name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup virtual environment
        run: |
          uv venv
          uv sync

      - name: Install collections
        run: |
          if [ -f requirements.yml ]; then uv exec .venv -- ansible-galaxy collection install -r requirements.yml; fi

      - name: Run ansible-lint
        run: uv exec .venv -- ansible-lint

      - name: Run yamllint
        run: uv exec .venv -- yamllint .
