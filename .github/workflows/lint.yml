name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: pip install uv

      - name: Setup virtual environment
        run: |
          uv venv
          uv sync

      - name: Install Ansible collections
        run: |
          if [ -f requirements.yml ]; then
            uv run ansible-galaxy collection install -r requirements.yml
          fi

      - name: Prepare Ansible config for lint
        run: export ANSIBLE_CONFIG=$(pwd)/.github/workflows/ansible.cfg

      - name: Run ansible-lint
        run: uv run ansible-lint

      - name: Run yamllint
        run: uv run yamllint .
