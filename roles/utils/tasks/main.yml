---

- name: Gather minimal facts (role safeguard when running with tags)
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_distribution is not defined

- name: Install diagnostics and common tools (Arch)
  community.general.pacman:
    state: present
    name:
      - curl
      - wget
      - git
      - the_silver_searcher
      - logrotate
      - syslog-ng
      - cronie
      - ca-certificates-utils
      - bpytop
      - glances
      - iperf
      - jq
      - ncdu
      - lsof
      - traceroute
      - nmap
      - whois
      - httpie
      - python-pip
      - python-hvac
      - rsync
      - less
      - unzip
      - smartmontools
      - iproute2        # provides ss, ip
      - iputils         # provides ping, arping
      - openssl         # tls debugging (s_client, x509)
      - socat           # flexible port forwarder / tester
      - mtr             # traceroute+ping combined
      - tcpdump         # packet capture
      - iperf3          # bandwidth tests
      - inetutils       # telnet, hostname, etc.
      - ldns            # provides drill (DNS query tool)
      - bind            # provides dig/nslookup/host
  become: true
  when:
    - (ansible_facts['distribution'] | lower) == 'archlinux'

- name: Install Raspberry Pi specific tools (Arch)
  community.general.pacman:
    state: present
    name:
      - uboot-tools
      - gnu-netcat
  become: true
  when:
    - (ansible_facts['distribution'] | lower) == 'archlinux'
    - ansible_facts['architecture'] == 'aarch64'

- name: Install x86_64 specific tools (Arch)
  community.general.pacman:
    state: present
    name:
      - openbsd-netcat
  become: true
  when:
    - (ansible_facts['distribution'] | lower) == 'archlinux'
    - ansible_facts['architecture'] == 'x86_64'
