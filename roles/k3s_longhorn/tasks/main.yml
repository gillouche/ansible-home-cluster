---
# Longhorn prerequisites and deployment

- name: Install Longhorn dependencies (Arch Linux)
  community.general.pacman:
    name:
      - open-iscsi
      - nfs-utils
      - util-linux
      - bash
      - curl
      - grep
      - gawk
      - sed
      - gptfdisk
    state: present
  become: true
  when: ansible_facts['distribution'] | lower == 'archlinux'

- name: Ensure iscsid service is enabled and started
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
  become: true

- name: Load kernel modules required by Longhorn
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - dm_crypt
    - iscsi_tcp
  become: true

- name: Persist Longhorn kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/longhorn.conf
    content: |
      dm_crypt
      iscsi_tcp
    owner: root
    group: root
    mode: '0644'
  become: true
