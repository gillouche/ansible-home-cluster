---
grafana_user: grafana
grafana_group: grafana
grafana_uid: 10003
grafana_gid: 10003
grafana_home: /home/grafana
grafana_data_dir: "{{ grafana_home }}/data"
grafana_config_dir: "{{ grafana_home }}/config"
grafana_dashboards_dir: "{{ grafana_home }}/dashboards"
grafana_image: docker.io/grafana/grafana-oss:latest
grafana_container_name: grafana
grafana_port: 3000

grafana_admin_user: admin
grafana_admin_password: "password"

grafana_prometheus_host: "{{ hostvars[groups['prometheus'][0]].ansible_host }}"
grafana_prometheus_port: 9090

grafana_loki_host: "{{ hostvars[groups['loki'][0]].ansible_host }}"
grafana_loki_port: 3100

# Alerting Thresholds
grafana_alert_disk_yellow: 50
grafana_alert_disk_orange: 75
grafana_alert_disk_red: 90

grafana_alert_cpu_yellow: 50
grafana_alert_cpu_orange: 75
grafana_alert_cpu_red: 90

grafana_alert_mem_yellow: 50
grafana_alert_mem_orange: 75
grafana_alert_mem_red: 90
