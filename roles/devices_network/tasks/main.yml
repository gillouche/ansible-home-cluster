---
# tasks for devices_network (per-device network bootstrap)

- name: Add IP address of all hosts to /etc/hosts on each device (FQDN + short)
  ansible.builtin.blockinfile:
    dest: /etc/hosts
    marker: "# {mark} ansible-home-cluster peers"
    block: |
      {% for h in (groups['all'] | default([])) %}
      {% if hostvars[h].ansible_host is defined %}
      {{ hostvars[h].ansible_host }} {{ h }} {{ h }}.{{ base_domain | default('localdomain') }}
      {% endif %}
      {% endfor %}
  become: true
  when: devices_manage_hostsfile | default(true) | bool

- name: Get active NM connection name for primary interface
  ansible.builtin.shell: |
    set -o pipefail
    nmcli -t -f NAME,DEVICE con show --active | grep ':{{ monit_network_interface }}$' | cut -d: -f1
  args:
    executable: /bin/bash
  register: _nm_conn_name
  changed_when: false
  failed_when: false
  become: true

- name: Check if LAN subnet route already configured in NM
  ansible.builtin.shell: |
    set -o pipefail
    nmcli -g ipv4.routes con show "{{ _nm_conn_name.stdout | trim }}" | grep -q "{{ lan_subnet }}"
  args:
    executable: /bin/bash
  register: _nm_route_check
  changed_when: false
  failed_when: false
  become: true
  when:
    - _nm_conn_name.stdout | trim | length > 0

- name: Add LAN subnet route to NetworkManager connection
  ansible.builtin.command: >
    nmcli con modify "{{ _nm_conn_name.stdout | trim }}"
    +ipv4.routes "{{ lan_subnet }}"
  become: true
  register: _nm_route_add
  changed_when: _nm_route_add.rc == 0
  when:
    - _nm_conn_name.stdout | trim | length > 0
    - _nm_route_check.rc != 0

- name: Check if LAN subnet route exists in live routing table
  ansible.builtin.shell: |
    set -o pipefail
    ip route show {{ lan_subnet }} dev {{ monit_network_interface }} | grep -q .
  args:
    executable: /bin/bash
  register: _live_route_check
  changed_when: false
  failed_when: false
  become: true
  when:
    - _nm_conn_name.stdout | trim | length > 0

- name: Add LAN subnet route to live routing table
  ansible.builtin.command: >
    ip route replace {{ lan_subnet }}
    dev {{ monit_network_interface }}
    src {{ ansible_host }}
  become: true
  changed_when: true
  when:
    - _nm_conn_name.stdout | trim | length > 0
    - _live_route_check.rc != 0

- name: Check if NetworkManager is installed # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active NetworkManager
  register: nm_check
  failed_when: false
  changed_when: false
  become: true

- name: Disable NetworkManager management of resolv.conf
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/99-no-resolv-conf.conf
    content: |
      [main]
      rc-manager=unmanaged
    owner: root
    group: root
    mode: '0644'
  become: true
  when: nm_check.rc == 0
  notify: Restart NetworkManager

- name: Check if /etc/resolv.conf is a symlink
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: devices_resolvconf_stat

- name: Remove /etc/resolv.conf symlink if present
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when: devices_resolvconf_stat.stat.islnk | default(false)
  become: true

- name: Ensure /etc/nsswitch.conf prefers hosts over dns
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    regexp: '^hosts:'
    line: 'hosts: mymachines files myhostname dns'
    state: present
  become: true
  when: devices_manage_nsswitch | default(true) | bool

- name: Ensure /etc/resolv.conf uses Pi-hole with public fallback
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ pihole_virtual_ip | default('192.168.0.251') }}
      nameserver 1.1.1.1
    owner: root
    group: root
    mode: '0644'
  become: true
  when: devices_manage_resolvconf | default(true) | bool
