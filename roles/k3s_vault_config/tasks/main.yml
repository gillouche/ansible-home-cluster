---
- name: Read K3s Server CA
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/tls/server-ca.crt
  register: _k3s_ca_slurp
  become: true
  when: inventory_hostname == groups['server'][0]

- name: Vault API Configuration
  when: inventory_hostname == groups['server'][0]
  block:
    - name: Check enabled auth methods in Vault
      ansible.builtin.uri:
        url: "https://{{ load_balancer_virtual_ip }}:{{ global_vault_api_lb_port | default(8200) }}/v1/sys/auth"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        validate_certs: false
      delegate_to: localhost
      become: false
      register: _vault_auth_methods
      until: _vault_auth_methods.status == 200
      retries: 30
      delay: 5
      changed_when: false

    - name: Enable Kubernetes Auth Method in Vault
      ansible.builtin.uri:
        url: "https://{{ load_balancer_virtual_ip }}:{{ global_vault_api_lb_port | default(8200) }}/v1/sys/auth/kubernetes"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          type: kubernetes
        status_code: [200, 204]
        validate_certs: false
      delegate_to: localhost
      become: false
      register: _vault_auth_enable
      changed_when: _vault_auth_enable.status == 204
      when: "'kubernetes/' not in _vault_auth_methods.json"

    - name: Configure Kubernetes Auth Method
      ansible.builtin.uri:
        url: "https://{{ load_balancer_virtual_ip }}:{{ global_vault_api_lb_port | default(8200) }}/v1/auth/kubernetes/config"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          kubernetes_host: "https://{{ k3s_api_vip }}:{{ global_k3s_api_port | default(6443) }}"
          kubernetes_ca_cert: "{{ _k3s_ca_slurp.content | b64decode }}"
        validate_certs: false
        status_code: [200, 204]
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Create cert-manager policy in Vault
      ansible.builtin.uri:
        url: "https://{{ load_balancer_virtual_ip }}:{{ global_vault_api_lb_port | default(8200) }}/v1/sys/policy/cert-manager"
        method: PUT
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          policy: |
            path "pki_int/sign/{{ vault_pki_int_role_name }}" {
              capabilities = ["create", "update"]
            }
        validate_certs: false
        status_code: [200, 204]
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Create cert-manager role in Vault
      ansible.builtin.uri:
        url: "https://{{ load_balancer_virtual_ip }}:{{ global_vault_api_lb_port | default(8200) }}/v1/auth/kubernetes/role/cert-manager"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_root_token }}"
        body_format: json
        body:
          bound_service_account_names: ["cert-manager"]
          bound_service_account_namespaces: ["cert-manager"]
          policies: ["cert-manager"]
          ttl: "24h"
        validate_certs: false
        status_code: [200, 204]
      delegate_to: localhost
      become: false
      changed_when: true
