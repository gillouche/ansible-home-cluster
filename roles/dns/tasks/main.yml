---
# tasks file for pihole

- name: Skip role on non-cluster hosts
  ansible.builtin.meta: end_role
  when: inventory_hostname not in (groups['dns_cluster'] | default([]))
  become: false

- name: Gather minimal facts (role safeguard when running with tags)
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_distribution is not defined

- name: Create pihole group
  ansible.builtin.group:
    name: "{{ pihole_group }}"
    state: present
    system: true
  become: true

- name: Create pihole user
  ansible.builtin.user:
    name: "{{ pihole_user }}"
    group: "{{ pihole_group }}"
    home: "{{ pihole_root_dir }}"
    create_home: true
    shell: /usr/bin/nologin
    system: true
    state: present
  become: true

- name: Setup SSH environment for pihole user
  ansible.builtin.include_role:
    name: devices_ssh
  vars:
    devices_ssh_user: "{{ pihole_user }}"
    devices_ssh_group: "{{ pihole_group }}"
    devices_ssh_peer_group: "{{ groups['dns_cluster'] }}"

- name: Allow rootless publish of low ports
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '53'
    state: present
    sysctl_set: true
    reload: true
  become: true

- name: Determine Pi-hole cluster role for this host
  ansible.builtin.set_fact:
    pihole_is_primary: "{{ inventory_hostname in (groups['pihole_primary'] | default([])) }}"
    pihole_is_replica: "{{ inventory_hostname in (groups['pihole_replicas'] | default([])) }}"
  become: false

# ------------------------------------------------------------------------------
# Normal configuration
# ------------------------------------------------------------------------------

- name: Ensure Pi-hole host config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - "{{ pihole_host_etc_dir }}"
    - "{{ pihole_host_dnsmasq_dir }}"
  become: true

- name: Assert required Pi-hole cluster variables are defined
  ansible.builtin.assert:
    that:
      - pihole_virtual_ip is defined
      - pihole_primary_host is defined
    fail_msg: >-
      Required variables for Pi-hole VRRP are missing.
  when: inventory_hostname in (groups['dns_cluster'] | default([]))
  become: false

- name: Stat pihole.toml
  ansible.builtin.stat:
    path: "{{ pihole_host_etc_dir }}/pihole.toml"
  register: pihole_toml_stat
  become: true

- name: Ensure pihole.toml exists (create only when missing)
  ansible.builtin.file:
    path: "{{ pihole_host_etc_dir }}/pihole.toml"
    state: touch
    owner: "{{ pihole_user }}"
    group: "{{ pihole_group }}"
    mode: '0644'
  when: not (pihole_toml_stat.stat.exists | default(false))
  become: true

- name: Ensure [misc] section exists in pihole.toml
  ansible.builtin.lineinfile:
    path: "{{ pihole_host_etc_dir }}/pihole.toml"
    regexp: '^\[misc\]'
    line: '[misc]'
    insertafter: EOF
    state: present
  become: true

- name: Enable loading of /etc/dnsmasq.d in pihole.toml
  block:
    - name: Detect if etc_dnsmasq_d already true
      ansible.builtin.command: >-
        grep -Eq '^\s*etc_dnsmasq_d\s*=\s*true\s*$' {{ pihole_host_etc_dir }}/pihole.toml
      register: pihole_toml_dnsmasq_true
      changed_when: false
      failed_when: false
      become: true

    - name: Set etc_dnsmasq_d to true if set to false
      ansible.builtin.replace:
        path: "{{ pihole_host_etc_dir }}/pihole.toml"
        regexp: '^(\s*etc_dnsmasq_d\s*=)\s*false\s*$'
        replace: '\1 true'
      when: pihole_toml_dnsmasq_true.rc != 0
      notify: Restart pihole dns
      become: true

    - name: Detect if etc_dnsmasq_d key exists
      ansible.builtin.command: >-
        grep -Eq '^\s*etc_dnsmasq_d\s*=' {{ pihole_host_etc_dir }}/pihole.toml
      register: pihole_toml_dnsmasq_key
      changed_when: false
      failed_when: false
      become: true

    - name: Insert etc_dnsmasq_d = true under [misc] if key missing
      ansible.builtin.lineinfile:
        path: "{{ pihole_host_etc_dir }}/pihole.toml"
        regexp: '^\s*etc_dnsmasq_d\s*='
        line: 'etc_dnsmasq_d = true'
        insertafter: '^\[misc\]'
        state: present
      when: pihole_toml_dnsmasq_true.rc != 0 and pihole_toml_dnsmasq_key.rc != 0
      notify: Restart pihole dns
      become: true

- name: Manage custom DNS records via dnsmasq (address= lines)
  when:
    - (pihole_dns_mode | default('dnsmasq')) == 'dnsmasq'
  become: true
  block:
    - name: Render custom DNS records file from template
      ansible.builtin.template:
        src: dnsmasq-custom.conf.j2
        dest: "{{ pihole_host_dnsmasq_dir }}/05-ansible-local-dns.conf"
        owner: "{{ pihole_user }}"
        group: "{{ pihole_group }}"
        mode: '0644'
      when: (pihole_custom_dns_records | default([])) | length > 0
      notify: Restart pihole dns

    - name: Remove custom DNS records file when list is empty
      ansible.builtin.file:
        path: "{{ pihole_host_dnsmasq_dir }}/05-ansible-local-dns.conf"
        state: absent
      when: (pihole_custom_dns_records | default([])) | length == 0

- name: Render Pi-hole VRRP instance into conf.d
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/conf.d/pihole.conf
    owner: root
    group: root
    mode: '0644'
  vars:
    vip_address: "{{ pihole_virtual_ip }}"
    vrrp_interface: >-
      {{ pihole_vrrp_interface | default(ansible_facts['default_ipv4']['interface']
         | default(ansible_facts['default_ipv6']['interface']
         | default((ansible_facts['interfaces'] | select('match', '^(e|en|eth)')
         | list | first) | default('end0')))) }}
    vrrp_state: "{{ 'MASTER' if pihole_is_primary | bool else 'BACKUP' }}"
    vrrp_priority: "{{ 100 if pihole_is_primary | bool else 90 }}"
    vrrp_auth_pass: "{{ pihole_vrrp_auth_pass | default('p1h0l3') }}"
  notify: Restart keepalived
  become: true
  when: inventory_hostname in (groups['dns_cluster'] | default([]))

- name: Ensure sync prerequisites on replicas (Arch)
  community.general.pacman:
    name:
      - rsync
      - git
      - sqlite
    state: present
  become: true
  when: (ansible_facts['distribution'] | lower) == 'archlinux' and (pihole_is_replica | bool)

- name: Clone Gravity Sync on replicas
  ansible.builtin.git:
    repo: https://github.com/vmstan/gravity-sync.git
    dest: /opt/gravity-sync
    version: "{{ gravity_sync_ref | default('HEAD') }}"
    update: false
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true))

- name: Stop and disable systemd-resolved (free port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  become: true
  failed_when: false

- name: Stop and disable dnsmasq if present
  ansible.builtin.systemd:
    name: dnsmasq
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Check if NetworkManager is installed # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active NetworkManager
  register: nm_check
  failed_when: false
  changed_when: false
  become: true

- name: Disable NetworkManager management of resolv.conf
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/99-no-resolv-conf.conf
    content: |
      [main]
      rc-manager=unmanaged
    owner: root
    group: root
    mode: '0644'
  become: true
  when: nm_check.rc == 0
  notify: Restart NetworkManager

- name: Check if /etc/resolv.conf is a symlink
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: pihole_resolvconf_stat
  become: true

- name: Remove /etc/resolv.conf symlink
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when: pihole_resolvconf_stat.stat.islnk | default(false)
  become: true

- name: Ensure host resolv.conf points to Pi-hole VIP and fallback
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ pihole_virtual_ip }}
      nameserver 1.1.1.1
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Configure wildcard DNS to reverse-proxy VIP via dnsmasq (optional)
  ansible.builtin.copy:
    dest: "{{ pihole_host_dnsmasq_dir }}/99-wildcard-vip.conf"
    owner: "{{ pihole_user }}"
    group: "{{ pihole_group }}"
    mode: '0644'
    content: |
      {% for d in (pihole_dns_wildcard_domains | default([])) %}
      address=/{{ d }}/{{ pihole_reverse_proxy_vip }}
      {% endfor %}
  when:
    - pihole_dns_wildcard_enabled | default(false) | bool
    - (pihole_dns_wildcard_domains | default([])) | length > 0
  notify: Restart pihole dns
  become: true

- name: Remove wildcard DNS config if domains list is empty or disabled
  ansible.builtin.file:
    path: "{{ pihole_host_dnsmasq_dir }}/99-wildcard-vip.conf"
    state: absent
  when: >
    (not (pihole_dns_wildcard_enabled | default(false) | bool)) or
    ((pihole_dns_wildcard_domains | default([])) | length == 0)
  notify: Restart pihole dns
  become: true

- name: Start/Update pihole container (Podman, rootful)
  containers.podman.podman_container:
    name: "{{ pihole_container_name }}"
    image: "{{ pihole_image }}"
    state: created
    recreate: false
    restart_policy: "no"
    hostname: "{{ inventory_hostname }}"
    generate_systemd:
      path: /etc/systemd/system/
      restart_policy: always
      names: true
      container_prefix: container
    # cap_add removed to fix idempotency (rootful podman covers this)
    published_ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "{{ pihole_http_host_port | default(8080) }}:80/tcp"
    env:
      TZ: "{{ pihole_timezone }}"
      FTLCONF_webserver_api_password: "{{ pihole_web_password }}"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_upstreams: "{{ pihole_dns }}"
      FTLCONF_dns_piholePtr: "HOSTNAME"
      # Ensure Pi-hole binds to 0.0.0.0 inside the bridged container
      # so that Podman can map the host's VIP to it.
      FTLCONF_webserver_interface: "0.0.0.0"
      FTLCONF_dns_interface: "0.0.0.0"
    volumes:
      - "{{ pihole_host_etc_dir }}:/etc/pihole/"
      - "{{ pihole_host_dnsmasq_dir }}:/etc/dnsmasq.d/"
  become: true
  notify: Restart pihole systemd



- name: Enable and start Pi-hole systemd service
  ansible.builtin.systemd:
    name: "container-{{ pihole_container_name }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Wait for Pi-hole web interface to be available
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pihole_http_host_port | int }}/admin/"
    method: GET
    status_code: [200, 302, 401, 403]
  register: _pihole_health
  until: _pihole_health.status in [200, 302, 401, 403]
  retries: 30
  delay: 5
  become: false

- name: Add cron to update gravity every day
  ansible.builtin.cron:
    name: "update pihole gravity"
    minute: 0
    hour: 0
    job: "podman exec {{ pihole_container_name }} pihole updateGravity"
  become: true

- name: Remove old image versions (Podman)
  containers.podman.podman_prune:
    image: true

- name: Configure Gravity Sync for Docker on replicas
  ansible.builtin.template:
    src: gravity-sync.conf.j2
    dest: /opt/gravity-sync/gravity-sync.conf
    owner: root
    group: root
    mode: '0644'
  vars:
    gs_primary_host: "{{ hostvars[pihole_primary_host].ansible_host | default(pihole_primary_host) }}"
    gs_primary_user: "{{ pihole_user }}"
    gs_primary_port: "{{ hostvars[pihole_primary_host].ansible_port | default(22) }}"
    gs_container_name: "{{ pihole_container_name | default('pihole') }}"
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true))

- name: Symlink gravity-sync helper to /usr/local/bin
  ansible.builtin.file:
    src: /opt/gravity-sync/gravity-sync.sh
    dest: /usr/local/bin/gravity-sync
    state: link
    force: true
    owner: root
    group: root
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true))

- name: Create cron to run Gravity Sync hourly on replicas
  ansible.builtin.cron:
    name: "gravity-sync hourly"
    minute: 0
    job: "/usr/local/bin/gravity-sync sync"
    user: root
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true)) and (gravity_sync_schedule | default('hourly')) == 'hourly'

- name: Initial Gravity Sync run (best-effort)
  ansible.builtin.command: /usr/local/bin/gravity-sync sync
  register: gs_result
  changed_when: false
  failed_when: false
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true))
  check_mode: false
