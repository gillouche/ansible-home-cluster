---
- name: Ensure controller ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.ssh"
    state: directory
    mode: "0700"

- name: Initialize known_hosts file with safe permissions (if missing)
  ansible.builtin.file:
    path: "{{ controller_known_hosts_path }}"
    state: touch
    mode: "0600"

- name: Build list of host targets (ip + hostname when defined)
  ansible.builtin.set_fact:
    controller_known_hosts_targets: >-
      {{
        (
          groups['all'] | map('extract', hostvars) |
          list |
          map('extract', 'ansible_host') |
          select('defined') |
          list
        )
        +
        (
          groups['all'] | list
        )
      }}

- name: De-duplicate targets and normalize
  ansible.builtin.set_fact:
    controller_known_hosts_targets: "{{ controller_known_hosts_targets | map('string') | list | unique }}"

- name: Also include FQDN selectors for each inventory host (if base_domain provided)
  ansible.builtin.set_fact:
    controller_known_hosts_targets: >-
      {{
        (
          controller_known_hosts_targets
        )
        +
        (
          (
            (groups['all'] | default([]))
            | map('regex_replace', '$', '.' ~ (base_domain | default('gillouche.homelab')))
            | list
          )
        )
      | map('string')
      | reject('equalto', '')
      | reject('match', '^\\\\')
      | list | unique }}
  when: (base_domain | default('')) | length > 0

# Additionally include resolved IPs for hostnames that don't define ansible_host
# This ensures SSH lookups that select the IP (e.g., due to HostName in SSH config)
# have a matching known_hosts entry. Resolution is performed on the controller.

- name: Resolve IPs for inventory hostnames on controller (best-effort)
  ansible.builtin.command: >-
    python3 -c "import socket,sys; print(socket.gethostbyname(sys.argv[1]))" {{ item }}
  register: controller_hostname_resolution
  loop: "{{ groups['all'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  failed_when: false

- name: Append resolved IPv4 addresses to targets
  ansible.builtin.set_fact:
    controller_known_hosts_targets: >-
      {{
        controller_known_hosts_targets
        + (
            controller_hostname_resolution.results | default([])
            | selectattr('rc','equalto', 0)
            | map(attribute='stdout') | map('string') | list
            | select('match', '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$') | list
          )
      | map('string') | list | unique }}

# Per-target scan and add: ensure entries for hostname, IP, and FQDN

- name: Debug list of targets for known_hosts (controller)
  ansible.builtin.debug:
    var: controller_known_hosts_targets
    verbosity: 1

- name: Scan ed25519 host key for each target (suppress stderr)
  ansible.builtin.shell: |
    set -o pipefail
    ssh-keyscan -T {{ controller_known_hosts_timeout }} -t ed25519 "{{ item }}" 2>/dev/null
  args:
    executable: /bin/bash
  register: controller_keyscan_each
  loop: "{{ controller_known_hosts_targets | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  failed_when: false

- name: Add scanned keys to known_hosts (hashed, idempotent)
  vars:
    controller_target: "{{ item.item }}"
    controller_scanned_key_line: >-
      {{ (
           item.stdout | default('')
         ).splitlines()
         | select('match', '^' ~ controller_target ~ ' ')
         | list
         | first
         | default('')
      }}
  ansible.builtin.known_hosts:
    path: "{{ controller_known_hosts_path }}"
    name: "{{ controller_target }}"
    key: "{{ controller_scanned_key_line }}"
    state: present
    hash_host: true
  loop: "{{ controller_keyscan_each.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: controller_scanned_key_line | length > 0
  failed_when: false

- name: Ensure controller ~/.ssh/sockets directory exists (for ControlPath)
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') + '/.ssh/sockets' }}"
    state: directory
    mode: "0700"

- name: Ensure SSH config for controller network defaults (192.168.0.*)
  ansible.builtin.blockinfile:
    path: "{{ lookup('env', 'HOME') + '/.ssh/config' }}"
    create: true
    mode: "0600"
    marker: "# {mark} ansible-home-cluster network 192.168.0.*"
    block: |
      Host 192.168.0.*
        # Keep the connection alive by sending a signal every 60 seconds
        ServerAliveInterval 60
        # Disconnect only after 3 failed keep-alive signals (total 180s tolerance)
        ServerAliveCountMax 3
        # If the connection fails initially, retry connection attempts
        ConnectionAttempts 5
        # (Optional) reuse existing connections to speed up subsequent sessions
        ControlMaster auto
        ControlPath ~/.ssh/sockets/%r@%h-%p
        ControlPersist 600

# Removed secondary per-host scan to avoid duplication; covered by per-target scan above

# --- Bootstrap convenience (optional) ---

- name: Resolve controller bootstrap variables
  ansible.builtin.set_fact:
    bootstrap_user_resolved: "{{ bootstrap_user | default(default_bootstrap_user | default('alarm')) }}"
    bootstrap_pubkey_resolved: "{{ bootstrap_pubkey | default(default_bootstrap_pubkey |
     default(lookup('env', 'HOME') + '/.ssh/id_ed25519_local.pub')) }}"

- name: Derive private key path from provided public key
  ansible.builtin.set_fact:
    bootstrap_privkey: "{{ bootstrap_pubkey_resolved | regex_replace('\\.pub$', '') }}"

- name: Ensure SSH config entries on controller for all hosts
  ansible.builtin.blockinfile:
    path: "{{ lookup('env', 'HOME') + '/.ssh/config' }}"
    create: true
    mode: "0600"
    marker: "# {mark} ansible-home-cluster {{ item }}"
    block: |
      Host {{ item }} {{ hostvars[item].ansible_host | default(item) }}
        HostName {{ hostvars[item].ansible_host | default(item) }}
        User {{ bootstrap_user_resolved }}
        IdentityFile {{ bootstrap_privkey }}
        IdentitiesOnly yes
  loop: "{{ groups['all'] | default([]) }}"
