---
- name: Set k3s service name based on node role
  ansible.builtin.set_fact:
    k3s_service_name: "{{ 'k3s' if inventory_hostname in groups.get('server', []) else 'k3s-agent' }}"

- name: Create k3s health state directory
  ansible.builtin.file:
    path: /var/lib/k3s-health
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy k3s health check script
  ansible.builtin.template:
    src: k3s-health-check.sh.j2
    dest: /usr/local/bin/k3s-health-check.sh
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy k3s post-boot cleanup script
  ansible.builtin.template:
    src: k3s-post-boot-cleanup.sh.j2
    dest: /usr/local/bin/k3s-post-boot-cleanup.sh
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy k3s containerd cleanup script
  ansible.builtin.template:
    src: k3s-containerd-cleanup.sh.j2
    dest: /usr/local/bin/k3s-containerd-cleanup.sh
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy k3s health check service unit
  ansible.builtin.template:
    src: k3s-health-check.service.j2
    dest: /etc/systemd/system/k3s-health-check.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload systemd for k3s health

- name: Deploy k3s health check timer unit
  ansible.builtin.template:
    src: k3s-health-check.timer.j2
    dest: /etc/systemd/system/k3s-health-check.timer
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload systemd for k3s health

- name: Deploy k3s post-boot cleanup service unit
  ansible.builtin.template:
    src: k3s-post-boot-cleanup.service.j2
    dest: /etc/systemd/system/k3s-post-boot-cleanup.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload systemd for k3s health

- name: Deploy k3s containerd cleanup service unit
  ansible.builtin.template:
    src: k3s-containerd-cleanup.service.j2
    dest: /etc/systemd/system/k3s-containerd-cleanup.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload systemd for k3s health

- name: Enable and start k3s health check timer
  ansible.builtin.systemd:
    name: k3s-health-check.timer
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Enable k3s post-boot cleanup service
  ansible.builtin.systemd:
    name: k3s-post-boot-cleanup.service
    enabled: true
    daemon_reload: true
  become: true

- name: Enable k3s containerd cleanup service
  ansible.builtin.systemd:
    name: k3s-containerd-cleanup.service
    enabled: true
    daemon_reload: true
  become: true

- name: Create k3s systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/{{ k3s_service_name }}.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy k3s WatchdogSec drop-in
  ansible.builtin.template:
    src: k3s-watchdog.conf.j2
    dest: /etc/systemd/system/{{ k3s_service_name }}.service.d/watchdog.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload systemd for k3s health
