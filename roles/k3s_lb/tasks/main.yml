---
- name: Skip role on non-server hosts
  ansible.builtin.meta: end_role
  when: inventory_hostname not in (groups['server'] | default([]))
  become: false

- name: Ensure keepalived conf.d directory exists
  ansible.builtin.file:
    path: /etc/keepalived/conf.d
    state: directory
    mode: '0755'
  become: true

- name: Deploy K3s API Keepalived Config
  ansible.builtin.template:
    src: k3s-api.conf.j2
    dest: /etc/keepalived/conf.d/k3s-api.conf
    mode: '0644'
  become: true
  notify: Restart keepalived

- name: Deploy K3s LB Keepalived Config
  ansible.builtin.template:
    src: k3s-lb.conf.j2
    dest: /etc/keepalived/conf.d/k3s-lb.conf
    mode: '0644'
  become: true
  notify: Restart keepalived

- name: Install HAProxy package
  ansible.builtin.package:
    name: haproxy
    state: present
  become: true

- name: Ensure HAProxy conf.d directory exists
  ansible.builtin.file:
    path: /etc/haproxy/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Create HAProxy conf.d placeholder to prevent startup failure if empty
  ansible.builtin.copy:
    dest: /etc/haproxy/conf.d/00-placeholder.cfg
    content: "# Managed by Ansible - prevents HAProxy failure if conf.d is empty\n"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Render HAProxy main configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart haproxy

- name: Ensure HAProxy systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/haproxy.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install HAProxy systemd drop-in configuration
  ansible.builtin.copy:
    dest: /etc/systemd/system/haproxy.service.d/conf-d.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/sbin/haproxy -Ws -f /etc/haproxy/haproxy.cfg -f /etc/haproxy/conf.d/ -p /run/haproxy.pid
  become: true
  notify: Reload systemd

- name: Render HAProxy configuration for K3s
  ansible.builtin.template:
    src: haproxy-k3s.cfg.j2
    dest: /etc/haproxy/conf.d/k3s.cfg
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart haproxy

- name: Enable and start HAProxy service
  ansible.builtin.systemd:
    name: haproxy
    state: started
    enabled: true
    daemon_reload: true
  become: true
  register: _haproxy_start

- name: Verify HAProxy is actually running # noqa: command-instead-of-module no-handler
  ansible.builtin.command: systemctl is-active haproxy
  register: _haproxy_status
  retries: 5
  delay: 2
  until: _haproxy_status.rc == 0
  changed_when: false
  become: true
  when: _haproxy_start.changed
