---
- name: Wait for K3s API to be ready
  ansible.builtin.wait_for:
    port: 6443
    host: 127.0.0.1
    timeout: 300
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true

- name: Ensure all K3s nodes are healthy and reachable
  ansible.builtin.command: k3s kubectl get nodes --no-headers
  register: _k3s_nodes_check
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  changed_when: false
  until:
    - _k3s_nodes_check.rc == 0
    - "(_k3s_nodes_check.stdout_lines | length) >= (groups['k3s_cluster'] | length)"
    - "not 'NotReady' in _k3s_nodes_check.stdout"
  retries: 30
  delay: 10

- name: Identify missing or unhealthy nodes
  ansible.builtin.set_fact:
    missing_nodes: "{{ groups['k3s_cluster'] | reject('in', _k3s_nodes_check.stdout) | list }}"
    not_ready_nodes: "{{ _k3s_nodes_check.stdout_lines | select('search', 'NotReady') | map('split') | map('first') | list }}"
  run_once: true

- name: Assert K3s cluster health
  ansible.builtin.assert:
    that:
      - _k3s_nodes_check.rc == 0
      - (missing_nodes | length) == 0
      - (not_ready_nodes | length) == 0
    fail_msg: |
      K3s cluster is not healthy!
      Missing nodes: {{ missing_nodes | join(', ') }}
      NotReady nodes: {{ not_ready_nodes | join(', ') }}
      Current nodes in cluster:
      {{ _k3s_nodes_check.stdout }}
    success_msg: "All K3s nodes are healthy. Proceeding to apply labels."
  run_once: true

- name: Prepare K3s node labels list
  ansible.builtin.set_fact:
    k3s_labels_to_apply: |
      {% set results = [] %}
      {% for host in groups['k3s_cluster'] %}
        {% if hostvars[host]['k3s_node_labels'] is defined %}
          {% for key, value in hostvars[host]['k3s_node_labels'].items() %}
            {% set _ = results.append({'host': host, 'key': key, 'value': value}) %}
          {% endfor %}
        {% endif %}
      {% endfor %}
      {{ results | to_json }}
  run_once: true

- name: Remove blocking admission webhooks before applying labels
  ansible.builtin.command: >
    k3s kubectl delete {{ item }} --ignore-not-found
  loop:
    - validatingwebhookconfiguration longhorn-webhook-validator
    - mutatingwebhookconfiguration longhorn-webhook-mutator
    - validatingwebhookconfiguration gatekeeper-validating-webhook-configuration
    - mutatingwebhookconfiguration gatekeeper-mutating-webhook-configuration
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  changed_when: false
  failed_when: false

- name: Apply K3s node labels from inventory
  ansible.builtin.command: k3s kubectl label node {{ item.host }} {{ item.key }}={{ item.value }} --overwrite
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  loop: "{{ k3s_labels_to_apply | from_json }}"
  become: true
  changed_when: false
  retries: 3
  delay: 5
  register: _label_result
  until: _label_result.rc == 0

- name: Prepare K3s node taints list
  ansible.builtin.set_fact:
    k3s_taints_to_apply: |
      {% set results = [] %}
      {% for host in groups['k3s_cluster'] %}
        {% if hostvars[host]['k3s_node_taints'] is defined %}
          {% for taint in hostvars[host]['k3s_node_taints'] %}
            {% set _ = results.append({'host': host, 'taint': taint}) %}
          {% endfor %}
        {% endif %}
      {% endfor %}
      {{ results | to_json }}
  run_once: true

- name: Apply K3s node taints from inventory
  ansible.builtin.command: k3s kubectl taint node {{ item.host }} {{ item.taint }} --overwrite
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  loop: "{{ k3s_taints_to_apply | from_json }}"
  become: true
  changed_when: false
  retries: 3
  delay: 5
  register: _taint_result
  until: _taint_result.rc == 0
