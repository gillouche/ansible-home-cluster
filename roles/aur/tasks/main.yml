---
# tasks file for aur-helper
## variables come from role defaults; no need to set here
- name: Gather minimal facts (role safeguard when running with tags)
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_distribution is not defined

- name: Create the `aur_builder` user
  become: yes
  ansible.builtin.user:
    name: aur_builder
    create_home: yes
    group: wheel

- name: Allow the `aur_builder` user to run `sudo pacman` without a password
  become: yes
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/11-install-aur_builder
    line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
    create: yes
    mode: 0644
    validate: 'visudo -cf %s'

# Allow running only with --tags aur_rebuild_yay by setting the force flag early
- name: Force build when tag aur_rebuild_yay is provided
  ansible.builtin.set_fact:
    aur_helper_force_build: true
  tags:
    - never
    - aur_rebuild_yay
  when: "'aur_rebuild_yay' in (ansible_run_tags | default([]))"

# Detect Arch Linux safely using gathered facts
- name: Detect Arch Linux hosts for AUR flow
  ansible.builtin.set_fact:
    aur_is_arch: "{{ (ansible_facts.get('distribution','') | lower) == 'archlinux' }}"
  tags: [aur, aur_rebuild_yay]

### Main AUR build flow (tagged to run with either --tags aur or --tags aur_rebuild_yay)
- name: Ensure yay-bin present (build from AUR when required)
  tags: [aur, aur_rebuild_yay]
  block:
    - name: Ensure yay package is not installed (pacman)
      community.general.pacman:
        name: yay
        state: absent
      become: true

    - name: Collect package facts (pacman)
      ansible.builtin.package_facts:
        manager: pacman
      become: true

    - name: Probe yay-bin presence via pacman -Q (fallback check)
      ansible.builtin.command: pacman -Q yay-bin
      register: aur_helper_yay_q
      changed_when: false
      failed_when: false
      become: true

    - name: Debug AUR decision booleans (verbosity 1)
      ansible.builtin.debug:
        msg: "ansible_pkg_mgr={{ ansible_pkg_mgr | default('') }}, force={{ aur_helper_force_build | default(false) }}, packages_has_yay_bin={{ 'yay-bin' in (ansible_facts.packages | default({})) }}, pacman_Q_rc={{ aur_helper_yay_q.rc | default('n/a') }}, should_build={{ aur_helper_should_build | default('unset') }}"
        verbosity: 1

    - name: Determine if yay-bin is installed and if build is required
      ansible.builtin.set_fact:
        aur_helper_bin_installed: "{{ ('yay-bin' in (ansible_facts.packages | default({}))) or ((aur_helper_yay_q.rc | default(1)) == 0) }}"
        aur_helper_should_build: "{{ (not(( 'yay-bin' in (ansible_facts.packages | default({})) ) or ((aur_helper_yay_q.rc | default(1)) == 0))) or (aur_helper_force_build | bool) }}"
      become: false

    - name: Install build prerequisites for AUR (when build is required)
      community.general.pacman:
        name:
          - base-devel
          - make
          - git
          - go
          - gcc
          - fakeroot
          - python-setuptools
        state: present
      become: true
      when: aur_helper_should_build | bool

    - name: Remove work dir if existing (fresh build)
      ansible.builtin.file:
        path: "{{ aur_helper_work_dir_path }}"
        state: absent
      when: aur_helper_should_build | bool
      become: true

    - name: Create working directory
      ansible.builtin.file:
        path: "{{ aur_helper_work_dir_path }}"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0755"
        recurse: yes
      when: aur_helper_should_build | bool
      become: false

    - name: Clone yay-bin AUR repository
      ansible.builtin.git:
        repo: https://aur.archlinux.org/yay-bin.git
        dest: "{{ aur_helper_work_dir_path }}"
        version: "{{ aur_helper_yay_ref | default('HEAD') }}"
        update: true
      become: false
      when: aur_helper_should_build | bool

    - name: Build yay-bin
      ansible.builtin.command: makepkg --noconfirm
      args:
        chdir: "{{ aur_helper_work_dir_path }}"
      when: aur_helper_should_build | bool
      become: false

    - name: Find built package file (yay-bin)
      ansible.builtin.find:
        paths: "{{ aur_helper_work_dir_path }}"
        patterns: "yay-bin-*.pkg.tar.*"
        file_type: file
        recurse: false
        age_stamp: mtime
      register: aur_helper_yay_pkg_find
      when: aur_helper_should_build | bool
      become: false

    - name: Install yay-bin with pacman
      community.general.pacman:
        name: "{{ (aur_helper_yay_pkg_find.files | sort(attribute='mtime', reverse=true) | map(attribute='path') | list | first) }}"
        state: present
      become: true
      when:
        - aur_helper_should_build | bool
        - (aur_helper_yay_pkg_find.files | default([])) | length > 0

    - name: Verify yay works (prints version)
      ansible.builtin.command: yay -V
      register: aur_helper_yay_version_cmd
      changed_when: false
      failed_when: false
      become: false
