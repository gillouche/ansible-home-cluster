---
# tasks file for aur-helper
## variables come from role defaults; no need to set here
- name: Gather minimal facts (role safeguard when running with tags)
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_facts['distribution'] is not defined

- name: Create the `aur_builder` user
  become: true
  ansible.builtin.user:
    name: aur_builder
    home: "{{ user_home_root | default('/home') }}/aur_builder"
    create_home: true
    group: wheel

- name: Allow the `aur_builder` user to run `sudo pacman` without a password
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/11-install-aur_builder
    line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
    create: true
    mode: "0644"
    validate: 'visudo -cf %s'

# Allow running only with --tags aur_rebuild_yay by setting the force flag early
- name: Force build when tag aur_rebuild_yay is provided
  ansible.builtin.set_fact:
    aur_helper_force_build: true
  tags:
    - never
    - aur_rebuild_yay
  when: "'aur_rebuild_yay' in (ansible_run_tags | default([]))"

# Detect Arch Linux safely using gathered facts
- name: Detect Arch Linux hosts for AUR flow
  ansible.builtin.set_fact:
    aur_is_arch: "{{ (ansible_facts.get('distribution', '') | lower) == 'archlinux' }}"
  tags: [aur, aur_rebuild_yay]

### Main AUR build flow (tagged to run with either --tags aur or --tags aur_rebuild_yay)
- name: Ensure yay-bin present (build from AUR when required)
  tags: [aur, aur_rebuild_yay]
  block:
    - name: Ensure yay package is not installed (pacman)
      community.general.pacman:
        name: yay
        state: absent
      become: true
      when: false # Disabled to prevent removing existing yay if we are just checking for yay-bin

    - name: Collect package facts (pacman)
      ansible.builtin.package_facts:
        manager: pacman
      become: true

    - name: Probe yay-bin binary presence directly
      ansible.builtin.stat:
        path: /usr/bin/yay
      register: aur_helper_yay_stat
      become: true

    - name: Determine if yay-bin is installed and if build is required
      ansible.builtin.set_fact:
        aur_helper_should_build: >-
          {{ not (('yay-bin' in (ansible_facts.packages | default({}))) or
             ('yay' in (ansible_facts.packages | default({}))) or
             (aur_helper_yay_stat.stat.exists | bool)) or
             (aur_helper_force_build | bool) }}
      become: false

    - name: Ensure target architecture is supported (ARM check)
      ansible.builtin.fail:
        msg: >-
          yay-bin from AUR might not support your architecture ({{ ansible_facts['architecture'] }}).
          Consider using yay (source) if this fails.
      when:
        - aur_helper_should_build | bool
        - ansible_facts['architecture'] not in ['x86_64', 'aarch64']

    - name: Install build prerequisites for AUR (when build is required)
      community.general.pacman:
        name:
          - base-devel
          - make
          - git
          - go
          - gcc
          - fakeroot
          - python-setuptools
        state: present
      become: true
      when: aur_helper_should_build | bool

    - name: Remove work dir if existing (fresh build)
      ansible.builtin.file:
        path: "{{ aur_helper_work_dir_path }}"
        state: absent
      when: aur_helper_should_build | bool
      become: true

    - name: Create working directory
      ansible.builtin.file:
        path: "{{ aur_helper_work_dir_path }}"
        state: directory
        owner: aur_builder
        group: wheel
        mode: "0755"
        recurse: true
      when: aur_helper_should_build | bool
      become: true

    - name: Clone yay-bin AUR repository
      ansible.builtin.git:
        repo: https://aur.archlinux.org/yay-bin.git
        dest: "{{ aur_helper_work_dir_path }}"
        version: "{{ aur_helper_yay_ref | default('HEAD') }}"
        update: true
      become: true
      become_user: aur_builder
      register: aur_helper_git_clone
      when: aur_helper_should_build | bool

    - name: Check PKGBUILD architecture compatibility
      ansible.builtin.shell: |
        grep -q "'{{ ansible_facts['architecture'] }}'" PKGBUILD || grep -q "'any'" PKGBUILD
      args:
        chdir: "{{ aur_helper_work_dir_path }}"
      register: aur_helper_arch_check
      failed_when: false
      changed_when: false
      when: aur_helper_should_build | bool
      become: true

    - name: Warn if architecture not in PKGBUILD
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ ansible_facts['architecture'] }} not explicitly found in PKGBUILD 'arch' array.
          makepkg might fail unless -A is used.
      when: aur_helper_should_build | bool and aur_helper_arch_check.rc != 0

    - name: Build yay-bin
      ansible.builtin.command: makepkg --force --noconfirm -s{{ ' -A' if (aur_helper_arch_check.rc | default(0) != 0) else '' }}
      args:
        chdir: "{{ aur_helper_work_dir_path }}"
      register: aur_helper_makepkg_output
      changed_when: true
      when: aur_helper_should_build | bool
      become: true
      become_user: aur_builder

    - name: Find built package file (yay-bin)
      ansible.builtin.find:
        paths: "{{ aur_helper_work_dir_path }}"
        patterns: "yay-bin-[0-9]*.pkg.tar.*"
        file_type: file
        excludes: "*-debug-*"
        recurse: false
        age_stamp: mtime
      register: aur_helper_yay_pkg_find
      when: aur_helper_should_build | bool
      become: true

    - name: Ensure package was found
      ansible.builtin.assert:
        that:
          - aur_helper_yay_pkg_find.files | length > 0
        fail_msg: "No built package found in {{ aur_helper_work_dir_path }}. makepkg might have failed or produced a different filename."
      when: aur_helper_should_build | bool

    - name: Install yay-bin with pacman (explicit command to ensure force-reinstall if needed)
      ansible.builtin.command: >-
        pacman -U --noconfirm --needed
        {{ (aur_helper_yay_pkg_find.files | sort(attribute='mtime', reverse=true) | map(attribute='path') | list | first) }}
      become: true
      register: aur_helper_install_output
      changed_when: true
      when:
        - aur_helper_should_build | bool
        - (aur_helper_yay_pkg_find.files | default([])) | length > 0

    - name: Verify yay works (prints version)
      ansible.builtin.command: yay -V
      register: aur_helper_yay_version_cmd
      changed_when: false
      become: true
      when: aur_helper_should_build | bool

    - name: Final yay path check
      ansible.builtin.command: which yay
      register: aur_helper_yay_path_check
      changed_when: false
      become: true
      failed_when: false
      when: ansible_verbosity >= 1

    - name: Debug final yay path
      ansible.builtin.debug:
        msg: "yay is located at: {{ aur_helper_yay_path_check.stdout }}"
      when:
        - ansible_verbosity >= 1
        - aur_helper_yay_path_check.rc | default(1) == 0
