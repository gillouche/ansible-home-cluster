---
# Caddy container configuration
reverse_proxy_container_name: "edge-proxy"
reverse_proxy_image: "caddy:2.10.2"

# VIP and primary host sane defaults (override in group_vars as needed)
reverse_proxy_virtual_ip: "192.168.0.252"
reverse_proxy_bind_ip: "{{ reverse_proxy_virtual_ip }}"
reverse_proxy_primary_host: "rpi5b16g4"

# Default ACME email if not provided in group_vars
reverse_proxy_acme_email: "noreply@{{ base_domain | default('gillouche.homelab') }}"

# Resolver IP to prefer on reverse proxy hosts when managing /etc/resolv.conf.
reverse_proxy_resolver_ip: "{{ pihole_virtual_ip | default('192.168.0.251') }}"

# Fallback option: if set to true explicitly, we will write /etc/resolv.conf
reverse_proxy_manage_resolv_conf: true
reverse_proxy_public_resolver: "1.1.1.1"

# Domains to serve (list of hostnames/FQDNs)
reverse_proxy_domains: []

# Vault ACME directory URL consumed by Caddy.
# Defaults to localhost since Caddy runs in host network mode to reach the local Vault.
reverse_proxy_acme_ca_url: "https://127.0.0.1:{{ vault_api_port | default(18200) }}/v1/pki_int/acme/directory"
reverse_proxy_data_dir: "/home/reverse_proxy/data"
