---

- name: Ensure reverse_proxy system user exists with home
  become: true
  block:
    - name: Probe available nologin paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/sbin/nologin
        - /sbin/nologin
        - /usr/bin/nologin
      register: _nologin_stats

    - name: Pick first available nologin
      ansible.builtin.set_fact:
        reverse_proxy_nologin: >-
          {{ (_nologin_stats.results | selectattr('stat.exists', 'defined')
             | selectattr('stat.exists')
             | map(attribute='invocation.module_args.path')
             | list | first) | default('/usr/sbin/nologin') }}

    - name: Create reverse_proxy system user with home
      ansible.builtin.user:
        name: reverse_proxy
        comment: "Reverse Proxy Service User"
        home: "{{ reverse_proxy_root_dir }}"
        create_home: true
        shell: "{{ reverse_proxy_nologin }}"
        system: true

- name: Gather minimal facts (role safeguard when running with tags)
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_distribution is not defined

- name: Determine reverse proxy role for this host
  ansible.builtin.set_fact:
    reverse_proxy_is_primary: "{{ inventory_hostname in (groups['edge_proxy_primary'] | default([])) }}"
  become: false

- name: Render reverse proxy VRRP instance into conf.d
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/conf.d/edge-proxy.conf
    owner: root
    group: root
    mode: '0644'
  vars:
    vip_address: "{{ reverse_proxy_virtual_ip }}"
    vrrp_interface: "{{ ansible_facts['default_ipv4']['interface'] | default('eth0') }}"
    vrrp_state: "{{ 'MASTER' if reverse_proxy_is_primary | bool else 'BACKUP' }}"
    vrrp_priority: "{{ 100 if reverse_proxy_is_primary | bool else 90 }}"
    vrrp_auth_pass: "{{ reverse_proxy_vrrp_auth_pass }}"
  notify: Restart keepalived
  become: true
  when: (reverse_proxy_vrrp_auth_pass is defined) and ((reverse_proxy_vrrp_auth_pass | length) >= 12)

- name: DNS Configuration (Resolv.conf)
  when: reverse_proxy_manage_resolv_conf | default(false) | bool
  become: true
  block:
    - name: Check if /etc/resolv.conf is a symlink (reverse proxy)
      ansible.builtin.stat:
        path: /etc/resolv.conf
      register: reverse_proxy_resolvconf_stat

    - name: Remove /etc/resolv.conf symlink if managed by systemd-resolved (reverse proxy)
      ansible.builtin.file:
        path: /etc/resolv.conf
        state: absent
      when: reverse_proxy_resolvconf_stat.stat.islnk | default(false)

    - name: Check if /etc/resolv.conf already has the desired nameservers (reverse proxy)
      ansible.builtin.shell: >
        grep -q "nameserver {{ pihole_virtual_ip | default('192.168.0.251') }}" /etc/resolv.conf &&
        grep -q "nameserver 1.1.1.1" /etc/resolv.conf
      register: _edge_proxy_resolv_conf_check
      failed_when: false
      changed_when: false

    - name: Ensure /etc/resolv.conf uses Pi-hole VIP with public fallback (reverse proxy)
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ pihole_virtual_ip | default('192.168.0.251') }}
          nameserver 1.1.1.1
        owner: root
        group: root
        mode: '0644'
      when: _edge_proxy_resolv_conf_check.rc != 0

- name: Ensure reverse proxy host directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "reverse_proxy"
    group: "reverse_proxy"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ reverse_proxy_root_dir }}", mode: '0755'}
    - {path: "{{ reverse_proxy_config_dir }}", mode: '0755'}
    - {path: "{{ reverse_proxy_data_dir }}", mode: '0755'}
    - {path: "{{ reverse_proxy_certs_dir }}", mode: '0755'}
  become: true

- name: Ensure Caddy certificates directory exists
  ansible.builtin.file:
    path: "{{ reverse_proxy_data_dir }}/caddy/certificates"
    state: directory
    owner: "reverse_proxy"
    group: "reverse_proxy"
    mode: '0755'
  become: true

- name: Render Caddyfile
  ansible.builtin.template:
    src: "Caddyfile.j2"
    dest: "{{ reverse_proxy_config_dir }}/Caddyfile"
    owner: "reverse_proxy"
    group: "reverse_proxy"
    mode: '0644'
  become: true
  notify: Restart reverse proxy

- name: Copy Vault Cluster CA to reverse proxy trust path
  ansible.builtin.copy:
    src: "{{ tls_bundle_anchor_path }}"
    remote_src: true
    dest: "{{ reverse_proxy_certs_dir }}/ca-bundle.pem"
    owner: "reverse_proxy"
    group: "reverse_proxy"
    mode: '0644'
  become: true
  notify: Restart reverse proxy

- name: Ensure reverse proxy container is running (rootful Podman)
  containers.podman.podman_container:
    name: "{{ reverse_proxy_container_name }}"
    image: "{{ reverse_proxy_image }}"
    state: started
    restart_policy: unless-stopped
    recreate: true
    user: 0
    network_mode: host
    env: >-
      {{ {'VAULT_TOKEN': tls_wildcard_vault_token}
         if (tls_wildcard_vault_token is defined and (tls_wildcard_vault_token | length > 0))
         else {}
      }}
    volumes:
      - "{{ reverse_proxy_config_dir }}/Caddyfile:/etc/caddy/Caddyfile"
      - "{{ reverse_proxy_data_dir }}:/data"
      - "{{ reverse_proxy_data_dir }}/caddy/certificates/wildcard:/data/caddy/certificates/wildcard:ro"
      - "{{ reverse_proxy_certs_dir }}/ca-bundle.pem:/etc/ssl/certs/internal-ca-bundle.pem"
    generate_systemd:
      path: /etc/systemd/system/
      restart_policy: always
      names: true
      container_prefix: container
  become: true
  notify: Restart reverse proxy

- name: Enable and start Reverse Proxy systemd service
  ansible.builtin.systemd:
    name: "container-{{ reverse_proxy_container_name }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Restart Reverse Proxy if certificates were updated
  ansible.builtin.systemd:
    name: "container-{{ reverse_proxy_container_name }}"
    state: restarted
  become: true
  when: tls_wildcard_certs_updated | default(false) | bool
