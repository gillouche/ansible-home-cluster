---
# Generalized tasks for devices_ssh (setup for a specific user)

- name: Ensure ~/.ssh exists for user ({{ devices_ssh_user }})
  ansible.builtin.file:
    path: "{{ user_home_root | default('/home') }}/{{ devices_ssh_user }}/.ssh"
    state: directory
    owner: "{{ devices_ssh_user }}"
    group: "{{ devices_ssh_group | default(devices_ssh_user) }}"
    mode: "0700"
  become: true

- name: Ensure SSH keypair exists for user ({{ devices_ssh_user }})
  community.crypto.openssh_keypair:
    path: "{{ user_home_root | default('/home') }}/{{ devices_ssh_user }}/.ssh/id_ed25519"
    type: ed25519
    state: present
    owner: "{{ devices_ssh_user }}"
    group: "{{ devices_ssh_group | default(devices_ssh_user) }}"
    mode: "0600"
    comment: "{{ devices_ssh_user }}@{{ inventory_hostname }}"
  become: true

- name: Install controller public key for user ({{ devices_ssh_user }})
  ansible.posix.authorized_key:
    user: "{{ devices_ssh_user }}"
    state: present
    key: "{{ lookup('file', devices_ssh_pubkey) }}"
    manage_dir: false
  become: true

# --- Inter-device trust: distribute peers' public keys ---

- name: Prepare peer connection passwords
  ansible.builtin.set_fact:
    ansible_password: "{{ hostvars[item].ansible_password | default(ansible_password | default(omit)) }}"
    ansible_ssh_pass: "{{ hostvars[item].ansible_password | default(ansible_password | default(omit)) }}"
  loop: "{{ devices_ssh_peer_group | default(groups['all']) | difference([inventory_hostname]) | default([]) }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  no_log: true

- name: Collect peers' public keys ({{ devices_ssh_user }})
  ansible.builtin.slurp:
    src: "{{ user_home_root | default('/home') }}/{{ devices_ssh_user }}/.ssh/id_ed25519.pub"
  delegate_to: "{{ item }}"
  register: devices_peer_pubkeys
  loop: "{{ devices_ssh_peer_group | default(groups['all']) | difference([inventory_hostname]) | default([]) }}"
  ignore_errors: true
  become: true

- name: Install peer keys into authorized_keys ({{ devices_ssh_user }})
  ansible.posix.authorized_key:
    user: "{{ devices_ssh_user }}"
    state: present
    key: "{{ (devices_peer_pubkeys.results | selectattr('item', 'equalto', item) |
     map(attribute='content') | map('b64decode') | list | first) | default('') }}"
    manage_dir: false
  loop: "{{ devices_ssh_peer_group | default(groups['all']) | difference([inventory_hostname]) | default([]) }}"
  when: (devices_peer_pubkeys.results | selectattr('item', 'equalto', item) | map(attribute='content') | list | first) is defined
  become: true

- name: Ensure known_hosts contains peers' host keys ({{ devices_ssh_user }})
  vars:
    devices_peer_ip: "{{ hostvars[item].ansible_host | default(item) }}"
  ansible.builtin.shell: |
    set -o pipefail
    ssh-keyscan -T 5 -t ed25519 "{{ devices_peer_ip }}" 2>/dev/null
  args:
    executable: /bin/bash
  register: devices_peer_scan
  loop: "{{ devices_ssh_peer_group | default(groups['all']) | difference([inventory_hostname]) | default([]) }}"
  changed_when: false
  failed_when: false
  become: true

- name: Add scanned peer keys to known_hosts ({{ devices_ssh_user }})
  vars:
    devices_peer_ip: "{{ hostvars[item].ansible_host | default(item) }}"
    devices_peer_key_line: >-
      {{ (
           devices_peer_scan.results
           | selectattr('item','equalto', item)
           | map(attribute='stdout')
           | list
           | first
           | default('')
         ).splitlines()
         | select('match', '^' ~ devices_peer_ip ~ ' ')
         | list
         | first
         | default('')
      }}
  ansible.builtin.known_hosts:
    path: "{{ user_home_root | default('/home') }}/{{ devices_ssh_user }}/.ssh/known_hosts"
    name: "{{ devices_peer_ip }}"
    key: "{{ devices_peer_key_line }}"
    state: present
    hash_host: true
  loop: "{{ devices_ssh_peer_group | default(groups['all']) | difference([inventory_hostname]) | default([]) }}"
  when: devices_peer_key_line | length > 0
  become: true
  become_user: "{{ devices_ssh_user }}"

- name: Generate SSH config for peer devices ({{ devices_ssh_user }})
  ansible.builtin.template:
    src: config.j2
    dest: "{{ user_home_root | default('/home') }}/{{ devices_ssh_user }}/.ssh/config"
    owner: "{{ devices_ssh_user }}"
    group: "{{ devices_ssh_group | default(devices_ssh_user) }}"
    mode: "0600"
  become: true
