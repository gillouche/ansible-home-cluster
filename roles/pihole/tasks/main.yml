---
# tasks file for pihole

- name: Skip role on non-cluster hosts
  ansible.builtin.meta: end_role
  when: inventory_hostname not in (groups['pihole_cluster'] | default([]))
  become: false

- name: Create pihole directory
  ansible.builtin.file:
    path: "/home/{{ target_user }}/pihole"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    state: directory
    mode: "0755"

# -------------------------
# Cluster setup (primary + replicas) and VIP with keepalived
# -------------------------

- name: Determine Pi-hole cluster role for this host
  ansible.builtin.set_fact:
    pihole_is_primary: "{{ inventory_hostname in (groups['pihole_primary'] | default([])) }}"
    pihole_is_replica: "{{ inventory_hostname in (groups['pihole_replicas'] | default([])) }}"
  become: false

- name: Ensure keepalived is installed (Arch)
  community.general.pacman:
    name: keepalived
    state: present
  become: true

### Pi-hole 6: manage hosts list in /etc/pihole/pihole.toml (TOML [dns].hosts)

- name: Build hosts array string from desired records
  ansible.builtin.set_fact:
    pihole_hosts_block: |
      hosts = [
      {% for rec in (pihole_custom_dns_records | default([])) %}
        "{{ rec.ip }} {{ rec.host }}"{% if not loop.last %},{% endif %}
      {% endfor %}
      ]
  when: (pihole_custom_dns_records | default([])) | length > 0

- name: Ensure pihole.toml exists (minimal) when missing
  ansible.builtin.copy:
    dest: "{{ pihole_host_etc_dir }}/pihole.toml"
    content: |
      [dns]
      {{ pihole_hosts_block | default('hosts = []') }}
    owner: root
    group: root
    mode: '0644'
    force: false
  when: (pihole_custom_dns_records | default([])) | length > 0
  become: false

- name: Try replacing existing hosts array in pihole.toml
  ansible.builtin.replace:
    path: "{{ pihole_host_etc_dir }}/pihole.toml"
    regexp: '(?ms)^\s*hosts\s*=\s*\[.*?\]'
    replace: "{{ pihole_hosts_block }}"
  register: pihole_toml_replace
  when: (pihole_custom_dns_records | default([])) | length > 0
  become: false

- name: Ensure [dns] section exists in pihole.toml
  ansible.builtin.lineinfile:
    path: "{{ pihole_host_etc_dir }}/pihole.toml"
    regexp: '^\[dns\]'
    line: '[dns]'
    insertafter: EOF
    state: present
  when:
    - (pihole_custom_dns_records | default([])) | length > 0
    - not pihole_toml_replace.changed
  become: false

- name: Insert hosts array into [dns] section when not present
  ansible.builtin.blockinfile:
    path: "{{ pihole_host_etc_dir }}/pihole.toml"
    marker: "# {mark} ansible-home-cluster hosts"
    block: "{{ pihole_hosts_block }}"
    insertafter: '^\[dns\]'
  when:
    - (pihole_custom_dns_records | default([])) | length > 0
    - not pihole_toml_replace.changed
  become: false

- name: Reload Pi-hole DNS after pihole.toml update
  ansible.builtin.command: >-
    docker exec {{ pihole_container_name }} pihole reloaddns
  changed_when: false
  when: (pihole_custom_dns_records | default([])) | length > 0

- name: Ensure pihole.toml exists (for dnsmasq include flag)
  ansible.builtin.file:
    path: "{{ pihole_host_etc_dir }}/pihole.toml"
    state: touch
    owner: root
    group: root
    mode: '0644'
  become: false

- name: Ensure [misc] section exists in pihole.toml
  ansible.builtin.lineinfile:
    path: "{{ pihole_host_etc_dir }}/pihole.toml"
    regexp: '^\[misc\]'
    line: '[misc]'
    insertafter: EOF
    state: present
  become: false

- name: Enable loading of /etc/dnsmasq.d in pihole.toml (etc_dnsmasq_d = true)
  ansible.builtin.lineinfile:
    path: "{{ pihole_host_etc_dir }}/pihole.toml"
    regexp: '^\s*etc_dnsmasq_d\s*='
    line: 'etc_dnsmasq_d = true'
    insertafter: '^\[misc\]'
    state: present
  notify: Restart pihole dns
  become: false

- name: Ensure keepalived conf.d directory exists
  ansible.builtin.file:
    path: /etc/keepalived/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))

- name: Check if keepalived main config exists
  ansible.builtin.stat:
    path: /etc/keepalived/keepalived.conf
  register: pihole_keepalived_main
  become: true
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))

- name: Create minimal keepalived main config with include if missing
  ansible.builtin.copy:
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      global_defs {
        enable_script_security
      }
      include /etc/keepalived/conf.d/*.conf
  when:
    - inventory_hostname in (groups['pihole_cluster'] | default([]))
    - not pihole_keepalived_main.stat.exists
  become: true

- name: Ensure keepalived main config includes conf.d
  ansible.builtin.lineinfile:
    path: /etc/keepalived/keepalived.conf
    regexp: '^\s*include\s+/etc/keepalived/conf\.d/\*\.conf\s*$'
    line: 'include /etc/keepalived/conf.d/*.conf'
    state: present
    insertbefore: EOF
  become: true
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))

- name: Render Pi-hole VRRP instance into conf.d
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/conf.d/pihole.conf
    owner: root
    group: root
    mode: '0644'
  vars:
    vip_address: "{{ pihole_virtual_ip }}"
    vrrp_interface: "{{ ansible_facts['default_ipv4']['interface'] | default('eth0') }}"
    vrrp_state: "{{ 'MASTER' if pihole_is_primary | bool else 'BACKUP' }}"
    vrrp_priority: "{{ 150 if pihole_is_primary | bool else 100 }}"
    vrrp_auth_pass: "{{ pihole_vrrp_auth_pass | default('p1h0l3') }}"
  notify: Restart keepalived
  become: true
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))

- name: Enable and start keepalived
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true
    daemon_reload: true
  become: true
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))

# -------------------------
# Replicas: keep configuration in sync with primary using Gravity Sync (Docker mode)
# -------------------------

- name: Ensure sync prerequisites on replicas (Arch)
  community.general.pacman:
    name:
      - rsync
      - git
      - sqlite
    state: present
  become: true
  when: (ansible_facts['distribution'] | lower) == 'archlinux' and (pihole_is_replica | bool)


- name: Clone Gravity Sync on replicas
  ansible.builtin.git:
    repo: https://github.com/vmstan/gravity-sync.git
    dest: /opt/gravity-sync
    version: "{{ gravity_sync_ref | default('HEAD') }}"
    update: false
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true))

# -------------------------
# Docker container runtime for Pi-hole
# -------------------------

- name: Stop and disable systemd-resolved (free port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  become: true
  failed_when: false

- name: Stop and disable dnsmasq if present (avoid port 53 conflict)
  ansible.builtin.systemd:
    name: dnsmasq
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Check if /etc/resolv.conf is a symlink
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: pihole_resolvconf_stat
  become: true

- name: Remove /etc/resolv.conf symlink if managed by systemd-resolved
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when: pihole_resolvconf_stat.stat.islnk | default(false)
  become: true

- name: Ensure host resolv.conf has a usable upstream during startup
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ static_dns }}
    owner: root
    group: root
    mode: '0644'
  become: true
  when: static_dns is defined

- name: Ensure Pi-hole data directories exist (host mounts)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"
  loop:
    - "/home/{{ target_user }}/pihole/pihole"
    - "/home/{{ target_user }}/pihole/dnsmasq.d"
  become: true

- name: Configure wildcard DNS to reverse-proxy VIP via dnsmasq (optional)
  ansible.builtin.copy:
    dest: "/home/{{ target_user }}/pihole/dnsmasq.d/99-wildcard-vip.conf"
    owner: root
    group: root
    mode: '0644'
    content: |
      {% for d in (pihole_dns_wildcard_domains | default([])) %}
      address=/{{ d }}/{{ pihole_reverse_proxy_vip }}
      {% endfor %}
  when: pihole_dns_wildcard_enabled | default(false) | bool
  notify: Restart pihole dns
  become: true

- name: Start/Update pihole container
  community.general.docker_container:
    name: "{{ pihole_container_name }}"
    image: "{{ pihole_image }}"
    restart_policy: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
      - "8443:443/tcp"
    env:
      TZ: "{{ timezone }}"
      FTLCONF_webserver_api_password: "{{ pihole_web_password }}"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_upstreams: "{{ pihole_dns }}"
    healthcheck:
      test: ["CMD-SHELL", "dig +time=2 +tries=1 @127.0.0.1 pi-hole.net >/dev/null 2>&1 || nc -z 127.0.0.1 53 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - "/home/{{ target_user }}/pihole/pihole/:/etc/pihole/"
      - "/home/{{ target_user }}/pihole/dnsmasq.d/:/etc/dnsmasq.d/"
    log_driver: json-file
    log_options:
      max-size: "10m"
      max-file: "5"
  become: false

- name: Wait for pihole web UI to be up
  ansible.builtin.wait_for:
    port: 8080
    delay: 5
    timeout: 60

- name: Add cron to update gravity every day
  ansible.builtin.cron:
    name: "update pihole gravity"
    minute: 0
    hour: 0
    job: "docker exec {{ pihole_container_name }} pihole updateGravity"
  become: true

- name: Remove old image versions
  community.docker.docker_prune:
    images: yes
    images_filters:
      dangling: false

- name: Configure Gravity Sync for Docker on replicas
  ansible.builtin.template:
    src: gravity-sync.conf.j2
    dest: /opt/gravity-sync/gravity-sync.conf
    owner: root
    group: root
    mode: '0644'
  vars:
    gs_primary_host: "{{ hostvars[pihole_primary_host].ansible_host | default(pihole_primary_host) }}"
    gs_primary_user: "{{ hostvars[pihole_primary_host].ansible_ssh_user | default(target_user) }}"
    gs_primary_port: "{{ hostvars[pihole_primary_host].ansible_port | default(22) }}"
    gs_container_name: "{{ pihole_container_name | default('pihole') }}"
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true))

- name: Symlink gravity-sync helper to /usr/local/bin
  ansible.builtin.file:
    src: /opt/gravity-sync/gravity-sync.sh
    dest: /usr/local/bin/gravity-sync
    state: link
    force: true
    owner: root
    group: root
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true))

- name: Create cron to run Gravity Sync hourly on replicas
  ansible.builtin.cron:
    name: "gravity-sync hourly"
    minute: 0
    job: "/usr/local/bin/gravity-sync sync"
    user: root
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true)) and (gravity_sync_schedule | default('hourly')) == 'hourly'

- name: Initial Gravity Sync run (best-effort)
  ansible.builtin.command: /usr/local/bin/gravity-sync sync
  register: gs_result
  changed_when: false
  failed_when: false
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true))

## Removed role execution flag mechanism; rely on idempotent tasks
