---
# tasks file for pihole

- name: Skip role on non-cluster hosts
  ansible.builtin.meta: end_role
  when: inventory_hostname not in (groups['pihole_cluster'] | default([]))
  become: false

- name: Create pihole directory
  ansible.builtin.file:
    path: "/home/{{ target_user }}/pihole"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    state: directory
    mode: "0755"

# Ensure container-mapped config directories exist on host
- name: Ensure Pi-hole host etc and dnsmasq.d directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"
  loop:
    - "{{ pihole_host_etc_dir }}"
    - "{{ pihole_host_dnsmasq_dir }}"
  become: true

# -------------------------
# Cluster setup (primary + replicas) and VIP with keepalived
# -------------------------

- name: Determine Pi-hole cluster role for this host
  ansible.builtin.set_fact:
    pihole_is_primary: "{{ inventory_hostname in (groups['pihole_primary'] | default([])) }}"
    pihole_is_replica: "{{ inventory_hostname in (groups['pihole_replicas'] | default([])) }}"
  become: false

- name: Assert required Pi-hole cluster variables are defined
  ansible.builtin.assert:
    that:
      - pihole_virtual_ip is defined
      - pihole_primary_host is defined
    fail_msg: >-
      Required variables for Pi-hole VRRP are missing. Ensure group_vars/pihole_cluster.yml
      defines at least:
        pihole_virtual_ip: <VIP address>
        pihole_primary_host: <inventory hostname of primary>
      Current inventory path: {{ inventory_file | default('unknown') }}
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))
  become: false

- name: Ensure keepalived is installed (Arch)
  community.general.pacman:
    name: keepalived
    state: present
  become: true

### Pi-hole 6: minimally update existing /etc/pihole/pihole.toml (do not overwrite)

- name: Stat pihole.toml
  ansible.builtin.stat:
    path: "{{ pihole_host_etc_dir }}/pihole.toml"
  register: pihole_toml_stat
  become: false

- name: Ensure pihole.toml exists (create only when missing)
  ansible.builtin.file:
    path: "{{ pihole_host_etc_dir }}/pihole.toml"
    state: touch
    owner: root
    group: root
    mode: '0644'
  when: not (pihole_toml_stat.stat.exists | default(false))
  become: true

- name: Ensure [misc] section exists in pihole.toml
  ansible.builtin.lineinfile:
    path: "{{ pihole_host_etc_dir }}/pihole.toml"
    regexp: '^\[misc\]'
    line: '[misc]'
    insertafter: EOF
    state: present
  become: false

- name: Enable loading of /etc/dnsmasq.d in pihole.toml (etc_dnsmasq_d = true)
  block:
    - name: Detect if etc_dnsmasq_d already true
      ansible.builtin.command: >-
        grep -Eq '^\s*etc_dnsmasq_d\s*=\s*true\s*$' {{ pihole_host_etc_dir }}/pihole.toml
      register: pihole_toml_dnsmasq_true
      changed_when: false
      failed_when: false
      become: false

    - name: Set etc_dnsmasq_d to true if set to false
      ansible.builtin.replace:
        path: "{{ pihole_host_etc_dir }}/pihole.toml"
        regexp: '^(\s*etc_dnsmasq_d\s*=)\s*false\s*$'
        replace: '\1 true'
      when: pihole_toml_dnsmasq_true.rc != 0
      notify: Restart pihole dns
      become: false

    - name: Detect if etc_dnsmasq_d key exists
      ansible.builtin.command: >-
        grep -Eq '^\s*etc_dnsmasq_d\s*=' {{ pihole_host_etc_dir }}/pihole.toml
      register: pihole_toml_dnsmasq_key
      changed_when: false
      failed_when: false
      become: false

    - name: Insert etc_dnsmasq_d = true under [misc] if key missing
      ansible.builtin.lineinfile:
        path: "{{ pihole_host_etc_dir }}/pihole.toml"
        regexp: '^\s*etc_dnsmasq_d\s*='
        line: 'etc_dnsmasq_d = true'
        insertafter: '^\[misc\]'
        state: present
      when: pihole_toml_dnsmasq_true.rc != 0 and pihole_toml_dnsmasq_key.rc != 0
      notify: Restart pihole dns
      become: false

# -------------------------
# Custom DNS A records via dnsmasq.d (preferred automation mode)
# -------------------------

- name: Manage custom DNS records via dnsmasq (address= lines)
  when:
    - (pihole_dns_mode | default('dnsmasq')) == 'dnsmasq'
  become: true
  block:
    - name: Render custom DNS records file from template
      ansible.builtin.template:
        src: dnsmasq-custom.conf.j2
        dest: "/home/{{ target_user }}/pihole/dnsmasq.d/05-ansible-local-dns.conf"
        owner: root
        group: root
        mode: '0644'
      when: (pihole_custom_dns_records | default([])) | length > 0
      notify: Restart pihole dns

    - name: Remove custom DNS records file when list is empty
      ansible.builtin.file:
        path: "/home/{{ target_user }}/pihole/dnsmasq.d/05-ansible-local-dns.conf"
        state: absent
      when: (pihole_custom_dns_records | default([])) | length == 0

- name: Ensure keepalived conf.d directory exists
  ansible.builtin.file:
    path: /etc/keepalived/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))

- name: Check if keepalived main config exists
  ansible.builtin.stat:
    path: /etc/keepalived/keepalived.conf
  register: pihole_keepalived_main
  become: true
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))

- name: Create minimal keepalived main config with include if missing
  ansible.builtin.copy:
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      global_defs {
        enable_script_security
      }
      include /etc/keepalived/conf.d/*.conf
  when:
    - inventory_hostname in (groups['pihole_cluster'] | default([]))
    - not pihole_keepalived_main.stat.exists
  become: true

- name: Ensure keepalived main config includes conf.d
  ansible.builtin.lineinfile:
    path: /etc/keepalived/keepalived.conf
    regexp: '^\s*include\s+/etc/keepalived/conf\.d/\*\.conf\s*$'
    line: 'include /etc/keepalived/conf.d/*.conf'
    state: present
    insertbefore: EOF
  become: true
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))

- name: Normalize keepalived main configuration (purge legacy vrrp instances)
  ansible.builtin.copy:
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      global_defs {
        enable_script_security
      }
      include /etc/keepalived/conf.d/*.conf
  become: true
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))


- name: Render Pi-hole VRRP instance into conf.d
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/conf.d/pihole.conf
    owner: root
    group: root
    mode: '0644'
  vars:
    vip_address: "{{ pihole_virtual_ip }}"
    vrrp_interface: "{{
      pihole_vrrp_interface | default(
        ansible_facts['default_ipv4']['interface'] | default(
          ansible_facts['default_ipv6']['interface'] | default(
            (ansible_facts['interfaces'] | select('match','^(e|en|eth)') | list | first) | default('end0')
          )
        )
      )
    }}"
    vrrp_state: "{{ 'MASTER' if pihole_is_primary | bool else 'BACKUP' }}"
    vrrp_priority: "{{ 150 if pihole_is_primary | bool else 100 }}"
    vrrp_auth_pass: "{{ pihole_vrrp_auth_pass | default('p1h0l3') }}"
  notify: Restart keepalived
  become: true
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))

- name: Ensure non-local bind is enabled for services on VIP (recommended)
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    state: present
    sysctl_set: true
    reload: true
  become: true
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))

- name: Validate keepalived configuration before (re)start
  ansible.builtin.command: keepalived -t -f /etc/keepalived/keepalived.conf
  changed_when: false
  become: true
  register: keepalived_validate
  failed_when: false
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))

- name: Enable and start keepalived
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true
    daemon_reload: true
  become: true
  when: inventory_hostname in (groups['pihole_cluster'] | default([]))
  register: keepalived_systemd
  failed_when: false

- name: Show keepalived validation output (if validation failed)
  ansible.builtin.debug:
    var: keepalived_validate.stderr
  when:
    - inventory_hostname in (groups['pihole_cluster'] | default([]))
    - keepalived_validate is defined
    - keepalived_validate.rc | default(0) != 0

- name: Show keepalived journal on failure
  ansible.builtin.command: journalctl -u keepalived --no-pager -n 100
  register: keepalived_journal
  changed_when: false
  become: true
  when:
    - inventory_hostname in (groups['pihole_cluster'] | default([]))
    - keepalived_systemd is defined
    - (keepalived_systemd is failed) or (keepalived_systemd.status is defined and keepalived_systemd.status != 0)

- name: Fail with keepalived journal extract
  ansible.builtin.fail:
    msg: |
      keepalived failed to start. Validation rc={{ keepalived_validate.rc | default('n/a') }}
      Validation stderr: {{ keepalived_validate.stderr | default('') }}
      Recent journal:
      {{ keepalived_journal.stdout | default('no journal captured') }}
  when:
    - inventory_hostname in (groups['pihole_cluster'] | default([]))
    - keepalived_systemd is defined
    - (keepalived_systemd is failed) or (keepalived_validate is defined and keepalived_validate.rc | default(0) != 0)

# -------------------------
# Replicas: keep configuration in sync with primary using Gravity Sync (Docker mode)
# -------------------------

- name: Ensure sync prerequisites on replicas (Arch)
  community.general.pacman:
    name:
      - rsync
      - git
      - sqlite
    state: present
  become: true
  when: (ansible_facts['distribution'] | lower) == 'archlinux' and (pihole_is_replica | bool)


- name: Clone Gravity Sync on replicas
  ansible.builtin.git:
    repo: https://github.com/vmstan/gravity-sync.git
    dest: /opt/gravity-sync
    version: "{{ gravity_sync_ref | default('HEAD') }}"
    update: false
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true))

# -------------------------
# Docker container runtime for Pi-hole
# -------------------------

- name: Stop and disable systemd-resolved (free port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  become: true
  failed_when: false

- name: Stop and disable dnsmasq if present (avoid port 53 conflict)
  ansible.builtin.systemd:
    name: dnsmasq
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Check if /etc/resolv.conf is a symlink
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: pihole_resolvconf_stat
  become: true

- name: Remove /etc/resolv.conf symlink if managed by systemd-resolved
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when: pihole_resolvconf_stat.stat.islnk | default(false)
  become: true

- name: Ensure host resolv.conf has a usable upstream during startup
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ pihole_static_dns }}
    owner: root
    group: root
    mode: '0644'
  become: true
  when: pihole_static_dns is defined

- name: Ensure Pi-hole data directories exist (host mounts)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"
  loop:
    - "/home/{{ target_user }}/pihole/pihole"
    - "/home/{{ target_user }}/pihole/dnsmasq.d"
  become: true

- name: Configure wildcard DNS to reverse-proxy VIP via dnsmasq (optional)
  ansible.builtin.copy:
    dest: "/home/{{ target_user }}/pihole/dnsmasq.d/99-wildcard-vip.conf"
    owner: root
    group: root
    mode: '0644'
    content: |
      {% for d in (pihole_dns_wildcard_domains | default([])) %}
      address=/{{ d }}/{{ pihole_reverse_proxy_vip }}
      {% endfor %}
  when: pihole_dns_wildcard_enabled | default(false) | bool
  notify: Restart pihole dns
  become: true

# Note: On some RPi kernels, netfilter/bridge capabilities needed by Podman user networks
# are unavailable. We run the Pi-hole container in host network (rootful) to bind low ports
# without relying on port publishing or netavark bridges.

- name: Start/Update pihole container (Podman)
  containers.podman.podman_container:
    name: "{{ pihole_container_name }}"
    image: "{{ pihole_image }}"
    state: started
    restart_policy: always
    network: host
    env:
      TZ: "{{ pihole_timezone }}"
      FTLCONF_webserver_api_password: "{{ pihole_web_password }}"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_upstreams: "{{ pihole_dns }}"
    volumes:
      - "/home/{{ target_user }}/pihole/pihole/:/etc/pihole/"
      - "/home/{{ target_user }}/pihole/dnsmasq.d/:/etc/dnsmasq.d/"
  become: true

- name: Wait for pihole web UI to be up
  ansible.builtin.wait_for:
    port: 80
    delay: 5
    timeout: 60

- name: Add cron to update gravity every day
  ansible.builtin.cron:
    name: "update pihole gravity"
    minute: 0
    hour: 0
    job: "podman exec {{ pihole_container_name }} pihole updateGravity"
  become: true

- name: Remove old image versions (Podman)
  containers.podman.podman_prune:
    image: true

- name: Configure Gravity Sync for Docker on replicas
  ansible.builtin.template:
    src: gravity-sync.conf.j2
    dest: /opt/gravity-sync/gravity-sync.conf
    owner: root
    group: root
    mode: '0644'
  vars:
    gs_primary_host: "{{ hostvars[pihole_primary_host].ansible_host | default(pihole_primary_host) }}"
    gs_primary_user: "{{ hostvars[pihole_primary_host].ansible_ssh_user | default(target_user) }}"
    gs_primary_port: "{{ hostvars[pihole_primary_host].ansible_port | default(22) }}"
    gs_container_name: "{{ pihole_container_name | default('pihole') }}"
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true))

- name: Symlink gravity-sync helper to /usr/local/bin
  ansible.builtin.file:
    src: /opt/gravity-sync/gravity-sync.sh
    dest: /usr/local/bin/gravity-sync
    state: link
    force: true
    owner: root
    group: root
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true))

- name: Create cron to run Gravity Sync hourly on replicas
  ansible.builtin.cron:
    name: "gravity-sync hourly"
    minute: 0
    job: "/usr/local/bin/gravity-sync sync"
    user: root
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true)) and (gravity_sync_schedule | default('hourly')) == 'hourly'

- name: Initial Gravity Sync run (best-effort)
  ansible.builtin.command: /usr/local/bin/gravity-sync sync
  register: gs_result
  changed_when: false
  failed_when: false
  become: true
  when: (pihole_is_replica | bool) and (gravity_sync_enabled | default(true))
  check_mode: no

## Removed role execution flag mechanism; rely on idempotent tasks
