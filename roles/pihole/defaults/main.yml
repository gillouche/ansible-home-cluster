---
# Docker image and container name (pinned by default; override in group_vars if needed)
pihole_image: "pihole/pihole:2025.11.1"
pihole_container_name: "pihole"

# Environment defaults
pihole_web_password: "changeme"
# Upstream DNS servers for Pi-hole inside the container (semicolon-separated per Pi-hole docs)
pihole_dns: "1.1.1.1;8.8.8.8"
# Secondary DNS for Docker daemon to use when starting container (host resolver fallback)
pihole_static_dns: "1.1.1.1"

# Timezone (will typically be provided globally via inventory)
pihole_timezone: "Europe/Brussels"

# Optional: run container as a non-root user if image supports it (empty = image default)
# Example (uid:gid): "1000:1000" or a named user if supported by the image
pihole_container_user: ""

# Pi-hole note: Running FTL as non-root typically fails due to capabilities
# (e.g., CAP_SETFCAP) and low-port binding. Set the DNSMASQ user explicitly
# to root to avoid startup errors like "Unable to set capabilities".
# Change only if you fully support rootless with proper capabilities and mounts.
pihole_dnsmasq_user: "root"

# Optional: custom DNS A records to publish via Pi-hole (on primary only)
# Example:
# pihole_custom_dns_records:
#   - host: "primary.pihole.{{ base_domain }}"
#     ip: "192.168.0.252"  # reverse proxy VIP
#   - host: "replica1.pihole.{{ base_domain }}"
#     ip: "192.168.0.252"
pihole_custom_dns_records: []

# Host path that is bind-mounted to /etc/pihole inside the container
# Default matches the volumes mapping in the role (host: /home/<user>/pihole/pihole -> /etc/pihole)
pihole_host_etc_dir: "/home/{{ target_user }}/pihole/pihole"

# Host path that is bind-mounted to /etc/dnsmasq.d inside the container
pihole_host_dnsmasq_dir: "/home/{{ target_user }}/pihole/dnsmasq.d"

# DNS record management mode:
# - 'cli'     : use `pihole -a addcustomdns` / `removecustomdns` (appears in UI)
# - 'dnsmasq' : write address= lines into /etc/dnsmasq.d/05-ansible-local-dns.conf
pihole_dns_mode: "dnsmasq"

################################################################################
# Wildcard DNS to Reverse Proxy VIP (dnsmasq)
# - Disabled by default.
# - When enabled, creates dnsmasq entries that map the configured domains and
#   their subdomains to the reverse proxy VIP (Caddy/keepalived), so that any
#   host under those domains resolves to the VIP.
################################################################################

# Turn on to manage wildcard records via dnsmasq
pihole_dns_wildcard_enabled: false

# Domains to wildcard-map to the reverse proxy VIP. Each entry produces:
#   address=/DOMAIN/{{ pihole_reverse_proxy_vip }}
# By default:
#  - the base homelab domain (e.g., gillouche.homelab)
#  - the pihole subtree (pihole.gillouche.homelab) for multi-label hosts
pihole_dns_wildcard_domains:
  - "{{ base_domain | default('gillouche.homelab') }}"

# Reverse proxy VIP used for wildcard DNS (defaults to global reverse_proxy_virtual_ip)
pihole_reverse_proxy_vip: "{{ reverse_proxy_virtual_ip | default('192.168.0.252') }}"

# Networking/ports for Podman
# Run rootless by default using slirp4netns and publish mapped ports
pihole_rootless: false
pihole_dns_tcp_port: 53
pihole_dns_udp_port: 53
pihole_http_host_port: 8080
pihole_https_host_port: 8443
