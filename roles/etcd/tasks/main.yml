---
- name: Ensure /mnt/data exists (NVMe mount point)
  ansible.builtin.file:
    path: /mnt/data
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Ensure etcd data directory exists
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  become: true
  register: _etcd_dir_stat

- name: Debug etcd directory existence # noqa: no-handler
  ansible.builtin.debug:
    msg: "Directory {{ etcd_data_dir }} created/verified."
  when: _etcd_dir_stat.changed

- name: Start etcd container
  containers.podman.podman_container:
    name: "{{ etcd_container_name }}"
    image: "quay.io/coreos/etcd:{{ etcd_version }}"
    state: created
    generate_systemd:
      path: /etc/systemd/system/
      restart_policy: always
      names: true
      container_prefix: container
    restart_policy: "no"
    published_ports:
      - "{{ etcd_client_port }}:{{ etcd_client_port }}"
      - "{{ etcd_peer_port }}:{{ etcd_peer_port }}"
    command:
      - /usr/local/bin/etcd
      - --name={{ inventory_hostname }}
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://{{ ansible_host | default(ansible_facts.default_ipv4.address) }}:{{ etcd_peer_port }}
      - --listen-peer-urls=http://0.0.0.0:{{ etcd_peer_port }}
      - --advertise-client-urls=http://{{ ansible_host | default(ansible_facts.default_ipv4.address) }}:{{ etcd_client_port }}
      - --listen-client-urls=http://0.0.0.0:{{ etcd_client_port }}
      - >-
          --initial-cluster={{ groups['etcd_cluster'] | sort | map('extract', hostvars, ['ansible_host']) |
          zip(groups['etcd_cluster'] | sort) | map('format_etcd_peer', etcd_peer_port) | join(',') }}
      - --initial-cluster-state={{ etcd_initial_cluster_state | default('new') }}
      - --initial-cluster-token={{ etcd_initial_cluster_token }}
    volumes:
      - "{{ etcd_data_dir }}:/etcd-data:Z"
  become: true
  notify: Restart Etcd

- name: Enable and start Etcd systemd service
  ansible.builtin.systemd:
    name: "container-{{ etcd_container_name }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true
