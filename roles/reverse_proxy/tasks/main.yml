---

- name: Ensure reverse_proxy system user exists with home
  block:
    - name: Detect nologin path
      ansible.builtin.set_fact:
        _nologin_path: >-
          {{ '/usr/sbin/nologin' if (ansible_facts['path'] is defined and '/usr/sbin' in ansible_facts['path']) else '/sbin/nologin' }}
      when: false  # placeholder; below we probe files directly

    - name: Probe available nologin paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/sbin/nologin
        - /sbin/nologin
        - /usr/bin/nologin
      register: _nologin_stats

    - name: Pick first available nologin
      ansible.builtin.set_fact:
        reverse_proxy_nologin: "{{ (_nologin_stats.results |
         selectattr('stat.exists','defined') |
          selectattr('stat.exists') |
           map(attribute='invocation.module_args.path') |
            list | first) | default('/usr/sbin/nologin') }}"

    - name: Create reverse_proxy system user with home
      ansible.builtin.user:
        name: reverse_proxy
        comment: "Reverse Proxy Service User"
        home: "/home/reverse_proxy"
        create_home: true
        shell: "{{ reverse_proxy_nologin }}"
        system: true
  become: true

# tasks for reverse_proxy (Caddy + keepalived VIP)
- name: Gather minimal facts (role safeguard when running with tags)
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_distribution is not defined

- name: Determine reverse proxy role for this host
  ansible.builtin.set_fact:
    reverse_proxy_is_primary: "{{ inventory_hostname in (groups['reverse_proxy_primary'] | default([])) }}"
  become: false
- name: Warn if VRRP auth password is not set (keepalived will be skipped)
  ansible.builtin.debug:
    msg: >-
      reverse_proxy_vrrp_auth_pass is undefined or too short (<12). Skipping keepalived VRRP configuration on this host.
      Define it in group_vars/reverse_proxy_cluster.vault.yml and encrypt with ansible-vault for HA VIP.
  when: (reverse_proxy_vrrp_auth_pass is not defined) or ((reverse_proxy_vrrp_auth_pass | length) < 12)
  become: false

- name: Render reverse proxy VRRP instance into conf.d
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/conf.d/reverse-proxy.conf
    owner: root
    group: root
    mode: '0644'
  vars:
    vip_address: "{{ reverse_proxy_virtual_ip }}"
    vrrp_interface: "{{ ansible_facts['default_ipv4']['interface'] | default('eth0') }}"
    vrrp_state: "{{ 'MASTER' if reverse_proxy_is_primary | bool else 'BACKUP' }}"
    vrrp_priority: "{{ 150 if reverse_proxy_is_primary | bool else 100 }}"
    vrrp_auth_pass: "{{ reverse_proxy_vrrp_auth_pass }}"
  notify: Restart keepalived
  become: true
  when: (reverse_proxy_vrrp_auth_pass is defined) and ((reverse_proxy_vrrp_auth_pass | length) >= 12)


- name: Check if /etc/resolv.conf is a symlink (reverse proxy)
  ansible.builtin.stat:
    path: /etc/resolv.conf
  register: reverse_proxy_resolvconf_stat
  become: true
  when: reverse_proxy_manage_resolv_conf | default(false) | bool

- name: Remove /etc/resolv.conf symlink if managed by systemd-resolved (reverse proxy)
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when: (reverse_proxy_manage_resolv_conf | default(false) | bool) and (reverse_proxy_resolvconf_stat.stat.islnk | default(false))
  become: true

- name: Ensure /etc/resolv.conf uses Pi-hole VIP with public fallback (reverse proxy)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ reverse_proxy_resolver_ip }}
      nameserver {{ reverse_proxy_public_resolver }}
    owner: root
    group: root
    mode: '0644'
  when: reverse_proxy_manage_resolv_conf | default(false) | bool
  become: true

# ----------------------------------------
# Caddy reverse proxy using Podman
# ----------------------------------------

- name: Ensure reverse proxy host directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "reverse_proxy"
    group: "reverse_proxy"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ reverse_proxy_root_dir }}", mode: '0755'}
    - {path: "{{ reverse_proxy_config_dir }}", mode: '0755'}
    - {path: "{{ reverse_proxy_data_dir }}", mode: '0755'}
    - {path: "{{ reverse_proxy_certs_dir }}", mode: '0755'}
  become: true

- name: Build Caddyfile from reverse_proxy_domains (use Vault ACME)
  ansible.builtin.template:
    src: "Caddyfile.j2"
    dest: "{{ reverse_proxy_config_dir }}/Caddyfile"
    owner: reverse_proxy
    group: reverse_proxy
    mode: '0644'
  notify: Restart reverse proxy
  become: true


- name: Copy Vault Cluster CA to reverse proxy trust path (for ACME)
  ansible.builtin.copy:
    src: "{{ tls_dir }}/ca-bundle.pem"
    remote_src: true
    dest: "{{ reverse_proxy_certs_dir }}/ca-bundle.pem"
    owner: "reverse_proxy"
    group: "reverse_proxy"
    mode: '0644'
  become: true
  notify: Restart reverse proxy

- name: Render Caddyfile with Vault ACME configured
  ansible.builtin.template:
    src: "Caddyfile.j2"
    dest: "{{ reverse_proxy_config_dir }}/Caddyfile"
    owner: "reverse_proxy"
    group: "reverse_proxy"
    mode: '0644'
  notify: Restart reverse proxy
  become: true

- name: Ensure reverse proxy container is running (rootful Podman)
  containers.podman.podman_container:
    name: "{{ reverse_proxy_container_name }}"
    image: "{{ reverse_proxy_image }}"
    state: started
    restart_policy: unless-stopped
    user: 0
    publish:
      - "{{ reverse_proxy_http_port }}:80/tcp"
      - "{{ reverse_proxy_https_port }}:443/tcp"
    volumes:
      - "{{ reverse_proxy_config_dir }}:/etc/caddy"
      - "{{ reverse_proxy_data_dir }}:/data"
      - "{{ reverse_proxy_certs_dir }}:/etc/ssl/certs"
  become: true

- name: Remove old reverse proxy container (safety, ensure clean create)
  containers.podman.podman_container:
    name: "{{ reverse_proxy_container_name }}"
    state: absent
  become: true
  when: false  # placeholder disabled; set to true if you need explicit removal before create
