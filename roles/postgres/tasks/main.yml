---
- name: Ensure postgres group exists
  ansible.builtin.group:
    name: "{{ postgres_group }}"
    gid: "{{ postgres_gid }}"
    state: present
    system: true
  become: true

- name: Ensure postgres user exists
  ansible.builtin.user:
    name: "{{ postgres_user }}"
    uid: "{{ postgres_uid }}"
    group: "{{ postgres_group }}"
    home: "{{ postgres_home }}"
    create_home: yes
    state: present
    system: true
    shell: /bin/bash
  become: true

- name: Ensure postgres data directory exists
  ansible.builtin.file:
    path: "{{ postgres_data_dir }}"
    state: directory
    owner: "{{ postgres_uid }}"
    group: "{{ postgres_gid }}"
    mode: '0700'
  become: true

- name: Force correct ownership on postgres data directory (recursive)
  ansible.builtin.command: chown -R {{ postgres_uid }}:{{ postgres_gid }} {{ postgres_data_dir }}
  become: true
  changed_when: false

- name: Ensure postgres config directory exists
  ansible.builtin.file:
    path: "{{ postgres_config_dir }}"
    state: directory
    owner: "{{ postgres_uid }}"
    group: "{{ postgres_gid }}"
    mode: '0755'
  become: true

- name: Render Patroni configuration
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: "{{ postgres_config_dir }}/patroni.yml"
    owner: "{{ postgres_uid }}"
    group: "{{ postgres_gid }}"
    mode: '0640'
  become: true
  register: _patroni_render
  # notify: Restart Postgres  <-- DISABLED: Managed via SPILO_CONFIGURATION env var changes in podman task

- name: Install HAProxy and health check packages
  ansible.builtin.package:
    name:
      - "{{ postgres_haproxy_package }}"
      - psmisc
    state: present
  become: true

- name: Ensure HAProxy config directory exists
  ansible.builtin.file:
    path: /etc/haproxy
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Ensure HAProxy conf.d directory exists
  ansible.builtin.file:
    path: /etc/haproxy/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Ensure HAProxy systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/{{ postgres_haproxy_service }}.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Install HAProxy systemd drop-in configuration
  ansible.builtin.copy:
    dest: /etc/systemd/system/{{ postgres_haproxy_service }}.service.d/conf-d.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/sbin/haproxy -Ws -f /etc/haproxy/haproxy.cfg -f /etc/haproxy/conf.d/ -p /run/haproxy.pid
  become: true
  register: _haproxy_dropin
  notify: Reload systemd

- name: Force systemd reload if drop-in changed
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: _haproxy_dropin.changed

- name: Render HAProxy main configuration
  ansible.builtin.copy:
    dest: /etc/haproxy/haproxy.cfg
    content: |
      global
          log /dev/log local0
          log /dev/log local1 notice
          daemon
      defaults
          log     global
          mode    tcp
          option  tcplog
          timeout connect 5s
          timeout client  1m
          timeout server  1m
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart haproxy

- name: Render HAProxy configuration for Postgres
  ansible.builtin.template:
    src: haproxy-postgres.cfg.j2
    dest: /etc/haproxy/conf.d/postgres.cfg
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart haproxy

- name: Enable and start HAProxy service
  ansible.builtin.systemd:
    name: "{{ postgres_haproxy_service }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Render Keepalived configuration for Postgres VIP
  ansible.builtin.template:
    src: keepalived-postgres.conf.j2
    dest: /etc/keepalived/conf.d/postgres.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart keepalived

- name: Flush handlers to ensure Keepalived and HAProxy are updated
  ansible.builtin.meta: flush_handlers

- name: Ensure Keepalived service is running
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true
  become: true

- name: Set Spilo configuration fact
  ansible.builtin.set_fact:
    _spilo_config:
      scope: "{{ postgres_cluster_name }}"
      name: "{{ inventory_hostname }}"
      etcd3:
        hosts: "{{ groups['postgres'] | sort | map('extract', hostvars, 'ansible_host') | join(':' ~ (global_etcd_port | default(2379)) ~ ',') }}:{{ global_etcd_port | default(2379) }}"
      postgresql:
        port: "{{ postgres_port | int }}"
        listen: "0.0.0.0:{{ postgres_port }}"
        connect_address: "{{ hostvars[inventory_hostname].ansible_host }}:{{ postgres_port }}"
        parameters:
          unix_socket_directories: "/var/run/postgresql, /tmp"
          port: "{{ postgres_port | int }}"
        pg_hba:
          - local   all             all                                   trust
          - host    all             all             127.0.0.1/32            md5
          - host    all             all             ::1/128                 md5
          - local   replication     replicator                              trust
          - host    replication     replicator      {{ lan_subnet }}        md5
          - host    {{ postgres_db_name }} {{ postgres_db_user }} {{ lan_subnet }} md5
          - host    {{ postgres_db_name }} {{ postgres_db_user }} {{ k3s_cluster_cidr }} md5
          - host    {{ postgres_authelia_db_name }} {{ postgres_authelia_db_user }} {{ lan_subnet }} md5
          - host    {{ postgres_authelia_db_name }} {{ postgres_authelia_db_user }} {{ k3s_cluster_cidr }} md5
          - local   all             postgres                                trust
          - host    all             postgres        {{ lan_subnet }}        md5
      bootstrap:
        dcs:
          postgresql:
            pg_hba:
              - local   all             all                                   trust
              - host    all             all             127.0.0.1/32            md5
              - host    all             all             ::1/128                 md5
              - local   replication     replicator                              trust
              - host    replication     replicator      {{ lan_subnet }}        md5
              - host    {{ postgres_db_name }} {{ postgres_db_user }} {{ lan_subnet }} md5
              - host    {{ postgres_db_name }} {{ postgres_db_user }} {{ k3s_cluster_cidr }} md5
              - host    {{ postgres_authelia_db_name }} {{ postgres_authelia_db_user }} {{ lan_subnet }} md5
              - host    {{ postgres_authelia_db_name }} {{ postgres_authelia_db_user }} {{ k3s_cluster_cidr }} md5
              - local   all             postgres                                trust
              - host    all             postgres        {{ lan_subnet }}        md5
        init:
          postgresql:
            auth:
              user:
                username: "{{ postgres_db_user }}"
                password: "{{ postgres_db_password }}"
              superuser:
                username: postgres
                password: "{{ postgres_db_password }}"
              replication:
                username: replicator
                password: "{{ postgres_db_password }}"
  become: false
  register: _spilo_config_render

- name: Check if Patroni configuration or Spilo config changed
  ansible.builtin.set_fact:
    _postgres_container_recreate: "{{ _patroni_render.changed or _spilo_config_render.changed }}"

- name: Run Postgres container (Patroni)
  containers.podman.podman_container:
    name: "{{ postgres_container_name }}"
    image: "{{ postgres_image }}"
    state: started
    recreate: "{{ _postgres_container_recreate | default(false) }}"
    restart_policy: always
    published_ports:
      - "{{ postgres_port }}:{{ postgres_port }}"
      - "{{ postgres_patroni_port }}:{{ postgres_patroni_port }}"
    env:
      # Core Spilo/Patroni identification
      SCOPE: "{{ postgres_cluster_name }}"
      PATRONI_SCOPE: "{{ postgres_cluster_name }}"
      PATRONI_NAME: "{{ inventory_hostname }}"

      # Networking and Ports
      PGPORT: "{{ postgres_port | string }}"
      PATRONI_POSTGRESQL_PORT: "{{ postgres_port | string }}"
      PATRONI_POSTGRESQL_LISTEN: "0.0.0.0:{{ postgres_port }}"
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: "{{ hostvars[inventory_hostname].ansible_host }}:{{ postgres_port }}"
      APIPORT: "{{ postgres_patroni_port }}"
      PATRONI_RESTAPI_LISTEN: "0.0.0.0:{{ postgres_patroni_port }}"
      PATRONI_RESTAPI_CONNECT_ADDRESS: "{{ hostvars[inventory_hostname].ansible_host }}:{{ postgres_patroni_port }}"

      # Etcd Configuration
      ETCD_HOSTS: "{{ groups['postgres'] | sort | map('extract', hostvars, 'ansible_host') | join(':' ~ (global_etcd_port | default(2379)) ~ ',') }}:{{ global_etcd_port | default(2379) }}"
      PATRONI_ETCD3_HOSTS: "{{ groups['postgres'] | sort | map('extract', hostvars, 'ansible_host') | join(':' ~ (global_etcd_port | default(2379)) ~ ',') }}:{{ global_etcd_port | default(2379) }}"
      ETCD3_ENDPOINTS: "{{ groups['postgres'] | sort | map('extract', hostvars, 'ansible_host') | map('regex_replace', '^', 'http://') | join(':' ~ (global_etcd_port | default(2379)) ~ ',') }}:{{ global_etcd_port | default(2379) }}"
      DCS_ENABLE_INTERNAL_ETCD: "false"

      # Authentication
      PGUSER_SUPERUSER: postgres
      PGPASSWORD_SUPERUSER: "{{ postgres_db_password }}"
      PGUSER_ADMIN: "{{ postgres_db_user }}"
      PGPASSWORD_ADMIN: "{{ postgres_db_password }}"
      USE_ADMIN: "true"
      PGUSER_STANDBY: replicator
      PGPASSWORD_STANDBY: "{{ postgres_db_password }}"

      # Paths
      PGROOT: "/home/postgres/pgdata"
      PGDATA: "/home/postgres/pgdata/pgdata"
      PATRONI_POSTGRESQL_DATA_DIR: "/home/postgres/pgdata/pgdata"
      PATRONI_POSTGRESQL_BIN_DIR: "/usr/lib/postgresql/{{ postgres_version }}/bin"
      PATRONI_POSTGRESQL_PGPASS: "/home/postgres/.pgpass"
      PGVERSION: "{{ postgres_version }}"

      # Configuration
      SPILO_CONFIGURATION: "{{ _spilo_config | to_json }}"
      PGHBA_EDITABLE: "true"
    volumes:
      - "{{ postgres_data_dir }}:/home/postgres/pgdata:Z"
  become: true
  register: _postgres_container

- name: Wait for Postgres container to stabilize
  ansible.builtin.pause:
    seconds: 5
  become: false
  when: _postgres_container.changed

- name: Verify Postgres container is running
  ansible.builtin.command: podman inspect {{ postgres_container_name }} --format '{{ '{{' }} .State.Running {{ '}}' }}'
  register: _postgres_running
  retries: 5
  delay: 2
  until: _postgres_running.stdout == 'true'
  changed_when: false
  become: true
  when: _postgres_container.changed

- name: Ensure Patroni API is responding
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ postgres_patroni_port }}/health"
    status_code: 200
  register: _patroni_health
  retries: 30
  delay: 5
  until: _patroni_health.status == 200
  become: false
  when: _postgres_container.changed

  # Only wait if we just (re)started the container.
  # Otherwise, we assume it's already healthy if podman says it's running.

# Spilo/Patroni only sets the password during the INITIAL bootstrap of the cluster.
# If the database already exists (on the NVME SSD), changing environment variables will NOT update the password in the DB.
# We must explicitly sync the password to ensure it matches what Ansible/K3s expects.
- name: Check if current node is Patroni leader
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ postgres_patroni_port }}/leader"
    status_code: [200, 503]
  register: _patroni_leader_check
  become: false

- name: Set leader status fact
  ansible.builtin.set_fact:
    is_postgres_leader: "{{ _patroni_leader_check.status == 200 }}"

- name: Update Patroni DCS configuration with new pg_hba rules (Leader only)
  ansible.builtin.shell:
    cmd: >
      podman exec {{ postgres_container_name }}
      patronictl edit-config --force --set "postgresql.pg_hba=['local all all trust', 'host all all 127.0.0.1/32 md5', 'host all all ::1/128 md5', 'local replication replicator trust', 'host replication replicator {{ lan_subnet }} md5', 'host {{ postgres_db_name }} {{ postgres_db_user }} {{ lan_subnet }} md5', 'host {{ postgres_db_name }} {{ postgres_db_user }} {{ k3s_cluster_cidr }} md5', 'host {{ postgres_authelia_db_name }} {{ postgres_authelia_db_user }} {{ lan_subnet }} md5', 'host {{ postgres_authelia_db_name }} {{ postgres_authelia_db_user }} {{ k3s_cluster_cidr }} md5', 'local all postgres trust', 'host all postgres {{ lan_subnet }} md5']"
  become: true
  when: is_postgres_leader
  changed_when: true
  register: _patroni_config_update

- name: Force Patroni reload to apply HBA changes (Leader only)
  ansible.builtin.command:
    cmd: podman exec {{ postgres_container_name }} patronictl reload {{ postgres_cluster_name }} --force
  become: true
  when: is_postgres_leader and _patroni_config_update.changed

- name: Administrative tasks (Leader only)
  block:
    - name: Ensure postgres database user has the correct password
      ansible.builtin.command:
        cmd: >
          podman exec {{ postgres_container_name }}
          psql -U postgres -d postgres -c "ALTER USER {{ postgres_db_user }} WITH PASSWORD '{{ postgres_db_password }}';"
      register: _alter_user
      failed_when:
        - _alter_user.rc != 0
        - '"role \"" + postgres_db_user + "\" does not exist" not in _alter_user.stderr'
      changed_when: "'ALTER ROLE' in _alter_user.stdout"
      retries: 5
      delay: 5
      until: _alter_user.rc == 0 or ("role \"" + postgres_db_user + "\" does not exist") in _alter_user.stderr

    - name: Create postgres database user if it does not exist
      ansible.builtin.command:
        cmd: >
          podman exec {{ postgres_container_name }}
          psql -U postgres -d postgres -c "CREATE USER {{ postgres_db_user }} WITH PASSWORD '{{ postgres_db_password }}';"
      when: '("role \"" + postgres_db_user + "\" does not exist") in _alter_user.stderr'
      register: _create_user
      changed_when: "'CREATE ROLE' in _create_user.stdout"

    - name: Ensure postgres database exists
      ansible.builtin.command:
        cmd: >
          podman exec {{ postgres_container_name }}
          psql -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ postgres_db_name }}';"
      register: _db_exists
      changed_when: false
      retries: 5
      delay: 5
      until: _db_exists.rc == 0

    - name: Create postgres database if it does not exist
      ansible.builtin.command:
        cmd: >
          podman exec {{ postgres_container_name }}
          psql -U postgres -d postgres -c "CREATE DATABASE {{ postgres_db_name }} OWNER {{ postgres_db_user }};"
      when: _db_exists.stdout != "1"
      register: _create_db
      changed_when: "'CREATE DATABASE' in _create_db.stdout"

    - name: Ensure Authelia database user has the correct password
      ansible.builtin.command:
        cmd: >
          podman exec {{ postgres_container_name }}
          psql -U postgres -d postgres -c "ALTER USER {{ postgres_authelia_db_user }} WITH PASSWORD '{{ postgres_authelia_db_password }}';"
      register: _alter_authelia_user
      failed_when:
        - _alter_authelia_user.rc != 0
        - '"role \"" + postgres_authelia_db_user + "\" does not exist" not in _alter_authelia_user.stderr'
      changed_when: "'ALTER ROLE' in _alter_authelia_user.stdout"
      retries: 5
      delay: 5
      until: _alter_authelia_user.rc == 0 or ("role \"" + postgres_authelia_db_user + "\" does not exist") in _alter_authelia_user.stderr

    - name: Create Authelia database user if it does not exist
      ansible.builtin.command:
        cmd: >
          podman exec {{ postgres_container_name }}
          psql -U postgres -d postgres -c "CREATE USER {{ postgres_authelia_db_user }} WITH PASSWORD '{{ postgres_authelia_db_password }}';"
      when: '("role \"" + postgres_authelia_db_user + "\" does not exist") in _alter_authelia_user.stderr'
      register: _create_authelia_user
      changed_when: "'CREATE ROLE' in _create_authelia_user.stdout"

    - name: Ensure Authelia database exists
      ansible.builtin.command:
        cmd: >
          podman exec {{ postgres_container_name }}
          psql -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ postgres_authelia_db_name }}';"
      register: _authelia_db_exists
      changed_when: false
      retries: 5
      delay: 5
      until: _authelia_db_exists.rc == 0

    - name: Create Authelia database if it does not exist
      ansible.builtin.command:
        cmd: >
          podman exec {{ postgres_container_name }}
          psql -U postgres -d postgres -c "CREATE DATABASE {{ postgres_authelia_db_name }} OWNER {{ postgres_authelia_db_user }};"
      when: _authelia_db_exists.stdout != "1"
      register: _create_authelia_db
      changed_when: "'CREATE DATABASE' in _create_authelia_db.stdout"

    - name: Ensure postgres superuser has the correct password
      ansible.builtin.command:
        cmd: >
          podman exec {{ postgres_container_name }}
          psql -U postgres -d postgres -c "ALTER USER postgres WITH PASSWORD '{{ postgres_db_password }}';"
      register: _alter_superuser
      changed_when: "'ALTER ROLE' in _alter_superuser.stdout"
      retries: 5
      delay: 5
      until: _alter_superuser.rc == 0
  when: is_postgres_leader
  become: true

- name: Verify database connectivity with password (internal network)
  ansible.builtin.command:
    cmd: >
      podman exec -e PGPASSWORD="{{ postgres_db_password }}" {{ postgres_container_name }}
      psql -h 127.0.0.1 -p {{ postgres_port }} -U {{ postgres_db_user }} -d {{ postgres_db_name }} -c "SELECT 1;"
  become: true
  register: _db_connectivity
  retries: 15
  delay: 5
  until: _db_connectivity.rc == 0
  changed_when: false

- name: Verify superuser connectivity with password (internal network)
  ansible.builtin.command:
    cmd: >
      podman exec -e PGPASSWORD="{{ postgres_db_password }}" {{ postgres_container_name }}
      psql -h 127.0.0.1 -p {{ postgres_port }} -U postgres -d postgres -c "SELECT 1;"
  become: true
  register: _superuser_connectivity
  retries: 15
  delay: 5
  until: _superuser_connectivity.rc == 0
  changed_when: false
