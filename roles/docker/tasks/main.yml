---
# tasks file for docker
- name: Install docker (Arch)
  community.general.pacman:
    state: present
    name: ['docker', 'docker-compose']
  notify: "Restart docker"
  become: true
  when: (ansible_facts['distribution'] | lower) == 'archlinux'

- name: Install Docker SDK dependencies for Ansible (Arch)
  community.general.pacman:
    state: present
    name:
      - python-requests
      - python-docker
  become: true
  when: (ansible_facts['distribution'] | lower) == 'archlinux'

- name: Add target_user to docker group
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: docker
    append: yes
  become: true

- name: Start service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes
  become: true
