
---
# Ensure base packages for Podman with bridge networking (netavark + nftables NAT)

- name: Gather minimal facts (role safeguard when running with tags)
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_distribution is not defined

- name: Force remove legacy iptables (ignore deps) with pacman module
  community.general.pacman:
    name: iptables
    state: absent
    force: true
  become: true
  when: (ansible_facts['distribution'] | default('') | lower) == 'archlinux'

- name: Install Podman and dependencies (Arch)
  community.general.pacman:
    name:
      - podman
      - conmon
      - slirp4netns
      - netavark
      - aardvark-dns
      - iptables-nft
    state: present
  become: true
  when: (ansible_facts['distribution'] | default('') | lower) == 'archlinux'

- name: Ensure IPv4 forwarding enabled for container networking
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    sysctl_set: true
    reload: true
  become: true

- name: Allow rootless publish of low ports (enable ports <1024 starting at 53)
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '53'
    state: present
    sysctl_set: true
    reload: true
  become: true

- name: Ensure target_user can run rootless containers (subuid/subgid)
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "{{ target_user }}:100000:65536"
    create: true
    state: present
  become: true

- name: Ensure target_user subgid range exists
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "{{ target_user }}:100000:65536"
    create: true
    state: present
  become: true

- name: Ensure newuidmap/newgidmap exist (rootless prerequisite)
  ansible.builtin.stat:
    path: "/usr/bin/{{ item }}"
  register: _uidmap_bins
  loop:
    - newuidmap
    - newgidmap

- name: Ensure newuidmap/newgidmap are owned by root and setuid
  ansible.builtin.file:
    path: "/usr/bin/{{ item.item }}"
    owner: root
    group: root
    mode: '04755'
  loop: "{{ _uidmap_bins.results | default([]) }}"
  when: item.stat.exists | default(false)
  become: true

# Configure Podman registries so short image names like "pihole/pihole:tag" resolve
- name: Ensure /etc/containers exists
  ansible.builtin.file:
    path: /etc/containers
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Configure unqualified-search registries for Podman
  ansible.builtin.copy:
    dest: /etc/containers/registries.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by ansible-home-cluster
      # Allow short names like "pihole/pihole" by defining search registries
      unqualified-search-registries = ["docker.io", "quay.io", "ghcr.io"]
  become: true
