---
- name: Create ArgoCD namespace
  ansible.builtin.command: k3s kubectl create namespace {{ argocd_namespace }}
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  register: _argocd_ns
  failed_when: _argocd_ns.rc != 0 and 'already exists' not in _argocd_ns.stderr
  changed_when: _argocd_ns.rc == 0

- name: Install ArgoCD HA ({{ argocd_version }})
  ansible.builtin.command: >-
    k3s kubectl apply -n {{ argocd_namespace }}
    -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/ha/install.yaml
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  register: _argocd_install
  changed_when: "'created' in _argocd_install.stdout or 'configured' in _argocd_install.stdout"

- name: Wait for ArgoCD server to be ready
  ansible.builtin.command: k3s kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n {{ argocd_namespace }}
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  changed_when: false

- name: Attempt login with provided password (group_vars)
  ansible.builtin.shell: >-
    argocd login --port-forward --port-forward-namespace {{ argocd_namespace }}
    --username admin
    --password '{{ argocd_admin_password }}'
    --insecure
  delegate_to: localhost
  become: false
  register: _argocd_cli_login_group_vars
  failed_when: false
  changed_when: "'logged in' in _argocd_cli_login_group_vars.stdout"

- name: Get ArgoCD Admin Password from secret if group_vars password failed
  ansible.builtin.shell: |
    set -o pipefail
    k3s kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  register: _argocd_password_secret
  changed_when: false
  when: _argocd_cli_login_group_vars.rc != 0

- name: Attempt login with secret password if group_vars password failed
  ansible.builtin.shell: >-
    argocd login --port-forward --port-forward-namespace {{ argocd_namespace }}
    --username admin
    --password '{{ _argocd_password_secret.stdout }}'
    --insecure
  delegate_to: localhost
  become: false
  register: _argocd_cli_login_secret
  when:
    - _argocd_cli_login_group_vars.rc != 0
    - _argocd_password_secret.stdout | default('') != ''
  retries: 5
  delay: 10
  until: _argocd_cli_login_secret.rc == 0
  changed_when: "'logged in' in _argocd_cli_login_secret.stdout"

- name: Set working ArgoCD password fact
  ansible.builtin.set_fact:
    argocd_working_password: "{{ argocd_admin_password if _argocd_cli_login_group_vars.rc == 0 else _argocd_password_secret.stdout }}"

- name: Ensure local storage directory exists
  ansible.builtin.file:
    path: "{{ argocd_credentials_file | dirname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Save ArgoCD Password to JSON
  ansible.builtin.copy:
    content: "{{ {'admin_password': argocd_working_password} | to_nice_json }}"
    dest: "{{ argocd_credentials_file }}"
    mode: '0600'
  delegate_to: localhost
  become: false

- name: Print ArgoCD Password location
  ansible.builtin.debug:
    msg: "ArgoCD Admin Password saved to {{ argocd_credentials_file }} -> you now need to apply root.yaml from gitops repo."

- name: Set default ArgoCD server context
  ansible.builtin.command: argocd context --port-forward --port-forward-namespace {{ argocd_namespace }}
  delegate_to: localhost
  become: false
  changed_when: false
  when: _argocd_cli_login_group_vars.rc == 0 or (_argocd_cli_login_secret.rc | default(1)) == 0
  ignore_errors: true
