---
- name: Create ArgoCD namespace
  ansible.builtin.command: k3s kubectl create namespace {{ argocd_namespace }}
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  register: _argocd_ns
  failed_when: _argocd_ns.rc != 0 and 'already exists' not in _argocd_ns.stderr
  changed_when: _argocd_ns.rc == 0

- name: Create longhorn-system namespace
  ansible.builtin.command: k3s kubectl create namespace longhorn-system
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  register: _longhorn_ns
  failed_when: _longhorn_ns.rc != 0 and 'already exists' not in _longhorn_ns.stderr
  changed_when: _longhorn_ns.rc == 0

- name: Pre-create longhorn-service-account
  ansible.builtin.command: >-
    k3s kubectl create serviceaccount longhorn-service-account
    -n longhorn-system --dry-run=client --save-config -o yaml
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  register: _longhorn_sa_yaml
  changed_when: false

- name: Apply longhorn-service-account
  ansible.builtin.command: >-
    k3s kubectl apply -f -
  args:
    stdin: "{{ _longhorn_sa_yaml.stdout }}"
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  changed_when: true

- name: Install Prometheus CRDs
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      base="https://raw.githubusercontent.com"
      repo="prometheus-operator/prometheus-operator"
      ver="v0.82.2"
      for crd in servicemonitors prometheuses \
        prometheusrules podmonitors alertmanagers \
        alertmanagerconfigs probes thanosrulers \
        scrapeconfigs; do
        k3s kubectl apply --server-side \
          -f "${base}/${repo}/${ver}/jsonnet/prometheus-operator/${crd}-crd.json" \
          2>/dev/null || true
      done
    executable: /bin/bash
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  changed_when: true

- name: Install ArgoCD HA
  ansible.builtin.command: >-
    k3s kubectl apply -k {{ path_to_gitops_repo }}//bootstrap/argocd?ref=main
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  register: _argocd_install
  changed_when: "'created' in _argocd_install.stdout or 'configured' in _argocd_install.stdout"

- name: Wait for ArgoCD server to be ready
  ansible.builtin.command: k3s kubectl wait --for=condition=available --timeout=300s deployment/argocd-server -n {{ argocd_namespace }}
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  changed_when: false

- name: Wait for argocd-notifications-secret to be available
  ansible.builtin.command: >-
    k3s kubectl get secret argocd-notifications-secret -n {{ argocd_namespace }}
  register: _argocd_notifications_secret_check
  until: _argocd_notifications_secret_check.rc == 0
  retries: 30
  delay: 10
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  changed_when: false

- name: Annotate argocd-notifications-secret
  ansible.builtin.command: >-
    k3s kubectl annotate secret argocd-notifications-secret -n {{ argocd_namespace }} sealedsecrets.bitnami.com/managed="true" --overwrite
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  when: _argocd_notifications_secret_check.rc == 0
  changed_when: true

- name: Wait for argocd-secret to be available
  ansible.builtin.command: >-
    k3s kubectl get secret argocd-secret -n {{ argocd_namespace }}
  register: _argocd_secret_check
  until: _argocd_secret_check.rc == 0
  retries: 30
  delay: 10
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  changed_when: false

- name: Annotate argocd-secret to allow Sealed Secrets adoption
  ansible.builtin.command: >-
    k3s kubectl annotate secret argocd-secret -n {{ argocd_namespace }} sealedsecrets.bitnami.com/managed="true" --overwrite
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  when: _argocd_secret_check.rc == 0
  changed_when: true

- name: Apply ArgoCD sealed secret (custom admin password and OIDC)
  ansible.builtin.command: >-
    k3s kubectl apply -f https://raw.githubusercontent.com/gillouche/home-cluster-gitops/main/resources/argocd/sealed-argocd-secret.yaml
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  register: _argocd_sealed_secret
  changed_when: "'created' in _argocd_sealed_secret.stdout or 'configured' in _argocd_sealed_secret.stdout"

- name: Patch ArgoCD Server Deployment with hostAliases for Authelia
  ansible.builtin.command: >-
    k3s kubectl patch deployment argocd-server -n {{ argocd_namespace }} --patch
    '{"spec": {"template": {"spec": {"hostAliases": [{"ip": "{{ reverse_proxy_virtual_ip }}",
    "hostnames": ["auth.k3s.gillouche.homelab"]}]}}}}'
  delegate_to: "{{ groups['server'][0] }}"
  run_once: true
  become: true
  changed_when: true
