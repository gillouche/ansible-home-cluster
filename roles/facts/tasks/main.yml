---
# tasks file for facts

- name: Check that the target_user variable has been provided to the playbook
  ansible.builtin.fail:
    msg: "The variable 'target_user' must be provided in order to run the playbook."
  when: target_user is not defined
  become: false

- name: Gather full facts for facts role
  ansible.builtin.setup:
    gather_subset:
      - all
  when: ansible_facts is not defined or (ansible_facts | length) == 0 or true

- name: Print all available facts if debug verbosity 4 is enabled
  ansible.builtin.debug:
    msg:
      - "OS Family: {{ ansible_facts.os_family | default('n/a') }}"
      - "Distribution: {{ ansible_facts.distribution | default('n/a') }} {{ ansible_facts.distribution_version | default('') }}"
      - "Distribution Release: {{ ansible_facts.distribution_release | default('n/a') }}"
      - "Kernel: {{ ansible_facts.kernel | default('n/a') }}"
      - "Architecture: {{ ansible_facts.architecture | default('n/a') }}"
      - "Hostname: {{ ansible_facts.hostname | default('n/a') }}"
      - "FQDN: {{ ansible_facts.fqdn | default('n/a') }}"
      - "Python Version: {{ ansible_facts.python_version | default('n/a') }}"
      - "CPU Cores: {{ ansible_facts.processor_vcpus | default(ansible_facts.processor_cores | default('n/a')) }}"
      - "Memory (MB): {{ ansible_facts.memtotal_mb | default('n/a') }}"
      - "User: {{ ansible_facts.user_id | default('n/a') }}"
      - "Home Directory: {{ ansible_facts.user_dir | default('n/a') }}"
    verbosity: 4
  register: facts_debug_result
  become: false

- name: Print network information
  ansible.builtin.debug:
    msg:
      - "Default IPv4 Address: {{ (ansible_facts.default_ipv4.address | default('N/A')) if (ansible_facts.default_ipv4 is defined) else 'N/A' }}"
      - "Default Network Interface: {{ (ansible_facts.default_ipv4.interface | default('N/A')) if (ansible_facts.default_ipv4 is defined) else 'N/A' }}"
      - "All IPv4 Addresses: {{ ansible_facts.all_ipv4_addresses | default([]) }}"
    verbosity: 4
  become: false

- name: Optionally stop playbook after debug (disabled by default)
  ansible.builtin.meta: end_play
  when: end_after_facts | default(false) | bool
  become: false
