---
# tasks file for aur-helper

- name: Stop role on non-Arch Linux
  ansible.builtin.meta: end_role
  when:
    - (ansible_facts['os_family'] | lower) != 'archlinux'
    - (ansible_facts['distribution'] | lower) != 'archlinux'
  become: false

## Removed role execution flag mechanism; rely on idempotent tasks

- name: Set variables
  ansible.builtin.set_fact:
    aur_helper_work_dir_path: "/tmp/aur/yay-bin"
  become: false

- name: Ensure legacy yay package is removed
  community.general.pacman:
    name: yay
    state: absent
  become: true

- name: Collect package facts (pacman)
  ansible.builtin.package_facts:
    manager: pacman
  become: true

- name: Determine if yay-bin is installed
  ansible.builtin.set_fact:
    aur_helper_bin_installed: "{{ 'yay-bin' in (ansible_facts.packages | default({})) }}"
  become: false

- name: Install build prerequisites for AUR (only if yay-bin missing)
  community.general.pacman:
    name:
      - base-devel
      - make
      - git
      - go
      - gcc
      - fakeroot
    state: present
  become: true
  when: not aur_helper_bin_installed

- name: Remove work dir if existing (fresh build)
  ansible.builtin.file:
    path: "{{ aur_helper_work_dir_path }}"
    state: absent
  when: not aur_helper_bin_installed
  become: true

- name: Create working directory
  ansible.builtin.file:
    path: "{{ aur_helper_work_dir_path }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"
    recurse: yes
  when: not aur_helper_bin_installed
  become: false

- name: Clone yay-bin AUR repository
  ansible.builtin.git:
    repo: https://aur.archlinux.org/yay-bin.git
    dest: "{{ aur_helper_work_dir_path }}"
    version: "{{ aur_helper_yay_ref | default('HEAD') }}"
    update: false
  become: false
  when: not aur_helper_bin_installed

- name: Build yay-bin
  ansible.builtin.command: makepkg --noconfirm
  args:
    chdir: "{{ aur_helper_work_dir_path }}"
    creates: "{{ aur_helper_work_dir_path }}/yay-bin-*.pkg.tar.*"
  when: not aur_helper_bin_installed
  become: false

- name: Find built package file (yay-bin)
  ansible.builtin.find:
    paths: "{{ aur_helper_work_dir_path }}"
    patterns: "yay-bin-*.pkg.tar.*"
    file_type: file
    recurse: false
    age_stamp: mtime
  register: aur_helper_yay_pkg_find
  when: not aur_helper_bin_installed
  become: false

- name: Install yay-bin with pacman
  community.general.pacman:
    name: "{{ (aur_helper_yay_pkg_find.files | sort(attribute='mtime', reverse=true) | map(attribute='path') | list | first) }}"
    state: present
  become: true
  when:
    - not aur_helper_bin_installed
    - (aur_helper_yay_pkg_find.files | default([])) | length > 0

# ---------------------------------------------
# Verification
# ---------------------------------------------
- name: Verify yay works (prints version)
  ansible.builtin.command: yay -V
  register: aur_helper_yay_version_cmd
  changed_when: false
  failed_when: false
  become: false

## Removed role execution flag mechanism; rely on idempotent tasks
