---
vault_image: "hashicorp/vault:1.21.1"
vault_version: "1.21.1"
vault_container_name: "vault"
vault_api_port: "{{ global_vault_api_port | default(18200) }}"

# Container-internal paths
vault_cfg_path_in_container: "/vault/config/vault.hcl"
vault_tls_dir_in_container: "/vault/tls"
vault_data_dir_in_container: "/vault/data"
vault_logs_dir_in_container: "/vault/logs"

# Runtime user
vault_runtime_user: "vault"
vault_runtime_group_name: "vault"

# Host paths
vault_host_root_dir_data: "/home/vault"
vault_host_config_dir: "/home/vault/config"
vault_host_tls_dir: "{{ tls_dir | default('/etc/tls') }}"
vault_host_data_dir: "/home/vault/data"
vault_host_logs_dir: "/home/vault/logs"
vault_host_bin_dir: "/home/vault/bin"

# Container options
vault_container_user: "root"
vault_enable_log_wrapper: true
vault_log_level: "debug"

# Networking
vault_listener_address: "0.0.0.0"
vault_bind_ip: "0.0.0.0"

# TLS/CA Defaults
vault_enable_cluster_ca: true
vault_cluster_ca_dir_controller: "~/.local/share/ansible-home-cluster/vault-ca"
vault_cluster_ca_cert_controller: "{{ vault_cluster_ca_dir_controller }}/homelab-root-ca.crt"
vault_cluster_ca_key_controller: "{{ vault_cluster_ca_dir_controller }}/homelab-root-ca.key"
vault_cluster_ca_days: 3650
vault_server_cert_days: 1825

# SAN customization
vault_additional_san_ips: []
vault_additional_san_dns: []

# PKI/ACME Defaults
vault_pki_mount: "pki"
vault_pki_int_mount: "pki_int"
vault_intermediate_common_name: "Homelab Intermediate CA"
vault_intermediate_key_type: "rsa"
vault_intermediate_key_bits: 4096
vault_pki_int_role_name: "homelab-server"
vault_pki_max_ttl: "87600h"
vault_pki_base_domains:
  - "gillouche.homelab"
  - "*.gillouche.homelab"

# Readiness/wait tuning
vault_wait_retries: 45
vault_wait_delay: 2
vault_wait_active_retries: 45
vault_wait_active_delay: 2

# Clustering control
vault_cluster_port: "{{ global_vault_cluster_port | default(18201) }}"
vault_tls_cert_path: "{{ vault_tls_dir_in_container }}/api.crt"
vault_tls_key_path: "{{ vault_tls_dir_in_container }}/api.key"

# Transit Seal Defaults
vault_enable_transit_seal: true
vault_transit_addr: "https://{{ pihole_transit_ip | default('192.168.0.80') }}:{{ global_vault_api_port | default(18200) }}"
vault_transit_token: ""
vault_transit_key_name: "autounseal"
vault_transit_mount_path: "transit/"
vault_transit_tls_skip_verify: false

# Force flags
vault_force_fresh_bootstrap: false
vault_force_tls_regen: false

# Firefox (macOS controller)
vault_firefox_enable_enterprise_roots: false
