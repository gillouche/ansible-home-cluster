---
# Followers-only stage: wait for leader, then start container (retry_join via config)

- name: Get Homelab Root CA certificate content (controller)
  ansible.builtin.slurp:
    src: "{{ vault_cluster_ca_cert_controller }}"
  register: _homelab_root_ca_cert_content
  delegate_to: localhost
  run_once: true

- name: Get Homelab Root CA private key content (controller)
  ansible.builtin.slurp:
    src: "{{ vault_cluster_ca_key_controller }}"
  register: _homelab_root_ca_key_content
  delegate_to: localhost
  run_once: true

- name: Check for existing cluster init JSON on controller
  ansible.builtin.stat:
    path: "{{ vault_init_export_path | expanduser }}"
  register: _cluster_init_stat
  delegate_to: localhost
  run_once: true

- name: Load cluster init JSON
  ansible.builtin.slurp:
    src: "{{ vault_init_export_path | expanduser }}"
  register: _cluster_init_loaded
  delegate_to: localhost
  run_once: true
  when: _cluster_init_stat.stat.exists | default(false)

- name: Set vault_root_token from controller file
  ansible.builtin.set_fact:
    vault_root_token: >-
      {{ (_cluster_init_loaded.content | b64decode | default('{}', true) | from_json).root_token |
         default(vault_root_token | default('')) }}
  when:
    - _cluster_init_loaded.content is defined
    - (_cluster_init_loaded.content | b64decode | regex_search('^\s*[\[{]')) != ''

- name: Ensure TLS directory exists for follower
  ansible.builtin.file:
    path: "{{ vault_host_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Load Transit Token for Followers
  when: vault_enable_transit_seal | default(false) | bool
  block:
    - name: Locate bootstrap transit token
      ansible.builtin.stat:
        path: "{{ vault_transit_token_export_path | expanduser }}"
      register: _bootstrap_transit_token_file
      delegate_to: localhost
      run_once: true

    - name: Read bootstrap transit token
      ansible.builtin.slurp:
        src: "{{ vault_transit_token_export_path | expanduser }}"
      register: _bootstrap_transit_token
      when: _bootstrap_transit_token_file.stat.exists
      delegate_to: localhost
      run_once: true

    - name: Set transit token fact
      ansible.builtin.set_fact:
        vault_transit_token: >-
          {{ (_bootstrap_transit_token.content | b64decode | trim)
             if (_bootstrap_transit_token is defined and _bootstrap_transit_token.content is defined) else '' }}
      # No run_once: true to ensure all followers get the token fact

    - name: Verify transit token can unseal (test encrypt from follower)
      ansible.builtin.uri:
        url: "{{ vault_transit_addr }}/v1/transit/encrypt/{{ vault_transit_key_name }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_transit_token }}"
        body_format: json
        body:
          plaintext: "{{ 'follower-test' | b64encode }}"
        validate_certs: false
        status_code: [200, 403, -1]
      register: _follower_transit_test
      ignore_errors: true

    - name: Debug Transit Token presence (follower)
      ansible.builtin.debug:
        msg:
          - "Follower {{ inventory_hostname }} transit token length: {{ vault_transit_token | length }}"
          - "Transit test status: {{ _follower_transit_test.status | default('N/A') }}"

- name: Render Vault configuration (followers)
  ansible.builtin.template:
    src: "vault.hcl.j2"
    dest: "{{ vault_host_config_dir }}/vault.hcl"
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: '0644'
  become: true
  notify: Restart Vault container to apply config changes (if needed)
  vars:
    # Compute effective Vault public URL used by the template
    vault_public_url_effective: >-
      {{
        (vault_public_url | default(''))
        if ((vault_public_url | default('') | length) > 0)
        else (
          'https://'
          ~ (
              (
                hostvars is defined
                and hostvars[inventory_hostname] is defined
                and hostvars[inventory_hostname].ansible_facts is defined
                and hostvars[inventory_hostname].ansible_facts.default_ipv4 is defined
              )
              | ternary(
                  hostvars[inventory_hostname].ansible_facts.default_ipv4.address,
                  ansible_facts.default_ipv4.address
                )
            )
          ~ ':' ~ (vault_api_port | string)
        )
      }}

- name: Set leader host fact (followers)
  ansible.builtin.set_fact:
    vault_leader_host: "{{ (groups['vault_leader'] | default([]))[0] }}"

- name: Determine leader API endpoint
  ansible.builtin.set_fact:
    _leader_api: >-
      https://{{ hostvars[vault_leader_host].ansible_host |
      default(hostvars[vault_leader_host].ansible_facts.default_ipv4.address) }}:{{ vault_api_port }}

- name: Generate a private key for the Vault follower
  community.crypto.openssl_privatekey:
    path: "{{ vault_host_tls_dir }}/api.key"
    size: 2048
    owner: root
    group: root
    mode: '0600'
  become: true

- name: Construct dynamic SANs list for Vault server certificate
  ansible.builtin.set_fact:
    _vault_server_sansa: "{{
      (
        ( [ 'DNS:' ~ inventory_hostname ] if inventory_hostname is defined else [] ) +
        ( [ 'DNS:' ~ inventory_hostname ~ '.' ~ base_domain ] if base_domain is defined else [] ) +
        [ 'DNS:localhost' ] +
        ( vault_additional_san_dns | map('regex_replace', '^(.*)$', 'DNS:\\1') | list
          if vault_additional_san_dns is defined and vault_additional_san_dns | length > 0 else [] ) +
        ( tls_additional_san_dns | map('regex_replace', '^(.*)$', 'DNS:\\1') | list
          if tls_additional_san_dns is defined and tls_additional_san_dns | length > 0 else [] ) +
        ( [ 'IP:' ~ ansible_facts.default_ipv4.address ] if ansible_facts.default_ipv4.address is defined else [] ) +
        [ 'IP:127.0.0.1' ] +
        ( vault_additional_san_ips | map('regex_replace', '^(.*)$', 'IP:\\1') | list
          if vault_additional_san_ips is defined and vault_additional_san_ips | length > 0 else [] ) +
        ( [ 'IP:' ~ load_balancer_virtual_ip ]
          if load_balancer_virtual_ip is defined and load_balancer_virtual_ip | length > 0 else [] )
      ) | unique | sort | list
    }}"

- name: Debug generated SANs for Vault follower certificate
  ansible.builtin.debug:
    msg: "Generated SANs for {{ inventory_hostname }}: {{ _vault_server_sansa }}"

- name: Generate CSR for the Vault follower
  community.crypto.openssl_csr:
    path: "{{ vault_host_tls_dir }}/api.csr"
    privatekey_path: "{{ vault_host_tls_dir }}/api.key"
    common_name: "{{ inventory_hostname }}"
    subject_alt_name: "{{ _vault_server_sansa }}"
    country_name: "BE"
    organization_name: "Homelab"
    state_or_province_name: "Brussels"
    locality_name: "Brussels"
  become: true

- name: Fetch Vault follower CSR to controller
  ansible.builtin.fetch:
    src: "{{ vault_host_tls_dir }}/api.csr"
    dest: "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}-api.csr"
    flat: true
  become: true

- name: Create OpenSSL config for Vault follower extensions (on controller)
  ansible.builtin.copy:
    dest: "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}.ext"
    content: |
      authorityKeyIdentifier=keyid,issuer
      basicConstraints=CA:FALSE
      keyUsage = digitalSignature, nonRepudiation, keyEncipherment, dataEncipherment
      extendedKeyUsage = serverAuth
      subjectAltName = {{ _vault_server_sansa | join(',') }}
    mode: '0644'
  delegate_to: localhost

- name: Sign Vault follower certificate with Homelab Root CA (on controller)
  ansible.builtin.command: >
    openssl x509 -req
    -in "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}-api.csr"
    -CA "{{ vault_cluster_ca_cert_controller }}"
    -CAkey "{{ vault_cluster_ca_key_controller }}"
    -CAcreateserial
    -out "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}-api.crt"
    -days 1825
    -sha256
    -extfile "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}.ext"
  changed_when: true
  delegate_to: localhost

- name: Copy signed Vault follower certificate to host
  ansible.builtin.copy:
    src: "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}-api.crt"
    dest: "{{ vault_host_tls_dir }}/api.crt"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Copy Homelab Root CA certificate to Vault follower
  ansible.builtin.copy:
    content: "{{ _homelab_root_ca_cert_content.content | b64decode }}"
    dest: "{{ vault_host_tls_dir }}/ca-bundle.pem"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Ensure Vault container is running - followers
  containers.podman.podman_container:
    name: "{{ vault_container_name }}"
    image: "{{ vault_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ vault_api_port }}:{{ vault_api_port }}/tcp"
      - "{{ vault_cluster_port }}:{{ vault_cluster_port }}/tcp"
    cap_add:
      - IPC_LOCK
      - DAC_OVERRIDE
      - CHOWN
    user: "{{ vault_container_user | default(omit) }}"
    env:
      SKIP_CHOWN: "true"
      SKIP_SETCAP: "true"
      VAULT_LOG_LEVEL: "{{ vault_log_level | default('debug') }}"
      VAULT_CACERT: "{{ vault_tls_dir_in_container }}/ca-bundle.pem"
      VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    command: >-
      {{ (vault_enable_log_wrapper | default(true))
          | ternary('/bin/sh -lc /vault/bin/start-vault.sh', 'server -config=' ~ vault_cfg_path_in_container) }}
    volumes:
      - "{{ vault_host_config_dir }}:/vault/config"
      - "{{ vault_host_tls_dir }}:/vault/tls"
      - "{{ vault_host_data_dir }}:/vault/data"
      - "{{ vault_host_logs_dir }}:{{ vault_logs_dir_in_container | default('/vault/logs') }}"
      - "{{ vault_host_bin_dir }}:/vault/bin"
  become: true

- name: Pause briefly after starting container
  ansible.builtin.pause:
    seconds: 5

# Persist root token for CLI usage (after container is up)
- name: Write /root/.vault-token when vault_root_token is available (follower)
  ansible.builtin.copy:
    content: "{{ vault_root_token }}"
    dest: /root/.vault-token
    mode: '0600'
  become: true
  when:
    - (vault_root_token | default('') | length) > 0

- name: Verify CLI token (lookup, follower)
  ansible.builtin.command: /usr/local/bin/vault token lookup -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_SKIP_VERIFY: "true"
  register: _follower_token_lookup
  changed_when: false
  failed_when: false
  become: true
  when:
    - (vault_root_token | default('') | length) > 0

# Detect current follower status once
- name: Read current follower Vault status (pre-init check)
  ansible.builtin.command: /usr/local/bin/vault status -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_SKIP_VERIFY: "true"
  register: _follower_status_preinit
  changed_when: false
  failed_when: false
  become: true

- name: Detect Seal Wrapped Decryption Error on Follower
  ansible.builtin.set_fact:
    _follower_seal_mismatch: "{{ (_follower_status_preinit.stderr | default('') is search('error decrypting seal wrapped value')) or (_follower_status_preinit.stderr | default('') is search('cipher: message authentication failed')) }}"

- name: Determine if Follower Remediation (Wipe) is required
  ansible.builtin.set_fact:
    _trigger_follower_remediation: >-
      {{
        (_follower_status_preinit.stdout | default('{}', true) | from_json).initialized | default(false) and
        (
          (_follower_seal_mismatch | default(false)) or
          ((_follower_status_preinit.stdout | default('{}', true) | from_json).sealed | default(true))
        )
      }}

- name: Execute Follower Remediation (Wipe and Restart)
  when: _trigger_follower_remediation | bool
  become: true
  block:
    - name: Warn about follower remediation
      ansible.builtin.debug:
        msg: "WARNING: Follower {{ inventory_hostname }} has a Seal Mismatch. performing AUTOMATED REMEDIATION (Wipe & Re-join)."

    - name: Stop Vault Container (Follower Remediation)
      containers.podman.podman_container:
        name: "{{ vault_container_name }}"
        state: stopped

    - name: Wipe Vault Data Directory (Follower Remediation)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ vault_host_data_dir }}"
        - /root/.vault-token

    - name: Re-create Vault Data Directory (Follower Remediation)
      ansible.builtin.file:
        path: "{{ vault_host_data_dir }}"
        state: directory
        owner: "{{ vault_container_user | default('root') }}"
        group: "{{ vault_container_user | default('root') }}"
        mode: '0755'

    - name: Start Vault Container (Follower Remediation)
      containers.podman.podman_container:
        name: "{{ vault_container_name }}"
        state: started

    - name: Wait for Vault to be ready (Post-Follower-Remediation)
      ansible.builtin.wait_for:
        port: "{{ vault_api_port }}"
        host: "{{ ansible_facts.default_ipv4.address }}"
        timeout: 60

- name: Wait for follower to be unsealed
  ansible.builtin.command: /usr/local/bin/vault status -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_SKIP_VERIFY: "true"
  register: _follower_status_after_init
  changed_when: false
  failed_when: false
  retries: "{{ vault_wait_retries | default(150) }}"
  delay: "{{ vault_wait_delay | default(2) }}"
  until: >-
    (_follower_status_after_init.rc | default(1)) == 0 and
    ((_follower_status_after_init.stdout | default('{}', true) | regex_search('^\s*[\[{]')) != '') and
    not ((_follower_status_after_init.stdout | default('{}', true) | from_json).sealed | default(true))
  become: true
  when:
    - vault_enable_transit_seal | default(false)
    - inventory_hostname in (groups['vault_followers'] | default([]))
    # Removed conditions that might prevent waiting for auto-unseal if init status is complex

- name: Final Health Check Summary (Follower)
  ansible.builtin.debug:
    msg:
      - "Vault Follower: Healthy"
      - "Status: Unsealed"
      - "Transit Seal: Active and verified"
