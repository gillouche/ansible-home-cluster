---
# Removed: common.yml is now included in the vault_init stage

- name: Ensure TLS directory exists
  ansible.builtin.file:
    path: "{{ vault_host_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Construct dynamic SANs list for Transit Vault certificate
  ansible.builtin.set_fact:
    _vault_server_sansa: "{{
      (
        ( [ 'DNS:' ~ inventory_hostname ] if inventory_hostname is defined else [] ) +
        ( [ 'DNS:' ~ inventory_hostname ~ '.' ~ base_domain ] if base_domain is defined else [] ) +
        [ 'DNS:localhost' ] +
        ( vault_additional_san_dns | map('regex_replace', '^(.*)$', 'DNS:\\1') | list
          if vault_additional_san_dns is defined and vault_additional_san_dns | length > 0 else [] ) +
        ( tls_additional_san_dns | map('regex_replace', '^(.*)$', 'DNS:\\1') | list
          if tls_additional_san_dns is defined and tls_additional_san_dns | length > 0 else [] ) +
        ( [ 'IP:' ~ ansible_facts.default_ipv4.address ] if ansible_facts.default_ipv4.address is defined else [] ) +
        [ 'IP:127.0.0.1' ] +
        ( vault_additional_san_ips | map('regex_replace', '^(.*)$', 'IP:\\1') | list
          if vault_additional_san_ips is defined and vault_additional_san_ips | length > 0 else [] ) +
        ( [ 'IP:' ~ load_balancer_virtual_ip ]
          if load_balancer_virtual_ip is defined and load_balancer_virtual_ip | length > 0 else [] )
      ) | unique | sort | list
    }}"

- name: Debug generated SANs for Transit Vault certificate
  ansible.builtin.debug:
    msg: "Generated SANs for {{ inventory_hostname }}: {{ _vault_server_sansa }}"

- name: Generate a private key for the transit vault
  community.crypto.openssl_privatekey:
    path: "{{ vault_host_tls_dir }}/api.key"
    size: 2048
    owner: root
    group: root
    mode: '0600'
    force: "{{ vault_force_tls_regen | default(false) }}"
  become: true

- name: Check if Transit Vault certificate exists
  ansible.builtin.stat:
    path: "{{ vault_host_tls_dir }}/api.crt"
    get_checksum: no
  register: _api_crt_stat
  become: true

- name: Generate a self-signed certificate for the transit vault (using openssl)
  ansible.builtin.shell: |
    openssl req -x509 -new -sha256 \
      -key "{{ vault_host_tls_dir }}/api.key" \
      -out "{{ vault_host_tls_dir }}/api.crt" \
      -days 3650 \
      -subj "/CN={{ inventory_hostname }}" \
      -addext "subjectAltName={{ _vault_server_sansa | join(',') }}" \
      -nodes
  changed_when: true
  when: (not _api_crt_stat.stat.exists) or (vault_force_tls_regen | default(false))
  become: true

- name: Set permissions for transit vault certificate
  ansible.builtin.file:
    path: "{{ vault_host_tls_dir }}/api.crt"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Ensure ca-bundle.pem exists for transit vault
  ansible.builtin.copy:
    src: "{{ vault_host_tls_dir }}/api.crt"
    dest: "{{ vault_host_tls_dir }}/ca-bundle.pem"
    remote_src: true
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Render Vault configuration (bootstrap)
  ansible.builtin.template:
    src: "vault.bootstrap.hcl.j2"
    dest: "{{ vault_host_config_dir }}/vault.hcl"
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: '0644'
  become: true
  vars:
    vault_public_url_effective: "https://{{ ansible_facts.default_ipv4.address }}:{{ vault_api_port }}"

- name: Ensure Vault container is running on bootstrap
  containers.podman.podman_container:
    name: "{{ vault_container_name }}"
    image: "{{ vault_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ vault_api_port }}:{{ vault_api_port }}/tcp"
      - "{{ vault_cluster_port }}:{{ vault_cluster_port }}/tcp"
    cap_add:
      - IPC_LOCK
      - DAC_OVERRIDE
      - CHOWN
    user: "{{ vault_container_user | default(omit) }}"
    env:
      SKIP_CHOWN: "true"
      SKIP_SETCAP: "true"
      VAULT_LOG_LEVEL: "{{ vault_log_level | default('debug') }}"
      VAULT_CACERT: "{{ vault_tls_dir_in_container }}/ca-bundle.pem"
      VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    command: >-
      {{ (vault_enable_log_wrapper | default(true))
          | ternary('/bin/sh -lc /vault/bin/start-vault.sh', 'server -config=' ~ vault_cfg_path_in_container) }}
    volumes:
      - "{{ vault_host_config_dir }}:/vault/config"
      - "{{ vault_host_tls_dir }}:/vault/tls"
      - "{{ vault_host_data_dir }}:/vault/data"
      - "{{ vault_host_logs_dir }}:{{ vault_logs_dir_in_container | default('/vault/logs') }}"
      - "{{ vault_host_bin_dir }}:/vault/bin"
  become: true

- name: Wait for vault to be ready
  ansible.builtin.wait_for:
    port: "{{ vault_api_port }}"
    host: "{{ ansible_facts.default_ipv4.address }}"
    timeout: 60

- name: Check if Vault is initialized
  ansible.builtin.command: /usr/local/bin/vault status -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_SKIP_VERIFY: "true"
  register: _vault_status_check
  changed_when: false
  failed_when: false
  become: true

- name: Initialize Vault needs initialization default
  ansible.builtin.set_fact:
    vault_needs_init: true

- name: Detect if Transit Vault needs initialization (if valid JSON)
  ansible.builtin.set_fact:
    vault_needs_init: "{{ not ((_vault_status_check.stdout | default('{}', true) | from_json).initialized | default(false)) }}"
  when: (_vault_status_check.stdout | default('') | regex_search('^\s*[\[{]')) != ''

- name: Check for existing transit init JSON on controller
  ansible.builtin.stat:
    path: "{{ vault_transit_init_export_path | default('~/.local/share/ansible-home-cluster/vault/transit-init.json') | expanduser }}"
  register: _transit_init_stat
  delegate_to: localhost
  run_once: true

- name: Backup stale transit-init.json if Vault is fresh
  ansible.builtin.copy:
    src: >-
      {{ vault_transit_init_export_path |
      default('~/.local/share/ansible-home-cluster/vault/transit-init.json') | expanduser }}
    dest: >-
      {{ vault_transit_init_export_path |
      default('~/.local/share/ansible-home-cluster/vault/transit-init.json') |
      expanduser }}.bak.{{ ansible_date_time.iso8601 }}
    remote_src: true
    mode: '0600'
  delegate_to: localhost
  when:
    - vault_needs_init
    - _transit_init_stat.stat.exists | default(false)

- name: Load transit init JSON from controller if present
  ansible.builtin.slurp:
    src: "{{ vault_transit_init_export_path | default('~/.local/share/ansible-home-cluster/vault/transit-init.json') | expanduser }}"
  register: _transit_init_loaded
  delegate_to: localhost
  run_once: true
  when:
    - _transit_init_stat.stat.exists
    - not vault_needs_init

- name: Set unseal keys and root token from loaded init JSON (if present)
  ansible.builtin.set_fact:
    vault_unseal_keys_b64: >-
      {{ (_transit_init_loaded.content | default('') | b64decode | default('{}', true) | from_json).unseal_keys_b64 | default([]) }}
    vault_root_token: >-
      {{ (_transit_init_loaded.content | default('') | b64decode | default('{}', true) | from_json).root_token | default('') }}
  when:
    - _transit_init_loaded.content is defined
    - not (_transit_init_loaded.skipped | default(false))
    - (_transit_init_loaded.content | default('') | b64decode | regex_search('^\s*[\[{]')) != ''

- name: Initialize Vault (if not already initialized)
  ansible.builtin.command: /usr/local/bin/vault operator init -key-shares=1 -key-threshold=1 -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_SKIP_VERIFY: "true"
  register: _vault_init_output
  changed_when: _vault_init_output.rc == 0
  become: true
  when: vault_needs_init

- name: Store transit init JSON to controller # noqa: no-handler
  ansible.builtin.copy:
    content: "{{ (_vault_init_output.stdout | default('{}', true) | from_json) | to_nice_json }}"
    dest: "{{ vault_transit_init_export_path | default('~/.local/share/ansible-home-cluster/vault/transit-init.json') | expanduser }}"
    mode: '0600'
  delegate_to: localhost
  when:
    - _vault_init_output.changed
    - (_vault_init_output.stdout | default('') | regex_search('^\s*[\[{]')) != ''

- name: Set unseal keys and root token from NEW init output (if initialization just happened) # noqa: no-handler
  ansible.builtin.set_fact:
    vault_unseal_keys_b64: "{{ (_vault_init_output.stdout | default('{}', true) | from_json).unseal_keys_b64 }}"
    vault_root_token: "{{ (_vault_init_output.stdout | default('{}', true) | from_json).root_token }}"
  when:
    - _vault_init_output.changed
    - (_vault_init_output.stdout | default('') | regex_search('^\s*[\[{]')) != ''

- name: Unseal Vault
  ansible.builtin.command: /usr/local/bin/vault operator unseal {{ item }}
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_SKIP_VERIFY: "true"
    VAULT_TOKEN: "{{ vault_root_token }}"
  loop: "{{ vault_unseal_keys_b64 }}"
  changed_when: true
  become: true
  when: >
    (vault_unseal_keys_b64 | default([])) | length > 0 and
    ((_vault_status_check.stdout | default('{}', true) | from_json).sealed | default(true))

- name: Enable transit secrets engine
  ansible.builtin.command: /usr/local/bin/vault secrets enable -path=transit transit
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  register: _enable_transit
  changed_when: "'Success!' in _enable_transit.stdout"
  failed_when: _enable_transit.rc != 0 and 'path is already in use' not in _enable_transit.stderr
  become: true

- name: Create transit key
  ansible.builtin.command: /usr/local/bin/vault write -f transit/keys/autounseal
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: false
  become: true

- name: Create transit policy
  ansible.builtin.shell: |
    /usr/local/bin/vault policy write autounseal - <<'EOF'
      path "transit/encrypt/autounseal" {
        capabilities = ["update"]
      }
      path "transit/decrypt/autounseal" {
        capabilities = ["update"]
      }
    EOF
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: false
  become: true

- name: Check if transit token file exists on controller
  ansible.builtin.stat:
    path: "{{ vault_transit_token_export_path | default('~/.local/share/ansible-home-cluster/vault-transit/transit_token.txt') | expanduser }}"
  delegate_to: localhost
  register: _transit_token_file_stat
  run_once: true

- name: Read transit token from controller
  ansible.builtin.slurp:
    src: "{{ vault_transit_token_export_path | default('~/.local/share/ansible-home-cluster/vault-transit/transit_token.txt') | expanduser }}"
  register: _transit_token_slurp
  delegate_to: localhost
  run_once: true
  when: _transit_token_file_stat.stat.exists

- name: Set transit token fact (transit stage)
  ansible.builtin.set_fact:
    vault_transit_token: "{{ _transit_token_slurp.content | b64decode | trim }}"
  when: _transit_token_file_stat.stat.exists
  run_once: true

- name: Verify if transit token is valid
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ vault_api_port }}/v1/auth/token/lookup-self"
    method: GET
    headers:
      X-Vault-Token: "{{ vault_transit_token }}"
    validate_certs: false
    status_code: [200, 403]
  register: _transit_token_lookup
  when: _transit_token_file_stat.stat.exists
  become: true

- name: Create transit token
  ansible.builtin.command: /usr/local/bin/vault token create -policy="autounseal" -renewable=true -ttl=72h -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  register: _vault_transit_token_output
  changed_when: _vault_transit_token_output.rc == 0
  become: true
  when: >-
    not _transit_token_file_stat.stat.exists or
    (_transit_token_lookup.status | default(0)) == 403 or
    'vault_token_refresh' in ansible_run_tags

- name: Ensure Vault controller export directory exists
  ansible.builtin.file:
    path: "{{ (vault_transit_token_export_path | default('~/.local/share/ansible-home-cluster/vault-transit/transit_token.txt') | expanduser) | ansible.builtin.dirname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  run_once: true

- name: Store transit token on controller
  ansible.builtin.copy:
    content: "{{ (_vault_transit_token_output.stdout | default('{}', true) | from_json).auth.client_token }}"
    dest: "{{ vault_transit_token_export_path | default('~/.local/share/ansible-home-cluster/vault-transit/transit_token.txt') | expanduser }}"
    mode: '0600'
  delegate_to: localhost
  when:
    - (_vault_transit_token_output.stdout | default('') | regex_search('^\s*[\[{]')) != ''
    - (_vault_transit_token_output.changed or (not _transit_token_file_stat.stat.exists and _vault_transit_token_output.stdout is defined))
  register: _store_token_result

- name: Update transit token fact after creation
  ansible.builtin.set_fact:
    vault_transit_token: "{{ (_vault_transit_token_output.stdout | from_json).auth.client_token }}"
  when: _store_token_result.changed
  run_once: true
