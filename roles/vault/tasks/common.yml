---
# Common preparation tasks for all Vault nodes (no container start here)

- name: Ensure vault group exists
  ansible.builtin.group:
    name: "{{ vault_runtime_group_name | default('vault') }}"
    state: present
    system: true
  become: true

- name: Ensure vault user exists with home directory
  ansible.builtin.user:
    name: "{{ vault_runtime_user | default('vault') }}"
    state: present
    system: true
    group: "{{ vault_runtime_group_name | default('vault') }}"
    home: "/home/{{ vault_runtime_user | default('vault') }}"
    create_home: true
    shell: /usr/bin/nologin
  become: true

- name: Ensure Vault host directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ vault_host_root_dir_data }}", mode: '0750'}
    - {path: "{{ vault_host_logs_dir }}", mode: '0775'}
    - {path: "{{ vault_host_bin_dir }}", mode: '0755'}
    - {path: "{{ vault_host_config_dir }}", mode: '0750'}
    - {path: "{{ vault_host_tls_dir }}", mode: '0750'}
    - {path: "{{ vault_host_data_dir }}", mode: '0770'}
  become: true

- name: Ensure controller CA directory exists (run on controller)
  ansible.builtin.file:
    path: "{{ vault_cluster_ca_dir_controller | expanduser }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  run_once: true
  become: false
  when: vault_is_bootstrap | default(false)

- name: Check if cluster CA exists (controller)
  ansible.builtin.stat:
    path: "{{ vault_cluster_ca_cert_controller | expanduser }}"
  register: _vault_ca_cert_stat_common
  delegate_to: localhost
  run_once: true
  become: false
  when: (vault_is_bootstrap | default(false)) or ((vault_stage | default('')) == 'bootstrap')

- name: Generate Vault cluster CA when missing (controller)
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    mkdir -p {{ vault_cluster_ca_dir_controller | expanduser }}
    cd {{ vault_cluster_ca_dir_controller | expanduser }}
    if [ ! -f cluster-ca.key ]; then
      openssl genrsa -out cluster-ca.key 4096
    fi
    cat > ca.cnf <<'EOF'
    [ req ]
    prompt             = no
    default_bits       = 4096
    default_md         = sha256
    distinguished_name = dn
    x509_extensions    = v3_ca

    [ dn ]
    CN = Vault Cluster CA
    O  = Homelab
    C  = FR

    [ v3_ca ]
    subjectKeyIdentifier=hash
    authorityKeyIdentifier=keyid:always,issuer
    basicConstraints = critical,CA:true
    keyUsage = critical, digitalSignature, keyCertSign, cRLSign
    EOF
    if [ ! -f cluster-ca.pem ]; then
      openssl req -x509 -new -key cluster-ca.key
      -days {{ vault_cluster_ca_days | default(3650) }}
      -out cluster-ca.pem -config ca.cnf -extensions v3_ca
    fi
  args:
    executable: /bin/sh
  when:
    - (vault_is_bootstrap | default(false)) or ((vault_stage | default('')) == 'bootstrap')
    - not _vault_ca_cert_stat_common.stat.exists
  delegate_to: localhost
  run_once: true
  become: false

- name: Copy cluster CA certificate to host
  ansible.builtin.copy:
    src: "{{ vault_cluster_ca_cert_controller | expanduser }}"
    dest: "{{ vault_host_tls_dir }}/cluster-ca.pem"
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: '0644'
  become: true

- name: Compute SANs for server certificate
  ansible.builtin.set_fact:
    _vault_tls_san_dns: >-
      {{ [
            inventory_hostname,
            (inventory_hostname ~ '.' ~ base_domain) if (base_domain is defined and (base_domain | length) > 0) else omit,
            'localhost'
         ] | reject('equalto', omit) | unique }}
    _vault_tls_san_ips: >-
      {{ [
            (ansible_facts.default_ipv4.address if (ansible_facts.default_ipv4 is defined) else omit),
            '127.0.0.1'
         ] | reject('equalto', omit) | unique }}

- name: Render OpenSSL config for Vault server CSR
  ansible.builtin.copy:
    dest: "{{ vault_host_tls_dir }}/openssl-api.cnf"
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: '0644'
    content: |
      [ req ]
      default_bits       = 2048
      prompt             = no
      default_md         = sha256
      req_extensions     = v3_req
      distinguished_name = dn

      [ dn ]
      CN = {{ inventory_hostname }}

      [ v3_req ]
      subjectAltName = @alt_names

      [ alt_names ]
      {% set idx = 1 %}
      {% for dns in _vault_tls_san_dns | default([]) %}
      DNS.{{ idx }} = {{ dns }}
      {% set idx = idx + 1 %}
      {% endfor %}
      {% for ip in _vault_tls_san_ips | default([]) %}
      IP.{{ idx }} = {{ ip }}
      {% set idx = idx + 1 %}
      {% endfor %}
  become: true

- name: Stat TLS assets
  ansible.builtin.stat:
    path: "{{ item }}"
    get_attributes: false
    get_checksum: false
  loop:
    - "{{ vault_host_tls_dir }}/api.key"
    - "{{ vault_host_tls_dir }}/api.crt"
  register: _tls_stats
  become: true
  become_user: root

- name: Read current cert SANs (if present)
  ansible.builtin.command: >-
    openssl x509 -in {{ vault_host_tls_dir }}/api.crt -noout -text
  register: _cert_text
  changed_when: false
  failed_when: false
  when: (_tls_stats.results[1].stat.exists | default(false))
  become: true

- name: Decide if TLS regeneration is required
  ansible.builtin.set_fact:
    _tls_regen_required: >-
      {{ (vault_tls_force_regen | default(false)) or (vault_force_tls_regen | default(false))
         or not (_tls_stats.results[0].stat.exists | default(false))
         or not (_tls_stats.results[1].stat.exists | default(false))
         or (
              _cert_text.stdout is defined and (
                ('DNS:' ~ inventory_hostname) not in _cert_text.stdout
                or ('IP Address:' ~ (ansible_facts.default_ipv4.address | default(''))) not in _cert_text.stdout
              )
            )
      }}

- name: Generate server key (only when required)
  ansible.builtin.command: >-
    openssl genrsa -out {{ vault_host_tls_dir }}/api.key 2048
  when: _tls_regen_required
  changed_when: true
  become: true

- name: Generate server CSR (only when required)
  ansible.builtin.command: >-
    openssl req -new -key {{ vault_host_tls_dir }}/api.key
    -out {{ vault_host_tls_dir }}/api.csr
    -config {{ vault_host_tls_dir }}/openssl-api.cnf
  when: _tls_regen_required
  changed_when: true
  become: true

- name: Ensure CSRs directory exists on controller
  ansible.builtin.file:
    path: "{{ vault_cluster_ca_dir_controller | expanduser }}/csrs"
    state: directory
    mode: '0700'
  delegate_to: localhost

- name: Fetch CSR to controller
  ansible.builtin.fetch:
    src: "{{ vault_host_tls_dir }}/api.csr"
    dest: "{{ vault_cluster_ca_dir_controller | expanduser }}/csrs/{{ inventory_hostname }}.csr"
    flat: true
  become: true

- name: Ensure extfiles directory exists on controller
  ansible.builtin.file:
    path: "{{ vault_cluster_ca_dir_controller | expanduser }}/exts"
    state: directory
    mode: '0700'
  delegate_to: localhost

- name: Render SAN extfile for CSR (controller)
  ansible.builtin.copy:
    dest: "{{ vault_cluster_ca_dir_controller | expanduser }}/exts/{{ inventory_hostname }}.ext"
    mode: '0600'
    content: |
      [ v3_req ]
      subjectAltName=@alt_names

      [ alt_names ]
      {% set dns_idx = 1 %}
      DNS.{{ dns_idx }}={{ inventory_hostname }}
      {% set dns_idx = dns_idx + 1 %}
      {% if base_domain is defined and (base_domain | length) > 0 %}
      DNS.{{ dns_idx }}={{ inventory_hostname }}.{{ base_domain }}
      {% set dns_idx = dns_idx + 1 %}
      {% endif %}
      DNS.{{ dns_idx }}=localhost
      {% set ip_idx = 1 %}
      {% if hostvars[inventory_hostname] is defined and
        hostvars[inventory_hostname].ansible_facts is defined and
        hostvars[inventory_hostname].ansible_facts.default_ipv4 is defined %}
      IP.{{ ip_idx }}={{ hostvars[inventory_hostname].ansible_facts.default_ipv4.address }}
      {% set ip_idx = ip_idx + 1 %}
      {% endif %}
      IP.{{ ip_idx }}=127.0.0.1
  delegate_to: localhost

- name: Sign server CSR with cluster CA (controller)
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    cd {{ vault_cluster_ca_dir_controller | expanduser }}
    mkdir -p certs exts
    SERIAL_FILE="cluster-ca.srl"
    if [ ! -s "$SERIAL_FILE" ] || ! grep -Eq '^[0-9A-Fa-f]+$' "$SERIAL_FILE"; then
      hexdump -vn8 -e '8/1 "%02X"' /dev/urandom > "$SERIAL_FILE"
    fi
    openssl x509 -req -in csrs/{{ inventory_hostname }}.csr -CA cluster-ca.pem -CAkey cluster-ca.key -CAserial "$SERIAL_FILE" \
      -days {{ vault_server_cert_days | default(1825) }}
      -out certs/{{ inventory_hostname }}.crt
      -extfile exts/{{ inventory_hostname }}.ext -extensions v3_req
  args:
    executable: /bin/sh
  when: _tls_regen_required
  delegate_to: localhost

- name: Copy signed server certificate back to host
  ansible.builtin.copy:
    src: "{{ vault_cluster_ca_dir_controller | expanduser }}/certs/{{ inventory_hostname }}.crt"
    dest: "{{ vault_host_tls_dir }}/api.crt"
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: '0644'
    force: false
  become: true
  when: _tls_regen_required

- name: Ensure ownership and permissions on TLS assets
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ vault_host_tls_dir }}/api.key", mode: '0600'}
    - {path: "{{ vault_host_tls_dir }}/api.crt", mode: '0644'}
    - {path: "{{ vault_host_tls_dir }}/cluster-ca.pem", mode: '0644'}
  become: true

- name: Render Vault configuration from template (no container start here)
  ansible.builtin.template:
    src: "{{ (_vault_cfg_template | string) }}"
    dest: "{{ vault_host_config_dir }}/vault.hcl"
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: '0644'
  become: true
  vars:
    _vault_cfg_template: >-
      {{ ((vault_is_bootstrap | default(false)) or ((vault_stage | default('')) == 'bootstrap'))
          | ternary('vault.bootstrap.hcl.j2', 'vault.hcl.j2') }}
    # Compute effective Vault public URL used by the template
    vault_public_url_effective: >-
      {{
        (vault_public_url | default(''))
        if ((vault_public_url | default('') | length) > 0)
        else (
          'https://'
          ~ (
              (
                hostvars is defined
                and hostvars[inventory_hostname] is defined
                and hostvars[inventory_hostname].ansible_facts is defined
                and hostvars[inventory_hostname].ansible_facts.default_ipv4 is defined
              )
              | ternary(
                  hostvars[inventory_hostname].ansible_facts.default_ipv4.address,
                  ansible_facts.default_ipv4.address
                )
            )
          ~ ':' ~ (vault_api_port | string)
        )
      }}
    # Ensure the template knows who the leader is to suppress retry_join there
    vault_leader_host: "{{ (groups['vault_cluster'] | default([inventory_hostname]))[0] }}"
