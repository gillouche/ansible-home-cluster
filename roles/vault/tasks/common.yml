---
# Common preparation tasks for all Vault nodes (no container start here)

- name: Ensure vault group exists
  ansible.builtin.group:
    name: "{{ vault_runtime_group_name | default('vault') }}"
    state: present
    system: true
  become: true

- name: Ensure vault user exists with home directory
  ansible.builtin.user:
    name: "{{ vault_runtime_user | default('vault') }}"
    state: present
    system: true
    group: "{{ vault_runtime_group_name | default('vault') }}"
    home: "/home/{{ vault_runtime_user | default('vault') }}"
    create_home: true
    shell: /usr/bin/nologin
    groups: "{{ tls_group_name | default('tls') }}"
    append: true
  become: true

- name: Ensure Vault host directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ vault_host_root_dir_data }}", mode: '0750'}
    - {path: "{{ vault_host_logs_dir }}", mode: '0775'}
    - {path: "{{ vault_host_bin_dir }}", mode: '0755'}
    - {path: "{{ vault_host_config_dir }}", mode: '0750'}
    - {path: "{{ vault_host_data_dir }}", mode: '0770'}
  become: true

- name: Install startup wrapper on bootstrap to capture early logs
  ansible.builtin.copy:
    dest: "/home/vault/bin/start-vault.sh"
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: '0755'
    content: |
      #!/bin/sh
      set -eu
      ts="$(date -Iseconds)"
      mkdir -p /vault/logs
      log_ts="/vault/logs/startup-${ts}.log"
      log_cur="/vault/logs/current.log"
      : > "$log_cur"
      : "${VAULT_LOG_LEVEL:=info}"
      export VAULT_LOG_LEVEL
      old_files=$(ls -1t /vault/logs/startup-*.log 2>/dev/null | sed -n '51,$p' || true)
      if [ -n "${old_files:-}" ]; then
        echo "$old_files" | xargs -r rm -f || true
      fi
      exec sh -lc "vault server -config={{ vault_cfg_path_in_container }} 2>&1 | tee -a '$log_ts' '$log_cur'"
  become: true

# Ensure root token is available to Vault CLI inside the container when we have it
