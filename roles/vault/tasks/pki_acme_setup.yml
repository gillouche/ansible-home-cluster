---
# tasks for setting up pki and acme

- name: Set Vault leader address fact
  ansible.builtin.set_fact:
    _vault_leader_addr: "https://{{ ansible_facts.default_ipv4.address }}:{{ vault_api_port }}"

- name: Check enabled secrets engines
  ansible.builtin.command: /usr/local/bin/vault secrets list -format=json
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  register: _vault_secrets_list
  changed_when: false

# Check if PKI mount 'pki' is already configured
- name: Read pki CA certificate to check existence
  ansible.builtin.command: /usr/local/bin/vault read pki/ca/pem
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  register: _pki_ca_status
  failed_when: false
  changed_when: false

- name: Enable PKI secrets engine (pki - Intermediate CA)
  ansible.builtin.command: >
    /usr/local/bin/vault secrets enable
    -path=pki
    -max-lease-ttl=43800h
    pki
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: true
  when:
    - (_vault_secrets_list.stdout | default('') | regex_search('^\s*[\[{]')) != ''
    - "'pki/' not in (_vault_secrets_list.stdout | default('{}', true) | from_json)"

- name: Generate PKI Intermediate CA CSR
  ansible.builtin.command: >
    /usr/local/bin/vault write -format=json pki/intermediate/generate/internal
    common_name="Homelab Intermediate CA"
    issuer_name="intermediate-pki"
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: true
  register: _generated_pki_csr_cmd
  when: _pki_ca_status.rc != 0 # Only generate if CA does not exist

- name: Fetch PKI Intermediate CA CSR to controller # noqa: no-handler
  ansible.builtin.copy:
    content: "{{ (_generated_pki_csr_cmd.stdout | default('{}', true) | from_json).data.csr }}"
    dest: "{{ vault_cluster_ca_dir_controller | expanduser }}/vault-pki-intermediate.csr"
    mode: '0600'
  delegate_to: localhost
  when:
    - _generated_pki_csr_cmd.changed
    - (_generated_pki_csr_cmd.stdout | default('') | regex_search('^\s*[\[{]')) != ''

- name: Create Python script to sign Intermediate CA
  ansible.builtin.copy:
    dest: "{{ vault_cluster_ca_dir_controller | expanduser }}/sign_intermediate.py"
    content: |
      import sys
      import datetime
      from cryptography import x509
      from cryptography.hazmat.primitives import hashes, serialization
      from cryptography.hazmat.primitives.asymmetric import rsa

      def sign_csr(csr_path, ca_cert_path, ca_key_path, output_path):
          with open(csr_path, "rb") as f:
              csr = x509.load_pem_x509_csr(f.read())
          with open(ca_cert_path, "rb") as f:
              ca_cert = x509.load_pem_x509_certificate(f.read())
          with open(ca_key_path, "rb") as f:
              ca_key = serialization.load_pem_private_key(f.read(), password=None)

          builder = x509.CertificateBuilder()
          builder = builder.subject_name(csr.subject)
          builder = builder.issuer_name(ca_cert.subject)
          builder = builder.public_key(csr.public_key())

          # Backdate by 1 hour to satisfy Vault's "notBefore before signer's notBefore" check
          now = datetime.datetime.now(datetime.timezone.utc)
          valid_from = now - datetime.timedelta(hours=1)
          valid_to = now + datetime.timedelta(days=1825)
          builder = builder.not_valid_before(valid_from)
          builder = builder.not_valid_after(valid_to)

          builder = builder.serial_number(x509.random_serial_number())

          # Extensions for Intermediate CA
          builder = builder.add_extension(
              x509.BasicConstraints(ca=True, path_length=1), critical=True
          )
          builder = builder.add_extension(
              x509.KeyUsage(
                  digital_signature=False,
                  content_commitment=False,
                  key_encipherment=False,
                  data_encipherment=False,
                  key_agreement=False,
                  key_cert_sign=True,
                  crl_sign=True,
                  encipher_only=False,
                  decipher_only=False,
              ),
              critical=True
          )
          builder = builder.add_extension(
              x509.SubjectKeyIdentifier.from_public_key(csr.public_key()),
              critical=False
          )
          builder = builder.add_extension(
              x509.AuthorityKeyIdentifier.from_issuer_public_key(ca_key.public_key()),
              critical=False
          )

          certificate = builder.sign(
              private_key=ca_key, algorithm=hashes.SHA256()
          )

          with open(output_path, "wb") as f:
              f.write(certificate.public_bytes(serialization.Encoding.PEM))

      if __name__ == "__main__":
          sign_csr(sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4])
    mode: '0755'
  delegate_to: localhost

- name: Sign Vault PKI Intermediate CA CSR with Homelab Root CA (python) # noqa: no-handler
  ansible.builtin.command: >
    python3 "{{ vault_cluster_ca_dir_controller | expanduser }}/sign_intermediate.py"
    "{{ vault_cluster_ca_dir_controller | expanduser }}/vault-pki-intermediate.csr"
    "{{ vault_cluster_ca_cert_controller }}"
    "{{ vault_cluster_ca_key_controller }}"
    "{{ vault_cluster_ca_dir_controller | expanduser }}/vault-pki-intermediate.crt"
  changed_when: true
  delegate_to: localhost
  register: _signed_pki_cert
  when: _generated_pki_csr_cmd.changed # Only sign if CSR was just generated

- name: Copy signed PKI Intermediate CA certificate back to Vault leader # noqa: no-handler
  ansible.builtin.copy:
    content: |
      {{ lookup('file', vault_cluster_ca_dir_controller | expanduser ~ '/vault-pki-intermediate.crt') }}
      {{ lookup('file', vault_cluster_ca_cert_controller | expanduser) }}
    dest: "{{ vault_host_tls_dir }}/vault-pki-intermediate.crt"
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: '0644'
  become: true
  when: _signed_pki_cert.changed

- name: Set signed PKI Intermediate CA certificate in Vault # noqa: no-handler
  ansible.builtin.command: >
    /usr/local/bin/vault write pki/intermediate/set-signed
    certificate=@{{ vault_host_tls_dir }}/vault-pki-intermediate.crt
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: true
  become: true
  when: _signed_pki_cert.changed # Only set if a new cert was just signed

- name: Create PKI role (for pki mount)
  ansible.builtin.command: >
    /usr/local/bin/vault write pki/roles/2023-servers
    allow_any_name=true
    no_store=false
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: false

- name: Set effective Vault public address for PKI
  ansible.builtin.set_fact:
    _vault_pki_public_addr: >-
      {{
        ("https://" ~ vault_acme_advertise_addr ~ ":" ~ vault_api_port)
        if (vault_acme_advertise_addr | default('') | length > 0)
        else _vault_leader_addr
      }}

- name: Configure PKI URLs (for pki mount)
  ansible.builtin.command: >
    /usr/local/bin/vault write pki/config/urls
    issuing_certificates="{{ _vault_pki_public_addr }}/v1/pki/ca"
    crl_distribution_points="{{ _vault_pki_public_addr }}/v1/pki/crl"
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: false

- name: Get pki issuers configuration
  ansible.builtin.command: /usr/local/bin/vault read -format=json pki/config/issuers
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  register: _pki_issuers_config
  changed_when: false
  check_mode: false

- name: List pki issuers
  ansible.builtin.command: /usr/local/bin/vault list -format=json pki/issuers
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  register: _pki_issuers_list
  changed_when: false
  when:
    - (_pki_issuers_config.stdout | default('') | regex_search('^\s*[\[{]')) != ''
    - (_pki_issuers_config.stdout | default('{}', true) | from_json).data.default == ""

- name: Find pki intermediate issuer ID
  ansible.builtin.shell: |
    set -o pipefail
    for issuer in {{ (_pki_issuers_list.stdout | default('[]', true) | from_json) | join(' ') }}; do
      subject=$(/usr/local/bin/vault read -format=json pki/issuer/$issuer | jq -r '.data.certificate' | openssl x509 -noout -subject)
      if echo "$subject" | grep -q "Homelab Intermediate CA"; then
        echo "$issuer"
        exit 0
      fi
    done
    exit 1
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  register: _pki_intermediate_issuer_id
  changed_when: false
  when:
    - (_pki_issuers_config.stdout | default('') | regex_search('^\s*[\[{]')) != ''
    - (_pki_issuers_config.stdout | default('{}', true) | from_json).data.default == ""
    - _pki_issuers_list.rc == 0
    - (_pki_issuers_list.stdout | default('') | regex_search('^\s*[\[{]')) != ''

- name: Set default pki issuer
  ansible.builtin.command: >
    /usr/local/bin/vault write pki/config/issuers
    default="{{ _pki_intermediate_issuer_id.stdout }}"
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: true
  when:
    - (_pki_issuers_config.stdout | default('') | regex_search('^\s*[\[{]')) != ''
    - (_pki_issuers_config.stdout | default('{}', true) | from_json).data.default == ""
    - _pki_intermediate_issuer_id.rc == 0

# Check if PKI mount 'pki_int' is already configured
- name: Read pki_int CA certificate to check existence
  ansible.builtin.command: /usr/local/bin/vault read pki_int/ca/pem
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  register: _pki_int_ca_status
  failed_when: false
  changed_when: false

- name: Enable intermediate PKI secrets engine (pki_int - sub-Intermediate/Issuing CA)
  ansible.builtin.command: >
    /usr/local/bin/vault secrets enable
    -path=pki_int
    -max-lease-ttl=43800h
    pki
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: true
  when:
    - (_vault_secrets_list.stdout | default('') | regex_search('^\s*[\[{]')) != ''
    - "'pki_int/' not in (_vault_secrets_list.stdout | default('{}', true) | from_json)"

- name: Generate PKI_INT Intermediate CA CSR
  ansible.builtin.command: >
    /usr/local/bin/vault write -format=json pki_int/intermediate/generate/internal
    common_name="homelab.internal Intermediate Authority"
    issuer_name="homelab-intermediate"
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: true
  register: _generated_pki_int_csr_cmd
  when: _pki_int_ca_status.rc != 0 # Only generate if CA does not exist

- name: Fetch PKI_INT Intermediate CA CSR to controller # noqa: no-handler
  ansible.builtin.copy:
    content: "{{ (_generated_pki_int_csr_cmd.stdout | default('{}', true) | from_json).data.csr }}"
    dest: "{{ vault_cluster_ca_dir_controller | expanduser }}/vault-pki-int-sub-intermediate.csr"
    mode: '0600'
  delegate_to: localhost
  when:
    - _generated_pki_int_csr_cmd.changed
    - (_generated_pki_int_csr_cmd.stdout | default('') | regex_search('^\s*[\[{]')) != ''

- name: Copy PKI_INT Intermediate CA CSR to Vault leader # noqa: no-handler
  ansible.builtin.copy:
    src: "{{ vault_cluster_ca_dir_controller | expanduser }}/vault-pki-int-sub-intermediate.csr"
    dest: /tmp/vault-pki-int-sub-intermediate.csr
    mode: '0644'
  when:
    - _generated_pki_int_csr_cmd.changed
    - (_generated_pki_int_csr_cmd.stdout | default('') | regex_search('^\s*[\[{]')) != ''

- name: Sign PKI_INT Intermediate CA CSR with Vault PKI # noqa: no-handler
  ansible.builtin.command: >
    /usr/local/bin/vault write -format=json pki/root/sign-intermediate
    mount_point=pki
    csr=@/tmp/vault-pki-int-sub-intermediate.csr
    format=pem_bundle ttl="43800h"
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: true
  register: _signed_pki_int_csr
  when: _generated_pki_int_csr_cmd.changed # Only sign if CSR was just generated

- name: Copy signed PKI_INT Intermediate CA certificate back to Vault leader # noqa: no-handler
  ansible.builtin.copy:
    content: "{{ (_signed_pki_int_csr.stdout | default('{}', true) | from_json).data.certificate }}"
    dest: "{{ vault_host_tls_dir }}/vault-pki-int-sub-intermediate.crt"
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: '0644'
  become: true
  when: _signed_pki_int_csr.changed

- name: Set signed PKI_INT Intermediate CA certificate in Vault # noqa: no-handler
  ansible.builtin.command: >
    /usr/local/bin/vault write pki_int/intermediate/set-signed
    certificate=@{{ vault_host_tls_dir }}/vault-pki-int-sub-intermediate.crt
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: true
  become: true
  when:
    - _signed_pki_int_csr.changed
    - (_signed_pki_int_csr.stdout | default('') | regex_search('^\s*[\[{]')) != ''

- name: Configure intermediate PKI cluster (pki_int)
  ansible.builtin.command: >
    /usr/local/bin/vault write pki_int/config/cluster
    path="{{ _vault_pki_public_addr }}/v1/pki_int"
    aia_path="{{ _vault_pki_public_addr }}/v1/pki_int"
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: false

- name: Get default issuer ID for pki_int
  ansible.builtin.command: /usr/local/bin/vault read -field=default pki_int/config/issuers
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  register: _default_pki_int_issuer
  changed_when: false

- name: Create intermediate PKI role (pki_int)
  ansible.builtin.command: >
    /usr/local/bin/vault write pki_int/roles/{{ vault_pki_int_role_name }}
    issuer="{{ _default_pki_int_issuer.stdout }}"
    allow_any_name=true
    max_ttl="8760h"
    ttl="8760h"
    no_store=false
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: false

- name: Create edge-proxy-policy
  ansible.builtin.shell: |
    /usr/local/bin/vault policy write edge-proxy-policy - <<'EOF'
      path "pki_int/issue/{{ vault_pki_int_role_name }}" {
        capabilities = ["create", "update"]
      }
      path "pki_int/sign/{{ vault_pki_int_role_name }}" {
        capabilities = ["create", "update"]
      }
      path "pki_int/cert/*" {
        capabilities = ["read"]
      }
      path "pki_int/ca/pem" {
        capabilities = ["read"]
      }
      path "pki_int/ca_chain" {
        capabilities = ["read"]
      }
    EOF
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: false

- name: Check if edge-proxy token exists on controller
  ansible.builtin.stat:
    path: "{{ vault_edge_proxy_token_path }}"
  register: _edge_proxy_token_stat
  delegate_to: localhost
  become: false

- name: Read edge-proxy token from controller
  ansible.builtin.slurp:
    src: "{{ vault_edge_proxy_token_path }}"
  register: _edge_proxy_token_slurp
  delegate_to: localhost
  become: false
  when: _edge_proxy_token_stat.stat.exists

- name: Verify if edge-proxy token is valid
  ansible.builtin.uri:
    url: "https://{{ _vault_leader_addr | regex_replace('^https?://', '') }}/v1/auth/token/lookup-self"
    method: GET
    headers:
      X-Vault-Token: "{{ _edge_proxy_token_slurp.content | b64decode | trim }}"
    validate_certs: false
    status_code: [200, 403]
  register: _edge_proxy_token_lookup
  delegate_to: localhost
  when: _edge_proxy_token_stat.stat.exists
  become: false

- name: Create edge-proxy token
  ansible.builtin.command: /usr/local/bin/vault token create -policy="edge-proxy-policy" -period=720h -format=json
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  register: _edge_proxy_token_output
  changed_when: _edge_proxy_token_output.rc == 0
  when: >-
    not _edge_proxy_token_stat.stat.exists or
    'vault_token_refresh' in ansible_run_tags or
    (_edge_proxy_token_lookup.status | default(0)) == 403
  tags: [vault_token_refresh]

- name: Ensure edge-proxy token directory exists on controller
  ansible.builtin.file:
    path: "{{ vault_eab_export_path | default('~/.local/share/ansible-home-cluster/vault/acme_eab.json') | dirname }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  run_once: true
  become: false

- name: Store edge-proxy token on controller # noqa: no-handler
  ansible.builtin.copy:
    content: "{{ (_edge_proxy_token_output.stdout | default('{}', true) | from_json).auth.client_token }}"
    dest: "{{ vault_edge_proxy_token_path }}"
    mode: '0600'
  delegate_to: localhost
  become: false
  when:
    - (_edge_proxy_token_output.stdout | default('') | regex_search('^\s*[\[{]')) != ''
    - (_edge_proxy_token_output.changed or (not _edge_proxy_token_stat.stat.exists and _edge_proxy_token_output.stdout is defined))
  tags: [vault_token_refresh]

- name: Configure intermediate PKI URLs (pki_int)
  ansible.builtin.command: >
    /usr/local/bin/vault write pki_int/config/urls
    issuing_certificates="{{ _vault_pki_public_addr }}/v1/pki_int/issuer/{{ _default_pki_int_issuer.stdout }}/der"
    crl_distribution_points="{{ _vault_pki_public_addr }}/v1/pki_int/issuer/{{ _default_pki_int_issuer.stdout }}/crl/der"
    ocsp_servers="{{ _vault_pki_public_addr }}/v1/pki_int/ocsp"
    enable_templating=true
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: false

- name: Enable ACME on intermediate PKI (pki_int)
  ansible.builtin.command: >
    /usr/local/bin/vault write pki_int/config/acme enabled=true
  environment:
    VAULT_ADDR: "{{ _vault_leader_addr }}"
    VAULT_TOKEN: "{{ vault_root_token }}"
    VAULT_SKIP_VERIFY: "true"
  changed_when: false
