---
# Minimal router for staged Vault role execution

- name: Route to split-stage tasks when vault_stage is set (common|leader|followers)
  ansible.builtin.include_tasks: "{{ vault_stage }}.yml"
  when:
    - vault_stage is defined

- name: End role after stage execution
  ansible.builtin.meta: end_role
  when:
    - vault_stage is defined

# Default: run common when no stage specified
- name: Run common tasks by default when no stage specified
  ansible.builtin.include_tasks: common.yml
  when:
    - vault_stage is not defined

- name: End role (no stage specified)
  ansible.builtin.meta: end_role
  when:
    - vault_stage is not defined
