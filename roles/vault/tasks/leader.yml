---
- name: Install startup wrapper on leader to capture early logs
  ansible.builtin.copy:
    dest: "/home/vault/bin/start-vault.sh"
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: '0755'
    content: |
      #!/bin/sh
      set -eu
      ts="$(date -Iseconds)"
      mkdir -p /vault/logs
      log_ts="/vault/logs/startup-${ts}.log"
      log_cur="/vault/logs/current.log"
      : > "$log_cur"
      : "${VAULT_LOG_LEVEL:=info}"
      export VAULT_LOG_LEVEL
      old_files=$(ls -1t /vault/logs/startup-*.log 2>/dev/null | sed -n '51,$p' || true)
      if [ -n "${old_files:-}" ]; then
        echo "$old_files" | xargs -r rm -f || true
      fi
      exec sh -lc "vault server -config={{ vault_cfg_path_in_container }} 2>&1 | tee -a '$log_ts' '$log_cur'"
  become: true

- name: Ensure Vault container is running on leader
  containers.podman.podman_container:
    name: "{{ vault_container_name }}"
    image: "{{ vault_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ vault_api_port }}:8200/tcp"
      - "{{ vault_cluster_port }}:8201/tcp"
    cap_add:
      - IPC_LOCK
      - DAC_OVERRIDE
      - CHOWN
    user: "{{ vault_container_user | default(omit) }}"
    env: "{{ vault_container_env }}"
    command: >-
      {{ (vault_enable_log_wrapper | default(true))
          | ternary('/bin/sh -lc /vault/bin/start-vault.sh', 'server -config=' ~ vault_cfg_path_in_container) }}
    volumes:
      - "{{ vault_host_config_dir }}:/vault/config"
      - "{{ vault_host_tls_dir }}:/vault/tls"
      - "{{ vault_host_data_dir }}:/vault/data"
      - "{{ vault_logs_dir }}:{{ vault_logs_dir_in_container | default('/vault/logs') }}"
      - "/home/vault/bin:/vault/bin"
  become: true

# Auto-initialize the Raft leader when using Transit seal (Vault remains sealed until initialized)
- name: Pause 5s before leader auto-initialize (transit)
  ansible.builtin.pause:
    seconds: 5
  when:
    - vault_enable_transit_seal | default(false)
    - inventory_hostname in (groups['vault_leader'] | default([]))

- name: Initialize Raft leader with recovery keys (Transit seal)
  ansible.builtin.command: >-
    podman exec {{ vault_container_name }} sh -lc "/bin/vault operator init"
  register: _leader_init
  changed_when: true
  failed_when: false
  become: true
  when:
    - vault_enable_transit_seal | default(false)
    - inventory_hostname in (groups['vault_leader'] | default([]))

- name: Wait for leader to be unsealed (post-init, transit)
  ansible.builtin.command: >-
    podman exec {{ vault_container_name }} sh -lc "/bin/vault status -format=json"
  register: _leader_status_after_init
  changed_when: false
  failed_when: false
  retries: "{{ vault_wait_retries | default(150) }}"
  delay: "{{ vault_wait_delay | default(2) }}"
  until: >-
    (_leader_status_after_init.rc | default(1)) == 0 and
    ((_leader_status_after_init.stdout | from_json).sealed | default(true)) == false
  become: true
  when:
    - vault_enable_transit_seal | default(false)
    - inventory_hostname in (groups['vault_leader'] | default([]))
