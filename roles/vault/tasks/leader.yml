---

- name: Get Homelab Root CA certificate content (controller)
  ansible.builtin.slurp:
    src: "{{ vault_cluster_ca_cert_controller }}"
  register: _homelab_root_ca_cert_content
  delegate_to: localhost
  run_once: true

- name: Get Homelab Root CA private key content (controller)
  ansible.builtin.slurp:
    src: "{{ vault_cluster_ca_key_controller }}"
  register: _homelab_root_ca_key_content
  delegate_to: localhost
  run_once: true

- name: Ensure TLS directory exists for leader
  ansible.builtin.file:
    path: "{{ vault_host_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Render Vault configuration (leader)
  ansible.builtin.template:
    src: "vault.hcl.j2"
    dest: "{{ vault_host_config_dir }}/vault.hcl"
    owner: "{{ vault_runtime_user | default('vault') }}"
    group: "{{ vault_runtime_group_name | default('vault') }}"
    mode: '0644'
  become: true
  notify: Restart Vault container to apply config changes (if needed)
  vars:
    # Compute effective Vault public URL used by the template
    vault_public_url_effective: >-
      {{
        (vault_public_url | default(''))
        if ((vault_public_url | default('') | length) > 0)
        else (
          'https://'
          ~ (
              (
                hostvars is defined
                and hostvars[inventory_hostname] is defined
                and hostvars[inventory_hostname].ansible_facts is defined
                and hostvars[inventory_hostname].ansible_facts.default_ipv4 is defined
              )
              | ternary(
                  hostvars[inventory_hostname].ansible_facts.default_ipv4.address,
                  ansible_facts.default_ipv4.address
                )
            )
          ~ ':' ~ (vault_api_port | string)
        )
      }}

- name: Generate a private key for the Vault leader
  community.crypto.openssl_privatekey:
    path: "{{ vault_host_tls_dir }}/api.key"
    size: 2048
    owner: root
    group: root
    mode: '0600'
  become: true

- name: Construct dynamic SANs list for Vault server certificate
  ansible.builtin.set_fact:
    _vault_server_sansa: "{{
      (
        ( [ 'DNS:' ~ inventory_hostname ] if inventory_hostname is defined else [] ) +
        ( [ 'DNS:' ~ inventory_hostname ~ '.' ~ base_domain ] if base_domain is defined else [] ) +
        [ 'DNS:localhost' ] +
        ( vault_additional_san_dns | map('regex_replace', '^(.*)$', 'DNS:\\1') | list if vault_additional_san_dns is defined and vault_additional_san_dns | length > 0 else [] ) +
        ( tls_additional_san_dns | map('regex_replace', '^(.*)$', 'DNS:\\1') | list if tls_additional_san_dns is defined and tls_additional_san_dns | length > 0 else [] ) +
        ( [ 'IP:' ~ ansible_facts.default_ipv4.address ] if ansible_facts.default_ipv4.address is defined else [] ) +
        [ 'IP:127.0.0.1' ] +
        ( vault_additional_san_ips | map('regex_replace', '^(.*)$', 'IP:\\1') | list if vault_additional_san_ips is defined and vault_additional_san_ips | length > 0 else [] ) +
        ( [ 'IP:' ~ load_balancer_virtual_ip ] if load_balancer_virtual_ip is defined and load_balancer_virtual_ip | length > 0 else [] )
      ) | unique | sort | list
    }}"

- name: Debug generated SANs for Vault leader certificate
  ansible.builtin.debug:
    msg: "Generated SANs for {{ inventory_hostname }}: {{ _vault_server_sansa }}"

- name: Generate CSR for the Vault leader
  community.crypto.openssl_csr:
    path: "{{ vault_host_tls_dir }}/api.csr"
    privatekey_path: "{{ vault_host_tls_dir }}/api.key"
    common_name: "{{ inventory_hostname }}"
    subject_alt_name: "{{ _vault_server_sansa }}"
    country_name: "BE"
    organization_name: "Homelab"
    state_or_province_name: "Brussels"
    locality_name: "Brussels"
  become: true

- name: Fetch Vault leader CSR to controller
  ansible.builtin.fetch:
    src: "{{ vault_host_tls_dir }}/api.csr"
    dest: "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}-api.csr"
    flat: true
  become: true
  register: _vault_leader_csr_fetch

- name: Create OpenSSL config for Vault leader extensions (on controller)
  ansible.builtin.copy:
    dest: "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}.ext"
    content: |
      authorityKeyIdentifier=keyid,issuer
      basicConstraints=CA:FALSE
      keyUsage = digitalSignature, nonRepudiation, keyEncipherment, dataEncipherment
      extendedKeyUsage = serverAuth
      subjectAltName = {{ _vault_server_sansa | join(',') }}
  delegate_to: localhost
  register: _vault_leader_ext_config

- name: Check if Vault leader certificate exists on controller
  ansible.builtin.stat:
    path: "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}-api.crt"
  delegate_to: localhost
  register: _vault_leader_crt_stat

- name: Sign Vault leader certificate with Homelab Root CA (on controller)
  ansible.builtin.command: >
    openssl x509 -req
    -in "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}-api.csr"
    -CA "{{ homelab_root_ca_cert_path | default(vault_cluster_ca_cert_controller) }}"
    -CAkey "{{ homelab_root_ca_key_path | default(vault_cluster_ca_key_controller) }}"
    -CAcreateserial
    -out "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}-api.crt"
    -days 1825
    -sha256
    -extfile "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}.ext"
  delegate_to: localhost
  when: >
    _vault_leader_csr_fetch.changed
    or _vault_leader_ext_config.changed
    or not _vault_leader_crt_stat.stat.exists

- name: Copy signed Vault leader certificate to host
  ansible.builtin.copy:
    src: "{{ vault_cluster_ca_dir_controller | expanduser }}/{{ inventory_hostname }}-api.crt"
    dest: "{{ vault_host_tls_dir }}/api.crt"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Copy Homelab Root CA certificate to Vault leader
  ansible.builtin.copy:
    content: "{{ _homelab_root_ca_cert_content.content | b64decode }}"
    dest: "{{ vault_host_tls_dir }}/ca-bundle.pem"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Ensure Vault container is running - leader
  containers.podman.podman_container:
    name: "{{ vault_container_name }}"
    image: "{{ vault_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ vault_api_port }}:{{ vault_api_port }}/tcp"
      - "{{ vault_cluster_port }}:{{ vault_cluster_port }}/tcp"
    cap_add:
      - IPC_LOCK
      - DAC_OVERRIDE
      - CHOWN
    user: "{{ vault_container_user | default(omit) }}"
    env:
      SKIP_CHOWN: "true"
      SKIP_SETCAP: "true"
      VAULT_LOG_LEVEL: "{{ vault_log_level | default('debug') }}"
      VAULT_CACERT: "{{ vault_tls_dir_in_container }}/ca-bundle.pem"
      VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    command: >-
      {{ (vault_enable_log_wrapper | default(true))
          | ternary('/bin/sh -lc /vault/bin/start-vault.sh', 'server -config=' ~ vault_cfg_path_in_container) }}
    volumes:
      - "{{ vault_host_config_dir }}:/vault/config"
      - "{{ vault_host_tls_dir }}:/vault/tls"
      - "{{ vault_host_data_dir }}:/vault/data"
      - "{{ vault_logs_dir }}:{{ vault_logs_dir_in_container | default('/vault/logs') }}"
      - "{{ vault_host_bin_dir }}:/vault/bin"
  become: true

- name: Pause briefly after starting container
  ansible.builtin.pause:
    seconds: 5

# -------------------------------------------------------------
# Cluster init JSON (strict reuse with auto-init if missing)
# -------------------------------------------------------------
- name: Check for existing cluster init JSON on controller (leader)
  ansible.builtin.stat:
    path: "{{ vault_init_export_path | expanduser }}"
  register: _cluster_init_stat
  delegate_to: localhost
  run_once: true

- name: Load cluster init JSON (strict reuse)
  ansible.builtin.slurp:
    src: "{{ vault_init_export_path | expanduser }}"
  register: _cluster_init_loaded
  delegate_to: localhost
  run_once: true
  when: _cluster_init_stat.stat.exists | default(false)

- name: Fail fast if cluster-init.json exists but is not valid JSON
  ansible.builtin.fail:
    msg: >-
      Existing cluster-init.json ({{ vault_init_export_path | expanduser }}) is not valid JSON. Delete it or replace with
      the JSON output from 'vault operator init -format=json'. The leader will not proceed with a non-JSON file.
  when:
    - _cluster_init_stat.stat.exists | default(false)
    - ((_cluster_init_loaded.content | default('') | b64decode | regex_search('^\s*[\[{]') | default('')) == '')
  delegate_to: localhost
  run_once: true

# Detect current leader status once (pre-init check)
- name: Read current leader Vault status (pre-init check)
  ansible.builtin.command: /usr/local/bin/vault status -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_SKIP_VERIFY: "true"
  register: _leader_status_preinit
  changed_when: false
  failed_when: false
  become: true

- name: Detect if Vault needs initialization (Fresh install or wipe)
  ansible.builtin.set_fact:
    vault_needs_init: "{{ not ((_leader_status_preinit.stdout | default('{}') | from_json).initialized | default(false)) }}"

- name: Backup stale cluster-init.json if Vault is fresh
  ansible.builtin.copy:
    src: "{{ vault_init_export_path | expanduser }}"
    dest: "{{ vault_init_export_path | expanduser }}.bak.{{ ansible_date_time.iso8601 }}"
    remote_src: true
  delegate_to: localhost
  when:
    - vault_needs_init
    - _cluster_init_stat.stat.exists | default(false)

- name: Initialize Raft leader (one-time, create cluster-init.json when missing)
  ansible.builtin.command: /usr/local/bin/vault operator init -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_SKIP_VERIFY: "true"
  register: _leader_init
  changed_when: (_leader_init.rc | default(1)) == 0
  failed_when: false
  become: true
  when:
    - vault_needs_init
    - not (vault_enable_transit_seal | default(false)) # Only run standard init if NOT transit seal

- name: Assert leader init output is valid JSON
  ansible.builtin.assert:
    that:
      - (_leader_init.stdout | default('') | regex_search('^\s*[\[{]')) != ''
    fail_msg: >-
      Vault leader init output was not JSON. Ensure the CLI honors -format=json. The role sets VAULT_FORMAT=json.
  when:
    - _leader_init is defined
    - (_leader_init.rc | default(1)) == 0

- name: Persist cluster init JSON to controller (leader)
  ansible.builtin.copy:
    dest: "{{ vault_init_export_path | expanduser }}"
    mode: '0600'
    content: "{{ (_leader_init.stdout | from_json) | to_nice_json }}"
  delegate_to: localhost
  run_once: true
  when:
    - _leader_init is defined
    - (_leader_init.rc | default(1)) == 0

- name: Load root token from controller init JSON if not provided (leader)
  ansible.builtin.slurp:
    src: "{{ vault_init_export_path | expanduser }}"
  register: _leader_init_json
  delegate_to: localhost
  run_once: true
  when:
    - (vault_root_token | default('') | length) == 0
    - (_cluster_init_stat.stat.exists | default(false))
    - not vault_needs_init # Only load if we didn't just re-init (if re-init, we use output)

- name: Set vault_root_token from controller file (leader)
  ansible.builtin.set_fact:
    vault_root_token: >-
      {{ (
            (_leader_init_json.content | default('') | b64decode | default('{}', true))
          | from_json
        ).root_token | default(vault_root_token | default('')) }}
  when:
    - (vault_root_token | default('') | length) == 0
    - (_leader_init_json is defined)
    - not vault_needs_init

- name: Set vault_root_token from leader init output when file just created (leader)
  ansible.builtin.set_fact:
    vault_root_token: "{{ (_leader_init.stdout | from_json).root_token }}"
  when:
    - _leader_init is defined
    - (_leader_init.rc | default(1)) == 0

- name: Write /root/.vault-token when vault_root_token is available (leader)
  ansible.builtin.copy:
    content: "{{ vault_root_token }}"
    dest: /root/.vault-token
    mode: '0600'
  become: true
  when:
    - (vault_root_token | default('') | length) > 0

- name: Verify CLI token (lookup, leader)
  ansible.builtin.command: /usr/local/bin/vault token lookup -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_SKIP_VERIFY: "true"
  register: _leader_token_lookup
  changed_when: false
  failed_when: false
  become: true
  when:
    - (vault_root_token | default('') | length) > 0



# Auto-initialize the Raft leader when using Transit seal (only when not initialized)
- name: Pause 5s before leader auto-initialize (transit)
  ansible.builtin.pause:
    seconds: 5
  when:
    - vault_enable_transit_seal | default(false)
    - inventory_hostname in (groups['vault_leader'] | default([]))
    - vault_needs_init

- name: Initialize Raft leader with recovery keys (Transit seal)
  ansible.builtin.command: /usr/local/bin/vault operator init -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_SKIP_VERIFY: "true"
  register: _leader_init
  changed_when: (_leader_init.rc | default(1)) == 0
  failed_when: false
  become: true
  when:
    - vault_enable_transit_seal | default(false)
    - inventory_hostname in (groups['vault_leader'] | default([]))
    - vault_needs_init

- name: Wait for leader to be unsealed (post-init, transit)
  ansible.builtin.command: /usr/local/bin/vault status -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_SKIP_VERIFY: "true"
  register: _leader_status_after_init
  changed_when: false
  failed_when: false
  retries: "{{ vault_wait_retries | default(150) }}"
  delay: "{{ vault_wait_delay | default(2) }}"
  until: >-
    (_leader_status_after_init.rc | default(1)) == 0 and
    ((_leader_status_after_init.stdout | from_json).sealed | default(true)) == false
  become: true
  when:
    - vault_enable_transit_seal | default(false)
    - inventory_hostname in (groups['vault_leader'] | default([]))

- name: Persist cluster init JSON to controller (transit leader)
  ansible.builtin.copy:
    dest: "{{ vault_init_export_path | expanduser }}"
    mode: '0600'
    content: "{{ (_leader_init.stdout | from_json) | to_nice_json }}"
  delegate_to: localhost
  run_once: true
  when:
    - _leader_init is defined
    - _leader_init.changed

- name: Set vault_root_token from leader init output (transit leader)
  ansible.builtin.set_fact:
    vault_root_token: "{{ (_leader_init.stdout | from_json).root_token }}"
  when:
    - _leader_init is defined
    - _leader_init.changed

- name: Write /root/.vault-token when vault_root_token is available (transit leader)
  ansible.builtin.copy:
    content: "{{ vault_root_token }}"
    dest: /root/.vault-token
    mode: '0600'
  become: true
  when:
    - _leader_init is defined
    - _leader_init.changed

- name: Attempt to recover root token from remote .vault-token if missing
  ansible.builtin.slurp:
    src: /root/.vault-token
  register: _remote_vault_token
  failed_when: false
  become: true
  when: (vault_root_token | default('') | length) == 0

- name: Set vault_root_token from remote file
  ansible.builtin.set_fact:
    vault_root_token: "{{ _remote_vault_token.content | b64decode | trim }}"
  when:
    - (vault_root_token | default('') | length) == 0
    - _remote_vault_token.content is defined

- name: Verify CLI token (final check)
  ansible.builtin.command: /usr/local/bin/vault token lookup -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:{{ vault_api_port }}"
    VAULT_SKIP_VERIFY: "true"
    VAULT_TOKEN: "{{ vault_root_token }}"
  register: _leader_token_final_check
  changed_when: false
  failed_when: false
  become: true

- name: Fail if Root Token is invalid
  ansible.builtin.fail:
    msg: >-
      The Vault Root Token is invalid.
      This usually happens if the Vault data volume persists but the token in cluster-init.json is stale/lost.
      To fix: Run `rm -rf /home/vault/data` on the leader {{ inventory_hostname }} to force a fresh initialization.
  when: _leader_token_final_check.rc != 0

- name: Include PKI and ACME setup tasks
  ansible.builtin.include_tasks: pki_acme_setup.yml
