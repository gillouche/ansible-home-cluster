---

- name: refresh system trust store
  ansible.builtin.shell: |
    (update-ca-trust || update-ca-trust extract || update-ca-certificates || true)
  changed_when: false
  failed_when: false
  become: true

- name: restart caddy
  ansible.builtin.systemd:
    name: "container-edge-proxy"
    state: restarted
    daemon_reload: true
  become: true
  failed_when: false
