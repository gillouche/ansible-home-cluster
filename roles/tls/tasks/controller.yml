---
- name: Ensure PKI directory exists
  ansible.builtin.file:
    path: "{{ tls_controller_pki_dir }}"
    state: directory
    mode: '0700'

# --- Root CA ---

- name: Check for existing Root CA key
  ansible.builtin.stat:
    path: "{{ tls_root_ca_key_path }}"
  register: _root_ca_key_stat

- name: Generate Root CA Private Key
  community.crypto.openssl_privatekey:
    path: "{{ tls_root_ca_key_path }}"
    type: RSA
    size: 4096
  when: not _root_ca_key_stat.stat.exists


- name: Generate Root CA CSR
  community.crypto.openssl_csr:
    path: "{{ tls_controller_pki_dir }}/root_ca.csr"
    privatekey_path: "{{ tls_root_ca_key_path }}"
    common_name: "{{ tls_root_ca_common_name }}"
    use_common_name_for_san: false
    basic_constraints:
      - "CA:TRUE"
    key_usage:
      - keyCertSign
      - cRLSign

- name: Check for existing Root CA cert
  ansible.builtin.stat:
    path: "{{ tls_root_ca_crt_path }}"
  register: _root_ca_crt_stat

- name: Generate Root CA Certificate
  community.crypto.x509_certificate:
    path: "{{ tls_root_ca_crt_path }}"
    csr_path: "{{ tls_controller_pki_dir }}/root_ca.csr"
    privatekey_path: "{{ tls_root_ca_key_path }}"
    provider: selfsigned
    selfsigned_not_after: "+{{ tls_root_ca_validity_days }}d"
  when: not _root_ca_crt_stat.stat.exists


# --- Wildcard Cert ---

- name: Generate Wildcard Private Key
  community.crypto.openssl_privatekey:
    path: "{{ tls_wildcard_key_path }}"
    type: RSA
    size: 2048

- name: Generate Wildcard CSR
  community.crypto.openssl_csr:
    path: "{{ tls_wildcard_csr_path }}"
    privatekey_path: "{{ tls_wildcard_key_path }}"
    common_name: "{{ tls_wildcard_common_name }}"
    subject_alt_name: "{{ tls_wildcard_sans }}"
    basic_constraints:
      - "CA:FALSE"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
      - clientAuth

- name: Sign Wildcard Certificate with Root CA
  community.crypto.x509_certificate:
    path: "{{ tls_wildcard_crt_path }}"
    csr_path: "{{ tls_wildcard_csr_path }}"
    ownca_path: "{{ tls_root_ca_crt_path }}"
    ownca_privatekey_path: "{{ tls_root_ca_key_path }}"
    provider: ownca
    ownca_not_after: "+{{ tls_wildcard_validity_days }}d"
    ownca_not_before: "-1d"
