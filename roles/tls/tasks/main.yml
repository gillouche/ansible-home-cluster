---
# 1. Controller Side Generation (Run Once)
- name: Ensure controller PKI artifacts exist
  ansible.builtin.include_tasks: controller.yml
  args:
    apply:
      delegate_to: localhost
      run_once: true
      become: false
  run_once: true
  tags: [tls_controller]

# 2. Target Node Trust Store Setup
- name: Target Node Trust Store Setup
  when: inventory_hostname != 'localhost'
  block:
    - name: Ensure TLS directory exists
      ansible.builtin.file:
        path: "{{ tls_target_dir }}"
        state: directory
        mode: '0755'
      become: true

    - name: Install CA into system trust anchors (Arch Linux)
      ansible.builtin.copy:
        src: "{{ tls_root_ca_crt_path }}"
        dest: /etc/ca-certificates/trust-source/anchors/homelab-root.crt
        mode: '0644'
        owner: root
        group: root
      when: ansible_facts['os_family'] | default('') == "Archlinux"
      become: true
      notify: Refresh system trust store

    - name: Install CA bundle (Root CA) - Legacy/App Bundle
      ansible.builtin.copy:
        src: "{{ tls_root_ca_crt_path }}"
        dest: "{{ tls_ca_bundle_path }}"
        mode: '0644'
        owner: root
        group: root
      # Also trigger trust refresh just in case, though usually this file is for apps targeting it directly
      become: true
      notify: Refresh system trust store

# 3. Edge Proxy Certificate Delivery
- name: Distribute Wildcard Certs to Proxy Nodes
  when: "'edge_proxy_cluster' in group_names"
  become: true
  block:
    - name: Ensure live cert directory exists
      ansible.builtin.file:
        path: "{{ tls_target_live_dir }}"
        state: directory
        mode: '0700'

    - name: Copy Wildcard Certificate
      ansible.builtin.copy:
        src: "{{ tls_wildcard_crt_path }}"
        dest: "{{ tls_target_live_dir }}/wildcard.pem"
        mode: '0644'
        owner: root
        group: root
      notify: Restart caddy

    - name: Copy Wildcard Private Key
      ansible.builtin.copy:
        src: "{{ tls_wildcard_key_path }}"
        dest: "{{ tls_target_live_dir }}/wildcard.key"
        mode: '0600'
        owner: root
        group: root
      notify: Restart caddy
