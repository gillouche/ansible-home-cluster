---

- name: Wildcard certificate management
  when: tls_wildcard_cert_enabled | bool
  block:
    - name: Token Retrieval for Wildcard
      block:
        - name: Check for edge-proxy token on controller
          ansible.builtin.stat:
            path: "{{ vault_edge_proxy_token_path }}"
          register: _edge_proxy_token_stat
          delegate_to: localhost
          become: false

        - name: Read edge-proxy token from controller
          ansible.builtin.slurp:
            src: "{{ vault_edge_proxy_token_path }}"
          register: _edge_proxy_token_content
          delegate_to: localhost
          when: _edge_proxy_token_stat.stat.exists
          become: false

        - name: Set tls_wildcard_vault_token from file
          ansible.builtin.set_fact:
            tls_wildcard_vault_token: "{{ _edge_proxy_token_content.content | b64decode | trim }}"
          when:
            - _edge_proxy_token_stat.stat.exists
            - (tls_wildcard_vault_token is not defined or (tls_wildcard_vault_token | length) == 0)

    - name: Ensure wildcard destination directory exists
      ansible.builtin.file:
        path: "{{ tls_wildcard_dest_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: Check existing wildcard certificate validity and SANs
      block:
        - name: Stat existing wildcard certificate
          ansible.builtin.stat:
            path: "{{ tls_wildcard_dest_dir }}/{{ tls_wildcard_cert_name }}.crt"
          register: _tls_wildcard_cert_stat

        - name: Read existing wildcard certificate info if present
          community.crypto.x509_certificate_info:
            path: "{{ tls_wildcard_dest_dir }}/{{ tls_wildcard_cert_name }}.crt"
          register: _tls_wildcard_cert_info
          when: _tls_wildcard_cert_stat.stat.exists and _tls_wildcard_cert_stat.stat.size > 0

        - name: Compute if wildcard certificate needs renewal
          ansible.builtin.set_fact:
            _tls_wildcard_cert_needs_renewal: >-
              {{ not _tls_wildcard_cert_stat.stat.exists or
                 _tls_wildcard_cert_stat.stat.size == 0 or
                 ((_tls_wildcard_cert_info.not_after | to_datetime('%Y%m%d%H%M%SZ')).timestamp() | int) <
                 (ansible_date_time.epoch | int) + (30 * 24 * 60 * 60) or
                 (_tls_wildcard_cert_info.subject_alt_name_items | default([]) | sort) !=
                 (tls_wildcard_domains | map('regex_replace', '^', 'DNS:') | unique | sort) or
                 ((_tls_wildcard_cert_info.not_after | to_datetime('%Y%m%d%H%M%SZ')).timestamp() | int) -
                 ((_tls_wildcard_cert_info.not_before | to_datetime('%Y%m%d%H%M%SZ')).timestamp() | int) <
                 (360 * 24 * 60 * 60) }}
          when: _tls_wildcard_cert_stat.stat.exists and _tls_wildcard_cert_stat.stat.size > 0

    - name: Request and distribute wildcard certificate (if renewal needed)
      when: _tls_wildcard_cert_needs_renewal | default(true)
      block:
        - name: Request wildcard certificate from Vault
          ansible.builtin.uri:
            url: >-
              https://{{ hostvars[groups['vault_leader'][0]].ansible_host }}:{{ vault_api_port }}
              /v1/pki_int/issue/{{ vault_pki_int_role_name }}
            method: POST
            body_format: json
            body:
              common_name: "{{ tls_wildcard_domains | first }}"
              alt_names: "{{ tls_wildcard_domains[1:] | join(',') if (tls_wildcard_domains | length > 1) else omit }}"
              ttl: "8760h"
            headers:
              X-Vault-Token: "{{ tls_wildcard_vault_token }}"
            validate_certs: false
            status_code: [200, 403]
          register: _vault_wildcard_cert_raw
          delegate_to: localhost
          run_once: true
          until: _vault_wildcard_cert_raw.status == 200
          retries: 10
          delay: 5
          ignore_errors: true

        - name: Fail if token is invalid and suggest refresh
          ansible.builtin.fail:
            msg: >-
              Vault edge-proxy token is invalid (403 Forbidden).
              This token is stored at '{{ vault_edge_proxy_token_path }}' and is used to request certificates.
              It might have expired or been revoked.
              Please run the vault setup playbook to automatically refresh it:
              'ansible-playbook playbooks/setup.yml --tags vault'
          when: _vault_wildcard_cert_raw.status == 403

        - name: Fail if request failed for reasons other than 403
          ansible.builtin.fail:
            msg: "Request to Vault failed: {{ _vault_wildcard_cert_raw.msg | default('Unknown error') }}"
          when:
            - _vault_wildcard_cert_raw.status != 200
            - _vault_wildcard_cert_raw.status != 403

        - name: Identify source host for wildcard certificate propagation
          ansible.builtin.set_fact:
            _wildcard_source_host: "{{ groups['edge_proxy_cluster'] | intersect(ansible_play_hosts) | first }}"
          when: (groups['edge_proxy_cluster'] | intersect(ansible_play_hosts) | length) > 0

        - name: Propagate wildcard certificate data to all hosts
          ansible.builtin.set_fact:
            _tls_wildcard_cert_content: >-
              {{ (([hostvars[_wildcard_source_host]._vault_wildcard_cert_raw.json.data.certificate] +
              hostvars[_wildcard_source_host]._vault_wildcard_cert_raw.json.data.ca_chain) | join('\n')) | trim }}
            _tls_wildcard_key_content: >-
              {{ hostvars[_wildcard_source_host]._vault_wildcard_cert_raw.json.data.private_key | trim }}
          when:
            - _wildcard_source_host is defined
            - hostvars[_wildcard_source_host]._vault_wildcard_cert_raw is defined
            - hostvars[_wildcard_source_host]._vault_wildcard_cert_raw.json is defined

        - name: Fix literal newlines in certificate and key
          ansible.builtin.set_fact:
            _tls_wildcard_cert_content: "{{ _tls_wildcard_cert_content | regex_replace('\\\\n', '\n') }}"
            _tls_wildcard_key_content: "{{ _tls_wildcard_key_content | regex_replace('\\\\n', '\n') }}"
          when: _tls_wildcard_cert_content is defined

        - name: Install wildcard certificate
          ansible.builtin.copy:
            content: "{{ _tls_wildcard_cert_content }}"
            dest: "{{ tls_wildcard_dest_dir }}/{{ tls_wildcard_cert_name }}.crt"
            owner: root
            group: root
            mode: '0644'
          become: true
          register: _tls_wildcard_cert_install

        - name: Install wildcard private key
          ansible.builtin.copy:
            content: "{{ _tls_wildcard_key_content }}"
            dest: "{{ tls_wildcard_dest_dir }}/{{ tls_wildcard_cert_name }}.key"
            owner: root
            group: root
            mode: '0600'
          become: true
          register: _tls_wildcard_key_install

        - name: Set fact for certificate update status
          ansible.builtin.set_fact:
            tls_wildcard_certs_updated: "{{ _tls_wildcard_cert_install.changed or _tls_wildcard_key_install.changed }}"
