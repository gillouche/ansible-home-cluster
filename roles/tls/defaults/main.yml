---

# Controller Cluster CA paths (source of truth)
tls_cluster_ca_dir_controller: "{{ vault_cluster_ca_dir_controller }}"
tls_cluster_ca_cert_controller: "{{ root_ca_cert_controller }}"
tls_cluster_ca_key_controller: "{{ root_ca_key_controller }}"

# SAN customization (added to hostnames, FQDN and local IP/127.0.0.1)
tls_additional_san_ips: []
tls_additional_san_dns: []

# Cert validity (days)
tls_server_cert_days: 1825

# Toggle to generate server certificate for the host
tls_generate_server_cert: false

# Wildcard certificate configuration (for edge proxy)
tls_wildcard_cert_enabled: false
tls_wildcard_cert_name: "wildcard"
tls_wildcard_domains: []
tls_wildcard_vault_token: ""
tls_wildcard_dest_dir: "/etc/tls/wildcard"

# Group to allow non-root read access to private keys (optional)
tls_group_name: "tls"

# Vault API Port (defaults to global setting)
vault_api_port: "{{ global_vault_api_port | default(18200) }}"
