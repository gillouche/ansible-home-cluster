---

# Destination directory for TLS assets on every device
tls_dir: "/etc/tls"

# Controller Cluster CA paths (source of truth)
tls_cluster_ca_dir_controller: "~/.local/share/ansible-home-cluster/vault-ca"
tls_cluster_ca_cert_controller: "{{ tls_cluster_ca_dir_controller }}/cluster-ca.pem"
tls_cluster_ca_key_controller: "{{ tls_cluster_ca_dir_controller }}/cluster-ca.key"

# SAN customization (added to hostnames, FQDN and local IP/127.0.0.1)
tls_additional_san_ips: []
tls_additional_san_dns: []

# Include HAProxy VIP automatically when available in inventory
tls_include_load_balancer_vip: true

# Cert validity (days)
tls_server_cert_days: 1825

# System anchor destination for the Cluster CA (kept as-is)
tls_system_anchor_path: "/etc/ca-certificates/trust-source/anchors/vault-cluster-ca.pem"

# Group to allow non-root read access to private keys (optional)
tls_group_name: "tls"

# Diagnostics and retention
tls_debug: false
# Keep CSRs on controller for N days (set to an integer to enable). When undefined, CSRs are deleted after signing.
tls_keep_csrs_days: ""

# Optional: import Cluster CA into macOS keychain on controller
tls_trust_ca_on_controller: false
# 'login' or 'system'
tls_controller_install_keychain: login
