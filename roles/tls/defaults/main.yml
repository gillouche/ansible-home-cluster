---
# TLS Role Defaults - Controller PKI

# Controller Paths
tls_controller_pki_dir: "{{ lookup('env', 'HOME') }}/.local/share/ansible-home-cluster/pki"
tls_root_ca_key_path: "{{ tls_controller_pki_dir }}/root-ca.key"
tls_root_ca_crt_path: "{{ tls_controller_pki_dir }}/root-ca.crt"
tls_wildcard_key_path: "{{ tls_controller_pki_dir }}/wildcard.key"
tls_wildcard_csr_path: "{{ tls_controller_pki_dir }}/wildcard.csr"
tls_wildcard_crt_path: "{{ tls_controller_pki_dir }}/wildcard.pem"

# Root CA Configuration
tls_root_ca_common_name: "Homelab Root CA"
tls_root_ca_validity_days: 3650

# Wildcard Configuration
tls_wildcard_common_name: "*.gillouche.homelab"
tls_wildcard_sans:
  - "DNS:*.gillouche.homelab"
  - "DNS:*.k3s.gillouche.homelab"
  - "DNS:*.dev.k3s.gillouche.homelab"
  - "DNS:*.demo-concept.dev.k3s.gillouche.homelab"
  - "DNS:*.test.k3s.gillouche.homelab"
  - "DNS:*.demo-concept.test.k3s.gillouche.homelab"
  - "DNS:*.prod.k3s.gillouche.homelab"
  - "DNS:*.demo-concept.prod.k3s.gillouche.homelab"
  - "DNS:*.pihole.gillouche.homelab"
  - "DNS:gillouche.homelab"
tls_wildcard_validity_days: 365

# Target Node Paths
tls_target_dir: "/etc/tls"
tls_target_live_dir: "{{ tls_target_dir }}/live"
tls_ca_bundle_path: "{{ tls_target_dir }}/ca-bundle.pem"
