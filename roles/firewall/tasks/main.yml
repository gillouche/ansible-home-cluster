---
# Firewall role: ensure required firewall packages and set permissive LAN policy

- name: Gather minimal facts (role safeguard when running with tags)
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_distribution is not defined

# Package management moved here from podman role
- name: Remove legacy iptables package (Arch)
  community.general.pacman:
    name: iptables
    state: absent
    force: true
  become: true
  when: (ansible_facts['distribution'] | default('') | lower) == 'archlinux'

- name: Install nftables stack (Arch)
  community.general.pacman:
    name:
      - iptables-nft
      - nftables
    state: present
  become: true
  when: (ansible_facts['distribution'] | default('') | lower) == 'archlinux'

- name: Installing NFTables python-module with pip (pacman packages doesn't exist)
  ansible.builtin.pip:
    name: 'oxl-libnftables'
    break_system_packages: true
    state: present
  become: true

- name: Ensure /etc/nftables.d exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy consolidated nftables.conf
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nftables
  become: true

- name: Find existing files under /etc/nftables.d
  ansible.builtin.find:
    paths: /etc/nftables.d
    file_type: any
  register: nftables_d_contents
  become: true

- name: Purge /etc/nftables.d contents (leave directory present)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ nftables_d_contents.files | default([]) }}"
  when: (nftables_d_contents.matched | default(0)) > 0
  notify: Restart nftables
  become: true

- name: Enable nftables service
  ansible.builtin.systemd:
    name: nftables.service
    enabled: true
  become: true

- name: Ensure nftables service is running
  ansible.builtin.systemd:
    name: nftables.service
    state: started
  become: true
