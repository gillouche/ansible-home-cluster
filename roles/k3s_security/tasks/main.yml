---
- name: Deploy ResourceQuota to disable default namespace
  ansible.builtin.template:
    src: default-ns-quota.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/default-ns-quota.yaml
    owner: root
    group: root
    mode: '0644'
  become: true
  when: inventory_hostname == groups['server'][0]

- name: Deploy Gatekeeper HelmChart manifest
  ansible.builtin.template:
    src: gatekeeper-helmchart.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/gatekeeper.yaml
    owner: root
    group: root
    mode: '0644'
  become: true
  when: inventory_hostname == groups['server'][0]

- name: Wait for Gatekeeper deployment to be successful
  ansible.builtin.shell: |
    kubectl wait --for=condition=complete --timeout=300s job/helm-install-gatekeeper -n kube-system
  register: _gatekeeper_wait
  until: _gatekeeper_wait is success
  retries: 10
  delay: 5
  become: true
  when: inventory_hostname == groups['server'][0]
  changed_when: false

- name: Create Gatekeeper manifests directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests/gatekeeper
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: inventory_hostname == groups['server'][0]

- name: Label playground namespaces
  ansible.builtin.shell: |
    kubectl label namespace {{ item }} policy-tier=playground --overwrite
  loop: "{{ k3s_security_playground_namespaces }}"
  become: true
  when: inventory_hostname == groups['server'][0]
  changed_when: false
  failed_when: false

- name: Deploy Gatekeeper templates and constraints
  ansible.builtin.template:
    src: "{{ item }}"
    dest: >-
      /var/lib/rancher/k3s/server/manifests/gatekeeper/{{ item | basename | regex_replace('\.j2$', '') }}
    owner: root
    group: root
    mode: '0644'
  with_fileglob:
    - "../templates/gatekeeper/*.yaml.j2"
  become: true
  when: inventory_hostname == groups['server'][0]

- name: Wait for Gatekeeper ConstraintTemplates to be loaded
  ansible.builtin.shell: |
    kubectl get constrainttemplates
  register: _gatekeeper_templates
  until: _gatekeeper_templates.rc == 0 and _gatekeeper_templates.stdout_lines | length > 0
  retries: 20
  delay: 10
  become: true
  when: inventory_hostname == groups['server'][0]
  changed_when: false

- name: Get Gatekeeper dryrun violations
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get constraints -o json | \
    jq -c '.items[] | select(.spec.enforcementAction == "dryrun") | \
    {name: .metadata.name, violations: (.status.violations // []), audited: .status.auditTimestamp}'
  register: _dryrun_violations
  become: true
  when: inventory_hostname == groups['server'][0]
  changed_when: false
  # Wait until all constraints have been audited (auditTimestamp exists)
  until:
    - _dryrun_violations.stdout_lines | length > 0
    - >-
      _dryrun_violations.stdout_lines | map('from_json') | map(attribute='audited') |
      select('defined') | list | length == _dryrun_violations.stdout_lines | length
  retries: 20
  delay: 30

- name: Render Gatekeeper dryrun violations report
  ansible.builtin.template:
    src: gatekeeper_violations_report.j2
    dest: /tmp/gatekeeper-violations-report.txt
    mode: '0644'
  become: false
  delegate_to: localhost
  vars:
    violations_data: "{{ _dryrun_violations.stdout_lines }}"
  when: inventory_hostname == groups['server'][0]

- name: Print Gatekeeper dryrun violations
  ansible.builtin.pause:
    prompt: "{{ lookup('file', '/tmp/gatekeeper-violations-report.txt') }}"
  become: false
  delegate_to: localhost
  when: inventory_hostname == groups['server'][0]
