---
# handlers for ntp role

- name: Restart chronyd
  ansible.builtin.systemd:
    name: chronyd
    state: restarted
  become: true

- name: Restart NetworkManager
  ansible.builtin.service:
    name: NetworkManager
    state: restarted
  become: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart force-time-sync
  ansible.builtin.systemd:
    name: force-time-sync.service
    state: restarted
    daemon_reload: true
  become: true
