---
# tasks for ntp role (Arch Linux NTP daemon)
- name: Gather minimal facts (role safeguard when running with tags)
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_distribution is not defined

- name: Disable and stop systemd-timesyncd (conflicts with ntpd)
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: false
    state: stopped
  become: true
  failed_when: false

- name: Ensure ntp package is installed (Arch)
  community.general.pacman:
    name: ntp
    state: present
  become: true
  when: (ansible_facts['distribution'] | lower) == 'archlinux'

- name: Deploy ntp.conf template
  ansible.builtin.template:
    src: ntp.conf.j2
    dest: /etc/ntp.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart ntpd

- name: Enable and start ntpd.service (Arch)
  ansible.builtin.systemd:
    name: ntpd.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: (ansible_facts['distribution'] | lower) == 'archlinux'

- name: Force immediate time sync
  ansible.builtin.command: ntpd -gq
  become: true
  changed_when: false
  failed_when: false
  notify: Restart ntpd
