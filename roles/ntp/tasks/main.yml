---
# tasks for ntp role (Refactored to use chrony)
- name: Gather minimal facts (role safeguard when running with tags)
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_distribution is not defined

- name: Set distribution fact if not defined
  ansible.builtin.set_fact:
    is_arch: "{{ (ansible_facts['distribution'] | lower) in ['archlinux', 'arch linux'] }}"

- name: Disable and stop legacy ntp services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  become: true
  failed_when: false
  with_items:
    - ntpd
    - force-time-sync.timer
    - force-time-sync.service
    - systemd-timesyncd
  when: is_arch

- name: Remove legacy ntp package
  ansible.builtin.package:
    name: ntp
    state: absent
  become: true
  when: is_arch

- name: Install chrony package
  ansible.builtin.package:
    name: chrony
    state: present
  become: true
  when: is_arch

- name: Remove legacy ntp and force-sync files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  with_items:
    - /etc/ntp.conf
    - /usr/local/bin/force-time-sync.sh
    - /etc/systemd/system/force-time-sync.service
    - /etc/systemd/system/force-time-sync.timer
    - /etc/systemd/system/ntpd.service.d/override.conf
    - /etc/systemd/system/ntpd.service.d
  when: is_arch

- name: Deploy chrony.conf template
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Restart chronyd
  when: is_arch

- name: Enable and start chronyd
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true
    daemon_reload: true
  become: true
  register: _chrony_start
  until: _chrony_start is success
  retries: 5
  delay: 5
  when: is_arch
