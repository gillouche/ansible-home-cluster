---

# Virtual IP managed by keepalived for the load balancer cluster
load_balancer_virtual_ip: "192.168.0.253"
load_balancer_vip_prefixlen: 24
load_balancer_virtual_router_id: 53  # must be unique per L2 domain; differs from pihole(51) and reverse_proxy(52)

# HAProxy defaults
load_balancer_enable_nonlocal_bind: true  # allow HAProxy to start on BACKUP nodes without VIP bound
load_balancer_haproxy_package: haproxy
load_balancer_keepalived_package: keepalived

# Service names (override if distro differs)
load_balancer_haproxy_service: haproxy
load_balancer_keepalived_service: keepalived

# Ports and example frontends/backends. Users should override for their apps.
load_balancer_haproxy_frontends:
  - name: http
    bind: ":80"
    default_backend: web_backends
# Example HTTPS disabled by default; enable and set certificate path as needed.
#  - name: https
#    bind: ":443 ssl crt /etc/haproxy/certs/your.pem"
#    default_backend: web_backends

load_balancer_haproxy_backends:
  - name: web_backends
    balance: roundrobin
    servers: []  # e.g., [{ name: app1, addr: 192.168.0.101, port: 8080, opts: 'check' }]

# Optional: HAProxy peers for stick-table sync (disabled by default)
load_balancer_haproxy_peers_enabled: false
load_balancer_haproxy_peers_name: lb-peers
load_balancer_haproxy_peers: []  # e.g., [{ name: rpi5b16g4, addr: 192.168.0.84 }, ...]
