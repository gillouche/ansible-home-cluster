---
# Generic keepalived setup role (installed once, used by dependent roles)

- name: Gather minimal facts (role safeguard when running with tags)
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_distribution is not defined
  tags: [keepalived, infra]

- name: Ensure keepalived is installed (Arch)
  community.general.pacman:
    name: keepalived
    state: present
  become: true
  when: (ansible_facts['distribution'] | lower) == 'archlinux'
  tags: [keepalived, infra]

- name: Ensure curl is installed (required for health checks)
  ansible.builtin.package:
    name: curl
    state: present
  become: true
  tags: [keepalived, infra]

- name: Ensure keepalived conf.d directory exists
  ansible.builtin.file:
    path: /etc/keepalived/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: [keepalived, infra]

- name: Normalize keepalived main configuration (include conf.d)
  ansible.builtin.copy:
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      global_defs {
        enable_script_security
      }
      include /etc/keepalived/conf.d/*.conf
  become: true
  tags: [keepalived, infra]

- name: Ensure non-local bind is enabled for services on VIP
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/90-keepalived.conf
    reload: true
  become: true
  tags: [keepalived, infra]

- name: Deploy keepalived notification script
  ansible.builtin.template:
    src: notify.sh.j2
    dest: /usr/local/bin/keepalived_notify.sh
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: [keepalived, infra]

- name: Ensure keepalived systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/keepalived.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: [keepalived, infra]

- name: Order keepalived after k3s to prevent flannel VIP conflicts
  ansible.builtin.copy:
    dest: /etc/systemd/system/keepalived.service.d/after-k3s.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      After=k3s.service
  become: true
  tags: [keepalived, infra]

- name: Enable keepalived
  ansible.builtin.systemd:
    name: keepalived
    enabled: true
    daemon_reload: true
  become: true
  tags: [keepalived, infra]
