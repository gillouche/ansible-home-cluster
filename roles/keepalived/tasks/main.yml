---
# Generic keepalived setup role (installed once, used by dependent roles)

- name: Gather minimal facts (role safeguard when running with tags)
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_distribution is not defined
  tags: [always]

- name: Ensure keepalived is installed (Arch)
  community.general.pacman:
    name: keepalived
    state: present
  become: true
  when: (ansible_facts['distribution'] | lower) == 'archlinux'
  tags: [always]

- name: Ensure keepalived conf.d directory exists
  ansible.builtin.file:
    path: /etc/keepalived/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags: [always]

- name: Normalize keepalived main configuration (include conf.d)
  ansible.builtin.copy:
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      global_defs {
        enable_script_security
      }
      include /etc/keepalived/conf.d/*.conf
  become: true
  tags: [always]

- name: Ensure non-local bind is enabled for services on VIP
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/90-keepalived.conf
    reload: true
  become: true
  tags: [always]

- name: Enable and start keepalived
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true
    daemon_reload: true
  become: true
  tags: [always]
