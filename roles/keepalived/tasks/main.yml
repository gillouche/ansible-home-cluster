---
# Generic keepalived setup role (installed once, used by dependent roles)

- name: Ensure keepalived is installed (Arch)
  community.general.pacman:
    name: keepalived
    state: present
  become: true
  when: (ansible_facts['distribution'] | lower) == 'archlinux'

- name: Ensure keepalived conf.d directory exists
  ansible.builtin.file:
    path: /etc/keepalived/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Normalize keepalived main configuration (include conf.d)
  ansible.builtin.copy:
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      global_defs {
        enable_script_security
      }
      include /etc/keepalived/conf.d/*.conf
  become: true

- name: Ensure non-local bind is enabled for services on VIP (recommended)
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    state: present
    sysctl_set: true
    reload: true
  become: true

- name: Enable and start keepalived
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true
    daemon_reload: true
  become: true
