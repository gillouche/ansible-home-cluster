- name: Create Docker Group repository
  ansible.builtin.uri:
    url: "http://localhost:8081/service/rest/v1/repositories/docker/group"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "docker-all"
      online: true
      storage:
        blobStoreName: "default"
        strictContentTypeValidation: true
      group:
        memberNames:
          - docker-hub
          - quay-proxy
      docker:
        v1Enabled: true
        forceBasicAuth: false
        httpPort: 5000
    status_code: 201
  when: _nexus_repos.json | selectattr('name', 'equalto', 'docker-all') | list | length == 0
  become: false

