## ── Phase 1: Container Registry Proxies (GHCR, GCR, CGR) ──

- name: Create Docker registry proxy repositories
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/repositories/docker/proxy"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "{{ item.name }}"
      online: true
      storage:
        blobStoreName: "default"
        strictContentTypeValidation: true
      proxy:
        remoteUrl: "{{ item.url }}"
        contentMaxAge: 1440
        metadataMaxAge: 1440
      negativeCache:
        enabled: true
        timeToLive: 1440
      httpClient:
        blocked: false
        autoBlock: true
        connection:
          retries: 2
          timeout: 60
      docker:
        v1Enabled: true
        forceBasicAuth: false
      dockerProxy:
        indexType: "REGISTRY"
    status_code: [200, 201]
  loop:
    - { name: "ghcr-proxy", url: "https://ghcr.io" }
    - { name: "gcr-proxy", url: "https://gcr.io" }
    - { name: "cgr-proxy", url: "https://cgr.dev" }
    - { name: "nvcr-proxy", url: "https://nvcr.io" }
  when: _nexus_repos.json | selectattr('name', 'equalto', item.name) | list | length == 0
  become: false
  no_log: true

- name: Update Docker Group to include all registry proxies
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/repositories/docker/group/docker-all"
    method: PUT
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "docker-all"
      online: true
      storage:
        blobStoreName: "default"
        strictContentTypeValidation: true
      group:
        memberNames:
          - docker-hosted
          - docker-hub
          - quay-proxy
          - ghcr-proxy
          - gcr-proxy
          - cgr-proxy
          - nvcr-proxy
      docker:
        v1Enabled: true
        forceBasicAuth: false
        httpPort: 5000
    status_code: [200, 204]
  become: false

## ── Phase 2-5: Raw Proxy Repositories ──

- name: Create raw proxy repositories
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/repositories/raw/proxy"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "{{ item.name }}"
      online: true
      storage:
        blobStoreName: "default"
        strictContentTypeValidation: false
      proxy:
        remoteUrl: "{{ item.url }}"
        contentMaxAge: "{{ item.max_age | default(1440) | int }}"
        metadataMaxAge: "{{ item.meta_age | default(1440) | int }}"
      negativeCache:
        enabled: true
        timeToLive: 1440
      httpClient:
        blocked: false
        autoBlock: true
        connection:
          retries: 2
          timeout: 60
    status_code: [200, 201]
  loop:
    - { name: "github-codeload", url: "https://codeload.github.com" }
    - { name: "github-releases", url: "https://github.com" }
    - { name: "docker-downloads", url: "https://download.docker.com" }
    - { name: "nixos-releases", url: "https://releases.nixos.org" }
    - { name: "chainguard-apk", url: "https://apk.cgr.dev", meta_age: 0 }
    - { name: "nix-cache-proxy", url: "https://cache.nixos.org", max_age: -1, meta_age: -1 }
  when: _nexus_repos.json | selectattr('name', 'equalto', item.name) | list | length == 0
  become: false
  no_log: true

- name: Get list of roles
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/security/roles"
    method: GET
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _nexus_roles
  become: false

- name: Create publish role
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/security/roles"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      id: "nx-publish"
      name: "nx-publish"
      description: "Publish Role for CICD"
      privileges:
        - "nx-repository-view-*-*-browse"
        - "nx-repository-view-*-*-read"
        - "nx-repository-view-*-*-add"
        - "nx-repository-view-*-*-edit"
      roles: []
    status_code: [200, 201]
  when: _nexus_roles.json | selectattr('id', 'equalto', 'nx-publish') | list | length == 0
  become: false

- name: Get list of users
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/security/users"
    method: GET
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _nexus_users
  become: false
  no_log: true

- name: Create publish user
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/security/users"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      userId: "{{ artifactory_nexus_publish_user }}"
      firstName: "Publish"
      lastName: "User"
      emailAddress: "publish@example.com"
      password: "{{ artifactory_nexus_publish_user_password }}"
      status: "active"
      roles:
        - "nx-publish"
    status_code: [200, 201]
  become: false
  no_log: true
  register: _nexus_publish_user_created
  when: _nexus_users.json | selectattr('userId', 'equalto', artifactory_nexus_publish_user) | list | length == 0

- name: Set existing publish user fact
  ansible.builtin.set_fact:
    _nexus_existing_publish_user: >-
      {{ _nexus_users.json | selectattr('userId', 'equalto', artifactory_nexus_publish_user) | first | default({}) }}
  when: _nexus_users.json | selectattr('userId', 'equalto', artifactory_nexus_publish_user) | list | length > 0
  no_log: true

- name: Update publish user details and roles
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/security/users/{{ artifactory_nexus_publish_user }}"
    method: PUT
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      userId: "{{ artifactory_nexus_publish_user }}"
      firstName: "{{ _nexus_existing_publish_user.firstName | default('Publish') }}"
      lastName: "{{ _nexus_existing_publish_user.lastName | default('User') }}"
      emailAddress: "{{ _nexus_existing_publish_user.emailAddress | default('publish@example.com') }}"
      status: "active"
      source: "default"
      roles:
        - "nx-publish"
    status_code: [204]
  become: false
  no_log: true
  when:
    - _nexus_existing_publish_user.userId is defined
    - not (_nexus_publish_user_created is changed)

- name: Check if admin password needs rotation
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/security/anonymous"
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 401]
  register: _nexus_vault_auth_test
  become: false
  no_log: true

- name: Update working admin password fact if current is incorrect
  ansible.builtin.set_fact:
    artifactory_nexus_admin_password_working: "{{ artifactory_nexus_admin_password }}"
  when: _nexus_vault_auth_test.status == 200
  no_log: true

- name: Rotate Nexus admin password to vault value
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/security/users/admin/change-password"
    method: PUT
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    headers:
      Content-Type: "text/plain"
    body: "{{ artifactory_nexus_admin_password }}"
    status_code: [204]
  become: false
  no_log: true
  when: _nexus_vault_auth_test.status == 401
  register: _nexus_admin_rotated

- name: Update working admin password fact if rotated # noqa: no-handler
  ansible.builtin.set_fact:
    artifactory_nexus_admin_password_working: "{{ artifactory_nexus_admin_password }}"
  when: _nexus_admin_rotated is changed
  no_log: true

- name: Update publish user password
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/security/users/{{ artifactory_nexus_publish_user }}/change-password"
    method: PUT
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    headers:
      Content-Type: "text/plain"
    body: "{{ artifactory_nexus_publish_user_password }}"
    status_code: [204]
  become: false
  no_log: true
  when:
    - _nexus_existing_publish_user.userId is defined
    - not (_nexus_publish_user_created is changed)

- name: Verify publish user authentication
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/security/users"
    user: "{{ artifactory_nexus_publish_user }}"
    password: "{{ artifactory_nexus_publish_user_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 403
  become: false
  no_log: true

- name: Verify publish user can read repositories (REST API)
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/repositories"
    user: "{{ artifactory_nexus_publish_user }}"
    password: "{{ artifactory_nexus_publish_user_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  become: false
  no_log: true

## ── Cleanup Policies (internal API — /v1/ endpoint is Pro-only) ──

- name: Get existing cleanup policies
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/internal/cleanup-policies"
    method: GET
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _nexus_cleanup_policies
  become: false

- name: Create cleanup policies
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/internal/cleanup-policies"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "{{ item.name }}"
      format: "*"
      notes: "{{ item.notes }}"
      criteriaLastDownloaded: "{{ item.days }}"
    status_code: [200, 201]
  loop:
    - name: "proxy-cleanup"
      days: 30
      notes: "Remove cached proxy artifacts not downloaded in 30 days"
  when: _nexus_cleanup_policies.json | selectattr('name', 'equalto', item.name) | list | length == 0
  become: false
  no_log: true

## ── Assign cleanup policies to repositories ──

- name: Assign cleanup policy to Docker proxy repositories
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/repositories/docker/proxy/{{ item.name }}"
    method: PUT
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "{{ item.name }}"
      online: true
      storage:
        blobStoreName: "default"
        strictContentTypeValidation: true
      cleanup:
        policyNames:
          - "proxy-cleanup"
      proxy:
        remoteUrl: "{{ item.url }}"
        contentMaxAge: 1440
        metadataMaxAge: 1440
      negativeCache:
        enabled: true
        timeToLive: 1440
      httpClient:
        blocked: false
        autoBlock: true
        connection:
          retries: 2
          timeout: 60
      docker:
        v1Enabled: true
        forceBasicAuth: false
      dockerProxy:
        indexType: "{{ item.index_type }}"
    status_code: [200, 204]
  loop:
    - { name: "docker-hub", url: "https://registry-1.docker.io", index_type: "HUB" }
    - { name: "quay-proxy", url: "https://quay.io", index_type: "REGISTRY" }
    - { name: "ghcr-proxy", url: "https://ghcr.io", index_type: "REGISTRY" }
    - { name: "gcr-proxy", url: "https://gcr.io", index_type: "REGISTRY" }
    - { name: "cgr-proxy", url: "https://cgr.dev", index_type: "REGISTRY" }
    - { name: "nvcr-proxy", url: "https://nvcr.io", index_type: "REGISTRY" }
  become: false
  no_log: true

- name: Assign cleanup policy to docker-hosted repository
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/repositories/docker/hosted/docker-hosted"
    method: PUT
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "docker-hosted"
      online: true
      storage:
        blobStoreName: "default"
        strictContentTypeValidation: true
        writePolicy: ALLOW
      cleanup:
        policyNames:
          - "proxy-cleanup"
      docker:
        v1Enabled: false
        forceBasicAuth: true
        httpPort: 5001
    status_code: [200, 204]
  become: false
  no_log: true

- name: Assign cleanup policy to package proxy repositories
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/repositories/{{ item.format }}/proxy/{{ item.name }}"
    method: PUT
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "{{ item.name }}"
      online: true
      storage:
        blobStoreName: "default"
        strictContentTypeValidation: true
      cleanup:
        policyNames:
          - "proxy-cleanup"
      proxy:
        remoteUrl: "{{ item.url }}"
        contentMaxAge: 1440
        metadataMaxAge: 1440
      negativeCache:
        enabled: true
        timeToLive: 1440
      httpClient:
        blocked: false
        autoBlock: true
    status_code: [200, 204]
  loop:
    - { name: "pypi-proxy", format: "pypi", url: "https://pypi.org" }
    - { name: "go-proxy", format: "go", url: "https://proxy.golang.org" }
    - { name: "cargo-proxy", format: "cargo", url: "https://crates.io" }
    - { name: "npm-proxy", format: "npm", url: "https://registry.npmjs.org" }
  become: false
  no_log: true

- name: Assign cleanup policy to raw proxy repositories
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/repositories/raw/proxy/{{ item.name }}"
    method: PUT
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "{{ item.name }}"
      online: true
      storage:
        blobStoreName: "default"
        strictContentTypeValidation: false
      cleanup:
        policyNames:
          - "proxy-cleanup"
      proxy:
        remoteUrl: "{{ item.url }}"
        contentMaxAge: "{{ item.max_age | default(1440) | int }}"
        metadataMaxAge: "{{ item.meta_age | default(1440) | int }}"
      negativeCache:
        enabled: true
        timeToLive: 1440
      httpClient:
        blocked: false
        autoBlock: true
        connection:
          retries: 2
          timeout: 60
    status_code: [200, 204]
  loop:
    - { name: "github-codeload", url: "https://codeload.github.com" }
    - { name: "github-releases", url: "https://github.com" }
    - { name: "docker-downloads", url: "https://download.docker.com" }
    - { name: "nixos-releases", url: "https://releases.nixos.org" }
    - { name: "chainguard-apk", url: "https://apk.cgr.dev", meta_age: 0 }
    - { name: "nix-cache-proxy", url: "https://cache.nixos.org", max_age: -1, meta_age: -1 }
  become: false
  no_log: true

- name: Invalidate cache for proxy repositories with metadata revalidation
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/repositories/{{ item }}/invalidate-cache"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 204]
  loop:
    - chainguard-apk
  become: false
  no_log: true

## ── Scheduled Tasks ──

- name: Get existing scheduled tasks
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/tasks"
    method: GET
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _nexus_tasks
  become: false

- name: Create scheduled tasks
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/extdirect"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      action: "coreui_Task"
      method: "create"
      data:
        - id: ""
          typeId: "{{ item.type_id }}"
          enabled: true
          name: "{{ item.name }}"
          alertEmail: ""
          schedule: "advanced"
          cronExpression: "{{ item.cron }}"
          properties: "{{ item.properties | default({}) }}"
      type: "rpc"
      tid: 1
    status_code: [200]
  loop:
    - name: "Cleanup repositories"
      type_id: "repository.cleanup"
      cron: "0 0 2 * * ?"
    - name: "Docker GC"
      type_id: "repository.docker.gc"
      cron: "0 0 3 * * ?"
    - name: "Compact blob store"
      type_id: "blobstore.compact"
      cron: "0 0 4 ? * SUN"
      properties:
        blobstoreName: "default"
    - name: "Docker upload purge"
      type_id: "repository.docker.upload-purge"
      cron: "0 0 5 ? * SUN"
      properties:
        age: "24"
  when: _nexus_tasks.json['items'] | default([]) | selectattr('name', 'equalto', item.name) | list | length == 0
  become: false
  no_log: true

- name: Remove Nexus initial admin password file
  ansible.builtin.file:
    path: "{{ artifactory_nexus_data_dir }}/admin.password"
    state: absent
  become: true
  when: _nexus_admin_pw_file.stat.exists | default(false)
