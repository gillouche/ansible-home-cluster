- name: Get list of users
  ansible.builtin.uri:
    url: "http://localhost:8081/service/rest/v1/security/users"
    method: GET
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: _nexus_users
  become: false

- name: Create publish user
  ansible.builtin.uri:
    url: "http://localhost:8081/service/rest/v1/security/users"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      userId: "{{ artifactory_nexus_publish_user }}"
      firstName: "Publish"
      lastName: "User"
      emailAddress: "publish@example.com"
      password: "{{ artifactory_nexus_publish_user_password }}"
      status: "active"
      roles:
        - "nx-admin"
    status_code: [200, 201]
  when: _nexus_users.json | selectattr('userId', 'equalto', artifactory_nexus_publish_user) | list | length == 0
  become: false
