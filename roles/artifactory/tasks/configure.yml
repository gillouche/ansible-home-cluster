        strictContentTypeValidation: true
      group:
        memberNames:
          - docker-hub
          - quay-proxy
      docker:
        v1Enabled: true
        forceBasicAuth: false
        httpPort: 5000
    status_code: [200, 201]
  when: _nexus_repos.json | selectattr('name', 'equalto', 'docker-all') | list | length == 0
