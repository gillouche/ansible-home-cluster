- name: Create Docker Group repository
  ansible.builtin.uri:
    url: "{{ artifactory_nexus_url }}/service/rest/v1/repositories/docker/group"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
