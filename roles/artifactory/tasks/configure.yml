---
- name: Enable Anonymous Access
  ansible.builtin.uri:
    url: "http://localhost:{{ artifactory_nexus_port }}/service/rest/v1/security/anonymous"
    method: PUT
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      enabled: true
      userId: "anonymous"
      realmName: "NexusAuthorizingRealm"
    status_code: [200, 204]
  become: false

- name: Get current EULA status
  ansible.builtin.uri:
    url: "http://localhost:{{ artifactory_nexus_port }}/service/rest/v1/system/eula"
    method: GET
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _nexus_eula_status
  become: false

- name: Accept End User License Agreement (EULA)
  ansible.builtin.uri:
    url: "http://localhost:{{ artifactory_nexus_port }}/service/rest/v1/system/eula"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      accepted: true
    status_code: [200, 204]
  when: not _nexus_eula_status.json.accepted | bool
  failed_when: false # Ignore 500 errors related to file locks if UI says it is accepted
  become: false

- name: Get list of existing repositories
  ansible.builtin.uri:
    url: "http://localhost:{{ artifactory_nexus_port }}/service/rest/v1/repositories"
    method: GET
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: _nexus_repos
  become: false

- name: Create Docker Hub Proxy repository
  ansible.builtin.uri:
    url: "http://localhost:{{ artifactory_nexus_port }}/service/rest/v1/repositories/docker/proxy"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "docker-hub"
      online: true
      storage:
        blobStoreName: "default"
        strictContentTypeValidation: true
      proxy:
        remoteUrl: "https://registry-1.docker.io"
        contentMaxAge: 1440
        metadataMaxAge: 1440
      negativeCache:
        enabled: true
        timeToLive: 1440
      httpClient:
        blocked: false
        autoBlock: true
        connection:
          retries: 2
          timeout: 60
      docker:
        v1Enabled: true
        forceBasicAuth: false
      dockerProxy:
        indexType: "HUB"
    status_code: [200, 201]
  when: _nexus_repos.json | selectattr('name', 'equalto', 'docker-hub') | list | length == 0
  become: false

- name: Create docker-hosted repository
  ansible.builtin.uri:
    url: "http://localhost:{{ artifactory_nexus_port }}/service/rest/v1/repositories/docker/hosted"
    method: POST
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_working }}"
    force_basic_auth: true
    headers:
      Content-Type: application/json
    body_format: json
    body:
      name: docker-hosted
      online: true
      storage:
        blobStoreName: default
        strictContentTypeValidation: true
        writePolicy: ALLOW
      docker:
        v1Enabled: false
        forceBasicAuth: true
        # No httpPort - subdomain routing via reverse proxy
    status_code: [201, 409]
  when: _nexus_repos.json | selectattr('name', 'equalto', 'docker-hosted') | list | length == 0
  become: false

