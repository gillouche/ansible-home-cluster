---
- name: Ensure nexus group exists
  ansible.builtin.group:
    name: "{{ artifactory_nexus_group }}"
    gid: "{{ artifactory_nexus_gid }}"
    system: true
  become: true

- name: Ensure nexus user exists
  ansible.builtin.user:
    name: "{{ artifactory_nexus_user }}"
    uid: "{{ artifactory_nexus_uid }}"
    group: "{{ artifactory_nexus_group }}"
    home: "{{ artifactory_nexus_home }}"
    create_home: true
    shell: /sbin/nologin
    system: true
  become: true

- name: Ensure nexus data and config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ artifactory_nexus_user }}"
    group: "{{ artifactory_nexus_group }}"
    mode: '0755'
  loop:
    - "{{ artifactory_nexus_data_dir }}"
    - "{{ artifactory_nexus_data_dir }}/etc"
    - "{{ artifactory_nexus_data_dir }}/javaprefs"
    - "{{ artifactory_nexus_home }}"
  become: true

- name: Ensure nexus.properties exists in nexus home
  ansible.builtin.template:
    src: nexus.properties.j2
    dest: "{{ artifactory_nexus_home }}/nexus.properties"
    owner: "{{ artifactory_nexus_user }}"
    group: "{{ artifactory_nexus_group }}"
    mode: '0644'
  become: true

- name: Ensure nexus container is running
  containers.podman.podman_container:
    name: "{{ artifactory_nexus_container_name }}"
    image: "{{ artifactory_nexus_image }}"
    state: started
    restart_policy: unless-stopped
    user: "{{ artifactory_nexus_uid }}:{{ artifactory_nexus_gid }}"
    env:
      INSTALL4J_ADD_VM_PARAMS: "-Dnexus.wizard.enabled=false -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
    volumes:
      - "{{ artifactory_nexus_data_dir }}:/nexus-data:Z"
      - "{{ artifactory_nexus_home }}/nexus.properties:/nexus-data/etc/nexus.properties:Z"
    ports:
      - "{{ artifactory_nexus_port }}:8081"
      - "5000:5000"
  become: true

- name: Wait for Nexus to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ artifactory_nexus_port }}/service/rest/v1/status"
    status_code: 200
    validate_certs: false
  register: _nexus_status
  until: _nexus_status.status == 200
  retries: 60
  delay: 10
  become: false
  tags: [nexus_config]

- name: Handle Nexus initial admin password
  become: true
  block:
    - name: Check if admin.password file exists
      ansible.builtin.stat:
        path: "{{ artifactory_nexus_data_dir }}/admin.password"
      register: _nexus_admin_pw_file

    - name: Read initial admin password
      ansible.builtin.slurp:
        src: "{{ artifactory_nexus_data_dir }}/admin.password"
      register: _nexus_initial_pw_b64
      when: _nexus_admin_pw_file.stat.exists

    - name: Set current admin password fact
      ansible.builtin.set_fact:
        artifactory_nexus_admin_password_current: >-
          {{ (_nexus_initial_pw_b64.content | b64decode | trim)
             if (_nexus_admin_pw_file.stat.exists and (_nexus_initial_pw_b64.content | default('') | length > 0))
             else artifactory_nexus_admin_password }}
      no_log: true

- name: Try to authenticate with current password
  ansible.builtin.uri:
    url: "http://localhost:{{ artifactory_nexus_port }}/service/rest/v1/security/anonymous"
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_current }}"
    force_basic_auth: true
    status_code: [200, 401]
    validate_certs: false
  register: _nexus_auth_test
  become: false
  no_log: true

- name: Fallback to default password if 401
  ansible.builtin.set_fact:
    artifactory_nexus_admin_password_current: "{{ artifactory_nexus_admin_password_default }}"
  no_log: true
  when:
    - _nexus_auth_test.status == 401
    - artifactory_nexus_admin_password_current != artifactory_nexus_admin_password_default

- name: Try to authenticate with default password
  ansible.builtin.uri:
    url: "http://localhost:{{ artifactory_nexus_port }}/service/rest/v1/security/anonymous"
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_current }}"
    force_basic_auth: true
    status_code: [200, 401]
    validate_certs: false
  register: _nexus_auth_test_default
  become: false
  no_log: true
  when:
    - _nexus_auth_test.status == 401

- name: Fallback to vault password if still 401
  ansible.builtin.set_fact:
    artifactory_nexus_admin_password_current: "{{ artifactory_nexus_admin_password }}"
  no_log: true
  when:
    - _nexus_auth_test.status == 401
    - _nexus_auth_test_default.status | default(0) == 401
    - artifactory_nexus_admin_password_current != artifactory_nexus_admin_password

- name: Final attempt to authenticate
  ansible.builtin.uri:
    url: "http://localhost:{{ artifactory_nexus_port }}/service/rest/v1/security/anonymous"
    user: "{{ artifactory_nexus_admin_user }}"
    password: "{{ artifactory_nexus_admin_password_current }}"
    force_basic_auth: true
    status_code: 200
    validate_certs: false
  become: false
  no_log: true
  when: _nexus_auth_test.status == 401

- name: Configure Nexus repositories
  ansible.builtin.include_tasks: configure.yml
  vars:
    artifactory_nexus_admin_password_working: "{{ artifactory_nexus_admin_password_current }}"
  tags: [nexus_config]
