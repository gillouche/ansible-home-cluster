---
# tasks file for devices_os (refactored from os_setup)

- name: Ensure Ansible remote tmp exists with safe perms
  ansible.builtin.file:
    path: /tmp/.ansible-tmp
    state: directory
    mode: "1777"
    owner: root
    group: root
  become: true

- name: Set locale
  community.general.locale_gen:
    name: "en_GB.UTF-8"
    state: present
  become: true

- name: Ensure user_home_root directory exists
  ansible.builtin.file:
    path: "{{ user_home_root }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: Update hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  become: true

- name: Set timezone
  community.general.timezone:
    name: Europe/Brussels
  become: true

- name: "Create group {{ target_user }}"
  ansible.builtin.group:
    name: "{{ target_user }}"
    state: present
  become: true

- name: Disable pam_faillock account lockout
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^#?\s*deny\s*='
    line: 'deny = 0'
    create: true
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Reset any existing faillock entries for target user
  ansible.builtin.command:
    cmd: "faillock --user {{ target_user }} --reset"
  become: true
  changed_when: false
  failed_when: false

- name: Stability and Auto-Recovery Settings (RPi Only)
  become: true
  when: "'rpi' in inventory_hostname"
  block:
    - name: Configure kernel panic auto-reboot
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/90-stability.conf
        reload: true
      failed_when: false
      loop:
        - { name: 'kernel.panic', value: '10' }
        - { name: 'kernel.panic_on_oops', value: '1' }
        - { name: 'kernel.softlockup_panic', value: '1' }

    - name: Enable Systemd Hardware Watchdog
      ansible.builtin.lineinfile:
        path: /etc/systemd/system.conf
        regexp: '^#?RuntimeWatchdogSec='
        line: 'RuntimeWatchdogSec=15s'
      notify: Reload systemd (reexec)

- name: Ensure necessary kernel modules for RPi are loaded
  ansible.builtin.copy:
    dest: /etc/modules-load.d/raspberrypi.conf
    content: |
      bcm2835_wdt
      i2c-dev
    owner: root
    group: root
    mode: '0644'
  become: true
  when: "'rpi' in inventory_hostname"
