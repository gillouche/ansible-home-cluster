---
- name: Install Monit and dependencies
  pacman:
    name:
      - monit
      - networkmanager
      - openssh
    state: present
    update_cache: true
  become: true

- name: Ensure /etc/monit.d directory exists
  ansible.builtin.file:
    path: /etc/monit.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Ensure /etc/monit.d is not empty (fix include wildcard error)
  ansible.builtin.copy:
    content: "# Place custom monit config files here"
    dest: /etc/monit.d/README
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Check if NetworkManager is installed
  ansible.builtin.command: systemctl is-active NetworkManager
  register: nm_check
  failed_when: false
  changed_when: false
  become: true

- name: Disable NetworkManager management of resolv.conf
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/99-no-resolv-conf.conf
    content: |
      [main]
      rc-manager=unmanaged
    owner: root
    group: root
    mode: '0644'
  become: true
  when: nm_check.rc == 0
  notify: restart NetworkManager

- name: Ensure /etc/resolv.conf points to Pi-hole VIP
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      nameserver {{ pihole_virtual_ip | default('192.168.0.251') }}
      nameserver 1.1.1.1
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Configure Monit
  template:
    src: monitrc.j2
    dest: /etc/monitrc
    mode: '0700'
    owner: root
    group: root
  notify: restart monit
  become: true

- name: Ensure Monit service is enabled and started
  systemd:
    name: monit
    enabled: true
    state: started
  become: true
