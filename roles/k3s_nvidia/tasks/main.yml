---
- name: Ensure containerd config drop-in directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd/config.toml.d
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: true

- name: Drop legacy config.toml.tmpl override
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl
    state: absent
  become: true
  notify: Restart k3s

- name: Deploy nvidia runtime drop-in
  ansible.builtin.template:
    src: nvidia-runtime.toml.j2
    dest: /var/lib/rancher/k3s/agent/etc/containerd/config.toml.d/nvidia.toml
    mode: '0644'
    owner: root
    group: root
  become: true
  notify: Restart k3s

- name: Ensure runc symlink exists for nvidia-container-runtime
  ansible.builtin.file:
    src: /var/lib/rancher/k3s/data/current/bin/runc
    dest: /usr/bin/runc
    state: link
  become: true

- name: Configure nvidia-container-runtime ldconfig path
  ansible.builtin.lineinfile:
    path: /etc/nvidia-container-runtime/config.toml
    regexp: '^ldconfig ='
    line: 'ldconfig = "@/sbin/ldconfig"'
  become: true
  notify: Restart k3s
