---
- name: Ensure K3s manifest directory exists
  ansible.builtin.file:
    path: "{{ k3s_server_location | default('/var/lib/rancher/k3s') }}/server/manifests"
    state: directory
    mode: '0755'
  become: true

- name: Deploy Sealed Secret Private Key to K3s manifests
  ansible.builtin.template:
    src: 00-sealed-secrets-key.yaml.j2
    dest: "{{ k3s_server_location | default('/var/lib/rancher/k3s') }}/server/manifests/00-sealed-secrets-key.yaml"
    mode: '0600'
  become: true

- name: Wait for Sealed Secret Private Key to be applied
  ansible.builtin.command: >-
    k3s kubectl get secret {{ sealed_secrets_key_name }}
    -n {{ sealed_secrets_namespace }}
  register: _sealed_secret_key_check
  until: _sealed_secret_key_check.rc == 0
  retries: 12
  delay: 5
  become: true
  changed_when: false

- name: Deploy Sealed Secrets via K3s HelmChart CRD
  ansible.builtin.template:
    src: 01-sealed-secrets-helm.yaml.j2
    dest: "{{ k3s_server_location | default('/var/lib/rancher/k3s') }}/server/manifests/01-sealed-secrets-helm.yaml"
    mode: '0644'
  become: true

- name: Wait for Sealed Secrets controller deployment to exist
  ansible.builtin.command: >-
    k3s kubectl get deployment/{{ sealed_secrets_controller_name }}
    -n {{ sealed_secrets_namespace }}
  register: _sealed_secrets_deployment_check
  until: _sealed_secrets_deployment_check.rc == 0
  retries: 20
  delay: 10
  become: true
  changed_when: false

- name: Wait for Sealed Secrets controller to be ready
  ansible.builtin.command: >-
    k3s kubectl wait --for=condition=available --timeout=300s
    deployment/{{ sealed_secrets_controller_name }}
    -n {{ sealed_secrets_namespace }}
  become: true
  changed_when: false
