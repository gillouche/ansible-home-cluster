collections:
  - name: community.general
    version: "12.5.0"
  - name: ansible.posix
    version: "2.1.0"
  - name: ansible.utils
    version: "6.0.2"
  - name: containers.podman
    version: "1.19.2"
  - name: kewlfft.aur
    version: "0.13.0"
  - name: community.hashi_vault
    version: "7.1.0"
  - name: community.crypto
    version: "3.1.1"
  - name: k3s
    type: git
    source: https://github.com/k3s-io/k3s-ansible.git
    version: "1.2.0"
