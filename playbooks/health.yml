---
- name: "Gather facts for localhost"
  hosts: localhost
  gather_facts: true
  become: false
  tags:
    - health
  vars:
    ansible_connection: local
  tasks:
    - name: Set fact for Homelab Root CA path
      ansible.builtin.set_fact:
        homelab_root_ca_cert_path: "{{ vault_cluster_ca_dir_controller | default('~/.local/share/ansible-home-cluster/vault-ca') | expanduser }}/homelab-root-ca.crt"

- name: "Vault Cluster Health Check"
  hosts: vault_cluster
  gather_facts: true
  become: false
  vars:
    vault_init_export_path: "~/.local/share/ansible-home-cluster/cluster-init.json"
  pre_tasks:
    - name: Load cluster init JSON (controller)
      ansible.builtin.slurp:
        src: "{{ vault_init_export_path | expanduser }}"
      register: _cluster_init_content
      delegate_to: localhost
      run_once: true
      failed_when: false

    - name: Set vault_root_token fact
      ansible.builtin.set_fact:
        vault_root_token: "{{ (_cluster_init_content.content | b64decode | from_json).root_token }}"
      when: _cluster_init_content.content is defined
  tasks:
    - name: Query Vault health status
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:8200/v1/sys/health"
        method: GET
        status_code: [200, 429, 501, 503]
        validate_certs: true
      register: _vault_node_health
      failed_when: false

    - name: Debug Vault Cluster Node Information
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Vault Node Health: {{ inventory_hostname }} ({{ ansible_host }})"
          - "-----------------------------------------------------------"
          - "  Status: {{ 'HEALTHY (Leader)' if (_vault_node_health.status | default(0)) == 200 else
                       'HEALTHY (Follower/Standby)' if (_vault_node_health.status | default(0)) == 429 else
                       'UNINITIALIZED' if (_vault_node_health.status | default(0)) == 501 else
                       'SEALED' if (_vault_node_health.status | default(0)) == 503 else 'DOWN/ERROR' }}"
          - "  Response Code: {{ _vault_node_health.status | default('N/A') }}"
          - "  Version: {{ _vault_node_health.json.version if _vault_node_health.json is defined else 'N/A' }}"
          - "  Cluster Name: {{ _vault_node_health.json.cluster_name if _vault_node_health.json is defined else 'N/A' }}"
          - "  Is Leader: {{ 'YES' if (_vault_node_health.status | default(0)) == 200 else 'NO' }}"
          - "-----------------------------------------------------------"

    - name: Query Vault Leader PKI and ACME status
      block:
        - name: Check PKI status
          ansible.builtin.uri:
            url: "https://{{ ansible_host }}:8200/v1/pki/config/urls"
            method: GET
            headers:
              X-Vault-Token: "{{ vault_root_token | default('') }}"
            validate_certs: false
          register: _vault_pki_status
          failed_when: false
          when: vault_root_token is defined

        - name: Check PKI Intermediate status
          ansible.builtin.uri:
            url: "https://{{ ansible_host }}:8200/v1/pki_int/config/urls"
            method: GET
            headers:
              X-Vault-Token: "{{ vault_root_token | default('') }}"
            validate_certs: false
          register: _vault_pki_int_status
          failed_when: false
          when: vault_root_token is defined

        - name: Check ACME status
          ansible.builtin.uri:
            url: "https://{{ ansible_host }}:8200/v1/pki_int/config/acme"
            method: GET
            headers:
              X-Vault-Token: "{{ vault_root_token | default('') }}"
            validate_certs: false
          register: _vault_acme_status
          failed_when: false
          when: vault_root_token is defined

        - name: Debug Vault Leader Configuration
          ansible.builtin.debug:
            msg:
              - "-----------------------------------------------------------"
              - "Vault Leader Config Status ({{ inventory_hostname }})"
              - "-----------------------------------------------------------"
              - "PKI URLs: {{ _vault_pki_status.json.data if (_vault_pki_status.json is defined and _vault_pki_status.json.data is defined) else 'N/A' }}"
              - "PKI Int URLs: {{ _vault_pki_int_status.json.data if (_vault_pki_int_status.json is defined and _vault_pki_int_status.json.data is defined) else 'N/A' }}"
              - "ACME Enabled: {{ _vault_acme_status.json.data.enabled if (_vault_acme_status.json is defined and _vault_acme_status.json.data is defined) else 'N/A' }}"
              - "-----------------------------------------------------------"
      when: (_vault_node_health.status | default(0)) == 200
  tags:
    - health

- name: "TLS Health Check"
  hosts: all
  gather_facts: true
  become: false
  tasks:
    - name: Capture deployed certificate details
      ansible.builtin.command: openssl x509 -in {{ tls_dir | default('/etc/ssl/certs') }}/api.crt -noout -subject -issuer -dates
      register: _tls_inspect_details
      changed_when: false
      failed_when: false
      become: true

    - name: Capture deployed SANs
      ansible.builtin.command: openssl x509 -in {{ tls_dir | default('/etc/ssl/certs') }}/api.crt -noout -ext subjectAltName
      register: _tls_inspect_sans
      changed_when: false
      failed_when: false
      become: true

    - name: Verify certificate chain locally
      ansible.builtin.command: openssl verify -CAfile {{ tls_dir | default('/etc/ssl/certs') }}/ca-bundle.pem {{ tls_dir | default('/etc/ssl/certs') }}/api.crt
      register: _tls_inspect_chain
      changed_when: false
      failed_when: false
      become: true

    - name: Debug TLS Information
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "TLS Health Check for {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Paths:"
          - "  Intermediate CA: {{ tls_dir | default('N/A') }}/intermediate-ca.pem"
          - "  System Anchor:   {{ tls_bundle_anchor_path | default('/etc/ca-certificates/trust-source/anchors/ca-bundle.pem') }}"
          - "  Server Cert:     {{ tls_dir | default('N/A') }}/api.crt"
          - "  Server Key:      {{ tls_dir | default('N/A') }}/api.key"
          - "-----------------------------------------------------------"
          - "Deployed Certificate Info (OpenSSL):"
          - "{{ _tls_inspect_details.stdout_lines if _tls_inspect_details is defined and _tls_inspect_details.stdout_lines is defined else ['N/A'] }}"
          - "-----------------------------------------------------------"
          - "Deployed SANs (OpenSSL):"
          - "{{ _tls_inspect_sans.stdout_lines if _tls_inspect_sans is defined and _tls_inspect_sans.stdout_lines is defined else ['N/A'] }}"
          - "-----------------------------------------------------------"
          - "Chain Verification:"
          - "  Result: {{ (_tls_inspect_chain.stdout | default(_tls_inspect_chain.stderr, true) | trim) if _tls_inspect_chain is defined else 'N/A' }}"
          - "-----------------------------------------------------------"
  tags:
    - health

- name: "Pi-hole Health Check"
  hosts: dns_cluster
  gather_facts: true
  become: false
  tasks:
    - name: Verify DNS resolution via Pi-hole VIP
      ansible.builtin.command: "drill @192.168.0.251 google.com"
      register: _pihole_vip_dns_check
      failed_when: false
      changed_when: false

    - name: Verify DNS resolution via Pi-hole members
      ansible.builtin.command: "drill @{{ ansible_host }} google.com"
      register: _pihole_member_dns_check
      failed_when: false
      changed_when: false

    - name: Debug Pi-hole Cluster Information
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Pi-hole Health Information for {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "VIP (192.168.0.251) Check:"
          - "  Status: {{ 'SUCCESS' if (_pihole_vip_dns_check.rc | default(-1)) == 0 else 'FAILED' }}"
          - "  Output: {{ _pihole_vip_dns_check.stdout | default('N/A') }}"
          - "-----------------------------------------------------------"
          - "Member DNS Check ({{ ansible_host }}):"
          - "  Status: {{ 'SUCCESS' if (_pihole_member_dns_check.rc | default(-1)) == 0 else 'FAILED' }}"
          - "  Output: {{ _pihole_member_dns_check.stdout | default('N/A') }}"
          - "-----------------------------------------------------------"
  tags:
    - health

- name: "Load Balancer Health Check"
  hosts: internal_lb_cluster
  gather_facts: true
  become: false
  tasks:
    - name: Verify Vault Health via Load Balancer VIP
      ansible.builtin.uri:
        url: "https://192.168.0.253:8200/v1/sys/health"
        method: GET
        status_code: [200, 429]
        validate_certs: true
      register: _lb_vault_health_check
      failed_when: false

    - name: Debug Load Balancer Information
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Load Balancer Health Information for {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Vault Health via LB VIP (192.168.0.253):8200"
          - "  Status: {{ 'SUCCESS' if (_lb_vault_health_check.status | default(0)) in [200, 429] else 'FAILED' }}"
          - "  Response Code: {{ _lb_vault_health_check.status | default('N/A') }}"
          - "  Is Leader: {{ 'YES' if (_lb_vault_health_check.status | default(0)) == 200 else 'NO' }}"
          - "  Vault Initialized: {{ _lb_vault_health_check.json.initialized if (_lb_vault_health_check.json is defined and _lb_vault_health_check.json.initialized is defined) else 'N/A' }}"
          - "  Vault Sealed: {{ _lb_vault_health_check.json.sealed if (_lb_vault_health_check.json is defined and _lb_vault_health_check.json.sealed is defined) else 'N/A' }}"
          - "  Note: 200=Leader, 429=Standby/Follower. LB should ideally target 200."
          - "-----------------------------------------------------------"
  tags:
    - health

- name: "Reverse Proxy Health Check"
  hosts: edge_proxy_cluster
  gather_facts: true
  become: false
  tasks:
    - name: Get Caddy container logs
      ansible.builtin.command: "podman logs {{ reverse_proxy_container_name | default('edge-proxy') }}"
      register: _caddy_logs
      become: true
      failed_when: false
      changed_when: false

    - name: Check ACME certificate status in Caddy
      ansible.builtin.command: "podman exec {{ reverse_proxy_container_name | default('edge-proxy') }} find /data/caddy/certificates -name '*.crt'"
      register: _caddy_certs
      become: true
      failed_when: false
      changed_when: false

    - name: Check network reachability to Vault from Caddy container (using wget)
      ansible.builtin.shell: |
        podman exec {{ reverse_proxy_container_name | default('edge-proxy') }} \
        wget --no-check-certificate -q -O /dev/null --server-response https://192.168.0.253:8200/v1/sys/health 2>&1 | \
        grep "HTTP/" | awk '{print $2}'
      register: _caddy_vault_reachability
      become: true
      failed_when: false
      changed_when: false

    - name: Simulate ACME certificate issuance from host
      ansible.builtin.command: >
        curl -k -s -v
        -X POST
        -H "Content-Type: application/jose+json"
        https://192.168.0.253:8200/v1/pki_int/acme/new-order
        -d '{"identifiers":[{"type":"dns","value":"primary-pihole.gillouche.homelab"}]}'
      register: _acme_simulation
      become: false
      failed_when: false
      changed_when: false

    - name: Debug Reverse Proxy (Caddy) Information
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Reverse Proxy Health Information for {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Vault Reachability from Container (LB VIP 192.168.0.253):"
          - "  Status: {{ 'SUCCESS' if (_caddy_vault_reachability.stdout | trim) in ['200', '429'] else 'FAILED' }}"
          - "  HTTP Code: {{ _caddy_vault_reachability.stdout | trim if _caddy_vault_reachability.stdout is defined else 'N/A' }}"
          - "  Note: 200=Leader, 429=Standby/Follower"
          - "-----------------------------------------------------------"
          - "Caddy Certificate List (Found in /data/caddy/certificates):"
          - "{{ _caddy_certs.stdout_lines if (_caddy_certs is defined and (_caddy_certs.stdout_lines | default([])) | length > 0) else ['None found or error: ' ~ (_caddy_certs.stderr | default('N/A'))] }}"
          - "-----------------------------------------------------------"
          - "ACME Simulation (primary-pihole.gillouche.homelab):"
          - "  Status: {{ 'OK (Reachable)' if (_acme_simulation.stdout | from_json | default({})).type == 'urn:ietf:params:acme:error:malformed' else 'FAILED' }}"
          - "  Response (short): {{ _acme_simulation.stdout | truncate(200) }}"
          - "  Note: 'malformed' is EXPECTED here as we send plain JSON instead of JWS. It confirms the ACME endpoint is ACTIVE."
          - "-----------------------------------------------------------"
          - "Recent Caddy Logs (ACME/Errors):"
          - "{{ _caddy_logs.stdout_lines[-20:] if (_caddy_logs is defined and (_caddy_logs.stdout_lines | default([])) | length > 0) else [(_caddy_logs.stderr | default('N/A')) if _caddy_logs is defined else 'N/A'] }}"
          - "-----------------------------------------------------------"
  tags:
    - health
