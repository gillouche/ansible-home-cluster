---

- name: Setup all devices
  hosts: all
  gather_facts: true
  become: false

  roles:
    - role: facts
      tags: ['facts']
    - role: ntp
      tags: ['ntp']
    - role: os_setup
      tags: ['os']
    - role: utils
      tags: ['utils']
    - role: aur_helper
      tags: ['aur']
    - role: docker
      tags: ['docker']

# Pi-hole cluster setup runs only on the pihole_cluster group
# this creates the virtual IP for the DNS so it must be executed first
- name: Setup Pi-hole cluster (primary + replicas)
  hosts: pihole_cluster
  gather_facts: true
  become: false

  roles:
    - role: pihole
      tags: ['pihole']

# HashiCorp Vault cluster (3-node Raft)
- name: Setup HashiCorp Vault cluster
  hosts: vault_cluster
  gather_facts: true
  become: false

  roles:
    - role: vault
      tags: ['vault']

# Reverse proxy cluster (Caddy + keepalived VIP), must be after vault setup
- name: Setup reverse proxy cluster
  hosts: reverse_proxy_cluster
  gather_facts: true
  become: false

  roles:
    - role: reverse_proxy
      tags: ['proxy']

# ----------------------------------------------------
# Optional / never-run-by-default plays
# ----------------------------------------------------

- name: Ping all devices
  hosts: all
  gather_facts: false
  become: false

  tags: [never, ping]

  tasks:
    - name: Ping
      ansible.builtin.ping:


- name: Maintenance - Pacman refresh and upgrade
  hosts: all
  gather_facts: true
  become: false

  tags: [never, maintenance]

  tasks:
    - name: Refresh pacman database and upgrade all packages (Arch only)
      community.general.pacman:
        update_cache: true
        upgrade: true
      become: true
      when:
        - ansible_facts['distribution'] | lower == 'archlinux'

    - name: Skip maintenance on non-Arch hosts
      ansible.builtin.debug:
        msg: "Skipping pacman maintenance on non-Arch host: {{ ansible_facts['distribution'] }}"
      when:
        - ansible_facts['distribution'] | lower != 'archlinux'

- name: Update controller /etc/hosts with inventory hosts
  hosts: localhost
  gather_facts: true
  become: false
  tags: [never, bootstrap_controller_host]

  vars:
    # Optionally restrict which inventory group to include (default: all)
    controller_hosts_group: "all"
    # Controller SSH bootstrap defaults (avoid self-referential defaults)
    default_bootstrap_user: "alarm"
    default_bootstrap_pubkey: "{{ lookup('env','HOME') + '/.ssh/id_ed25519_local.pub' }}"
    # Network service name on macOS to adjust DNS for (change if your interface differs)
    controller_dns_network_service: "Wi-Fi"

  tasks:
    - name: Build hosts block content from inventory (short + FQDN)
      ansible.builtin.set_fact:
        controller_hosts_block: |
          {% for h in (groups[controller_hosts_group] | default(groups['all']) | list) %}
          {{ hostvars[h].ansible_host | default(h) }} {{ h }} {{ h }}.{{ base_domain | default('gillouche.homelab') }}
          {% endfor %}

    - name: Ensure controller /etc/hosts contains all selected inventory hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ansible-home-cluster hosts"
        create: false
        block: "{{ controller_hosts_block }}"
      become: true

    # --- Extracted from bootstrap: controller SSH known_hosts and config ---

    - name: Ensure controller ~/.ssh directory exists
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') + '/.ssh' }}"
        state: directory
        mode: "0700"

    - name: Ensure controller ~/.ssh/sockets directory exists (for ControlPath)
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') + '/.ssh/sockets' }}"
        state: directory
        mode: "0700"

    - name: Ensure SSH config for controller network defaults (192.168.0.*)
      ansible.builtin.blockinfile:
        path: "{{ lookup('env', 'HOME') + '/.ssh/config' }}"
        create: true
        mode: "0600"
        marker: "# {mark} ansible-home-cluster network 192.168.0.*"
        block: |
          Host 192.168.0.*
            # Keep the connection alive by sending a signal every 60 seconds
            ServerAliveInterval 60
            # Disconnect only after 3 failed keep-alive signals (total 180s tolerance)
            ServerAliveCountMax 3
            # If the connection fails initially, retry connection attempts
            ConnectionAttempts 5
            # (Optional) reuse existing connections to speed up subsequent sessions
            ControlMaster auto
            ControlPath ~/.ssh/sockets/%r@%h-%p
            ControlPersist 600

    - name: Ensure controller knows host keys (idempotent)
      ansible.builtin.known_hosts:
        path: "{{ lookup('env', 'HOME') + '/.ssh/known_hosts' }}"
        name: "{{ hostvars[item].ansible_host | default(item) }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -T 5 -t ed25519 ' + (hostvars[item].ansible_host | default(item))) }}"
        state: present
        hash_host: true
      loop: "{{ groups['all'] | default([]) }}"
      failed_when: false

    - name: Resolve controller bootstrap variables
      ansible.builtin.set_fact:
        bootstrap_user_resolved: "{{ bootstrap_user | default(default_bootstrap_user) }}"
        bootstrap_pubkey_resolved: "{{ bootstrap_pubkey | default(default_bootstrap_pubkey) }}"

    - name: Derive private key path from provided public key
      ansible.builtin.set_fact:
        bootstrap_privkey: "{{ bootstrap_pubkey_resolved | regex_replace('\\.pub$', '') }}"

    - name: Ensure SSH config entries on controller for all hosts
      ansible.builtin.blockinfile:
        path: "{{ lookup('env', 'HOME') + '/.ssh/config' }}"
        create: true
        mode: "0600"
        marker: "# {mark} ansible-home-cluster {{ item }}"
        block: |
          Host {{ item }} {{ hostvars[item].ansible_host | default(item) }}
            HostName {{ hostvars[item].ansible_host | default(item) }}
            User {{ bootstrap_user_resolved }}
            IdentityFile {{ bootstrap_privkey }}
            IdentitiesOnly yes
      loop: "{{ groups['all'] | default([]) }}"

    - name: Set macOS DNS server to Pi-hole VIP (networksetup)
      ansible.builtin.command: >-
        networksetup -setdnsservers {{ controller_dns_network_service | quote }} {{ pihole_virtual_ip | default('192.168.0.251') }}
      changed_when: true
      when: (ansible_facts.get('os_family', '') | lower) == 'darwin'

    - name: Flush macOS DNS caches (mDNSResponder HUP)
      ansible.builtin.command: >-
        killall -HUP mDNSResponder
      changed_when: false
      become: true
      when: (ansible_facts.get('os_family', '') | lower) == 'darwin'
