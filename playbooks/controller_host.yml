---
- name: Bootstrap controller host for SSH and network configuration
  hosts: localhost
  gather_facts: true
  become: false
  tags:
    - never
    - bootstrap_controller_host

  roles:
    - role: controller_network
    - role: controller_ssh

- name: Reset controller DNS to public resolver and flush caches (macOS)
  hosts: localhost
  gather_facts: true
  become: false
  tags:
    - never
    - controller_dns_reset

  tasks:
    - name: Set macOS DNS server to Pi-hole VIP (networksetup)
      ansible.builtin.command: >-
        networksetup -setdnsservers {{ controller_dns_network_service | quote }} 1.1.1.1
      changed_when: true
      when: (ansible_facts.get('os_family', '') | lower) == 'darwin'

    - name: Flush macOS DNS caches (mDNSResponder HUP)
      ansible.builtin.command: >-
        killall -HUP mDNSResponder
      changed_when: false
      become: true
      when: (ansible_facts.get('os_family', '') | lower) == 'darwin'
