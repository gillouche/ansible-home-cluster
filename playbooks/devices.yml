---
- name: "Gather facts for localhost and generate Homelab Root CA"
  hosts: localhost
  gather_facts: true
  become: false
  tags:
    - homelab_root_ca
    - trust
  vars:
    ansible_connection: local # Ensure this play runs locally
  tasks:
    - name: Ensure Homelab Root CA directory exists
      ansible.builtin.file:
        path: "{{ vault_cluster_ca_dir_controller | default('~/.local/share/ansible-home-cluster/vault-ca') | expanduser }}"
        state: directory
        mode: '0700'

    - name: Check if Homelab Root CA key exists
      ansible.builtin.stat:
        path: "{{ vault_cluster_ca_dir_controller | default('~/.local/share/ansible-home-cluster/vault-ca') | expanduser }}/homelab-root-ca.key"
      register: _homelab_root_ca_key_stat

    - name: Generate Homelab Root CA private key if missing
      community.crypto.openssl_privatekey:
        path: "{{ vault_cluster_ca_dir_controller | default('~/.local/share/ansible-home-cluster/vault-ca') | expanduser }}/homelab-root-ca.key"
        size: 4096
        mode: '0600'
      when: not _homelab_root_ca_key_stat.stat.exists

    - name: Check if Homelab Root certificate exists
      ansible.builtin.stat:
        path: "{{ vault_cluster_ca_dir_controller | default('~/.local/share/ansible-home-cluster/vault-ca') | expanduser }}/homelab-root-ca.crt"
      register: _homelab_root_ca_certificate_stat

    - name: Create OpenSSL config for Root CA extensions
      ansible.builtin.copy:
        dest: "{{ vault_cluster_ca_dir_controller | default('~/.local/share/ansible-home-cluster/vault-ca') | expanduser }}/root_ca.ext"
        content: |
          [req]
          distinguished_name = req_distinguished_name
          x509_extensions = v3_ca
          prompt = no

          [req_distinguished_name]
          C = BE
          ST = Brussels
          L = Brussels
          O = Homelab
          CN = Homelab Root CA

          [v3_ca]
          basicConstraints = critical, CA:TRUE, pathlen:2
          keyUsage = critical, keyCertSign, cRLSign
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid:always,issuer
      when: not _homelab_root_ca_certificate_stat.stat.exists

    - name: Generate Homelab Root CA certificate if missing
      ansible.builtin.command: >
        openssl req -new -x509
        -key "{{ vault_cluster_ca_dir_controller | default('~/.local/share/ansible-home-cluster/vault-ca') | expanduser }}/homelab-root-ca.key"
        -out "{{ vault_cluster_ca_dir_controller | default('~/.local/share/ansible-home-cluster/vault-ca') | expanduser }}/homelab-root-ca.crt"
        -days 3650
        -sha256
        -config "{{ vault_cluster_ca_dir_controller | default('~/.local/share/ansible-home-cluster/vault-ca') | expanduser }}/root_ca.ext"
      when: not _homelab_root_ca_certificate_stat.stat.exists

    - name: Set fact for Homelab Root CA path
      ansible.builtin.set_fact:
        homelab_root_ca_cert_path: "{{ vault_cluster_ca_dir_controller | default('~/.local/share/ansible-home-cluster/vault-ca') | expanduser }}/homelab-root-ca.crt"
        homelab_root_ca_key_path: "{{ vault_cluster_ca_dir_controller | default('~/.local/share/ansible-home-cluster/vault-ca') | expanduser }}/homelab-root-ca.key"

    - name: Check if Homelab Root CA is in macOS keychain
      ansible.builtin.command: security find-certificate -c "Homelab Root CA"
      register: _macos_cert_check
      failed_when: false
      changed_when: false
      when: ansible_os_family == 'Darwin'

    - name: Install Homelab Root CA into macOS login keychain
      ansible.builtin.command: >-
        security add-trusted-cert -d -r trustRoot -k /Users/{{ ansible_user_id }}/Library/Keychains/login.keychain-db
        "{{ homelab_root_ca_cert_path }}"
      when:
        - ansible_os_family == 'Darwin'
        - _macos_cert_check.rc != 0
      register: macos_trust
      failed_when: false

    - name: Ensure Firefox distribution directory exists (macOS)
      ansible.builtin.file:
        path: "~/Library/Application Support/Firefox/distribution"
        state: directory
        mode: '0755'
      when:
        - ansible_os_family == 'Darwin'
        - vault_firefox_enable_enterprise_roots | default(false) | bool

    - name: Enable Firefox Enterprise Roots via policies.json (macOS)
      ansible.builtin.copy:
        dest: "~/Library/Application Support/Firefox/distribution/policies.json"
        content: |
          {
            "policies": {
              "ImportEnterpriseRoots": true
            }
          }
        mode: '0644'
      when:
        - ansible_os_family == 'Darwin'
        - vault_firefox_enable_enterprise_roots | default(false) | bool

- name: "Setup Base System Components"
  hosts: all
  gather_facts: true
  become: false
  tags:
    - base # Keeping the base tag for this play

  roles:
    - role: facts
      tags:
        - facts
    - role: ntp
      tags:
        - ntp
    - role: devices_os
      tags:
        - os
    - role: utils
      tags:
        - utils
    - role: aur
      tags:
        - aur
        - aur_rebuild_yay
    - role: firewall
      tags:
        - firewall
    - role: containers
      tags:
        - containers

- name: "Vault Environment Initialization"
  hosts: vault_cluster
  gather_facts: true
  become: false
  tasks:
    - name: Run vault role for init stage
      import_role:
        name: vault
      vars:
        vault_stage: init
      tags:
        - vault
        - vault_init
        - trust

- name: "Distribute Homelab Root CA to All Devices"
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Copy Homelab Root CA to system anchor path
      ansible.builtin.copy:
        src: "{{ hostvars['localhost']['homelab_root_ca_cert_path'] }}"
        dest: "{{ tls_root_ca_anchor_path }}"
        owner: root
        group: root
        mode: '0644'
      notify: Refresh system trust store
      tags:
        - tls
        - root_ca_distribute
        - trust

  handlers:
    - name: Refresh system trust store
      ansible.builtin.shell: |
        (update-ca-trust || update-ca-trust extract || update-ca-certificates || true)
      changed_when: false
      failed_when: false
      become: true

- name: "Bootstrap Transit Vault on rpi5b8g1"
  hosts: vault_transit
  gather_facts: true
  become: false
  tasks:
    - name: Run vault role for transit stage
      import_role:
        name: vault
      vars:
        vault_stage: transit
        vault_enable_transit_seal: false
      tags:
        - vault
        - trust

- name: "Setup HashiCorp Vault leader"
  hosts: vault_leader
  gather_facts: true
  become: false
  pre_tasks:
    - name: Locate bootstrap transit token on controller (if present)
      ansible.builtin.stat:
        path: "{{ vault_transit_token_export_path | default('~/.local/share/ansible-home-cluster/vault-transit/transit_token.txt') | expanduser }}"
      register: _bootstrap_transit_token_file
      delegate_to: localhost
      run_once: true

    - name: Read bootstrap transit token (controller)
      ansible.builtin.slurp:
        src: "{{ vault_transit_token_export_path | default('~/.local/share/ansible-home-cluster/vault-transit/transit_token.txt') | expanduser }}"
      register: _bootstrap_transit_token
      when: _bootstrap_transit_token_file.stat.exists | default(false)
      delegate_to: localhost
      run_once: true

    - name: Compute bootstrap vault address from inventory (rpi5b8g1)
      ansible.builtin.set_fact:
        _bootstrap_vault_addr_default:
          "https://{{ hostvars['rpi5b8g1'].ansible_host |
           default('192.168.0.80') }}:{{ vault_api_port | default(8200) }}"
      run_once: true

    - name: Set Transit seal defaults for main cluster when not provided
      ansible.builtin.set_fact:
        vault_enable_transit_seal: "{{ (vault_enable_transit_seal | default(false)) or true }}"
        vault_transit_addr: "{{ (vault_transit_addr | default('')) | length > 0 and vault_transit_addr or _bootstrap_vault_addr_default }}"
        vault_transit_token: "{{ (vault_transit_token | default('')) |
         length > 0 and vault_transit_token or
          ((_bootstrap_transit_token.content | default('')) |
           ternary((_bootstrap_transit_token.content | b64decode | trim), '') ) }}"
      run_once: true
  tasks:
    - name: Run vault role for leader stage
      import_role:
        name: vault
      vars:
        vault_stage: leader
      tags:
        - vault
        - trust

- name: "Setup HashiCorp Vault followers"
  hosts: vault_followers
  gather_facts: true
  become: false
  tasks:
    - name: Run vault role for followers stage
      import_role:
        name: vault
      vars:
        vault_stage: followers
      tags:
        - vault
        - trust

- name: "Provision TLS Certificates from Vault PKI"
  hosts: all
  gather_facts: true
  become: false
  vars:
    vault_init_export_path: "~/.local/share/ansible-home-cluster/cluster-init.json"
  pre_tasks:
    - name: Load cluster init JSON (controller)
      ansible.builtin.slurp:
        src: "{{ vault_init_export_path | expanduser }}"
      register: _cluster_init_content
      delegate_to: localhost
      run_once: true
      tags:
        - always

    - name: Debug loaded content
      ansible.builtin.debug:
        var: _cluster_init_content
      run_once: true
      tags:
        - always

    - name: Set vault_root_token fact
      ansible.builtin.set_fact:
        vault_root_token: "{{ (_cluster_init_content.content | b64decode | from_json).root_token }}"
      when: _cluster_init_content.content is defined
      tags:
        - always
  roles:
    - role: tls
      tags:
        - tls
        - trust

  post_tasks:
    - name: Restart Vault to apply new certificates
      containers.podman.podman_container:
        name: vault
        state: started
        restart: true
      become: true
      when:
        - "('vault_leader' in group_names or 'vault_followers' in group_names)"
        - "_tls_cert_install_result is defined and _tls_cert_install_result.changed"
      tags:
        - tls
        - trust

    - name: Restart Caddy to apply new certificates
      containers.podman.podman_container:
        name: "{{ reverse_proxy_container_name | default('edge-proxy') }}"
        image: "{{ reverse_proxy_image | default('caddy:2.10.2') }}"
        state: started
        restart: true
      become: true
      when:
        - "'edge_proxy_cluster' in group_names"
        - "_tls_cert_install_result is defined and _tls_cert_install_result.changed"
      tags:
        - tls
        - trust

- name: "Setup Pi-hole cluster (primary + replicas)"
  hosts: dns_cluster
  gather_facts: true
  become: false
  roles:
    - role: dns
      tags:
        - dns

- name: "Setup Load Balancer"
  hosts: internal_lb_cluster
  gather_facts: true
  become: false
  roles:
    - role: internal_lb
      tags:
        - internal_lb
        - trust

- name: "Setup Reverse Proxy"
  hosts: edge_proxy_cluster
  gather_facts: true
  become: false
  roles:
    - role: edge_proxy
      tags:
        - edge_proxy
        - trust
