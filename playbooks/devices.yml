---

- name: Setup all devices
  hosts: all
  gather_facts: true
  become: false
  tags:
    - base

  # roles executed on all hosts, they shouldn't be a dependency of another role
  roles:
    - role: facts
      tags:
        - facts
    - role: ntp
      tags:
        - ntp
    - role: devices_os
      tags:
        - os
    - role: utils
      tags:
        - utils
    - role: aur
      tags:
        - aur
        - aur_rebuild_yay
    - role: firewall
      tags:
        - firewall
    - role: containers
      tags:
        - containers

# Pi-hole cluster setup runs only on the pihole_cluster group
# this creates the virtual IP for the DNS so it must be executed first
- name: Setup Pi-hole cluster (primary + replicas)
  hosts: pihole_cluster
  gather_facts: true
  become: false

  roles:
    - role: pihole
      tags:
        - pihole

# Bootstrap Transit Vault (single node on rpi5b8g1) — run before main vault cluster
- name: "Bootstrap Transit Vault on rpi5b8g1"
  hosts: vault_transit
  gather_facts: true
  become: false

  tasks:
    - name: bootstrap end-to-end (CA/TLS + Vault start + Transit)
      import_role:
        name: vault
      vars:
        vault_stage: transit
        # Bootstrap must NOT use transit seal (starts with Shamir, then creates transit)
        vault_enable_transit_seal: false
      tags:
        - vault

# HashiCorp Vault cluster (3-node Raft) — staged execution by roles/groups
- name: "Setup HashiCorp Vault leader"
  hosts: vault_leader
  gather_facts: true
  become: false

  pre_tasks:
    - name: Locate bootstrap transit token on controller (if present)
      ansible.builtin.stat:
        path: "{{ vault_transit_token_export_path | default('~/.local/share/ansible-home-cluster/vault/transit_token.txt') | expanduser }}"
      register: _bootstrap_transit_token_file
      delegate_to: localhost
      run_once: true

    - name: Read bootstrap transit token (controller)
      ansible.builtin.slurp:
        src: "{{ vault_transit_token_export_path | default('~/.local/share/ansible-home-cluster/vault/transit_token.txt') | expanduser }}"
      register: _bootstrap_transit_token
      when: _bootstrap_transit_token_file.stat.exists | default(false)
      delegate_to: localhost
      run_once: true

    - name: Compute bootstrap vault address from inventory (rpi5b8g1)
      ansible.builtin.set_fact:
        _bootstrap_vault_addr_default:
          "https://{{ hostvars['rpi5b8g1'].ansible_host |
           default('192.168.0.80') }}:{{ vault_api_port | default(8200) }}"
      run_once: true

    - name: Set Transit seal defaults for main cluster when not provided
      ansible.builtin.set_fact:
        vault_enable_transit_seal: "{{ (vault_enable_transit_seal | default(false)) or true }}"
        vault_transit_addr: "{{ (vault_transit_addr | default('')) | length > 0 and vault_transit_addr or _bootstrap_vault_addr_default }}"
        vault_transit_token: "{{ (vault_transit_token | default('')) |
         length > 0 and vault_transit_token or
          ((_bootstrap_transit_token.content | default('')) |
           ternary((_bootstrap_transit_token.content | b64decode | trim), '') ) }}"
      run_once: true

  tasks:
    - name: Vault common prep on leader
      import_role:
        name: vault
      vars:
        vault_stage: common
      tags:
        - vault

    - name: Vault leader bring-up
      import_role:
        name: vault
      vars:
        vault_stage: leader
      tags:
        - vault

- name: "Setup HashiCorp Vault followers"
  hosts: vault_followers
  gather_facts: true
  become: false

  tasks:
    - name: Vault common prep on followers
      import_role:
        name: vault
      vars:
        vault_stage: common
      tags:
        - vault

    - name: Vault followers bring-up
      import_role:
        name: vault
      vars:
        vault_stage: followers
      tags:
        - vault

# Reverse proxy cluster (Caddy + keepalived VIP), must be after vault setup
- name: Setup reverse proxy cluster
  hosts: reverse_proxy_cluster
  gather_facts: true
  become: false

  roles:
    - role: reverse_proxy
      tags:
        - proxy

- name: Ping all devices
  hosts: all
  gather_facts: false
  become: false
  tags:
    - never
    - ping

  tasks:
    - name: Ping
      ansible.builtin.ping:

- name: Maintenance - Pacman refresh and upgrade
  hosts: all
  gather_facts: true
  become: false
  tags:
    - never
    - maintenance

  roles:
    - role: maintenance
      tags:
        - maintenance

- name: Bootstrap devices (SSH + network)
  hosts: all
  gather_facts: false
  become: false
  tags:
    - never
    - bootstrap_devices

  vars:
    devices_bootstrap_user: alarm
    devices_bootstrap_pubkey: "{{ lookup('env','HOME') + '/.ssh/id_ed25519_local.pub' }}"
    # Relax host-key checking only for this bootstrap run
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

    # Ensure the connection uses the bootstrap user
    ansible_user: "{{ devices_bootstrap_user }}"

  pre_tasks:
    - name: Check if inventories/group_vars/all.vault.yml exists
      ansible.builtin.stat:
        path: inventories/group_vars/all.vault.yml
      register: _all_vault_file
      no_log: true

    - name: Load vaulted credentials from group_vars/all.vault.yml (if present)
      ansible.builtin.include_vars:
        file: inventories/group_vars/all.vault.yml
      when: _all_vault_file.stat.exists | default(false)
      no_log: true

    - name: Check if inventories/group_vars/bootstrap.vault.yml exists
      ansible.builtin.stat:
        path: inventories/group_vars/bootstrap.vault.yml
      register: _bootstrap_vault_file
      no_log: true

    - name: Load vaulted credentials from group_vars/bootstrap.vault.yml (if present)
      ansible.builtin.include_vars:
        file: inventories/group_vars/bootstrap.vault.yml
      when: _bootstrap_vault_file.stat.exists | default(false)
      no_log: true

    - name: Prompt for SSH password if not provided by vault
      ansible.builtin.pause:
        prompt: "SSH password for bootstrap user ({{ devices_bootstrap_user }})"
        echo: no
      register: bootstrap_pw
      when: ansible_password is not defined
      no_log: true

    - name: Set ansible_password from prompt
      ansible.builtin.set_fact:
        ansible_password: "{{ bootstrap_pw.user_input }}"
      when: ansible_password is not defined
      no_log: true

  roles:
    - role: devices_ssh
    - role: devices_network

## --- General purpose firewall rule reset ---

- name: Flush firewall rules existing on devices
  hosts: all
  gather_facts: false
  become: true
  tags:
    - never
    - reset_firewall

  tasks:
    # need to restart all containers afterwards because the NFT rules from podman will be missing
    - name: Flush firewall rules
      ansible.builtin.command: >-
        nft flush ruleset
      changed_when: true


## --- General purpose staggered reboot (sequential, waits for each host) ---

- name: Reboot devices sequentially (staggered)
  hosts: all
  gather_facts: false
  become: true
  serial: 1
  tags:
    - never
    - reboot

  vars:
    # Tune these if needed via -e on the CLI
    reboot_timeout: 600
    reboot_connect_timeout: 30
    reboot_post_reboot_delay: 10
    reboot_test_command: "true"

  tasks:
    - name: Reboot host and wait for it to become available
      ansible.builtin.reboot:
        msg: "Reboot triggered by ansible-home-cluster"
        reboot_timeout: "{{ reboot_timeout }}"
        connect_timeout: "{{ reboot_connect_timeout }}"
        post_reboot_delay: "{{ reboot_post_reboot_delay }}"
        test_command: "{{ reboot_test_command }}"
