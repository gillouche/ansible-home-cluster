---

- name: Setup all devices
  hosts: all
  gather_facts: true
  become: false
  tags:
    - base

  roles:
    - role: facts
      tags:
        - facts
    - role: ntp
      tags:
        - ntp
    - role: devices_os
      tags:
        - os
    - role: utils
      tags:
        - utils
    - role: aur
      tags:
        - aur
    - role: docker
      tags:
        - docker

# Pi-hole cluster setup runs only on the pihole_cluster group
# this creates the virtual IP for the DNS so it must be executed first
- name: Setup Pi-hole cluster (primary + replicas)
  hosts: pihole_cluster
  gather_facts: true
  become: false

  roles:
    - role: pihole
      tags:
        - pihole

# HashiCorp Vault cluster (3-node Raft)
- name: Setup HashiCorp Vault cluster
  hosts: vault_cluster
  gather_facts: true
  become: false

  roles:
    - role: vault
      tags:
        - vault

# Reverse proxy cluster (Caddy + keepalived VIP), must be after vault setup
- name: Setup reverse proxy cluster
  hosts: reverse_proxy_cluster
  gather_facts: true
  become: false

  roles:
    - role: reverse_proxy
      tags:
        - proxy

- name: Ping all devices
  hosts: all
  gather_facts: false
  become: false
  tags:
    - never
    - ping

  tasks:
    - name: Ping
      ansible.builtin.ping:

- name: Maintenance - Pacman refresh and upgrade
  hosts: all
  gather_facts: true
  become: false
  tags:
    - never
    - maintenance

  roles:
    - role: maintenance
      tags:
        - maintenance

- name: Bootstrap devices (SSH + network)
  hosts: all
  gather_facts: true
  become: false
  tags:
    - never
    - bootstrap_devices

  roles:
    - role: devices_ssh
    - role: devices_network
