---
- name: Bootstrap controller host for SSH and network configuration
  hosts: localhost
  gather_facts: true
  become: false
  tags:
    - never
    - bootstrap_controller_host

  pre_tasks:
    - name: Load vaulted credentials from group_vars/all/vault.yml
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventories/group_vars/all/vault.yml"
      no_log: true

  roles:
    - role: controller_network
    - role: controller_ssh
