---
# One-shot nuclear reset for Vault cluster
# This playbook purges all controller artifacts under ~/.local/share/ansible-home-cluster
# and wipes /home/vault on all hosts in the vault_cluster group. It does NOT start or configure Vault.

- name: Nuclear reset for Vault (controller + all vault nodes)
  hosts: vault_cluster
  gather_facts: true
  become: false

  vars:
    vault_container_name: "vault"
    vault_runtime_user: "vault"
    vault_runtime_group_name: "vault"

  tasks:
    # Controller cleanup (localhost)
    - name: Reset Vault cluster artifacts on controller
      ansible.builtin.file:
        path: "{{ vault_cluster_ca_dir_controller }}"
        state: absent
      delegate_to: localhost
      run_once: true

    - name: Reset Vault transit artifacts on controller
      ansible.builtin.file:
        path: "~/.local/share/ansible-home-cluster/vault-transit"
        state: absent
      delegate_to: localhost
      run_once: true

    - name: Recreate controller Vault directories after reset
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - "{{ vault_cluster_ca_dir_controller }}"
        - "~/.local/share/ansible-home-cluster/vault-transit"
      delegate_to: localhost
      run_once: true

    # Host-side cleanup
    - name: Stop and remove Vault container if present (host)
      containers.podman.podman_container:
        name: "{{ vault_container_name }}"
        state: absent
      become: true
      failed_when: false

    - name: Wipe Vault home directory on host (DANGEROUS)
      ansible.builtin.file:
        path: "/home/vault"
        state: absent
      become: true

    - name: Delete existing ca-certificates
      ansible.builtin.file:
        path: "/etc/tls"
        state: absent
      become: true
