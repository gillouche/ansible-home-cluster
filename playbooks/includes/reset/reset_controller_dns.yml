---
- name: Reset controller DNS to public resolver and flush caches (macOS)
  hosts: localhost
  gather_facts: true
  become: false

  tasks:
    - name: Set macOS DNS server to public resolvers (networksetup)
      ansible.builtin.command: >-
        networksetup -setdnsservers "Wi-Fi" 192.168.0.251 1.1.1.1
      changed_when: true
      when: (ansible_facts.get('os_family', '') | lower) == 'darwin'

    - name: Flush macOS DNS caches (dscacheutil)
      ansible.builtin.command: >-
        dscacheutil -flushcache
      changed_when: false
      when: (ansible_facts.get('os_family', '') | lower) == 'darwin'

    - name: Flush macOS DNS caches (mDNSResponder HUP)
      ansible.builtin.command: >-
        killall -HUP mDNSResponder
      changed_when: false
      failed_when: false
      when:
        - (ansible_facts.get('os_family', '') | lower) == 'darwin'
