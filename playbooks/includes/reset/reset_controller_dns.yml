---
- name: Reset controller DNS to public resolver and flush caches (macOS)
  hosts: localhost
  gather_facts: true
  become: false
  tags:
    - never
    - controller_dns_reset

  pre_tasks:
    - name: Load vaulted credentials from group_vars/all/vault.yml
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../inventories/group_vars/all/vault.yml"
      no_log: true
      failed_when: false

  tasks:
    - name: Set macOS DNS server to public resolvers (networksetup)
      ansible.builtin.command: >-
        networksetup -setdnsservers "Wi-Fi" 1.1.1.1
      changed_when: true
      when: (ansible_facts.get('os_family', '') | lower) == 'darwin'

    - name: Flush macOS DNS caches (dscacheutil)
      ansible.builtin.command: >-
        dscacheutil -flushcache
      changed_when: false
      when: (ansible_facts.get('os_family', '') | lower) == 'darwin'

    - name: Flush macOS DNS caches (mDNSResponder HUP)
      ansible.builtin.command: >-
        killall -HUP mDNSResponder
      changed_when: false
      become: true
      when:
        - (ansible_facts.get('os_family', '') | lower) == 'darwin'
      ignore_errors: true
