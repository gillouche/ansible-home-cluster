---
- name: "Podman Container Status"
  hosts: all
  gather_facts: false
  become: false
  tags: [health_base, container_status]
  tasks:
    - name: Get User Podman Containers
      ansible.builtin.command: >
        podman ps -a --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Image{{ '}}' }}"
      register: _user_podman_ps
      changed_when: false
      failed_when: false

    - name: Get Root Podman Containers
      ansible.builtin.command: >
        podman ps -a --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Image{{ '}}' }}"
      register: _root_podman_ps
      changed_when: false
      failed_when: false
      become: true

- name: "Gather facts for localhost"
  hosts: localhost
  gather_facts: true
  become: false
  tags: [health_base, health_local]
  vars:
    ansible_connection: local
  tasks:
    - name: Ensure facts are gathered # noqa: run-once
      ansible.builtin.set_fact:
        _health_facts_gathered: true
      run_once: true

    - name: Capture Controller Time
      ansible.builtin.command: date +%s
      register: _controller_time
      changed_when: false

    - name: Wait 1s for propagation buffer
      ansible.builtin.pause:
        seconds: 1

- name: "System Clock Health Check"
  hosts: all
  gather_facts: false
  tags: [health_base, health_time]
  tasks:
    - name: Check Device System Clock
      ansible.builtin.command: date +%s
      register: _device_time
      changed_when: false

    - name: Check Chrony Tracking Status
      ansible.builtin.command: chronyc tracking
      register: _chrony_tracking
      changed_when: false
      failed_when: false

    - name: Verify Clock Sync
      ansible.builtin.assert:
        that:
          - _device_time.stdout | int >= hostvars['localhost']['_controller_time'].stdout | int
        fail_msg: >-
          Clock Drift Detected! Device time ({{ _device_time.stdout }}) is behind Controller time
          ({{ hostvars['localhost']['_controller_time'].stdout }}).
        success_msg: "Clock is synchronized."

    - name: Verify Chrony is Synced
      ansible.builtin.assert:
        that:
          - "'Leap status     : Normal' in _chrony_tracking.stdout"
        fail_msg: "Chrony is not synchronized or in an unstable state!"
        success_msg: "Chrony tracking is normal."
      when: _chrony_tracking.rc == 0

- name: "TLS Health Check"
  hosts: all
  gather_facts: true
  become: false
  tags: [health_base, health_tls]
  tasks:
    - name: Check for api.crt
      ansible.builtin.stat:
        path: "{{ tls_dir }}/api.crt"
      register: _tls_cert_stat

    - name: Capture deployed certificate details
      ansible.builtin.command: openssl x509 -in {{ tls_dir }}/api.crt -noout -subject -issuer -dates
      register: _tls_inspect_details
      changed_when: false
      failed_when: false
      become: true
      when: _tls_cert_stat.stat.exists

    - name: Verify certificate chain locally
      ansible.builtin.command: >-
        openssl verify
        -CAfile {{ (inventory_hostname in (groups['vault_transit'] | default(['homeserver']))) |
        ternary(tls_dir ~ '/api.crt',
                tls_dir ~ '/ca-bundle.pem') }}
        {{ tls_dir }}/api.crt
      register: _tls_inspect_chain
      changed_when: false
      failed_when: false
      become: true
      when: _tls_cert_stat.stat.exists

- name: "Certificate Expiration Check"
  hosts: all
  gather_facts: true
  become: true
  tags: [health_base, health_certs]
  vars:
    day_seconds: 86400
  tasks:
    - name: Check Root CA Expiration
      ansible.builtin.shell: |
        set -o pipefail
        openssl x509 -enddate -noout -in /etc/tls/ca-bundle.pem | cut -d= -f2 | xargs -I{} date -d "{}" +%s
      register: _root_ca_expiry_cmd
      changed_when: false
      failed_when: false

    - name: Calculate Root CA Days Remaining
      ansible.builtin.set_fact:
        _root_ca_days_remaining: "{{ ((_root_ca_expiry_cmd.stdout | int) - (ansible_date_time.epoch | int)) // day_seconds }}"
      when: _root_ca_expiry_cmd.rc == 0

    - name: Check Wildcard Cert Expiration (Edge Proxy Only)
      ansible.builtin.shell: |
        set -o pipefail
        openssl x509 -enddate -noout -in /etc/tls/live/wildcard.pem | cut -d= -f2 | xargs -I{} date -d "{}" +%s
      register: _wildcard_cert_expiry_cmd
      changed_when: false
      failed_when: false
      when: inventory_hostname in groups['edge_proxy_cluster']

    - name: Calculate Wildcard Cert Days Remaining
      ansible.builtin.set_fact:
        _wildcard_cert_days_remaining: "{{ ((_wildcard_cert_expiry_cmd.stdout | int) - (ansible_date_time.epoch | int)) // day_seconds }}"
      when:
        - inventory_hostname in groups['edge_proxy_cluster']
        - _wildcard_cert_expiry_cmd.rc == 0

- name: "Pi-hole Health Check"
  hosts: dns_cluster
  gather_facts: true
  become: false
  tags: [health_base, health_dns]
  tasks:
    - name: Verify DNS resolution via Pi-hole VIP
      ansible.builtin.command: "dig +short @{{ pihole_virtual_ip }} google.com"
      register: _pihole_vip_dns_check
      failed_when: false
      changed_when: false
      become: true

    - name: Verify DNS resolution via Local Node
      ansible.builtin.command: "dig +short @127.0.0.1 google.com"
      register: _pihole_local_dns_check
      failed_when: false
      changed_when: false
      become: true

    - name: Debug Local DNS resolution
      ansible.builtin.debug:
        msg:
          - "RC: {{ _pihole_local_dns_check.rc }}"
          - "STDOUT: {{ _pihole_local_dns_check.stdout }}"
          - "STDERR: {{ _pihole_local_dns_check.stderr }}"
      when: _pihole_local_dns_check.rc != 0 or _pihole_local_dns_check.stdout == ""

- name: "Reverse Proxy Health Check"
  hosts: edge_proxy_cluster
  gather_facts: true
  become: false
  tags: [health_base, health_proxy]
  vars_files:
    - ../../../roles/edge_proxy/defaults/main.yml
  tasks:
    - name: Check Wildcard Certificate Presence
      ansible.builtin.stat:
        path: "/etc/tls/live/wildcard.pem"
      register: _proxy_wildcard_stat
      become: true

    - name: Check Keepalived VIP Status (Edge Proxy)
      ansible.builtin.command: ip addr show
      register: _proxy_ip_addr
      changed_when: false

    - name: Set Keepalived VIP fact
      ansible.builtin.set_fact:
        _proxy_has_vip: "{{ reverse_proxy_virtual_ip in _proxy_ip_addr.stdout }}"

    - name: Get Edge Proxy Container Logs
      ansible.builtin.command: podman logs {{ reverse_proxy_container_name }}
      register: _proxy_logs
      become: true
      changed_when: false
      failed_when: false

- name: "Nexus Artifactory Health Check"
  hosts: artifactory
  gather_facts: true
  become: false
  tags: [health_base, health_nexus]
  vars_files:
    - ../../../inventories/group_vars/artifactory/vault.yml
    - ../../../roles/artifactory/defaults/main.yml
  tasks:
    - name: Query Nexus Status
      ansible.builtin.uri:
        url: "http://localhost:{{ artifactory_nexus_port }}/service/rest/v1/status"
        method: GET
        status_code: 200
      register: _nexus_status
      failed_when: false

    - name: Query Nexus Metrics
      ansible.builtin.uri:
        url: "http://localhost:{{ artifactory_nexus_port }}/service/rest/metrics/data"
        method: GET
        user: admin
        password: "{{ artifactory_nexus_admin_password }}"
        force_basic_auth: true
        status_code: [200, 403]
      register: _nexus_metrics
      failed_when: false

- name: "Postgres Health Check"
  hosts: postgres
  gather_facts: false
  become: true
  tags: [health_base, health_postgres]
  tasks:
    - name: Check Postgres container status
      ansible.builtin.command: >-
        podman inspect {{ postgres_container_name | default('postgres') }}
        --format "{{ '{{' }}.State.Status{{ '}}' }}"
      register: _postgres_container_status
      changed_when: false
      failed_when: false

    - name: Check Postgres is accepting connections
      ansible.builtin.command: >-
        podman exec {{ postgres_container_name | default('postgres') }}
        pg_isready -U {{ postgres_superuser | default('postgres') }}
      register: _postgres_ready
      changed_when: false
      failed_when: false

    - name: List databases
      ansible.builtin.command: >-
        podman exec {{ postgres_container_name | default('postgres') }}
        psql -U {{ postgres_superuser | default('postgres') }} -tAc
        "SELECT datname, pg_size_pretty(pg_database_size(datname))
         FROM pg_database WHERE datistemplate = false;"
      register: _postgres_databases
      changed_when: false
      failed_when: false

- name: "Firefly Health Check"
  hosts: firefly
  gather_facts: true
  become: false
  tags: [health_base, health_firefly]
  vars_files:
    - ../../../roles/firefly/defaults/main.yml
  tasks:
    - name: Query Firefly Health
      ansible.builtin.uri:
        url: "http://localhost:{{ firefly_port }}/login"
        method: GET
        status_code: [200, 302]
      register: _firefly_health
      failed_when: false

- name: "External Services Health Check - Base (via Proxy)"
  hosts: localhost
  gather_facts: false
  become: false
  tags: [health_base, health_external]
  tasks:
    - name: Verify Pi-hole Primary via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -v -k -L --silent --output /dev/null --write-out "%{http_code}"
        --resolve primary.pihole.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://primary.pihole.{{ base_domain }}/admin/
      register: _external_pihole_primary_ready_cmd
      changed_when: false
      failed_when: false

    - name: Debug External Pi-hole Primary
      ansible.builtin.debug:
        msg:
          - "RC: {{ _external_pihole_primary_ready_cmd.rc }}"
          - "STDOUT: {{ _external_pihole_primary_ready_cmd.stdout }}"
          - "STDERR: {{ _external_pihole_primary_ready_cmd.stderr }}"
      when: _external_pihole_primary_ready_cmd.stdout | int != 200

    - name: Set Pi-hole Primary status fact
      ansible.builtin.set_fact:
        _external_pihole_primary_ready:
          status: "{{ _external_pihole_primary_ready_cmd.stdout | int if _external_pihole_primary_ready_cmd.stdout | length > 0 else 0 }}"

    - name: Verify Pi-hole Replica1 via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -v -k -L --silent --output /dev/null --write-out "%{http_code}"
        --resolve replica1.pihole.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://replica1.pihole.{{ base_domain }}/admin/
      register: _external_pihole_replica1_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Pi-hole Replica1 status fact
      ansible.builtin.set_fact:
        _external_pihole_replica1_ready:
          status: "{{ _external_pihole_replica1_ready_cmd.stdout | int if _external_pihole_replica1_ready_cmd.stdout | length > 0 else 0 }}"

    - name: Verify Pi-hole Replica2 via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -v -k -L --silent --output /dev/null --write-out "%{http_code}"
        --resolve replica2.pihole.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://replica2.pihole.{{ base_domain }}/admin/
      register: _external_pihole_replica2_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Pi-hole Replica2 status fact
      ansible.builtin.set_fact:
        _external_pihole_replica2_ready:
          status: "{{ _external_pihole_replica2_ready_cmd.stdout | int if _external_pihole_replica2_ready_cmd.stdout | length > 0 else 0 }}"

    - name: Verify Nexus via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -v -k -L --silent --output /dev/null --write-out "%{http_code}"
        --resolve nexus.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://nexus.{{ base_domain }}/
      register: _external_nexus_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Nexus status fact
      ansible.builtin.set_fact:
        _external_nexus_ready:
          status: "{{ _external_nexus_ready_cmd.stdout | int if _external_nexus_ready_cmd.stdout | length > 0 else 0 }}"

    - name: Verify Firefly via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -v -k -L --silent --output /dev/null --write-out "%{http_code}"
        --resolve firefly.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://firefly.{{ base_domain }}/
      register: _external_firefly_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Firefly status fact
      ansible.builtin.set_fact:
        _external_firefly_ready:
          status: "{{ _external_firefly_ready_cmd.stdout | int if _external_firefly_ready_cmd.stdout | length > 0 else 0 }}"

    - name: Verify Firefly Login via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -k --silent --output /dev/null --write-out "%{http_code}"
        --resolve firefly.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://firefly.{{ base_domain }}/login
      register: _external_firefly_login_cmd
      changed_when: false
      failed_when: false

    - name: Set Firefly login status fact
      ansible.builtin.set_fact:
        _external_firefly_login_ready:
          status: "{{ _external_firefly_login_cmd.stdout | int if _external_firefly_login_cmd.stdout | length > 0 else 0 }}"

- name: "Base Infrastructure Health Report"
  hosts: localhost
  gather_facts: false
  tags: [health_base, health_summary]
  vars_files:
    - ../../../inventories/group_vars/all/main.yml
  tasks:
    - name: Render health report # noqa: run-once no-relative-paths
      ansible.builtin.template:
        src: "../../templates/health_summary_base.j2"
        dest: /tmp/cluster-health-report-base.txt
        mode: '0644'
      run_once: true
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: Show health report # noqa: run-once
      ansible.builtin.pause:
        prompt: "{{ lookup('file', '/tmp/cluster-health-report-base.txt') }}"
      run_once: true
      delegate_to: localhost
      vars:
        ansible_connection: local

- name: "Layer 1 Checkpoint: Base Infrastructure"
  hosts: localhost
  gather_facts: false
  tags: [health_base, health_checkpoint]
  tasks:
    - name: Assert Base Infrastructure Health
      ansible.builtin.assert:
        that:
          - (groups['dns_cluster'] | map('extract', hostvars, '_pihole_vip_dns_check') |
             select('defined') | map(attribute='rc', default=-1) | select('equalto', 0) | list | length) > 0
        fail_msg: "CRITICAL: Base Infrastructure (DNS) is DOWN. Cannot proceed to K3s layer."
        success_msg: "Base Infrastructure is healthy. Proceeding to K3s Platform layer."
      # noqa: ignore-errors
      ignore_errors: >-
        {{ 'health_k3s_infra' not in ansible_run_tags and
           'health_k3s_apps' not in ansible_run_tags and
           'all' not in ansible_run_tags }}
