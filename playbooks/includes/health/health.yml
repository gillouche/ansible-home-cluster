---
- name: "Gather facts for localhost"
  hosts: localhost
  gather_facts: true
  become: false
  tags: [health, health_local]
  vars:
    ansible_connection: local
  tasks:
    - name: Ensure facts are gathered # noqa: run-once
      ansible.builtin.set_fact:
        _health_facts_gathered: true
      run_once: true

- name: "Vault Cluster Health Check"
  hosts: vault_cluster
  gather_facts: true
  become: false
  tags: [health, health_vault]
  vars_files:
    - ../../../roles/vault/defaults/main.yml
  pre_tasks:
    - name: Load cluster init JSON # noqa: run-once
      ansible.builtin.slurp:
        src: "{{ vault_init_export_path | expanduser }}"
      register: _cluster_init_content
      delegate_to: localhost
      run_once: true
      failed_when: false

    - name: Set vault_root_token fact
      ansible.builtin.set_fact:
        vault_root_token: "{{ (_cluster_init_content.content | b64decode | from_json).root_token }}"
      when: _cluster_init_content.content is defined
  tasks:
    - name: Query Vault health status (Individual Nodes)
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ vault_api_port }}/v1/sys/health"
        method: GET
        status_code: [200, 429, 501, 503]
        validate_certs: false
      register: _vault_node_health
      failed_when: false

- name: "TLS Health Check"
  hosts: all
  gather_facts: true
  become: false
  tags: [health, health_tls]
  tasks:
    - name: Check for api.crt
      ansible.builtin.stat:
        path: "{{ tls_dir }}/api.crt"
      register: _tls_cert_stat

    - name: Capture deployed certificate details
      ansible.builtin.command: openssl x509 -in {{ tls_dir }}/api.crt -noout -subject -issuer -dates
      register: _tls_inspect_details
      changed_when: false
      failed_when: false
      become: true
      when: _tls_cert_stat.stat.exists

    - name: Verify certificate chain locally
      ansible.builtin.command: >-
        openssl verify
        -CAfile {{ (inventory_hostname in (groups['vault_transit'] | default(['rpi5b8g1']))) |
        ternary(tls_dir ~ '/api.crt', tls_dir ~ '/ca-bundle.pem') }}
        {{ tls_dir }}/api.crt
      register: _tls_inspect_chain
      changed_when: false
      failed_when: false
      become: true
      when: _tls_cert_stat.stat.exists

- name: "Pi-hole Health Check"
  hosts: dns_cluster
  gather_facts: true
  become: false
  tags: [health, health_dns]
  tasks:
    - name: Verify DNS resolution via Pi-hole VIP
      ansible.builtin.command: "dig +short @{{ pihole_virtual_ip }} google.com"
      register: _pihole_vip_dns_check
      failed_when: false
      changed_when: false

    - name: Verify DNS resolution via Local Node
      ansible.builtin.command: "dig +short @127.0.0.1 google.com"
      register: _pihole_local_dns_check
      failed_when: false
      changed_when: false

- name: "Load Balancer Health Check"
  hosts: internal_lb_cluster
  gather_facts: true
  become: false
  tags: [health, health_lb]
  tasks:
    - name: Verify Vault Health via Load Balancer VIP
      ansible.builtin.uri:
        url: "https://{{ load_balancer_virtual_ip }}:{{ vault_api_port }}/v1/sys/health"
        method: GET
        status_code: [200, 429]
        validate_certs: false
      register: _lb_vault_health_check
      failed_when: false

    - name: Verify K3s API via API VIP (HAProxy)
      ansible.builtin.uri:
        url: "https://{{ k3s_api_vip }}:6443/healthz"
        method: GET
        status_code: [200, 401]
        validate_certs: false
      register: _lb_k3s_api_health_check
      failed_when: false

    - name: Verify kube-state-metrics via LB VIP (HAProxy)
      ansible.builtin.uri:
        url: "http://{{ load_balancer_virtual_ip }}/metrics"
        method: GET
        headers:
          Host: "ksm.k3s.{{ base_domain }}"
        status_code: [200]
      register: _lb_ksm_health_check
      failed_when: false

    - name: Verify Traefik via LB VIP (HAProxy)
      ansible.builtin.uri:
        url: "http://{{ load_balancer_virtual_ip }}:9000"
        method: GET
        status_code: [200, 404]
      register: _lb_traefik_health_check
      failed_when: false

- name: "Reverse Proxy Health Check"
  hosts: edge_proxy_cluster
  gather_facts: true
  become: false
  tags: [health, health_proxy]
  vars_files:
    - ../../../roles/edge_proxy/defaults/main.yml
  tasks:
    - name: Check Wildcard Certificate Presence
      ansible.builtin.stat:
        path: "{{ reverse_proxy_data_dir }}/caddy/certificates/wildcard/wildcard.crt"
      register: _proxy_wildcard_stat

    - name: Verify Backend Reachability (HAProxy) from Proxy
      ansible.builtin.uri:
        url: "https://{{ load_balancer_virtual_ip }}:{{ vault_api_port }}/v1/sys/health"
        method: GET
        validate_certs: false
      register: _proxy_backend_check
      failed_when: false

- name: "Nexus Artifactory Health Check"
  hosts: artifactory
  gather_facts: true
  become: false
  tags: [health, health_nexus]
  vars_files:
    - ../../../inventories/group_vars/artifactory/vault.yml
  tasks:
    - name: Query Nexus Status
      ansible.builtin.uri:
        url: "http://localhost:8081/service/rest/v1/status"
        method: GET
        status_code: 200
      register: _nexus_status
      failed_when: false

    - name: Query Nexus Metrics
      ansible.builtin.uri:
        url: "http://localhost:8081/service/rest/metrics/data"
        method: GET
        user: admin
        password: "{{ artifactory_nexus_admin_password }}"
        force_basic_auth: true
        status_code: [200, 403]
      register: _nexus_metrics
      failed_when: false

- name: "Prometheus Health Check"
  hosts: prometheus
  gather_facts: true
  become: false
  tags: [health, health_prometheus]
  vars_files:
    - ../../../roles/prometheus/defaults/main.yml
  tasks:
    - name: Query Prometheus Health
      ansible.builtin.uri:
        url: "http://localhost:{{ prometheus_port }}/-/healthy"
        method: GET
        status_code: 200
      register: _prometheus_health
      failed_when: false

    - name: Query Prometheus Ready
      ansible.builtin.uri:
        url: "http://localhost:{{ prometheus_port }}/-/ready"
        method: GET
        status_code: 200
      register: _prometheus_ready
      failed_when: false

- name: "Node Exporter Health Check"
  hosts: all
  gather_facts: true
  become: false
  tags: [health, health_node_exporter]
  vars_files:
    - ../../../roles/prometheus_node_exporter/defaults/main.yml
  tasks:
    - name: Query Node Exporter Metrics
      ansible.builtin.uri:
        url: "http://localhost:{{ prometheus_node_exporter_port }}/metrics"
        method: GET
        status_code: 200
      register: _node_exporter_status
      failed_when: false

- name: "Promtail Health Check"
  hosts: all
  gather_facts: true
  become: false
  tags: [health, health_promtail]
  vars_files:
    - ../../../roles/loki_promtail/defaults/main.yml
  tasks:
    - name: Query Promtail Health
      ansible.builtin.uri:
        url: "http://localhost:{{ loki_promtail_http_listen_port }}/ready"
        method: GET
        status_code: 200
      register: _promtail_ready
      failed_when: false

- name: "Loki Health Check"
  hosts: loki
  gather_facts: true
  become: false
  tags: [health, health_loki]
  vars_files:
    - ../../../roles/loki/defaults/main.yml
  tasks:
    - name: Query Loki Ready
      ansible.builtin.uri:
        url: "http://localhost:{{ loki_port }}/ready"
        method: GET
        status_code: 200
      register: _loki_ready
      failed_when: false

    - name: Query Loki Log Level
      ansible.builtin.uri:
        url: "http://localhost:{{ loki_port }}/log_level"
        method: GET
        status_code: 200
      register: _loki_log_level
      failed_when: false

    - name: Query Loki Build Info
      ansible.builtin.uri:
        url: "http://localhost:{{ loki_port }}/loki/api/v1/status/buildinfo"
        method: GET
        status_code: 200
      register: _loki_build_info
      failed_when: false

- name: "Grafana Health Check"
  hosts: grafana
  gather_facts: true
  become: false
  tags: [health, health_grafana]
  vars_files:
    - ../../../roles/grafana/defaults/main.yml
    - ../../../inventories/group_vars/grafana/vault.yml
  tasks:
    - name: Query Grafana Health (Basic)
      ansible.builtin.uri:
        url: "http://localhost:{{ grafana_port }}/api/health"
        method: GET
        status_code: 200
      register: _grafana_health
      failed_when: false

    - name: Query Grafana Datasources
      ansible.builtin.uri:
        url: "http://localhost:{{ grafana_port }}/api/datasources"
        method: GET
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: _grafana_datasources
      failed_when: false

    - name: Query Grafana Alert Rules
      ansible.builtin.uri:
        url: "http://localhost:{{ grafana_port }}/api/prometheus/grafana/api/v1/rules"
        method: GET
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: _grafana_alerts
      failed_when: false

- name: "Firefly Health Check"
  hosts: firefly
  gather_facts: true
  become: false
  tags: [health, health_firefly]
  vars_files:
    - ../../../roles/firefly/defaults/main.yml
  tasks:
    - name: Query Firefly Health
      ansible.builtin.uri:
        url: "http://localhost:{{ firefly_port }}/login"
        method: GET
        status_code: 200
      register: _firefly_health
      failed_when: false

- name: "Postgres Health Check"
  hosts: postgres
  gather_facts: true
  become: false
  tags: [health, health_postgres]
  vars_files:
    - ../../../roles/postgres/defaults/main.yml
  tasks:
    - name: Check Postgres Port
      ansible.builtin.wait_for:
        port: "{{ postgres_port }}"
        timeout: 5
      register: _postgres_port_check
      failed_when: false

    - name: Check Postgres Ready (Command)
      ansible.builtin.command: "podman exec {{ postgres_container_name }} pg_isready -U {{ postgres_db_user }}"
      register: _postgres_cmd_check
      become: true
      failed_when: false
      changed_when: false

- name: "External Services Health Check (via Proxy)"
  hosts: localhost
  gather_facts: false
  become: false
  tags: [health, health_external]
  tasks:
    - name: Verify Prometheus via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl --silent --output /dev/null --write-out "%{http_code}"
        --cacert {{ homelab_ca_bundle_path | expanduser }}
        --resolve prometheus.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://prometheus.{{ base_domain }}/-/healthy
      register: _external_prometheus_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Prometheus status fact
      ansible.builtin.set_fact:
        _external_prometheus_ready:
          status: "{{ _external_prometheus_ready_cmd.stdout | int }}"

    - name: Verify Loki via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl --silent --output /dev/null --write-out "%{http_code}"
        --cacert {{ homelab_ca_bundle_path | expanduser }}
        --resolve loki.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://loki.{{ base_domain }}/ready
      register: _external_loki_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Loki status fact
      ansible.builtin.set_fact:
        _external_loki_ready:
          status: "{{ _external_loki_ready_cmd.stdout | int }}"

    - name: Verify Grafana via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl --silent --output /dev/null --write-out "%{http_code}"
        --cacert {{ homelab_ca_bundle_path | expanduser }}
        --resolve grafana.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://grafana.{{ base_domain }}/api/health
      register: _external_grafana_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Grafana status fact
      ansible.builtin.set_fact:
        _external_grafana_ready:
          status: "{{ _external_grafana_ready_cmd.stdout | int }}"

    - name: Verify Vault via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl --silent --output /dev/null --write-out "%{http_code}"
        --cacert {{ homelab_ca_bundle_path | expanduser }}
        --resolve vault.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://vault.{{ base_domain }}/v1/sys/health
      register: _external_vault_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Vault status fact
      ansible.builtin.set_fact:
        _external_vault_ready:
          status: "{{ _external_vault_ready_cmd.stdout | int }}"

    - name: Verify Firefly via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl --silent --output /dev/null --write-out "%{http_code}"
        --cacert {{ homelab_ca_bundle_path | expanduser }}
        --resolve firefly.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://firefly.{{ base_domain }}/login
      register: _external_firefly_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Firefly status fact
      ansible.builtin.set_fact:
        _external_firefly_ready:
          status: "{{ _external_firefly_ready_cmd.stdout | int }}"

    - name: Verify Pi-hole Primary via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -L --silent --output /dev/null --write-out "%{http_code}"
        --cacert {{ homelab_ca_bundle_path | expanduser }}
        --resolve primary.pihole.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://primary.pihole.{{ base_domain }}/admin/
      register: _external_pihole_primary_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Pi-hole Primary status fact
      ansible.builtin.set_fact:
        _external_pihole_primary_ready:
          status: "{{ _external_pihole_primary_ready_cmd.stdout | int }}"

    - name: Verify Pi-hole Replica1 via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -L --silent --output /dev/null --write-out "%{http_code}"
        --cacert {{ homelab_ca_bundle_path | expanduser }}
        --resolve replica1.pihole.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://replica1.pihole.{{ base_domain }}/admin/
      register: _external_pihole_replica1_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Pi-hole Replica1 status fact
      ansible.builtin.set_fact:
        _external_pihole_replica1_ready:
          status: "{{ _external_pihole_replica1_ready_cmd.stdout | int }}"

    - name: Verify Pi-hole Replica2 via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -L --silent --output /dev/null --write-out "%{http_code}"
        --cacert {{ homelab_ca_bundle_path | expanduser }}
        --resolve replica2.pihole.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://replica2.pihole.{{ base_domain }}/admin/
      register: _external_pihole_replica2_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Pi-hole Replica2 status fact
      ansible.builtin.set_fact:
        _external_pihole_replica2_ready:
          status: "{{ _external_pihole_replica2_ready_cmd.stdout | int }}"

    - name: Verify K3s API (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl --silent --output /dev/null --write-out "%{http_code}"
        --cacert {{ homelab_ca_bundle_path | expanduser }}
        --resolve api.k3s.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://api.k3s.{{ base_domain }}/healthz
      register: _external_k3s_api_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set K3s API status fact
      ansible.builtin.set_fact:
        _external_k3s_api_ready:
          status: "{{ _external_k3s_api_ready_cmd.stdout | int }}"

    - name: Verify Longhorn UI via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl --silent --output /dev/null --write-out "%{http_code}"
        --cacert {{ homelab_ca_bundle_path | expanduser }}
        --resolve longhorn.k3s.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://longhorn.k3s.{{ base_domain }}
      register: _external_longhorn_ui_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Longhorn UI status fact
      ansible.builtin.set_fact:
        _external_longhorn_ui_ready:
          status: "{{ _external_longhorn_ui_ready_cmd.stdout | int }}"

    - name: Verify Kubernetes Dashboard via External Proxy (HTTPS) # noqa: command-instead-of-module
      ansible.builtin.command: >-
        curl -L --silent --output /dev/null --write-out "%{http_code}"
        --cacert {{ homelab_ca_bundle_path | expanduser }}
        --resolve dashboard.k3s.{{ base_domain }}:443:{{ reverse_proxy_virtual_ip }}
        https://dashboard.k3s.{{ base_domain }}
      register: _external_dashboard_ready_cmd
      changed_when: false
      failed_when: false

    - name: Set Kubernetes Dashboard status fact
      ansible.builtin.set_fact:
        _external_dashboard_ready:
          status: "{{ _external_dashboard_ready_cmd.stdout | int }}"

- name: "K3s Cluster Health Check"
  hosts: server
  gather_facts: true
  become: true
  tags: [health, health_k3s]
  vars_files:
    - ../../../inventories/group_vars/k3s_cluster/main.yml
    - ../../../inventories/group_vars/all/main.yml
  tasks:
    - name: Check K3s Service Status
      ansible.builtin.systemd:
        name: k3s
      register: _k3s_service_status
      failed_when: false

    - name: Check Node Readiness (kubectl)
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: _k3s_node_status
      changed_when: false
      failed_when: false

    - name: Check API VIP Reachability
      ansible.builtin.uri:
        url: "https://{{ k3s_api_vip }}:6443/healthz"
        validate_certs: false
        status_code: [200, 401]
      register: _k3s_vip_status
      failed_when: false

    - name: Check K3s LB VIP Reachability
      ansible.builtin.uri:
        url: "http://{{ k3s_lb_vip }}:9000"
        validate_certs: false
        status_code: [200, 404] # 404 is fine as long as we reach Traefik
      register: _k3s_lb_vip_status
      failed_when: false


- name: "Cluster Health Report"
  hosts: 127.0.0.1
  gather_facts: false
  tags: [health, health_summary]
  vars_files:
    - ../../../inventories/group_vars/all/main.yml
  tasks:
    - name: Render health report # noqa: run-once no-relative-paths
      ansible.builtin.template:
        src: "../../templates/health_summary.j2"
        dest: /tmp/cluster-health-report.txt
        mode: '0644'
      run_once: true
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: Show health report # noqa: run-once
      ansible.builtin.pause:
        prompt: "{{ lookup('file', '/tmp/cluster-health-report.txt') }}"
      run_once: true
      delegate_to: localhost
      vars:
        ansible_connection: local
