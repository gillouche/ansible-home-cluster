---
- name: "Gather facts for localhost"
  hosts: localhost
  gather_facts: true
  become: false
  tags: [health, health_local]
  vars:
    ansible_connection: local
  tasks:
    - name: Ensure facts are gathered # noqa: run-once
      ansible.builtin.debug:
        msg: "Facts gathered for {{ inventory_hostname }}"
      run_once: true

- name: "Vault Cluster Health Check"
  hosts: vault_cluster
  gather_facts: true
  become: false
  tags: [health, health_vault]
  vars_files:
    - ../../../roles/vault/defaults/main.yml
  pre_tasks:
    - name: Load cluster init JSON # noqa: run-once
      ansible.builtin.slurp:
        src: "{{ vault_init_export_path | expanduser }}"
      register: _cluster_init_content
      delegate_to: localhost
      run_once: true
      failed_when: false

    - name: Set vault_root_token fact
      ansible.builtin.set_fact:
        vault_root_token: "{{ (_cluster_init_content.content | b64decode | from_json).root_token }}"
      when: _cluster_init_content.content is defined
  tasks:
    - name: Query Vault health status (Individual Nodes)
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:{{ vault_api_port }}/v1/sys/health"
        method: GET
        status_code: [200, 429, 501, 503]
        validate_certs: false
      register: _vault_node_health
      failed_when: false

    - name: Debug Vault Cluster Node Information
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Vault Node Health: {{ inventory_hostname }} ({{ ansible_host }})"
          - "-----------------------------------------------------------"
          - "  Status: {{ 'HEALTHY (Leader)' if (_vault_node_health.status | default(0)) == 200 else
                       'HEALTHY (Follower/Standby)' if (_vault_node_health.status | default(0)) == 429 else
                       'UNINITIALIZED' if (_vault_node_health.status | default(0)) == 501 else
                       'SEALED' if (_vault_node_health.status | default(0)) == 503 else
                       'DOWN/ERROR' }}"
          - "  Response Code: {{ _vault_node_health.status | default('N/A') }}"
          - "  Version: {{ _vault_node_health.json.version if (_vault_node_health.json is defined and
                       'version' in _vault_node_health.json) else 'N/A' }}"
          - "  Is Leader: {{ 'YES' if (_vault_node_health.status | default(0)) == 200 else 'NO' }}"
          - "-----------------------------------------------------------"

- name: "TLS Health Check"
  hosts: all
  gather_facts: true
  become: false
  tags: [health, health_tls]
  tasks:
    - name: Check for api.crt
      ansible.builtin.stat:
        path: "{{ tls_dir }}/api.crt"
      register: _tls_cert_stat

    - name: Capture deployed certificate details
      ansible.builtin.command: openssl x509 -in {{ tls_dir }}/api.crt -noout -subject -issuer -dates
      register: _tls_inspect_details
      changed_when: false
      failed_when: false
      become: true
      when: _tls_cert_stat.stat.exists

    - name: Verify certificate chain locally
      ansible.builtin.command: >-
        openssl verify
        -CAfile {{ (inventory_hostname in (groups['vault_transit'] | default(['rpi5b8g1']))) |
        ternary(tls_dir ~ '/api.crt', tls_dir ~ '/ca-bundle.pem') }}
        {{ tls_dir }}/api.crt
      register: _tls_inspect_chain
      changed_when: false
      failed_when: false
      become: true
      when: _tls_cert_stat.stat.exists

    - name: Debug TLS Information
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "TLS Health Check for {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Status: {{ 'PROVISIONED' if _tls_cert_stat.stat.exists else 'MISSING' }}"
          - "Chain: {{ (_tls_inspect_chain.stdout | default(_tls_inspect_chain.stderr, true) | trim)
             if (_tls_inspect_chain is defined and 'stdout' in _tls_inspect_chain) else 'N/A' }}"
          - "Issuer: {{ (_tls_inspect_details.stdout_lines | select('match', '^issuer=') | list | first)
             if (_tls_inspect_details is defined and 'stdout_lines' in _tls_inspect_details) else 'N/A' }}"
          - "-----------------------------------------------------------"

- name: "Pi-hole Health Check"
  hosts: dns_cluster
  gather_facts: true
  become: false
  tags: [health, health_dns]
  tasks:
    - name: Verify DNS resolution via Pi-hole VIP
      ansible.builtin.command: "dig +short @{{ pihole_virtual_ip }} google.com"
      register: _pihole_vip_dns_check
      failed_when: false
      changed_when: false

    - name: Verify DNS resolution via Local Node
      ansible.builtin.command: "dig +short @127.0.0.1 google.com"
      register: _pihole_local_dns_check
      failed_when: false
      changed_when: false

    - name: Debug Pi-hole Health
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Pi-hole Health Information for {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "VIP ({{ pihole_virtual_ip }}) Resolution: {{ 'SUCCESS' if _pihole_vip_dns_check.rc == 0
             and _pihole_vip_dns_check.stdout != '' else 'FAILED' }}"
          - "Local (127.0.0.1) Resolution: {{ 'SUCCESS' if _pihole_local_dns_check.rc == 0
             and _pihole_local_dns_check.stdout != '' else 'FAILED' }}"
          - "-----------------------------------------------------------"

- name: "Load Balancer Health Check"
  hosts: internal_lb_cluster
  gather_facts: true
  become: false
  tags: [health, health_lb]
  tasks:
    - name: Verify Vault Health via Load Balancer VIP
      ansible.builtin.uri:
        url: "https://{{ load_balancer_virtual_ip }}:{{ vault_api_port }}/v1/sys/health"
        method: GET
        status_code: [200, 429]
        validate_certs: false
      register: _lb_vault_health_check
      failed_when: false

    - name: Debug Load Balancer Information
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Load Balancer Health: {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Vault via LB VIP ({{ load_balancer_virtual_ip }}):
             {{ 'UP' if (_lb_vault_health_check.status | default(0)) in [200, 429] else 'DOWN' }}"
          - "Response Code: {{ _lb_vault_health_check.status | default('N/A') }}"
          - "-----------------------------------------------------------"

- name: "Reverse Proxy Health Check"
  hosts: edge_proxy_cluster
  gather_facts: true
  become: false
  tags: [health, health_proxy]
  vars_files:
    - ../../../roles/edge_proxy/defaults/main.yml
  tasks:
    - name: Check Wildcard Certificate Presence
      ansible.builtin.stat:
        path: "{{ reverse_proxy_data_dir }}/caddy/certificates/wildcard/wildcard.crt"
      register: _proxy_wildcard_stat

    - name: Verify Backend Reachability (HAProxy) from Proxy
      ansible.builtin.uri:
        url: "https://{{ load_balancer_virtual_ip }}:{{ vault_api_port }}/v1/sys/health"
        method: GET
        validate_certs: false
      register: _proxy_backend_check
      failed_when: false

    - name: Debug Reverse Proxy Information
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Reverse Proxy Health: {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Wildcard Cert: {{ 'PRESENT' if _proxy_wildcard_stat.stat.exists else 'MISSING' }}"
          - "Backend (HAProxy VIP) reachable: {{ 'YES' if _proxy_backend_check.status is defined else 'NO' }}"
          - "-----------------------------------------------------------"

- name: "Nexus Artifactory Health Check"
  hosts: artifactory
  gather_facts: true
  become: false
  tags: [health, health_nexus]
  vars_files:
    - ../../../inventories/group_vars/artifactory/vault.yml
  tasks:
    - name: Query Nexus Status
      ansible.builtin.uri:
        url: "http://localhost:8081/service/rest/v1/status"
        method: GET
        status_code: 200
      register: _nexus_status
      failed_when: false

    - name: Query Nexus Metrics
      ansible.builtin.uri:
        url: "http://localhost:8081/service/rest/metrics/data"
        method: GET
        user: admin
        password: "{{ artifactory_nexus_admin_password }}"
        force_basic_auth: true
        status_code: [200, 403]
      register: _nexus_metrics
      failed_when: false

    - name: Debug Nexus Health
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Nexus Health Check: {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Status: {{ 'HEALTHY' if _nexus_status.status == 200
             else 'DOWN/ERROR (' ~ (_nexus_status.status | default('N/A')) ~ ')' }}"
          - "Heap Used: {{ (_nexus_metrics.json.gauges['jvm.memory.heap.used'].value / 1024 / 1024) | round(2)
             if (_nexus_metrics.status == 200 and 'jvm.memory.heap.used' in _nexus_metrics.json.gauges) else 'N/A' }} MB"
          - "Total Requests: {{ _nexus_metrics.json.timers['org.sonatype.nexus.internal.web.HeaderPatternFilter.request'].count
             if (_nexus_metrics.status == 200 and
             'org.sonatype.nexus.internal.web.HeaderPatternFilter.request' in _nexus_metrics.json.timers) else 'N/A' }}"
          - "-----------------------------------------------------------"

- name: "Prometheus Health Check"
  hosts: prometheus
  gather_facts: true
  become: false
  tags: [health, health_prometheus]
  vars_files:
    - ../../../roles/prometheus/defaults/main.yml
  tasks:
    - name: Query Prometheus Health
      ansible.builtin.uri:
        url: "http://localhost:{{ prometheus_port }}/-/healthy"
        method: GET
        status_code: 200
      register: _prometheus_health
      failed_when: false

    - name: Query Prometheus Ready
      ansible.builtin.uri:
        url: "http://localhost:{{ prometheus_port }}/-/ready"
        method: GET
        status_code: 200
      register: _prometheus_ready
      failed_when: false

    - name: Debug Prometheus Health
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Prometheus Health Check: {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Healthy: {{ 'YES' if _prometheus_health.status == 200 else 'NO (' ~ (_prometheus_health.status | default('N/A')) ~ ')' }}"
          - "Ready: {{ 'YES' if _prometheus_ready.status == 200 else 'NO (' ~ (_prometheus_ready.status | default('N/A')) ~ ')' }}"
          - "-----------------------------------------------------------"

- name: "Node Exporter Health Check"
  hosts: all
  gather_facts: true
  become: false
  tags: [health, health_node_exporter]
  vars_files:
    - ../../../roles/prometheus_node_exporter/defaults/main.yml
  tasks:
    - name: Query Node Exporter Metrics
      ansible.builtin.uri:
        url: "http://localhost:{{ prometheus_node_exporter_port }}/metrics"
        method: GET
        status_code: 200
      register: _node_exporter_status
      failed_when: false

    - name: Debug Node Exporter Health
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Node Exporter Health: {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Status: {{ 'UP' if _node_exporter_status.status == 200
             else 'DOWN (' ~ (_node_exporter_status.status | default('N/A')) ~ ')' }}"
          - "-----------------------------------------------------------"

- name: "Promtail Health Check"
  hosts: all
  gather_facts: true
  become: false
  tags: [health, health_promtail]
  vars_files:
    - ../../../roles/loki_promtail/defaults/main.yml
  tasks:
    - name: Query Promtail Health
      ansible.builtin.uri:
        url: "http://localhost:{{ loki_promtail_http_listen_port }}/ready"
        method: GET
        status_code: 200
      register: _promtail_ready
      failed_when: false

    - name: Debug Promtail Health
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Promtail Health: {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Ready: {{ 'YES' if _promtail_ready.status == 200
             else 'NO (' ~ (_promtail_ready.status | default('N/A')) ~ ')' }}"
          - "-----------------------------------------------------------"

- name: "Loki Health Check"
  hosts: loki
  gather_facts: true
  become: false
  tags: [health, health_loki]
  vars_files:
    - ../../../roles/loki/defaults/main.yml
  tasks:
    - name: Query Loki Ready
      ansible.builtin.uri:
        url: "http://localhost:{{ loki_port }}/ready"
        method: GET
        status_code: 200
      register: _loki_ready
      failed_when: false

    - name: Query Loki Log Level
      ansible.builtin.uri:
        url: "http://localhost:{{ loki_port }}/log_level"
        method: GET
        status_code: 200
      register: _loki_log_level
      failed_when: false

    - name: Query Loki Build Info
      ansible.builtin.uri:
        url: "http://localhost:{{ loki_port }}/loki/api/v1/status/buildinfo"
        method: GET
        status_code: 200
      register: _loki_build_info
      failed_when: false

    - name: Debug Loki Health
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Loki Health Check: {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Ready:      {{ 'YES' if _loki_ready.status == 200 else 'NO (' ~ (_loki_ready.status | default('N/A')) ~ ')' }}"
          - "Log Level:  {{ (_loki_log_level.json.message | default('N/A'))
             if (_loki_log_level.json is defined and 'message' in _loki_log_level.json)
             else (_loki_log_level.content | default('N/A') | trim)
             if _loki_log_level.status == 200 else 'ERROR (' ~ (_loki_log_level.status | default('N/A')) ~ ')' }}"
          - "Version:    {{ _loki_build_info.json.version if (_loki_build_info.json is defined
             and 'version' in _loki_build_info.json) else 'N/A' }}"
          - "Revision:   {{ _loki_build_info.json.revision if (_loki_build_info.json is defined
             and 'revision' in _loki_build_info.json) else 'N/A' }}"
          - "-----------------------------------------------------------"

- name: "Grafana Health Check"
  hosts: grafana
  gather_facts: true
  become: false
  tags: [health, health_grafana]
  vars_files:
    - ../../../roles/grafana/defaults/main.yml
    - ../../../inventories/group_vars/grafana/vault.yml
  tasks:
    - name: Query Grafana Health (Basic)
      ansible.builtin.uri:
        url: "http://localhost:{{ grafana_port }}/api/health"
        method: GET
        status_code: 200
      register: _grafana_health
      failed_when: false

    - name: Query Grafana Datasources
      ansible.builtin.uri:
        url: "http://localhost:{{ grafana_port }}/api/datasources"
        method: GET
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: _grafana_datasources
      failed_when: false

    - name: Query Grafana Alert Rules
      ansible.builtin.uri:
        url: "http://localhost:{{ grafana_port }}/api/prometheus/grafana/api/v1/rules"
        method: GET
        user: "{{ grafana_admin_user }}"
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
      register: _grafana_alerts
      failed_when: false

    - name: Debug Grafana Health
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Grafana Health Check: {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Status (DB): {{ _grafana_health.json.database if (_grafana_health.json is defined
             and 'database' in _grafana_health.json) else 'DOWN/ERROR' }}"
          - "Version:     {{ _grafana_health.json.version if (_grafana_health.json is defined
             and 'version' in _grafana_health.json) else 'N/A' }}"
          - "Datasources: {{ _grafana_datasources.json | map(attribute='name') | list | join(', ')
             if _grafana_datasources.status == 200 else 'N/A' }}"
          - "Alert Rules: {{ _grafana_alerts.json.data.groups | length if (_grafana_alerts.status == 200
             and 'data' in _grafana_alerts.json) else 'N/A' }} groups provisioned"
          - "Firing Alerts: {{ _grafana_alerts.json.data.groups | map(attribute='rules') | flatten
             | selectattr('state', 'equalto', 'firing') | list | length if (_grafana_alerts.status == 200
             and 'data' in _grafana_alerts.json) else 'N/A' }}"
          - "-----------------------------------------------------------"

- name: "Firefly Health Check"
  hosts: firefly
  gather_facts: true
  become: false
  tags: [health, health_firefly]
  vars_files:
    - ../../../roles/firefly/defaults/main.yml
  tasks:
    - name: Query Firefly Health
      ansible.builtin.uri:
        url: "http://localhost:{{ firefly_port }}/login"
        method: GET
        status_code: 200
      register: _firefly_health
      failed_when: false

    - name: Debug Firefly Health
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Firefly Health Check: {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Status: {{ 'UP' if _firefly_health.status == 200 else 'DOWN (' ~ (_firefly_health.status | default('N/A')) ~ ')' }}"
          - "-----------------------------------------------------------"

- name: "Postgres Health Check"
  hosts: postgres
  gather_facts: true
  become: false
  tags: [health, health_postgres]
  vars_files:
    - ../../../roles/postgres/defaults/main.yml
  tasks:
    - name: Check Postgres Port
      ansible.builtin.wait_for:
        port: "{{ postgres_port }}"
        timeout: 5
      register: _postgres_port_check
      failed_when: false

    - name: Check Postgres Ready (Command)
      ansible.builtin.command: "podman exec {{ postgres_container_name }} pg_isready -U {{ postgres_db_user }}"
      register: _postgres_cmd_check
      become: true
      failed_when: false
      changed_when: false

    - name: Debug Postgres Health
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "Postgres Health Check: {{ inventory_hostname }}"
          - "-----------------------------------------------------------"
          - "Port {{ postgres_port }}: {{ 'OPEN' if _postgres_port_check.state is defined and _postgres_port_check.state == 'started' else 'CLOSED' }}"
          - "Status: {{ 'READY' if _postgres_cmd_check.rc == 0 else 'NOT READY' }}"
          - "Output: {{ _postgres_cmd_check.stdout | default(_postgres_cmd_check.stderr) }}"
          - "-----------------------------------------------------------"

- name: "External Services Health Check (via Proxy)"
  hosts: localhost
  gather_facts: false
  become: false
  tags: [health, health_external]
  tasks:
    - name: Verify Prometheus via External Proxy (HTTPS)
      ansible.builtin.uri:
        ca_path: "{{ homelab_ca_bundle_path | expanduser }}"
        status_code: 200
      register: _external_prometheus_ready
      failed_when: false

    - name: Verify Loki via External Proxy (HTTPS)
      ansible.builtin.uri:
        url: "https://loki.{{ base_domain }}/ready"
        method: GET
        ca_path: "{{ homelab_ca_bundle_path | expanduser }}"
        status_code: 200
      register: _external_loki_ready
      failed_when: false

    - name: Verify Grafana via External Proxy (HTTPS)
      ansible.builtin.uri:
        url: >-
          https://grafana.{{ base_domain }}/api/health
        method: GET
        ca_path: "{{ homelab_ca_bundle_path | expanduser }}"
        status_code: 200
      register: _external_grafana_ready
      failed_when: false

    - name: Debug External Services Health
      ansible.builtin.debug:
        msg:
          - "-----------------------------------------------------------"
          - "External Proxy Health Check"
          - "-----------------------------------------------------------"
          - "Prometheus (HTTPS): {{ 'UP' if _external_prometheus_ready.status == 200
             else 'DOWN (' ~ (_external_prometheus_ready.status | default('N/A')) ~ ')' }}"
          - "Loki (HTTPS):       {{ 'UP' if _external_loki_ready.status == 200
             else 'DOWN (' ~ (_external_loki_ready.status | default('N/A')) ~ ')' }}"
          - "Grafana (HTTPS):    {{ 'UP' if _external_grafana_ready.status == 200
             else 'DOWN (' ~ (_external_grafana_ready.status | default('N/A')) ~ ')' }}"
          - "-----------------------------------------------------------"

- name: "Cluster Summary"
  hosts: localhost
  gather_facts: false
  tags: [health, health_summary]
  tasks:
    - name: Print Critical Endpoints Summary
      ansible.builtin.debug:
        msg:
          - "==========================================================="
          - "           HOMELAB CLUSTER ENDPOINTS SUMMARY               "
          - "==========================================================="
          - "Vault API (VIP):      https://{{ load_balancer_virtual_ip }}:{{ vault_api_port }}"
          - "Pi-hole DNS (VIP):    {{ pihole_virtual_ip }}"
          - "Pi-hole Web (Proxy):  https://pihole.{{ base_domain }}"
          - "Nexus UI (Proxy):     https://nexus.{{ base_domain }}"
          - "Prometheus UI (Proxy): https://prometheus.{{ base_domain }}"
          - "Loki API (Proxy):     https://loki.{{ base_domain }}"
          - "Grafana UI (Proxy):   https://grafana.{{ base_domain }}"
          - "Edge Proxy VIP:       {{ reverse_proxy_virtual_ip }}"
          - "Vault Leader:         https://{{ hostvars[groups['vault_leader'][0]].ansible_host }}:{{ vault_api_port }}"
          - "==========================================================="
