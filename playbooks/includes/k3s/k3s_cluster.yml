---
- name: Cluster prep
  hosts: k3s_cluster
  gather_facts: true
  become: true
  tags: [k3s, k3s_cluster, k3s_prep]
  roles:
    - role: k3s.orchestration.prereq
      tags: [k3s, k3s_cluster, k3s_prep]
    - role: k3s.orchestration.raspberrypi
      tags: [k3s, k3s_cluster, k3s_prep]

  tasks:
    - name: Ensure required kernel modules are loaded
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter
        - vxlan
      tags: [k3s, k3s_cluster, k3s_prep]

    - name: Persist kernel modules on boot
      ansible.builtin.copy:
        content: |
          overlay
          br_netfilter
          vxlan
        dest: /etc/modules-load.d/k3s.conf
        mode: '0644'
      tags: [k3s, k3s_cluster, k3s_prep]

- name: Setup K3S server
  hosts: server
  become: true
  gather_facts: true
  tags: [k3s, k3s_cluster, k3s_server]
  pre_tasks:
    - name: Verify Postgres datastore is reachable
      ansible.builtin.command: >-
        podman exec {{ postgres_container_name | default('postgres') }}
        pg_isready -U {{ postgres_superuser | default('postgres') }}
      delegate_to: "{{ groups['postgres'][0] }}"
      register: _pg_check
      retries: 10
      delay: 3
      until: _pg_check.rc == 0
      changed_when: false
      run_once: true  # noqa: run-once[task]

    - name: Ensure k3s is stopped before setup
      ansible.builtin.systemd:
        name: k3s
        state: stopped
      failed_when: false

    - name: Kill stale containerd-shim processes
      ansible.builtin.command: killall -9 containerd-shim containerd-shim-runc-v2
      failed_when: false
      changed_when: false

    - name: Remove old etcd data and symlinks
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          rm -rf /var/lib/rancher/k3s/server/db/etcd
          rm -rf /mnt/ssd_nvme/etcd
          rm -rf /mnt/ssd_sata/etcd
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Ensure systemd preset directory exists
      ansible.builtin.file:
        path: /etc/systemd/system-presets
        state: directory
        mode: '0755'

    - name: Ensure systemd preset prevents k3s from auto-starting on boot
      ansible.builtin.copy:
        content: |
          disable k3s.service
        dest: /etc/systemd/system-presets/90-k3s.preset
        mode: '0644'

    - name: Ensure /run/flannel is recreated on every boot
      ansible.builtin.copy:
        content: |
          d /run/flannel 0755 root root -
        dest: /etc/tmpfiles.d/flannel.conf
        mode: '0644'

    - name: Ensure persistent flannel config directory exists
      ansible.builtin.file:
        path: /etc/flannel
        state: directory
        mode: '0755'

    - name: Deploy flannel subnet.env restore service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Restore flannel subnet.env from persistent storage
          Before=k3s.service
          After=systemd-tmpfiles-setup.service
          ConditionPathExists=/etc/flannel/subnet.env

          [Service]
          Type=oneshot
          ExecStartPre=/bin/mkdir -p /run/flannel
          ExecStart=/bin/cp /etc/flannel/subnet.env /run/flannel/subnet.env
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/k3s-flannel-restore.service
        mode: '0644'
      notify: reload systemd and enable flannel restore

    - name: Set token fact from k3s_cluster_token
      ansible.builtin.set_fact:
        token: "{{ k3s_cluster_token }}"
      when: k3s_cluster_token is defined
      tags: [k3s, k3s_cluster, k3s_server]
  roles:
    - role: k3s.orchestration.k3s_server
      tags: [k3s, k3s_cluster, k3s_server]
    - role: k3s_nvidia
      when:
        - k3s_node_labels['accelerator.nvidia.com/gpu.present'] | default('false') | bool
      tags: [k3s, k3s_cluster, k3s_server, k3s_nvidia]
  handlers:
    - name: Reload systemd and enable flannel restore
      ansible.builtin.systemd:
        name: k3s-flannel-restore
        enabled: true
        daemon_reload: true

  post_tasks:
    - name: Ensure k3s service is started but not enabled on boot
      ansible.builtin.systemd:
        name: k3s
        enabled: false
        state: started
        daemon_reload: true
      tags: [k3s, k3s_cluster, k3s_server]

    - name: Wait for flannel subnet.env to be created by k3s
      ansible.builtin.wait_for:
        path: /run/flannel/subnet.env
        timeout: 120
      tags: [k3s, k3s_cluster, k3s_server]

    - name: Save flannel subnet.env to persistent storage
      ansible.builtin.copy:
        src: /run/flannel/subnet.env
        dest: /etc/flannel/subnet.env
        remote_src: true
        mode: '0644'
      tags: [k3s, k3s_cluster, k3s_server]

    - name: Ensure k3s-flannel-restore service is enabled
      ansible.builtin.systemd:
        name: k3s-flannel-restore
        enabled: true
        daemon_reload: true
      tags: [k3s, k3s_cluster, k3s_server]

    - name: Wait for K3s API to be ready
      ansible.builtin.command: k3s kubectl get nodes
      register: _api_check
      retries: 30
      delay: 5
      until: _api_check.rc == 0
      changed_when: false
      tags: [k3s, k3s_cluster, k3s_server]

    - name: Uncordon this node
      ansible.builtin.command: >-
        k3s kubectl uncordon {{ inventory_hostname }}
      changed_when: true
      failed_when: false
      tags: [k3s, k3s_cluster, k3s_server]

- name: Take ownership of CoreDNS from k3s (managed by ArgoCD)
  hosts: server
  become: true
  gather_facts: false
  tags: [k3s, k3s_cluster, k3s_coredns]
  tasks:
    - name: Remove k3s CoreDNS manifest to prevent k3s from managing it
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/manifests/coredns.yaml
        state: absent

- name: Bootstrap CoreDNS HA (managed by ArgoCD)
  hosts: server[0]
  become: true
  gather_facts: false
  tags: [k3s, k3s_cluster, k3s_coredns]
  vars:
    coredns_bootstrap_dir: /tmp/coredns-bootstrap
    gitops_branch: main
    coredns_manifests:
      - resources/networking/coredns-rbac.yaml
      - resources/networking/coredns-service.yaml
      - resources/networking/coredns-config.yaml
      - resources/networking/coredns-custom.yaml
      - resources/networking/coredns-ha.yaml
      - resources/networking/pdb-coredns.yaml
  tasks:
    - name: Wait for k3s API to be ready
      ansible.builtin.command: k3s kubectl get nodes
      register: _k3s_api_check
      retries: 30
      delay: 5
      until: _k3s_api_check.rc == 0
      changed_when: false

    - name: Check if CoreDNS is already running
      ansible.builtin.command: >
        k3s kubectl get deployment coredns -n kube-system
        -o jsonpath='{.status.availableReplicas}'
      register: _coredns_available
      failed_when: false
      changed_when: false

    - name: Create bootstrap directory
      ansible.builtin.file:
        path: "{{ coredns_bootstrap_dir }}"
        state: directory
        mode: '0755'
      when: _coredns_available.stdout | default('0') | int == 0

    - name: Fetch CoreDNS manifests from GitOps repo
      ansible.builtin.uri:
        url: "https://raw.githubusercontent.com/gillouche/home-cluster-gitops/{{ gitops_branch }}/{{ item }}"
        dest: "{{ coredns_bootstrap_dir }}/{{ item | basename }}"
        mode: '0644'
      loop: "{{ coredns_manifests }}"
      when: _coredns_available.stdout | default('0') | int == 0

    - name: Apply CoreDNS manifests
      ansible.builtin.command: k3s kubectl apply -f {{ coredns_bootstrap_dir }}/
      when: _coredns_available.stdout | default('0') | int == 0
      changed_when: true

    - name: Wait for CoreDNS to be ready
      ansible.builtin.command: >
        k3s kubectl rollout status deployment/coredns -n kube-system --timeout=120s
      changed_when: false
      when: _coredns_available.stdout | default('0') | int == 0

    - name: Clean up bootstrap manifests
      ansible.builtin.file:
        path: "{{ coredns_bootstrap_dir }}"
        state: absent

- name: Fetch K3s Token
  hosts: server
  become: true
  gather_facts: false
  tags: [k3s, k3s_cluster, k3s_agent]
  tasks:
    - name: Check for node-token
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/node-token
      register: _node_token_stat
      tags: [k3s, k3s_cluster, k3s_agent]

    - name: Read node-token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: _node_token_content
      when: _node_token_stat.stat.exists
      tags: [k3s, k3s_cluster, k3s_agent]

    - name: Set token fact
      ansible.builtin.set_fact:
        token: "{{ _node_token_content.content | b64decode | trim }}"
      when: _node_token_stat.stat.exists
      tags: [k3s, k3s_cluster, k3s_agent]

- name: Setup K3S agent
  hosts: agent
  become: true
  tags: [k3s, k3s_cluster, k3s_agent]
  pre_tasks:
    - name: Ensure systemd preset directory exists
      ansible.builtin.file:
        path: /etc/systemd/system-presets
        state: directory
        mode: '0755'

    - name: Ensure systemd preset allows k3s-agent to be enabled on boot
      ansible.builtin.copy:
        content: |
          enable k3s-agent.service
        dest: /etc/systemd/system-presets/90-k3s.preset
        mode: '0644'

    - name: Ensure systemd is reloaded before agent setup
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Set token fact from server
      ansible.builtin.set_fact:
        token: "{{ hostvars[groups['server'][0]].token }}"
      tags: [k3s, k3s_cluster, k3s_agent]
  roles:
    - role: k3s.orchestration.k3s_agent
      tags: [k3s, k3s_cluster, k3s_agent]
  post_tasks:
    - name: Ensure k3s-agent service is enabled and started
      ansible.builtin.systemd:
        name: k3s-agent
        enabled: true
        state: started
        daemon_reload: true
      tags: [k3s, k3s_cluster, k3s_agent]

    - name: Uncordon this agent node
      ansible.builtin.command: >-
        k3s kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ groups['server'][0] }}"
      become: true
      changed_when: true
      failed_when: false
      tags: [k3s, k3s_cluster, k3s_agent]

- name: Label K3s nodes
  hosts: server[0]
  become: true
  tags: [k3s, k3s_cluster, k3s_labels]
  pre_tasks:
    - name: Remove blocking admission webhooks to prevent API errors
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop:
        - validatingwebhookconfiguration longhorn-webhook-validator
        - mutatingwebhookconfiguration longhorn-webhook-mutator
        - validatingwebhookconfiguration gatekeeper-validating-webhook-configuration
        - mutatingwebhookconfiguration gatekeeper-mutating-webhook-configuration
      changed_when: false
      failed_when: false
  roles:
    - role: k3s_labels
      tags: [k3s, k3s_cluster, k3s_labels]

- name: Setup Longhorn OS Dependencies
  hosts: server
  gather_facts: true
  become: true
  tags: [k3s, k3s_cluster, k3s_longhorn]
  roles:
    - role: k3s_longhorn
      tags: [k3s, k3s_cluster, longhorn]

- name: Deploy K3s Health Check
  hosts: k3s_cluster
  gather_facts: true
  become: true
  tags: [k3s, k3s_cluster, k3s_health]
  roles:
    - role: k3s_health
      tags: [k3s, k3s_cluster, k3s_health]

- name: Fetch K3s Kubeconfig
  hosts: server[0]
  become: true
  gather_facts: false
  tags: [k3s, k3s_cluster, k3s_kubeconfig]
  tasks:
    - name: Slurp k3s.yaml
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: _k3s_yaml_content

- name: Configure Local Kubeconfig
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [k3s, k3s_cluster, k3s_kubeconfig]
  vars:
    # URL for external access (Direct to API VIP to support client-cert auth)
    k3s_external_url: "https://{{ hostvars[groups['server'][0]]['k3s_api_vip'] }}:6443"
  tasks:
    - name: Ensure ~/.kube directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: '0700'

    - name: Check for existing config
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
      register: _kube_config_stat

    - name: Backup existing config
      ansible.builtin.copy:
        src: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
        dest: "{{ ansible_env.HOME }}/.kube/k3s.yaml.bak.{{ ansible_date_time.iso8601_basic_short | default('now') }}"
        mode: '0600'
      when: _kube_config_stat.stat.exists

    - name: Write new kubeconfig
      ansible.builtin.copy:
        content: "{{ hostvars[groups['server'][0]]['_k3s_yaml_content'].content | b64decode }}"
        dest: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
        mode: '0600'

    - name: Update server URL in kubeconfig
      ansible.builtin.replace:
        path: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
        regexp: 'server: https://127.0.0.1:6443'
        replace: "server: {{ k3s_external_url }}"

    - name: Rename context to k3s
      ansible.builtin.shell: |
        set -o pipefail
        if kubectl config get-contexts default --kubeconfig={{ ansible_env.HOME }}/.kube/k3s.yaml >/dev/null 2>&1; then
          kubectl config rename-context default k3s --kubeconfig={{ ansible_env.HOME }}/.kube/k3s.yaml
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Merge k3s context into main kubeconfig
      ansible.builtin.shell: |
        set -euo pipefail
        MAIN="{{ ansible_env.HOME }}/.kube/config"
        K3S="{{ ansible_env.HOME }}/.kube/k3s.yaml"
        if [ -f "$MAIN" ]; then
          KUBECONFIG="$MAIN:$K3S" kubectl config view --flatten > "$MAIN.merged"
          chmod 600 "$MAIN.merged"
          mv "$MAIN.merged" "$MAIN"
        else
          cp "$K3S" "$MAIN"
          chmod 600 "$MAIN"
        fi
      args:
        executable: /bin/bash
      changed_when: true

    - name: Show success message
      ansible.builtin.debug:
        msg: >-
          Kubeconfig merged into {{ ansible_env.HOME }}/.kube/config (context: k3s).
          Switch with: kubectl config use-context k3s
