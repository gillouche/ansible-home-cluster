---
- name: "Health gate - pre-action: delete blocking webhooks"
  when: >-
    'delete_blocking_webhooks' in (pre_actions | default([]))
    or 'delete_longhorn_webhooks' in (pre_actions | default([]))
    or 'delete_gatekeeper_webhooks' in (pre_actions | default([]))
  block:
    - name: "Delete all blocking webhook configurations"
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop: "{{ k3s_blocking_webhooks }}"
      register: _del_webhooks
      changed_when: "'deleted' in (_del_webhooks.stdout | default(''))"
      retries: 3
      delay: 10
      until: _del_webhooks.rc == 0

- name: "Health gate - pre-action: cnpg cleanup stale"
  when: "'cnpg_cleanup_stale' in (pre_actions | default([]))"
  block:
    - name: "Clean stale CNPG instance pods"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl delete pods -n database -l cnpg.io/cluster --field-selector=status.phase=Failed --ignore-not-found
        executable: /bin/bash
      failed_when: false
      register: _cnpg_del_pods
      changed_when: "'deleted' in (_cnpg_del_pods.stdout | default(''))"

    - name: "Delete stale CNPG-managed resources"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl delete {{ item }} -n database -l cnpg.io/cluster --ignore-not-found
        executable: /bin/bash
      loop:
        - svc
        - sa
        - role
        - rolebinding
        - pdb
      failed_when: false
      register: _cnpg_del_res
      changed_when: "'deleted' in (_cnpg_del_res.stdout | default(''))"
      retries: 3
      delay: 10
      until: _cnpg_del_res.rc == 0

- name: "Health gate - check deployment_available"
  when: "(health_checks | default([])) | selectattr('type', 'equalto', 'deployment_available') | list | length > 0"
  block:
    - name: "Health gate - set deployment check items"
      ansible.builtin.set_fact:
        _deploy_checks: >-
          {{ (health_checks | default([]))
             | selectattr('type', 'equalto', 'deployment_available')
             | map(attribute='items')
             | flatten
             | list }}

    - name: "Health gate - wait for deployment {{ item.namespace ~ '/' ~ item.name }}"
      ansible.builtin.command: >
        k3s kubectl rollout status deployment/{{ item.name }}
        -n {{ item.namespace }}
        --timeout={{ gate_timeout | default(300) }}s
      loop: "{{ _deploy_checks }}"
      register: _deploy_status
      changed_when: false
      failed_when: false
      retries: 3
      delay: 10
      until: _deploy_status.rc == 0

- name: "Health gate - check longhorn_nodes_ready"
  when: "(health_checks | default([])) | selectattr('type', 'equalto', 'longhorn_nodes_ready') | list | length > 0"
  block:
    - name: "Health gate - get longhorn node ready conditions"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get nodes.longhorn.io -n longhorn-system \
            -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{" "}{end}'
        executable: /bin/bash
      register: _lh_nodes_result
      changed_when: false
      failed_when: false
      retries: "{{ ((gate_timeout | default(300)) | int / 15) | int }}"
      delay: 15
      until: >-
        _lh_nodes_result.rc == 0
        and _lh_nodes_result.stdout | trim | length > 0
        and _lh_nodes_result.stdout | trim | split(' ') | reject('equalto', '') | reject('equalto', 'True') | list | length == 0

    - name: "Health gate - longhorn nodes status"
      ansible.builtin.debug:
        msg: >-
          Longhorn nodes ready check:
          {{ 'PASSED'
             if (_lh_nodes_result.stdout | default('')
                 | trim | split(' ')
                 | reject('equalto', '')
                 | reject('equalto', 'True')
                 | list | length == 0)
             else 'TIMED OUT - status: '
                  + (_lh_nodes_result.stdout | default('unknown')) }}

- name: "Health gate - check cnpg_cluster_healthy"
  when: "(health_checks | default([])) | selectattr('type', 'equalto', 'cnpg_cluster_healthy') | list | length > 0"
  block:
    - name: "Health gate - set cnpg check items"
      ansible.builtin.set_fact:
        _cnpg_checks: >-
          {{ (health_checks | default([]))
             | selectattr('type', 'equalto', 'cnpg_cluster_healthy')
             | map(attribute='items')
             | flatten
             | list }}

    - name: "Health gate - wait for CNPG cluster {{ item.namespace ~ '/' ~ item.name }}"
      ansible.builtin.command: >
        k3s kubectl get clusters.postgresql.cnpg.io/{{ item.name }}
        -n {{ item.namespace }}
        -o jsonpath='{.status.phase}'
      loop: "{{ _cnpg_checks }}"
      register: _cnpg_status
      changed_when: false
      failed_when: false
      retries: "{{ ((gate_timeout | default(300)) | int / 15) | int }}"
      delay: 15
      until: >-
        _cnpg_status.rc == 0
        and _cnpg_status.stdout | default('') | length > 0
        and 'Unable to create required cluster objects' not in (_cnpg_status.stdout | default(''))

    - name: "Health gate - CNPG cluster status summary"
      ansible.builtin.debug:
        msg: >-
          CNPG cluster {{ item.item.name }}:
          {{ item.stdout | default('unknown') }}
      loop: "{{ _cnpg_status.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default('unknown') }}"

- name: "Health gate - check pod_running"
  when: "(health_checks | default([])) | selectattr('type', 'equalto', 'pod_running') | list | length > 0"
  block:
    - name: "Health gate - set pod check items"
      ansible.builtin.set_fact:
        _pod_checks: >-
          {{ (health_checks | default([]))
             | selectattr('type', 'equalto', 'pod_running')
             | map(attribute='items')
             | flatten
             | list }}

    - name: "Health gate - wait for pod {{ item.namespace ~ '/' ~ item.name }}"
      ansible.builtin.command: >
        k3s kubectl get pod {{ item.name }}
        -n {{ item.namespace }}
        -o jsonpath='{.status.phase}'
      loop: "{{ _pod_checks }}"
      register: _pod_status
      changed_when: false
      failed_when: false
      retries: "{{ ((gate_timeout | default(300)) | int / 15) | int }}"
      delay: 15
      until: >-
        _pod_status.rc == 0
        and _pod_status.stdout | default('') == 'Running'

    - name: "Health gate - pod status summary"
      ansible.builtin.debug:
        msg: >-
          Pod {{ item.item.name }}:
          {{ item.stdout | default('unknown') }}
      loop: "{{ _pod_status.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name | default('unknown') }}"

- name: "Health gate - post-action: delete blocking webhooks"
  when: >-
    'delete_blocking_webhooks' in (post_actions | default([]))
    or 'delete_longhorn_webhooks' in (post_actions | default([]))
    or 'delete_gatekeeper_webhooks' in (post_actions | default([]))
  block:
    - name: "Post: delete all blocking webhook configurations"
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop: "{{ k3s_blocking_webhooks }}"
      register: _post_del_webhooks
      changed_when: "'deleted' in (_post_del_webhooks.stdout | default(''))"
      retries: 3
      delay: 10
      until: _post_del_webhooks.rc == 0

- name: "Health gate - post-action: cnpg cleanup stale"
  when: "'cnpg_cleanup_stale' in (post_actions | default([]))"
  block:
    - name: "Post: clean stale CNPG instance pods"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl delete pods -n database -l cnpg.io/cluster --field-selector=status.phase=Failed --ignore-not-found
        executable: /bin/bash
      failed_when: false
      register: _post_cnpg_del_pods
      changed_when: "'deleted' in (_post_cnpg_del_pods.stdout | default(''))"

    - name: "Post: delete stale CNPG-managed resources"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl delete {{ item }} -n database -l cnpg.io/cluster --ignore-not-found
        executable: /bin/bash
      loop:
        - svc
        - sa
        - role
        - rolebinding
        - pdb
      failed_when: false
      register: _post_cnpg_del_res
      changed_when: "'deleted' in (_post_cnpg_del_res.stdout | default(''))"
      retries: 3
      delay: 10
      until: _post_cnpg_del_res.rc == 0 or 'not found' in (_post_cnpg_del_res.stderr | default(''))
