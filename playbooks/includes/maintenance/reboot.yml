---
- name: Reboot devices sequentially (staggered)
  hosts: all
  gather_facts: true
  become: true
  serial: 1
  tags: [reboot]
  vars:
    reboot_timeout: 600
    reboot_connect_timeout: 30
    reboot_post_reboot_delay: 10
    reboot_test_command: "true"
  tasks:
    - name: Reboot host and wait for it to become available
      ansible.builtin.reboot:
        msg: "Reboot triggered by ansible-home-cluster"
        reboot_timeout: "{{ reboot_timeout }}"
        connect_timeout: "{{ reboot_connect_timeout }}"
        post_reboot_delay: "{{ reboot_post_reboot_delay }}"
        test_command: "{{ reboot_test_command }}"
