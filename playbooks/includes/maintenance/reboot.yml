    reboot_timeout: 1200
  tasks:
    - name: Stop K3s service gracefully
      ansible.builtin.service:
        name: k3s
        state: stopped

    - name: Reboot host
      ansible.builtin.reboot:
        msg: "Rebooting homeserver3 (Maintenance)"
        reboot_timeout: "{{ reboot_timeout }}"

    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: k3s_flannel_fix.yml

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate homeserver3 is Ready
      ansible.builtin.command: kubectl get node homeserver3 --no-headers
