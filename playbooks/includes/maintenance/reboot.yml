      become: false
      register: node_status
      until: "'Ready' in node_status.stdout"
      retries: 30
      delay: 10
      changed_when: false

    - name: Clean up stale pods on homeserver3
      ansible.builtin.shell: |
        set -o pipefail
        kubectl get pods --all-namespaces --field-selector spec.nodeName=homeserver3,status.phase=Failed \
          -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
          | while read -r ns name; do
              [ -n "$ns" ] && kubectl delete pod "$name" -n "$ns" --force --grace-period=0
            done
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      failed_when: false

    - name: Validate Critical Applications are Available
      ansible.builtin.command: >
        kubectl wait --for=condition=available --timeout=300s deployment/{{ item.name }} -n {{ item.ns }}
      delegate_to: localhost
      become: false
      loop:
        - { name: 'coredns', ns: 'kube-system' }
        - { name: 'traefik', ns: 'kube-system' }
        - { name: 'argocd-server', ns: 'argocd' }
        - { name: 'argocd-repo-server', ns: 'argocd' }
      changed_when: false

- name: Reboot agent devices
  hosts: agent
  gather_facts: true
  become: true
  tags: [reboot, reboot_agents]
  vars:
    reboot_timeout: 1200
  tasks:
    - name: Stop K3s Agent service gracefully
      ansible.builtin.service:
        name: k3s-agent
        state: stopped

    - name: Reboot host
      ansible.builtin.reboot:
        msg: "Rebooting agent (Maintenance)"
        reboot_timeout: "{{ reboot_timeout }}"
