---
# ==============================================================================
# Sequential Staggered Reboot with Graceful Drain/Uncordon
# ==============================================================================
# Order: pre-flight -> pause ArgoCD -> delete webhooks ->
#         drain & stop agents -> reboot agents ->
#         drain & reboot control planes (one by one) ->
#         uncordon all -> re-enable ArgoCD -> final validation

# ------------------------------------------------------------------------------
# 1. Pre-flight checks & preparation
# ------------------------------------------------------------------------------
- name: "Reboot: Pre-flight checks and preparation"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [reboot, reboot_preflight]
  tasks:
    - name: Delete blocking webhook configurations (best-effort, k3s may be down)
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop: "{{ k3s_blocking_webhooks }}"
      register: _result
      failed_when: false
      changed_when: "'deleted' in (_result.stdout | default(''))"

# ------------------------------------------------------------------------------
# 2. Drain, stop, and reboot agents
# ------------------------------------------------------------------------------
- name: "Reboot: Drain and stop agents"
  hosts: agent
  gather_facts: false
  become: true
  serial: 3
  max_fail_percentage: 30
  tags: [reboot, reboot_agents]
  tasks:
    - name: Drain agent node
      ansible.builtin.include_tasks: k3s_drain_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Stop k3s-agent service
      ansible.builtin.service:
        name: k3s-agent
        state: stopped
      register: _agent_stop
      failed_when: false

    - name: Warn if agent stop failed
      ansible.builtin.debug:
        msg: "WARNING: Failed to stop k3s-agent on {{ inventory_hostname }}: {{ _agent_stop.msg | default('unknown') }}"
      when: _agent_stop is failed

- name: "Reboot: Reboot agents"
  hosts: agent
  gather_facts: true
  become: true
  max_fail_percentage: 30
  tags: [reboot, reboot_agents]
  vars:
    reboot_timeout: 1200
  tasks:
    - name: Reboot host
      ansible.builtin.reboot:
        msg: "Rebooting agent (Maintenance)"
        reboot_timeout: "{{ reboot_timeout }}"

    - name: Flush ARP cache after reboot
      ansible.builtin.command: ip neigh flush all
      changed_when: true

# ------------------------------------------------------------------------------
# 3. Disable k3s, reboot all control planes in parallel
# ------------------------------------------------------------------------------
- name: "Reboot: Disable k3s, stop, and reboot all control planes"
  hosts: server
  gather_facts: true
  become: true
  tags: [reboot, reboot_servers]
  vars:
    reboot_timeout: 1200
  tasks:
    - name: Drain {{ inventory_hostname }}
      ansible.builtin.include_tasks: k3s_drain_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"
        drain_timeout: 120

    - name: Disable k3s to prevent auto-start after reboot
      ansible.builtin.systemd:
        name: k3s
        enabled: false

    - name: Stop K3s service gracefully
      ansible.builtin.service:
        name: k3s
        state: stopped

    - name: Reboot host
      ansible.builtin.reboot:
        msg: "Rebooting {{ inventory_hostname }} (Maintenance)"
        reboot_timeout: "{{ reboot_timeout }}"

    - name: Flush ARP cache after reboot
      ansible.builtin.command: ip neigh flush all
      changed_when: true

    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: k3s_flannel_fix.yml

# ------------------------------------------------------------------------------
# 3a. Start k3s sequentially on control planes
# ------------------------------------------------------------------------------
- name: "Reboot: Start k3s on control planes"
  hosts: server
  gather_facts: false
  become: true
  serial: 1
  tags: [reboot, reboot_servers]
  tasks:
    - name: Start k3s service on {{ inventory_hostname }}
      ansible.builtin.systemd:
        name: k3s
        state: started
        daemon_reload: true

    - name: Wait for K3s API port (6443) on {{ inventory_hostname }}
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Delete blocking webhook configurations
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop: "{{ k3s_blocking_webhooks }}"
      register: _result
      failed_when: false
      changed_when: "'deleted' in (_result.stdout | default(''))"
      run_once: true  # noqa: run-once[task]

    - name: Validate and clean up {{ inventory_hostname }}
      ansible.builtin.include_tasks: k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

# ------------------------------------------------------------------------------
# 3b. Stabilize cluster before uncordoning
# ------------------------------------------------------------------------------
- name: "Reboot: Stabilize cluster"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [reboot, reboot_servers]
  tasks:
    - name: Verify all control planes are Ready
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get nodes -l node-role.kubernetes.io/control-plane --no-headers \
          | grep -c 'Ready' || echo 0
      args:
        executable: /bin/bash
      register: _cp_ready
      retries: 30
      delay: 10
      until: (_cp_ready.stdout | trim | int) >= 3
      changed_when: false

    - name: Delete blocking webhook configurations
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop: "{{ k3s_blocking_webhooks }}"
      register: _result
      retries: 5
      delay: 10
      until: _result.rc == 0
      changed_when: false


# ------------------------------------------------------------------------------
# 3c. Uncordon ALL nodes (server[0] does it for everyone to avoid gaps)
# ------------------------------------------------------------------------------
- name: "Reboot: Uncordon all nodes"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [reboot, reboot_servers, reboot_agents]
  tasks:
    - name: Uncordon all nodes
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
            | while read -r node; do
                k3s kubectl uncordon "$node" 2>/dev/null || true
              done
        executable: /bin/bash
      changed_when: false

# ------------------------------------------------------------------------------
# 4. Validate agents after reboot (non-fatal per node)
# ------------------------------------------------------------------------------
- name: "Reboot: Validate agents"
  hosts: agent
  gather_facts: false
  become: false
  tags: [reboot, reboot_agents]
  tasks:
    - name: Check if agent is Ready
      ansible.builtin.command: kubectl get node {{ inventory_hostname }} --no-headers
      delegate_to: localhost
      register: _agent_status
      until: "'Ready' in _agent_status.stdout and 'NotReady' not in _agent_status.stdout"
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false

    - name: Warn if agent is not Ready
      ansible.builtin.debug:
        msg: "WARNING: {{ inventory_hostname }} is not Ready after reboot: {{ _agent_status.stdout | default('unknown') }}"
      when: _agent_status.rc != 0 or 'NotReady' in (_agent_status.stdout | default(''))

# ------------------------------------------------------------------------------
# 5. Clean up all stale resources from before reboot
# ------------------------------------------------------------------------------
- name: "Reboot: Clean up stale resources"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [reboot, reboot_validation]
  tasks:
    - name: Delete pods in Pending/Unknown/Failed state
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          for phase in Pending Unknown Failed; do
            k3s kubectl get pods --all-namespaces --field-selector="status.phase=$phase" \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
              | while read -r ns name; do
                  [ -n "$ns" ] && k3s kubectl delete pod "$name" -n "$ns" --force --grace-period=0 2>/dev/null || true
                done
          done
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Delete stale VolumeAttachments not attached
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get volumeattachments -o json \
            | jq -r '.items[] | select(.status.attached == false) | .metadata.name' \
            | while read -r va; do
                k3s kubectl patch volumeattachment "$va" -p '{"metadata":{"finalizers":null}}' --type merge 2>/dev/null
                k3s kubectl delete volumeattachment "$va" --force --grace-period=0 2>/dev/null || true
              done
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Clean stale Longhorn snapshot-controller attachment tickets
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get volumeattachments.longhorn.io -n longhorn-system -o json \
            | jq -r '.items[] | select(.spec.attachmentTickets | to_entries | length > 1) | .metadata.name' \
            | while read -r vol; do
                tickets=$(k3s kubectl get volumeattachments.longhorn.io "$vol" -n longhorn-system -o json \
                  | jq -r '[.spec.attachmentTickets | to_entries[] | select(.value.type == "snapshot-controller") | .key] | .[]')
                for ticket in $tickets; do
                  k3s kubectl patch volumeattachments.longhorn.io "$vol" -n longhorn-system \
                    --type json -p "[{\"op\":\"remove\",\"path\":\"/spec/attachmentTickets/$ticket\"}]" 2>/dev/null || true
                done
              done
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Delete failed Jobs
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get jobs --all-namespaces -o json \
            | jq -r '.items[] | select(.status.failed != null and .status.failed > 0) | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r ns name; do
                [ -n "$ns" ] && k3s kubectl delete job "$name" -n "$ns" --ignore-not-found 2>/dev/null || true
              done
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Delete stopped Longhorn replicas (orphans from failed rebuilds)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get replicas.longhorn.io -n longhorn-system -o json \
            | jq -r '.items[] | select(.status.currentState == "stopped") | .metadata.name' \
            | while read -r r; do
                k3s kubectl delete replica "$r" -n longhorn-system --force --grace-period=0 2>/dev/null || true
              done
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Delete orphaned Longhorn snapshots referencing deleted volumes
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get snapshots.longhorn.io -n longhorn-system -o json \
            | jq -r '[.items[] | .spec.volume] | unique | .[]' \
            | while read -r vol; do
                if ! k3s kubectl get volume "$vol" -n longhorn-system &>/dev/null; then
                  k3s kubectl delete snapshots.longhorn.io -n longhorn-system \
                    -l "longhornvolume=$vol" --force --grace-period=0 2>/dev/null || true
                fi
              done
        executable: /bin/bash
      changed_when: false
      failed_when: false

# ------------------------------------------------------------------------------
# 6. Final cluster validation & ArgoCD re-enable
# ------------------------------------------------------------------------------
- name: "Reboot: Final validation and ArgoCD re-enable"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [reboot, reboot_validation]
  tasks:
    - name: Verify all nodes are Ready (warn only)
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get nodes --no-headers | grep 'NotReady' || true
      args:
        executable: /bin/bash
      register: _not_ready_nodes
      retries: 5
      delay: 10
      until: _not_ready_nodes.rc == 0
      changed_when: false

    - name: Warn about NotReady nodes
      ansible.builtin.debug:
        msg: "WARNING: Some nodes are still NotReady: {{ _not_ready_nodes.stdout }}"
      when: _not_ready_nodes.stdout | trim | length > 0

    - name: Validate critical applications are available
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=available --timeout=300s
        deployment/{{ item.name }} -n {{ item.ns }}
      loop:
        - { name: 'coredns', ns: 'kube-system' }
        - { name: 'traefik', ns: 'kube-system' }
        - { name: 'argocd-server', ns: 'argocd' }
        - { name: 'argocd-repo-server', ns: 'argocd' }
      register: _result
      retries: 5
      delay: 10
      until: _result.rc == 0
      changed_when: false

    - name: Delete blocking webhook configurations (post-sync)
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop: "{{ k3s_blocking_webhooks }}"
      register: _result
      failed_when: false
      changed_when: "'deleted' in (_result.stdout | default(''))"

    - name: Clean up Failed pods cluster-wide
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get pods --all-namespaces --field-selector status.phase=Failed \
          -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
          | while read -r ns name; do
              [ -n "$ns" ] && k3s kubectl delete pod "$name" -n "$ns" --force --grace-period=0
            done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Delete stopped Longhorn replicas
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get replicas.longhorn.io -n longhorn-system -o json \
            | jq -r '.items[] | select(.status.currentState == "stopped") | .metadata.name' \
            | while read -r r; do
                k3s kubectl delete replica "$r" -n longhorn-system --force --grace-period=0 2>/dev/null || true
              done
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Run post-reboot health monitor
      ansible.builtin.include_tasks: restore_health_monitor.yml
