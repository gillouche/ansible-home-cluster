---
# ==============================================================================
# Sequential Staggered Reboot with Graceful Drain/Uncordon
# ==============================================================================
# Order: pre-flight -> pause ArgoCD -> delete webhooks ->
#         drain & stop agents -> reboot agents ->
#         drain & reboot control planes (one by one) ->
#         uncordon all -> re-enable ArgoCD -> final validation

# ------------------------------------------------------------------------------
# 1. Pre-flight checks & preparation
# ------------------------------------------------------------------------------
- name: "Reboot: Pre-flight checks and preparation"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [reboot, reboot_preflight]
  tasks:
    - name: Verify Postgres datastore is reachable
      ansible.builtin.wait_for:
        host: "{{ k3s_db_host }}"
        port: "{{ k3s_db_port }}"
        timeout: 10
      changed_when: false

    - name: Pause ArgoCD auto-sync on all Applications
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get applications -n argocd -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
          | while read -r app; do
              [ -n "$app" ] && k3s kubectl patch application "$app" -n argocd --type merge \
                -p '{"spec":{"syncPolicy":{"automated":null}}}' 2>/dev/null || true
            done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Delete blocking webhook configurations
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop:
        - validatingwebhookconfiguration longhorn-webhook-validator
        - mutatingwebhookconfiguration longhorn-webhook-mutator
        - validatingwebhookconfiguration gatekeeper-validating-webhook-configuration
        - mutatingwebhookconfiguration gatekeeper-mutating-webhook-configuration
      changed_when: false

# ------------------------------------------------------------------------------
# 2. Drain, stop, and reboot agents
# ------------------------------------------------------------------------------
- name: "Reboot: Drain and stop agents"
  hosts: agent
  gather_facts: false
  become: true
  serial: 3
  max_fail_percentage: 30
  tags: [reboot, reboot_agents]
  tasks:
    - name: Drain agent node
      ansible.builtin.include_tasks: k3s_drain_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Stop k3s-agent service
      ansible.builtin.service:
        name: k3s-agent
        state: stopped

- name: "Reboot: Reboot agents"
  hosts: agent
  gather_facts: true
  become: true
  max_fail_percentage: 30
  tags: [reboot, reboot_agents]
  vars:
    reboot_timeout: 1200
  tasks:
    - name: Reboot host
      ansible.builtin.reboot:
        msg: "Rebooting agent (Maintenance)"
        reboot_timeout: "{{ reboot_timeout }}"

    - name: Flush ARP cache after reboot
      ansible.builtin.command: ip neigh flush all
      changed_when: true

# ------------------------------------------------------------------------------
# 3. Drain & reboot control planes (one by one)
# ------------------------------------------------------------------------------
- name: "Reboot: Drain and reboot homeserver (Primary Control Plane)"
  hosts: homeserver
  gather_facts: true
  become: true
  tags: [reboot, reboot_servers]
  vars:
    reboot_timeout: 1200
  tasks:
    - name: Drain homeserver
      ansible.builtin.include_tasks: k3s_drain_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"
        drain_timeout: 120

    - name: Stop K3s service gracefully
      ansible.builtin.service:
        name: k3s
        state: stopped

    - name: Reboot host
      ansible.builtin.reboot:
        msg: "Rebooting homeserver (Maintenance)"
        reboot_timeout: "{{ reboot_timeout }}"

    - name: Flush ARP cache after reboot
      ansible.builtin.command: ip neigh flush all
      changed_when: true

    - name: Verify etcd is healthy after reboot
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:2379/health"
        status_code: 200
      register: _etcd_health
      retries: 15
      delay: 2
      until: _etcd_health.status == 200

    - name: Verify postgres container is running after reboot
      ansible.builtin.systemd:
        name: container-postgres
        state: started

    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: k3s_flannel_fix.yml

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate and clean up homeserver
      ansible.builtin.include_tasks: k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Uncordon homeserver
      ansible.builtin.include_tasks: k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

- name: "Reboot: Drain and reboot homeserver2 (Secondary Control Plane)"
  hosts: homeserver2
  gather_facts: true
  become: true
  tags: [reboot, reboot_servers]
  vars:
    reboot_timeout: 1200
  tasks:
    - name: Drain homeserver2
      ansible.builtin.include_tasks: k3s_drain_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"
        drain_timeout: 120

    - name: Stop K3s service gracefully
      ansible.builtin.service:
        name: k3s
        state: stopped

    - name: Reboot host
      ansible.builtin.reboot:
        msg: "Rebooting homeserver2 (Maintenance)"
        reboot_timeout: "{{ reboot_timeout }}"

    - name: Flush ARP cache after reboot
      ansible.builtin.command: ip neigh flush all
      changed_when: true

    - name: Verify etcd is healthy after reboot
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:2379/health"
        status_code: 200
      register: _etcd_health
      retries: 15
      delay: 2
      until: _etcd_health.status == 200

    - name: Verify postgres container is running after reboot
      ansible.builtin.systemd:
        name: container-postgres
        state: started

    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: k3s_flannel_fix.yml

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate and clean up homeserver2
      ansible.builtin.include_tasks: k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Uncordon homeserver2
      ansible.builtin.include_tasks: k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

- name: "Reboot: Drain and reboot homeserver3 (Tertiary Control Plane)"
  hosts: homeserver3
  gather_facts: true
  become: true
  tags: [reboot, reboot_servers]
  vars:
    reboot_timeout: 1200
  tasks:
    - name: Drain homeserver3
      ansible.builtin.include_tasks: k3s_drain_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"
        drain_timeout: 120

    - name: Stop K3s service gracefully
      ansible.builtin.service:
        name: k3s
        state: stopped

    - name: Reboot host
      ansible.builtin.reboot:
        msg: "Rebooting homeserver3 (Maintenance)"
        reboot_timeout: "{{ reboot_timeout }}"

    - name: Flush ARP cache after reboot
      ansible.builtin.command: ip neigh flush all
      changed_when: true

    - name: Verify etcd is healthy after reboot
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:2379/health"
        status_code: 200
      register: _etcd_health
      retries: 15
      delay: 2
      until: _etcd_health.status == 200

    - name: Verify postgres container is running after reboot
      ansible.builtin.systemd:
        name: container-postgres
        state: started

    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: k3s_flannel_fix.yml

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate and clean up homeserver3
      ansible.builtin.include_tasks: k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Uncordon homeserver3
      ansible.builtin.include_tasks: k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

# ------------------------------------------------------------------------------
# 4. Uncordon all agents (always run, even if a node is NotReady)
# ------------------------------------------------------------------------------
- name: "Reboot: Uncordon agents"
  hosts: agent
  gather_facts: false
  become: false
  tags: [reboot, reboot_agents]
  tasks:
    - name: Uncordon agent
      ansible.builtin.include_tasks: k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

# ------------------------------------------------------------------------------
# 5. Validate agents after reboot (non-fatal per node)
# ------------------------------------------------------------------------------
- name: "Reboot: Validate agents"
  hosts: agent
  gather_facts: false
  become: false
  tags: [reboot, reboot_agents]
  tasks:
    - name: Check if agent is Ready
      ansible.builtin.command: kubectl get node {{ inventory_hostname }} --no-headers
      delegate_to: localhost
      register: _agent_status
      until: "'Ready' in _agent_status.stdout and 'NotReady' not in _agent_status.stdout"
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false

    - name: Warn if agent is not Ready
      ansible.builtin.debug:
        msg: "WARNING: {{ inventory_hostname }} is not Ready after reboot: {{ _agent_status.stdout | default('unknown') }}"
      when: _agent_status.rc != 0 or 'NotReady' in (_agent_status.stdout | default(''))

# ------------------------------------------------------------------------------
# 6. Final cluster validation & ArgoCD re-enable
# ------------------------------------------------------------------------------
- name: "Reboot: Final validation and ArgoCD re-enable"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [reboot, reboot_validation]
  tasks:
    - name: Delete blocking webhook configurations
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop:
        - validatingwebhookconfiguration longhorn-webhook-validator
        - mutatingwebhookconfiguration longhorn-webhook-mutator
        - validatingwebhookconfiguration gatekeeper-validating-webhook-configuration
        - mutatingwebhookconfiguration gatekeeper-mutating-webhook-configuration
      changed_when: false

    - name: Verify all nodes are Ready (warn only)
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get nodes --no-headers | grep 'NotReady' || true
      args:
        executable: /bin/bash
      register: _not_ready_nodes
      changed_when: false

    - name: Warn about NotReady nodes
      ansible.builtin.debug:
        msg: "WARNING: Some nodes are still NotReady: {{ _not_ready_nodes.stdout }}"
      when: _not_ready_nodes.stdout | trim | length > 0

    - name: Validate critical applications are available
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=available --timeout=300s
        deployment/{{ item.name }} -n {{ item.ns }}
      loop:
        - { name: 'coredns', ns: 'kube-system' }
        - { name: 'traefik', ns: 'kube-system' }
        - { name: 'argocd-server', ns: 'argocd' }
        - { name: 'argocd-repo-server', ns: 'argocd' }
      changed_when: false

    - name: Re-enable ArgoCD auto-sync on all Applications
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get applications -n argocd -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
          | while read -r app; do
              [ -n "$app" ] && k3s kubectl patch application "$app" -n argocd --type merge \
                -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}' 2>/dev/null || true
            done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Clean up Failed pods cluster-wide
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get pods --all-namespaces --field-selector status.phase=Failed \
          -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
          | while read -r ns name; do
              [ -n "$ns" ] && k3s kubectl delete pod "$name" -n "$ns" --force --grace-period=0
            done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
