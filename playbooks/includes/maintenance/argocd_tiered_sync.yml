---
- name: "Discover remaining apps for tier {{ tier_name }}"
  when: tier_apps == "__remaining__"
  block:
    - name: "List all ArgoCD applications for tier {{ tier_name }}"
      ansible.builtin.command: >
        k3s kubectl get applications -n argocd -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'
      register: _all_apps_result
      changed_when: false
      retries: 3
      delay: 10
      until: _all_apps_result.rc == 0

    - name: "List apps with automated sync already enabled for tier {{ tier_name }}"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get applications -n argocd -o jsonpath='{range .items[?(@.spec.syncPolicy.automated)]}{.metadata.name}{"\n"}{end}'
        executable: /bin/bash
      register: _auto_sync_apps_result
      changed_when: false
      retries: 3
      delay: 10
      until: _auto_sync_apps_result.rc == 0

    - name: "Set remaining app list for tier {{ tier_name }}"
      ansible.builtin.set_fact:
        _tier_app_list: >-
          {{ _all_apps_result.stdout_lines | difference(_auto_sync_apps_result.stdout_lines) }}

- name: "Set explicit app list for tier {{ tier_name }}"
  when: tier_apps != "__remaining__"
  ansible.builtin.set_fact:
    _tier_app_list: "{{ tier_apps }}"

- name: "Enable auto-sync for tier {{ tier_name }}"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      k3s kubectl patch application {{ app_name }} -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
    executable: /bin/bash
  loop: "{{ _tier_app_list }}"
  loop_control:
    loop_var: app_name
    label: "{{ app_name }}"
  register: _patch_results
  changed_when: _patch_results.rc == 0
  failed_when: false
  retries: 3
  delay: 10
  until: _patch_results.rc == 0 or 'not found' in (_patch_results.stderr | default(''))

- name: "Trigger fresh sync for tier {{ tier_name }}"
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      k3s kubectl patch application {{ app_name }} -n argocd --type merge \
        -p '{"operation":{"initiatedBy":{"username":"ansible"},"sync":{"syncStrategy":{"apply":{"force":true}}}}}'
    executable: /bin/bash
  loop: "{{ _tier_app_list }}"
  loop_control:
    loop_var: app_name
    label: "{{ app_name }}"
  failed_when: false
  changed_when: false

- name: "Wait for apps to become healthy in tier {{ tier_name }}"
  ansible.builtin.command: >
    k3s kubectl get application {{ app_name }} -n argocd
    -o jsonpath='{.status.sync.status}/{.status.health.status}'
  loop: "{{ _tier_app_list }}"
  loop_control:
    loop_var: app_name
    label: "{{ app_name }}"
  register: _health_results
  changed_when: false
  failed_when: false
  retries: "{{ ((tier_timeout | default(300)) | int / 15) | int }}"
  delay: 15
  until: >-
    'Synced/Healthy' in (_health_results.stdout | default(''))
    or 'Synced/Suspended' in (_health_results.stdout | default(''))

- name: "Build health summary for tier {{ tier_name }}"
  ansible.builtin.set_fact:
    _healthy_apps: >-
      {{ _health_results.results
         | selectattr('stdout', 'defined')
         | selectattr('stdout', 'search', 'Synced/(Healthy|Suspended)')
         | map(attribute='app_name')
         | list }}
    _timed_out_apps: >-
      {{ _health_results.results
         | selectattr('stdout', 'defined')
         | rejectattr('stdout', 'search', 'Synced/(Healthy|Suspended)')
         | map(attribute='app_name')
         | list }}

- name: "Sync summary for tier {{ tier_name }}"
  ansible.builtin.debug:
    msg: >-
      Tier {{ tier_name }} complete.
      Healthy: {{ _healthy_apps | join(', ') | default('none') }}.
      Timed out: {{ _timed_out_apps | join(', ') | default('none') }}.
