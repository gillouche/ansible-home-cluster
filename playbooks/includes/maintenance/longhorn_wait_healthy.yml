---
- name: Wait for Longhorn volumes to reach stable state
  ansible.builtin.shell: |
    set -o pipefail
    k3s kubectl get volumes.longhorn.io --no-headers \
      -o custom-columns='STATE:.status.state' \
      | grep -cE 'attaching|detaching|faulted' || true
  args:
    executable: /bin/bash
  register: _longhorn_unhealthy_count
  retries: "{{ (longhorn_wait_timeout | default(300)) // 15 }}"
  delay: 15
  until: (_longhorn_unhealthy_count.stdout | trim | int) == 0
  changed_when: false
  failed_when: false

- name: Gather non-healthy Longhorn volumes for diagnostics
  ansible.builtin.shell: |
    set -o pipefail
    k3s kubectl get volumes.longhorn.io --no-headers \
      -o custom-columns='NAME:.metadata.name,STATE:.status.state,ROBUSTNESS:.status.robustness' \
      | grep -E 'attaching|detaching|faulted' || true
  args:
    executable: /bin/bash
  register: _longhorn_unhealthy_list
  changed_when: false
  failed_when: false
  when: (_longhorn_unhealthy_count.stdout | trim | int) != 0

- name: Warn about non-healthy Longhorn volumes
  ansible.builtin.debug:
    msg: >-
      WARNING: Some Longhorn volumes are not in a healthy state after waiting.
      Non-healthy volumes: {{ _longhorn_unhealthy_list.stdout | default('') }}
  when:
    - (_longhorn_unhealthy_count.stdout | trim | int) != 0
    - _longhorn_unhealthy_list is defined
