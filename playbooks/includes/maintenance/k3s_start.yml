---
# ==============================================================================
# K3s Cluster Recovery / Start
# ==============================================================================
# Order: verify infrastructure -> start control planes (serial) ->
#         validate control plane health -> start agents -> uncordon all ->
#         re-enable ArgoCD -> final validation
#
# NOTE: Etcd (for Patroni) and Postgres run as Podman containers with their
# own systemd units (container-etcd, container-postgres). They are independent
# of k3s and should already be running. This playbook verifies that before
# starting k3s.

# ------------------------------------------------------------------------------
# 0. Verify infrastructure (Etcd + Postgres) is healthy
# ------------------------------------------------------------------------------
- name: "K3s Start: Verify infrastructure dependencies"
  hosts: server
  gather_facts: false
  become: true
  tags: [k3s_start, k3s_start_infra]
  tasks:
    - name: Ensure etcd container is running
      ansible.builtin.systemd:
        name: container-etcd
        state: started
      register: _etcd_service

    - name: Verify etcd is healthy
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:2379/health"
        status_code: 200
      register: _etcd_health
      retries: 15
      delay: 2
      until: _etcd_health.status == 200

    - name: Ensure postgres container is running
      ansible.builtin.systemd:
        name: container-postgres
        state: started
      register: _pg_service

- name: "K3s Start: Verify Postgres VIP is reachable"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [k3s_start, k3s_start_infra]
  tasks:
    - name: Wait for Postgres VIP to respond
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['server'][0]]['k3s_db_host'] }}"
        port: "{{ hostvars[groups['server'][0]]['k3s_db_port'] }}"
        state: started
        timeout: 60

# ------------------------------------------------------------------------------
# 1. Flush ARP cache on all nodes
# ------------------------------------------------------------------------------
- name: "K3s Start: Flush ARP cache"
  hosts: k3s_cluster
  gather_facts: false
  tags: [k3s_start, k3s_start_arp]
  tasks:
    - name: Flush ARP cache
      ansible.builtin.command: ip neigh flush all
      become: true
      changed_when: true

# ------------------------------------------------------------------------------
# 2. Start control planes one by one
# ------------------------------------------------------------------------------
- name: "K3s Start: Start homeserver (Primary Control Plane)"
  hosts: homeserver
  gather_facts: false
  become: true
  tags: [k3s_start, k3s_start_servers]
  tasks:
    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: k3s_flannel_fix.yml

    - name: Start k3s service
      ansible.builtin.systemd:
        name: k3s
        state: started
        daemon_reload: true

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate homeserver is Ready
      ansible.builtin.include_tasks: k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Uncordon homeserver
      ansible.builtin.include_tasks: k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

- name: "K3s Start: Start homeserver2 (Secondary Control Plane)"
  hosts: homeserver2
  gather_facts: false
  become: true
  tags: [k3s_start, k3s_start_servers]
  tasks:
    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: k3s_flannel_fix.yml

    - name: Start k3s service
      ansible.builtin.systemd:
        name: k3s
        state: started
        daemon_reload: true

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate homeserver2 is Ready
      ansible.builtin.include_tasks: k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Uncordon homeserver2
      ansible.builtin.include_tasks: k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

- name: "K3s Start: Start homeserver3 (Tertiary Control Plane)"
  hosts: homeserver3
  gather_facts: false
  become: true
  tags: [k3s_start, k3s_start_servers]
  tasks:
    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: k3s_flannel_fix.yml

    - name: Start k3s service
      ansible.builtin.systemd:
        name: k3s
        state: started
        daemon_reload: true

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate homeserver3 is Ready
      ansible.builtin.include_tasks: k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Uncordon homeserver3
      ansible.builtin.include_tasks: k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

# ------------------------------------------------------------------------------
# 2. Post control-plane validation
# ------------------------------------------------------------------------------
- name: "K3s Start: Validate control plane health"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [k3s_start, k3s_start_servers]
  tasks:
    - name: Verify all control planes are Ready
      ansible.builtin.command: k3s kubectl get node {{ item }} --no-headers
      loop: "{{ groups['server'] }}"
      register: _cp_status
      until: "'Ready' in _cp_status.stdout and 'NotReady' not in _cp_status.stdout"
      retries: 15
      delay: 10
      changed_when: false

    - name: Wait for CoreDNS to be available
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=available --timeout=300s
        deployment/coredns -n kube-system
      changed_when: false

    - name: Delete blocking webhook configurations
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop:
        - validatingwebhookconfiguration longhorn-webhook-validator
        - mutatingwebhookconfiguration longhorn-webhook-mutator
        - validatingwebhookconfiguration gatekeeper-validating-webhook-configuration
        - mutatingwebhookconfiguration gatekeeper-mutating-webhook-configuration
      changed_when: false

# ------------------------------------------------------------------------------
# 3. Start agents
# ------------------------------------------------------------------------------
- name: "K3s Start: Start agent nodes"
  hosts: agent
  gather_facts: false
  tags: [k3s_start, k3s_start_agents]
  tasks:
    - name: Start k3s-agent service
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        daemon_reload: true
      become: true

# ------------------------------------------------------------------------------
# 4. Uncordon all agents (always run, even if a node is NotReady)
# ------------------------------------------------------------------------------
- name: "K3s Start: Uncordon agents"
  hosts: agent
  gather_facts: false
  tags: [k3s_start, k3s_start_agents]
  tasks:
    - name: Uncordon agent
      ansible.builtin.include_tasks: k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

# ------------------------------------------------------------------------------
# 5. Validate agents (non-fatal per node)
# ------------------------------------------------------------------------------
- name: "K3s Start: Validate agents"
  hosts: agent
  gather_facts: false
  tags: [k3s_start, k3s_start_agents]
  tasks:
    - name: Check if agent is Ready
      ansible.builtin.command: kubectl get node {{ inventory_hostname }} --no-headers
      delegate_to: localhost
      register: _agent_status
      until: "'Ready' in _agent_status.stdout and 'NotReady' not in _agent_status.stdout"
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false

    - name: Warn if agent is not Ready
      ansible.builtin.debug:
        msg: "WARNING: {{ inventory_hostname }} is not Ready: {{ _agent_status.stdout | default('unknown') }}"
      when: _agent_status.rc != 0 or 'NotReady' in (_agent_status.stdout | default(''))

# ------------------------------------------------------------------------------
# 6. Final cluster validation & ArgoCD re-enable
# ------------------------------------------------------------------------------
- name: "K3s Start: Final validation and ArgoCD re-enable"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [k3s_start, k3s_start_validation]
  tasks:
    - name: Verify all nodes are Ready (warn only)
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get nodes --no-headers | grep 'NotReady' || true
      args:
        executable: /bin/bash
      register: _not_ready_nodes
      changed_when: false

    - name: Warn about NotReady nodes
      ansible.builtin.debug:
        msg: "WARNING: Some nodes are still NotReady: {{ _not_ready_nodes.stdout }}"
      when: _not_ready_nodes.stdout | trim | length > 0

    - name: Validate critical applications are available
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=available --timeout=300s
        deployment/{{ item.name }} -n {{ item.ns }}
      loop:
        - { name: 'coredns', ns: 'kube-system' }
        - { name: 'traefik', ns: 'kube-system' }
        - { name: 'argocd-server', ns: 'argocd' }
        - { name: 'argocd-repo-server', ns: 'argocd' }
      changed_when: false

    - name: Re-enable ArgoCD auto-sync on all Applications
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get applications -n argocd -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
          | while read -r app; do
              [ -n "$app" ] && k3s kubectl patch application "$app" -n argocd --type merge \
                -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}' 2>/dev/null || true
            done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Clean up Failed pods cluster-wide
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get pods --all-namespaces --field-selector status.phase=Failed \
          -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
          | while read -r ns name; do
              [ -n "$ns" ] && k3s kubectl delete pod "$name" -n "$ns" --force --grace-period=0
            done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Cluster recovery complete
      ansible.builtin.debug:
        msg: >-
          K3s cluster is fully operational. All nodes are Ready,
          critical applications are available, and ArgoCD auto-sync is re-enabled.
