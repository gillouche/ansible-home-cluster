---
# Postgres HA Self-Healing
# Detects and fixes common Patroni issues:
# - Replicas with diverged timelines (reinitializes from leader)
# - Replicas with excessive replication lag (reinitializes from leader)
# - Replicas in "start failed" state (reinitializes from leader)

- name: "Postgres Heal: Get cluster state from Patroni leader"
  hosts: postgres
  gather_facts: false
  become: true
  serial: 1
  vars_files:
    - ../../../roles/postgres/defaults/main.yml
  tags: [postgres_heal]
  tasks:
    - name: Query Patroni cluster endpoint
      ansible.builtin.command: >
        podman exec {{ postgres_container_name }}
        curl -s http://localhost:{{ postgres_patroni_port }}/cluster
      register: _patroni_cluster_raw
      changed_when: false
      failed_when: false

    - name: Parse cluster state
      ansible.builtin.set_fact:
        patroni_cluster: "{{ _patroni_cluster_raw.stdout | from_json }}"
      when: _patroni_cluster_raw.rc == 0 and _patroni_cluster_raw.stdout | length > 0

    - name: Find leader # noqa: run-once
      ansible.builtin.set_fact:
        patroni_leader: >-
          {{ (patroni_cluster.members
             | selectattr('role', 'equalto', 'leader')
             | first).name }}
        patroni_leader_timeline: >-
          {{ (patroni_cluster.members
             | selectattr('role', 'equalto', 'leader')
             | first).timeline }}
      when: patroni_cluster is defined
      run_once: true # noqa: run-once

    - name: End play early if no cluster info
      ansible.builtin.meta: end_play
      when: patroni_cluster is not defined

- name: "Postgres Heal: Detect and reinitialize broken replicas"
  hosts: postgres
  gather_facts: false
  become: true
  vars_files:
    - ../../../roles/postgres/defaults/main.yml
  tags: [postgres_heal]
  tasks:
    - name: Skip if this node is the leader
      ansible.builtin.set_fact:
        _is_leader: "{{ inventory_hostname == hostvars[groups['postgres'][0]]['patroni_leader'] | default('') }}"

    - name: Get this node member info
      ansible.builtin.set_fact:
        _my_member: >-
          {{ hostvars[groups['postgres'][0]]['patroni_cluster']['members']
             | selectattr('name', 'equalto', inventory_hostname)
             | first | default({}) }}
      when: not _is_leader | bool

    - name: Determine if replica needs reinit
      ansible.builtin.set_fact:
        _needs_reinit: >-
          {{
            not (_is_leader | bool) and
            _my_member | length > 0 and
            (
              (_my_member.state | default('') not in ['running', 'streaming', 'in archive recovery']) or
              (_my_member.timeline | default(0) | int != hostvars[groups['postgres'][0]]['patroni_leader_timeline'] | int
               and _my_member.timeline | default(0) | int > 0) or
              (_my_member.lag | default(0) | string != 'unknown'
               and _my_member.lag | default(0) | int > 10737418240)
            )
          }}
      when: not _is_leader | bool

    - name: Report replica status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: state={{ _my_member.state | default('?') }},
          timeline={{ _my_member.timeline | default('?') }},
          lag={{ _my_member.lag | default('?') }},
          needs_reinit={{ _needs_reinit | default(false) }}
      when: not _is_leader | bool

    - name: Reinitialize broken replica via Patroni REST API
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ postgres_patroni_port }}/reinitialize"
        method: POST
        body_format: json
        body: '{}'
        status_code: [200, 202]
      when:
        - not _is_leader | bool
        - _needs_reinit | default(false) | bool
      register: _reinit_result
      changed_when: _reinit_result.status | default(0) in [200, 202]

    - name: Wait for replica to start replicating
      ansible.builtin.command: >
        podman exec {{ postgres_container_name }}
        curl -s -o /dev/null -w '%{http_code}' http://localhost:{{ postgres_patroni_port }}/replica
      register: _replica_health
      until: _replica_health.stdout == "200"
      retries: 60
      delay: 10
      when:
        - not _is_leader | bool
        - _needs_reinit | default(false) | bool
        - _reinit_result is changed
      changed_when: false
      failed_when: false

    - name: Report reinit result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: reinit {{ 'succeeded' if _replica_health.stdout | default('') == '200'
          else 'still in progress (check manually)' }}
      when:
        - _reinit_result is defined
        - _reinit_result is changed
