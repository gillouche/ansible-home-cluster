---
- name: "Vault Cluster Initialization"
  hosts: vault_cluster
  gather_facts: true
  become: false
  tags: [vault]
  tasks:
    - name: Run vault role for init stage
      ansible.builtin.import_role:
        name: vault
      vars:
        vault_stage: init
      tags: [vault, vault_init]

- name: "Bootstrap Transit Vault"
  hosts: vault_transit
  gather_facts: true
  become: false
  tags: [vault]
  tasks:
    - name: Run vault role for transit stage
      ansible.builtin.import_role:
        name: vault
      vars:
        vault_stage: transit
        vault_enable_transit_seal: false
      tags: [vault, vault_transit]

- name: "Setup Vault Leader"
  hosts: vault_leader
  gather_facts: true
  become: false
  tags: [vault]
  tasks:
    - name: Run vault role for leader stage
      ansible.builtin.import_role:
        name: vault
      vars:
        vault_stage: leader
      tags: [vault, vault_leader]

- name: "Setup Vault Followers"
  hosts: vault_followers
  gather_facts: true
  become: false
  tags: [vault]
  tasks:
    - name: Run vault role for followers stage
      ansible.builtin.import_role:
        name: vault
      vars:
        vault_stage: followers
      tags: [vault, vault_followers]

- name: "Post-Vault Tasks (Restarts)"
  hosts: vault_cluster
  gather_facts: false
  become: true
  tags: [vault]
  tasks:
    - name: Restart Vault to apply new certificates (if changed)
      containers.podman.podman_container:
        name: vault
        state: started
        restart: true
      when:
        - "_tls_cert_install_result is defined and _tls_cert_install_result.changed"
