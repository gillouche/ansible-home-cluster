---
- name: "Vault Cluster Initialization"
  hosts: vault_cluster
  gather_facts: true
  become: false
  tags: [vault, trust]
  tasks:
    - name: Run vault role for init stage
      ansible.builtin.import_role:
        name: vault
      vars:
        vault_stage: init

- name: "Bootstrap Transit Vault"
  hosts: vault_transit
  gather_facts: true
  become: false
  tags: [vault, trust]
  tasks:
    - name: Run vault role for transit stage
      ansible.builtin.import_role:
        name: vault
      vars:
        vault_stage: transit
        vault_enable_transit_seal: false

- name: "Setup Vault Leader"
  hosts: vault_leader
  gather_facts: true
  become: false
  tags: [vault, trust]
  pre_tasks:
    - name: Load Transit Token
      block:
        - name: Locate bootstrap transit token # noqa: run-once
          ansible.builtin.stat:
            path: "{{ vault_transit_token_export_path | expanduser }}"
          register: _bootstrap_transit_token_file
          delegate_to: localhost
          run_once: true

        - name: Read bootstrap transit token # noqa: run-once
          ansible.builtin.slurp:
            src: "{{ vault_transit_token_export_path | expanduser }}"
          register: _bootstrap_transit_token
          when: _bootstrap_transit_token_file.stat.exists
          delegate_to: localhost
          run_once: true

        - name: Compute bootstrap vault address # noqa: run-once
          ansible.builtin.set_fact:
            _bootstrap_vault_addr_default:
              "https://{{ hostvars['rpi5b8g1'].ansible_host | default('192.168.0.80') }}:{{ vault_api_port }}"
          run_once: true

        - name: Set Transit seal defaults # noqa: run-once
          ansible.builtin.set_fact:
            vault_enable_transit_seal: true
            vault_transit_addr: "{{ _bootstrap_vault_addr_default }}"
            vault_transit_token: >-
              {{ (_bootstrap_transit_token.content | b64decode | trim)
                 if _bootstrap_transit_token.content is defined else '' }}
          run_once: true
  tasks:
    - name: Run vault role for leader stage
      ansible.builtin.import_role:
        name: vault
      vars:
        vault_stage: leader

- name: "Setup Vault Followers"
  hosts: vault_followers
  gather_facts: true
  become: false
  tags: [vault, trust]
  tasks:
    - name: Run vault role for followers stage
      ansible.builtin.import_role:
        name: vault
      vars:
        vault_stage: followers

- name: "Post-Vault Tasks (Restarts)"
  hosts: vault_cluster
  gather_facts: false
  become: true
  tags: [vault, trust]
  tasks:
    - name: Restart Vault to apply new certificates (if changed)
      containers.podman.podman_container:
        name: vault
        state: started
        restart: true
      when:
        - "_tls_cert_install_result is defined and _tls_cert_install_result.changed"
