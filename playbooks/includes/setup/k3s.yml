---
- name: "Setup Etcd for Patroni + keepalived"
  hosts: postgres
  gather_facts: true
  become: true
  tags: [k3s, etcd, postgres]
  roles:
    - role: etcd
    - role: keepalived

- name: "Verify Etcd Cluster Health"
  hosts: postgres
  gather_facts: false
  become: false
  tags: [k3s, etcd, postgres]
  tasks:
    - name: Wait for Etcd health endpoint
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(ansible_facts.default_ipv4.address) }}:2379/health"
        status_code: 200
      register: _etcd_health
      retries: 15
      delay: 2
      until: _etcd_health.status == 200

- name: "Setup Postgres Leader"
  hosts: postgres_leader
  gather_facts: true
  become: true
  tags: [k3s, postgres]
  roles:
    - role: postgres

- name: "Setup Postgres Followers"
  hosts: postgres_replicas
  gather_facts: true
  become: true
  tags: [k3s, postgres]
  roles:
    - role: postgres

- name: "Verify Postgres VIP and HAProxy Readiness"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [k3s, postgres]
  tasks:
    - name: Wait for Postgres VIP to respond on HAProxy port
      ansible.builtin.wait_for:
        host: "{{ global_k3s_db_host }}"
        port: "{{ global_k3s_db_port }}"
        state: started
        timeout: 60

- name: Cluster prep
  hosts: k3s_cluster
  gather_facts: true
  become: true
  tags: [k3s, k3s_prep]
  pre_tasks:
    - name: Check for default K3s directory
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s
      register: _default_k3s_dir

    - name: Remove default K3s directory if it conflicts with custom location
      ansible.builtin.file:
        path: /var/lib/rancher/k3s
        state: absent
      when:
        - "'server' in group_names"
        - k3s_server_location is defined
        - k3s_server_location != '/var/lib/rancher/k3s'
        - _default_k3s_dir.stat.exists
        - _default_k3s_dir.stat.isdir
        - not _default_k3s_dir.stat.islnk
  roles:
    - role: k3s.orchestration.prereq
    - role: k3s.orchestration.raspberrypi

- name: Setup K3S server
  hosts: server
  become: true
  tags: [k3s, k3s_server]
  pre_tasks:
    - name: Ensure K3s data directory exists on SSD
      ansible.builtin.file:
        path: "{{ k3s_server_location }}"
        state: directory
        mode: '0755'
        owner: root
        group: root
      when: k3s_server_location is defined
  roles:
    - role: k3s_networking
    - role: k3s.orchestration.k3s_server

- name: Fetch K3s Token
  hosts: server
  become: true
  gather_facts: false
  tags: [k3s, k3s_agent]
  tasks:
    - name: Check for node-token
      ansible.builtin.stat:
        path: "{{ k3s_server_location | default('/var/lib/rancher/k3s') }}/server/node-token"
      register: _node_token_stat

    - name: Read node-token
      ansible.builtin.slurp:
        src: "{{ k3s_server_location | default('/var/lib/rancher/k3s') }}/server/node-token"
      register: _node_token_content
      when: _node_token_stat.stat.exists

    - name: Set token fact
      ansible.builtin.set_fact:
        token: "{{ _node_token_content.content | b64decode | trim }}"
      when: _node_token_stat.stat.exists

- name: Setup K3S agent
  hosts: agent
  become: true
  tags: [k3s, k3s_agent]
  pre_tasks:
    - name: Ensure systemd is reloaded before agent setup
      ansible.builtin.systemd:
        daemon_reload: true
  roles:
    - role: k3s.orchestration.k3s_agent

- name: Label K3s nodes
  hosts: server[0]
  become: true
  tags: [k3s, k3s_labels]
  roles:
    - role: k3s_labels

- name: Configure Vault Integration (Kubernetes Auth)
  hosts: server[0]
  gather_facts: true
  become: true
  tags: [k3s, k3s_vault_config]
  pre_tasks:
    - name: Load cluster init JSON # noqa: run-once
      ansible.builtin.slurp:
        src: "{{ vault_init_export_path | expanduser }}"
      register: _cluster_init_content
      delegate_to: localhost
      run_once: true
      become: false

    - name: Set vault_root_token fact
      ansible.builtin.set_fact:
        vault_root_token: "{{ (_cluster_init_content.content | b64decode | from_json).root_token }}"
      when: _cluster_init_content.content is defined
  roles:
    - role: k3s_vault_config

- name: Setup Longhorn OS Dependencies
  hosts: k3s_cluster
  gather_facts: true
  become: true
  tags: [k3s, k3s_longhorn]
  roles:
    - role: k3s_longhorn

- name: Fetch K3s Kubeconfig
  hosts: server[0]
  become: true
  gather_facts: false
  tags: [k3s, k3s_kubeconfig]
  tasks:
    - name: Slurp k3s.yaml
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: _k3s_yaml_content

- name: Configure Local Kubeconfig
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [k3s, k3s_kubeconfig]
  vars:
    # URL for external access (Direct to API VIP to support client-cert auth)
    k3s_external_url: "https://{{ hostvars[groups['server'][0]]['k3s_api_vip'] }}:6443"
  tasks:
    - name: Ensure ~/.kube directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: '0700'

    - name: Check for existing config
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
      register: _kube_config_stat

    - name: Backup existing config
      ansible.builtin.copy:
        src: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
        dest: "{{ ansible_env.HOME }}/.kube/k3s.yaml.bak.{{ ansible_date_time.iso8601_basic_short | default('now') }}"
        mode: '0600'
      when: _kube_config_stat.stat.exists

    - name: Write new kubeconfig
      ansible.builtin.copy:
        content: "{{ hostvars[groups['server'][0]]['_k3s_yaml_content'].content | b64decode }}"
        dest: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
        mode: '0600'

    - name: Update server URL in kubeconfig
      ansible.builtin.replace:
        path: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
        regexp: 'server: https://127.0.0.1:6443'
        replace: "server: {{ k3s_external_url }}"

    - name: Rename context to k3s
      ansible.builtin.shell: |
        set -o pipefail
        if kubectl config get-contexts default --kubeconfig={{ ansible_env.HOME }}/.kube/k3s.yaml >/dev/null 2>&1; then
          kubectl config rename-context default k3s --kubeconfig={{ ansible_env.HOME }}/.kube/k3s.yaml
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Show success message
      ansible.builtin.debug:
        msg: >-
          Kubeconfig saved to {{ ansible_env.HOME }}/.kube/k3s.yaml (context: k3s).
          To use it, run: export KUBECONFIG={{ ansible_env.HOME }}/.kube/config:{{ ansible_env.HOME }}/.kube/k3s.yaml
          or add that line to your shell profile.

- name: Deploy ArgoCD (GitOps Bootstrap)
  hosts: server[0]
  become: true
  tags: [k3s, k3s_argocd]
  roles:
    - role: k3s_argocd
