---
- name: "Setup Etcd for Patroni + keepalived"
  hosts: etcd_cluster
  gather_facts: true
  become: true
  tags: [k3s, etcd, postgres]
  roles:
    - role: etcd
      tags: [k3s, etcd]

- name: "Verify Etcd Cluster Health"
  hosts: postgres
  gather_facts: false
  become: false
  tags: [k3s, etcd, postgres]
  tasks:
    - name: Wait for Etcd health endpoint
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(ansible_facts.default_ipv4.address) }}:2379/health"
        status_code: 200
      register: _etcd_health
      retries: 15
      delay: 2
      until: _etcd_health.status == 200
      tags: [k3s, etcd]

- name: "Setup Postgres Leader"
  hosts: postgres_leader
  gather_facts: true
  become: true
  tags: [k3s, postgres]
  roles:
    - role: postgres
      tags: [k3s, postgres]

- name: "Setup Postgres replicas"
  hosts: postgres_replica
  gather_facts: true
  become: true
  tags: [k3s, postgres]
  roles:
    - role: postgres
      tags: [k3s, postgres]

- name: "Verify Postgres VIP and HAProxy Readiness"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [k3s, postgres]
  tasks:
    - name: Wait for Postgres VIP to respond on HAProxy port
      ansible.builtin.wait_for:
        host: "{{ global_k3s_db_host }}"
        port: "{{ global_k3s_db_port }}"
        state: started
        timeout: 60
      tags: [k3s, postgres]

- name: "Setup K3s Load Balancer"
  hosts: server
  gather_facts: true
  become: true
  tags: [k3s, k3s_lb]
  roles:
    - role: k3s_lb
      tags: [k3s, k3s_lb]

- name: Cluster prep
  hosts: k3s_cluster
  gather_facts: true
  become: true
  tags: [k3s, k3s_prep]
  pre_tasks:
  roles:
    - role: k3s.orchestration.prereq
      tags: [k3s, k3s_prep]
    - role: k3s.orchestration.raspberrypi
      tags: [k3s, k3s_prep]

- name: Setup K3S server
  hosts: server
  become: true
  serial: 1
  tags: [k3s, k3s_server]
  pre_tasks:
    - name: Set token fact from k3s_cluster_token
      ansible.builtin.set_fact:
        token: "{{ k3s_cluster_token }}"
      when: k3s_cluster_token is defined
      tags: [k3s, k3s_server]
  roles:
    - role: k3s_nvidia
      when:
        - k3s_node_labels['accelerator.nvidia.com/gpu.present'] | default('false') | bool
      tags: [k3s, k3s_server, k3s_nvidia]
    - role: k3s.orchestration.k3s_server
      tags: [k3s, k3s_server]

- name: Fetch K3s Token
  hosts: server
  become: true
  gather_facts: false
  tags: [k3s, k3s_agent]
  tasks:
    - name: Check for node-token
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/node-token
      register: _node_token_stat
      tags: [k3s, k3s_agent]

    - name: Read node-token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: _node_token_content
      when: _node_token_stat.stat.exists
      tags: [k3s, k3s_agent]

    - name: Set token fact
      ansible.builtin.set_fact:
        token: "{{ _node_token_content.content | b64decode | trim }}"
      when: _node_token_stat.stat.exists
      tags: [k3s, k3s_agent]

- name: Setup K3S agent
  hosts: agent
  become: true
  tags: [k3s, k3s_agent]
  pre_tasks:
    - name: Ensure systemd is reloaded before agent setup
      ansible.builtin.systemd:
        daemon_reload: true
  roles:
    - role: k3s.orchestration.k3s_agent
      tags: [k3s, k3s_agent]

- name: Label K3s nodes
  hosts: server[0]
  become: true
  tags: [k3s, k3s_labels]
  roles:
    - role: k3s_labels
      tags: [k3s, k3s_labels]

- name: Configure Vault Integration (Kubernetes Auth)
  hosts: server[0]
  gather_facts: true
  become: true
  tags: [k3s, vault, k3s_vault_config]
  pre_tasks:
    - name: "Load cluster init JSON" # noqa: run-once[task]
      ansible.builtin.slurp:
        src: "{{ vault_init_export_path | expanduser }}"
      register: _cluster_init_content
      delegate_to: localhost
      run_once: true # noqa: run-once
      become: false

    - name: Set vault_root_token fact
      ansible.builtin.set_fact:
        vault_root_token: "{{ (_cluster_init_content.content | b64decode | from_json).root_token }}"
      when:
        - _cluster_init_content.content is defined
        - (_cluster_init_content.content | b64decode | regex_search('^\\s*[{\\[]')) | length > 0

    - name: Find active Vault leader
      ansible.builtin.command: vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ global_vault_api_port | default(18200) }}"
        VAULT_SKIP_VERIFY: "true"
      register: _vault_node_status
      delegate_to: "{{ item }}"
      with_items: "{{ groups['vault_cluster'] }}"
      become: false
      failed_when: false
      changed_when: false

    - name: Set Vault Leader Fact
      ansible.builtin.set_fact:
        active_vault_leader: "{{ item.item }}"
      with_items: "{{ _vault_node_status.results }}"
      vars:
        _status: "{{ item.stdout | from_json }}"
      when:
        - item.rc == 0
        - item.item in groups['vault_cluster']
        - item.item not in (groups['vault_transit'] | default([]))
        - _status.ha_enabled | default(false)
        - _status.cluster_name | default('') == (global_vault_cluster_name | default('homelab-vault'))
        # A node is a leader if standby is explicitly false OR it's the active node
        - >-
          _status.standby | default(true) == false or
          _status.is_self | default(false) == true
      # Ensure we only pick the first one that matches
      run_once: true

    - name: Fallback to first vault_leader if no active leader found (for single node or early bootstrap)
      ansible.builtin.set_fact:
        active_vault_leader: "{{ groups['vault_leader'][0] }}"
      when: active_vault_leader is not defined

    - name: Verify local vault_root_token validity
      ansible.builtin.command: vault token lookup
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ global_vault_api_port | default(18200) }}"
        VAULT_TOKEN: "{{ vault_root_token }}"
        VAULT_SKIP_VERIFY: "true"
      delegate_to: "{{ active_vault_leader }}"
      become: false
      register: _local_token_verify
      until: _local_token_verify.rc == 0
      retries: 10
      delay: 5
      ignore_errors: true
      when:
        - vault_root_token is defined
        - vault_root_token | length > 0
        - active_vault_leader is defined

    - name: Check for /root/.vault-token on leader if local token is missing or invalid
      ansible.builtin.slurp:
        src: /root/.vault-token
      register: _leader_token_slurp
      delegate_to: "{{ active_vault_leader }}"
      when:
        - active_vault_leader is defined
        - (vault_root_token is not defined or vault_root_token | length == 0) or (_local_token_verify.rc | default(1) != 0)
      ignore_errors: true

    - name: Set vault_root_token from leader host if local was missing or invalid
      ansible.builtin.set_fact:
        vault_root_token: "{{ _leader_token_slurp.content | b64decode | trim }}"
      when:
        - _leader_token_slurp.content is defined
        - (vault_root_token is not defined or vault_root_token | length == 0 or _local_token_verify.rc | default(1) != 0)

    - name: Verify recovered vault_root_token validity
      ansible.builtin.command: vault token lookup
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ global_vault_api_port | default(18200) }}"
        VAULT_TOKEN: "{{ vault_root_token }}"
        VAULT_SKIP_VERIFY: "true"
      delegate_to: "{{ active_vault_leader }}"
      become: false
      register: _recovered_token_verify
      until: _recovered_token_verify.rc == 0
      retries: 10
      delay: 5
      ignore_errors: true
      when:
        - _leader_token_slurp.content is defined
        - (_local_token_verify.rc | default(1) != 0)

    - name: "Update local cluster init JSON if token was recovered from leader and is valid" # noqa: run-once[task]
      ansible.builtin.copy:
        dest: "{{ vault_init_export_path | expanduser }}"
        mode: '0600'
        content: |
          {{
            (_cluster_init_content.content | default('e30=') | b64decode | from_json)
            | combine({'root_token': vault_root_token})
            | to_nice_json
          }}
      delegate_to: localhost
      run_once: true # noqa: run-once
      become: false
      when:
        - _recovered_token_verify.rc | default(1) == 0
        - (_local_token_verify.rc | default(1) != 0)

    - name: Fail if vault_root_token is still invalid after recovery attempt
      ansible.builtin.fail:
        msg: |
          The Vault Root Token is invalid and recovery from leader host also failed or returned an invalid token.

          Current token (from local cluster-init.json): {{ vault_root_token | default('N/A') }}
          Vault API Status (local verify): {{ _local_token_verify.rc | default('N/A') }}
          Vault API Status (recovered verify): {{ _recovered_token_verify.rc | default('N/A') }}

          HINT: Since you just performed a 'nuke' reset, your local 'cluster-init.json' is stale.
          Please run the 'vault' role first to re-initialize Vault and generate a new token:
          ansible-playbook playbooks/setup.yml -t vault

          Alternatively, verify Vault status manually: ssh {{ active_vault_leader | default('homeserver') }} "vault status"
      when:
        - (_local_token_verify.rc | default(1) != 0)
        - (_recovered_token_verify.rc | default(1) != 0)
  roles:
    - role: k3s_vault_config
      tags: [k3s, vault, k3s_vault_config]

- name: Setup Longhorn OS Dependencies
  hosts: k3s_cluster
  gather_facts: true
  become: true
  tags: [k3s, k3s_longhorn]
  roles:
    - role: k3s_longhorn
      tags: [k3s, longhorn]

- name: Fetch K3s Kubeconfig
  hosts: server[0]
  become: true
  gather_facts: false
  tags: [k3s, k3s_kubeconfig]
  tasks:
    - name: Slurp k3s.yaml
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: _k3s_yaml_content

- name: Configure Local Kubeconfig
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [k3s, k3s_kubeconfig]
  vars:
    # URL for external access (Direct to API VIP to support client-cert auth)
    k3s_external_url: "https://{{ hostvars[groups['server'][0]]['k3s_api_vip'] }}:6443"
  tasks:
    - name: Ensure ~/.kube directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: '0700'

    - name: Check for existing config
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
      register: _kube_config_stat

    - name: Backup existing config
      ansible.builtin.copy:
        src: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
        dest: "{{ ansible_env.HOME }}/.kube/k3s.yaml.bak.{{ ansible_date_time.iso8601_basic_short | default('now') }}"
        mode: '0600'
      when: _kube_config_stat.stat.exists

    - name: Write new kubeconfig
      ansible.builtin.copy:
        content: "{{ hostvars[groups['server'][0]]['_k3s_yaml_content'].content | b64decode }}"
        dest: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
        mode: '0600'

    - name: Update server URL in kubeconfig
      ansible.builtin.replace:
        path: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
        regexp: 'server: https://127.0.0.1:6443'
        replace: "server: {{ k3s_external_url }}"

    - name: Rename context to k3s
      ansible.builtin.shell: |
        set -o pipefail
        if kubectl config get-contexts default --kubeconfig={{ ansible_env.HOME }}/.kube/k3s.yaml >/dev/null 2>&1; then
          kubectl config rename-context default k3s --kubeconfig={{ ansible_env.HOME }}/.kube/k3s.yaml
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Show success message
      ansible.builtin.debug:
        msg: >-
          Kubeconfig saved to {{ ansible_env.HOME }}/.kube/k3s.yaml (context: k3s).
          To use it, run: export KUBECONFIG={{ ansible_env.HOME }}/.kube/config:{{ ansible_env.HOME }}/.kube/k3s.yaml
          or add that line to your shell profile.

- name: Install Sealed Secrets
  hosts: server[0]
  become: true
  tags: [k3s, k3s_sealed_secret]
  roles:
    - role: k3s_sealed_secret

- name: Deploy ArgoCD (GitOps Bootstrap)
  hosts: server[0]
  become: true
  tags: [k3s, k3s_argocd]
  roles:
    - role: k3s_argocd
