---
- name: "Setup Postgres for HA k3s"
  hosts: postgres
  gather_facts: true
  become: true
  tags: [k3s, postgres]
  roles:
    - role: postgres

- name: Cluster prep
  hosts: k3s_cluster
  gather_facts: true
  become: true
  tags: [k3s, k3s_prep]
  roles:
    - role: k3s.orchestration.prereq
    - role: k3s.orchestration.raspberrypi

- name: Setup K3S server
  hosts: server
  become: true
  tags: [k3s, k3s_server]
  roles:
    - role: k3s_networking
    - role: k3s.orchestration.k3s_server

- name: Fetch K3s Token
  hosts: server
  become: true
  gather_facts: false
  tags: [k3s, k3s_agent]
  tasks:
    - name: Check for node-token
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/node-token
      register: _node_token_stat

    - name: Read node-token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: _node_token_content
      when: _node_token_stat.stat.exists

    - name: Set token fact
      ansible.builtin.set_fact:
        token: "{{ _node_token_content.content | b64decode | trim }}"
      when: _node_token_stat.stat.exists

- name: Setup K3S agent
  hosts: agent
  become: true
  tags: [k3s, k3s_agent]
  roles:
    - role: k3s.orchestration.k3s_agent

- name: Label K3s nodes
  hosts: server[0]
  become: true
  tags: [k3s, k3s_labels]
  roles:
    - role: k3s_labels

- name: Configure K3s Traefik
  hosts: server
  become: true
  tags: [k3s, k3s_server, traefik]
  roles:
    - role: k3s_traefik

- name: Deploy K3s Monitoring (metrics-server, kube-state-metrics)
  hosts: server
  gather_facts: true
  become: true
  tags: [k3s, k3s_monitoring]
  roles:
    - role: k3s_monitoring

- name: Deploy K3s Certs (Cert-Manager, Vault Issuer)
  hosts: server
  gather_facts: true
  become: true
  tags: [k3s, k3s_certs]
  pre_tasks:
    - name: Load cluster init JSON # noqa: run-once
      ansible.builtin.slurp:
        src: "{{ vault_init_export_path | expanduser }}"
      register: _cluster_init_content
      delegate_to: localhost
      run_once: true
      become: false

    - name: Set vault_root_token fact
      ansible.builtin.set_fact:
        vault_root_token: "{{ (_cluster_init_content.content | b64decode | from_json).root_token }}"
      when: _cluster_init_content.content is defined
  roles:
    - role: k3s_certs

- name: Deploy K3s Security (Namespace restriction, Gatekeeper)
  hosts: server
  gather_facts: true
  become: true
  tags: [k3s, k3s_security]
  roles:
    - role: k3s_security

- name: Deploy Longhorn
  hosts: k3s_cluster
  gather_facts: true
  become: true
  tags: [k3s, longhorn]
  roles:
    - role: longhorn

- name: Update Prometheus configuration with K3s token
  hosts: prometheus
  gather_facts: true
  become: false
  tags: [k3s, k3s_monitoring, prometheus]
  roles:
    - role: prometheus

- name: Fetch K3s Kubeconfig
  hosts: server[0]
  become: true
  gather_facts: false
  tags: [k3s, k3s_kubeconfig]
  tasks:
    - name: Slurp k3s.yaml
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: _k3s_yaml_content

- name: Configure Local Kubeconfig
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [k3s, k3s_kubeconfig]
  vars:
    # URL for external access (Direct to API VIP to support client-cert auth)
    k3s_external_url: "https://{{ hostvars[groups['server'][0]]['k3s_api_vip'] }}:6443"
  tasks:
    - name: Ensure ~/.kube directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: '0700'

    - name: Check for existing config
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
      register: _kube_config_stat

    - name: Backup existing config
      ansible.builtin.copy:
        src: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
        dest: "{{ ansible_env.HOME }}/.kube/k3s.yaml.bak.{{ ansible_date_time.iso8601_basic_short | default('now') }}"
        mode: '0600'
      when: _kube_config_stat.stat.exists

    - name: Write new kubeconfig
      ansible.builtin.copy:
        content: "{{ hostvars[groups['server'][0]]['_k3s_yaml_content'].content | b64decode }}"
        dest: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
        mode: '0600'

    - name: Update server URL in kubeconfig
      ansible.builtin.replace:
        path: "{{ ansible_env.HOME }}/.kube/k3s.yaml"
        regexp: 'server: https://127.0.0.1:6443'
        replace: "server: {{ k3s_external_url }}"

    - name: Rename context to k3s
      ansible.builtin.shell: |
        set -o pipefail
        if kubectl config get-contexts default --kubeconfig={{ ansible_env.HOME }}/.kube/k3s.yaml >/dev/null 2>&1; then
          kubectl config rename-context default k3s --kubeconfig={{ ansible_env.HOME }}/.kube/k3s.yaml
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Show success message
      ansible.builtin.debug:
        msg: >-
          Kubeconfig saved to {{ ansible_env.HOME }}/.kube/k3s.yaml (context: k3s).
          To use it, run: export KUBECONFIG={{ ansible_env.HOME }}/.kube/config:{{ ansible_env.HOME }}/.kube/k3s.yaml
          or add that line to your shell profile.
