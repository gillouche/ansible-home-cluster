---
- name: "Restore Dry Run: Validate prerequisites"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_dry_run]
  vars_files:
    - ../../../inventories/group_vars/all/main.yml
    - ../../../inventories/group_vars/k3s_cluster/main.yml
  tasks:
    - name: Check Etcd health on all servers
      ansible.builtin.uri:
        url: "http://{{ hostvars[item].ansible_host }}:2379/health"
        status_code: 200
      loop: "{{ groups['server'] | sort }}"
      register: _etcd_checks
      failed_when: false

    - name: Report Etcd status
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ 'HEALTHY' if item.status == 200 else 'DOWN' }}"
      loop: "{{ _etcd_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check Patroni health on all servers
      ansible.builtin.uri:
        url: "http://{{ hostvars[item].ansible_host }}:8008/health"
        status_code: [200, 503]
      loop: "{{ groups['server'] | sort }}"
      register: _patroni_checks
      failed_when: false

    - name: Report Patroni status
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ 'HEALTHY' if item.status in [200, 503] else 'DOWN' }}"
      loop: "{{ _patroni_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check Postgres VIP reachability
      ansible.builtin.wait_for:
        host: "{{ k3s_db_host }}"
        port: "{{ k3s_db_port }}"
        timeout: 5
      register: _pg_vip
      failed_when: false

    - name: Report Postgres VIP
      ansible.builtin.debug:
        msg: "Postgres VIP {{ k3s_db_host }}:{{ k3s_db_port }}: {{ 'REACHABLE' if _pg_vip is not failed else 'UNREACHABLE' }}"

    - name: Check K3s API VIP reachability
      ansible.builtin.uri:
        url: "https://{{ k3s_api_vip }}:6443/healthz"
        validate_certs: false
        status_code: [200, 401, 403]
        timeout: 5
      register: _api_vip
      failed_when: false

    - name: Report K3s API VIP
      ansible.builtin.debug:
        msg: >-
          K3s API VIP {{ k3s_api_vip }}:6443:
          {{ 'REACHABLE' if _api_vip.status | default(0) in [200, 401, 403]
             else 'UNREACHABLE (expected if k3s is stopped)' }}

- name: "Restore Dry Run: Validate node connectivity"
  hosts: k3s_cluster
  gather_facts: false
  tags: [restore_dry_run]
  tasks:
    - name: Ping node
      ansible.builtin.ping:
      register: _ping
      failed_when: false

    - name: Report connectivity
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ 'REACHABLE' if _ping is not failed else 'UNREACHABLE' }}"

- name: "Restore Dry Run: Validate storage"
  hosts: server
  gather_facts: false
  become: true
  tags: [restore_dry_run]
  tasks:
    - name: Check NVMe mount
      ansible.builtin.stat:
        path: /mnt/ssd_nvme
      register: _nvme

    - name: Report storage
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} /mnt/ssd_nvme: {{ 'MOUNTED' if _nvme.stat.exists else 'MISSING' }}"

- name: "Restore Dry Run: Report tier plan"
  hosts: server[0]
  gather_facts: false
  tags: [restore_dry_run]
  vars_files:
    - ../../../inventories/group_vars/k3s_cluster/main.yml
  tasks:
    - name: Display tier plan
      ansible.builtin.debug:
        msg: >-
          Tier {{ ansible_loop.index0 }}: {{ item.name }}
          | Apps: {{ item.apps | join(', ') if item.apps != '__remaining__' else 'ALL REMAINING' }}
          | Timeout: {{ item.timeout | default(300) }}s
          | Health checks: {{ item.health_checks | length | default(0) }}
          | Pre-actions: {{ item.pre_actions | default([]) | join(', ') or 'none' }}
          | Post-actions: {{ item.post_actions | default([]) | join(', ') or 'none' }}
      loop: "{{ argocd_restore_tiers }}"
      loop_control:
        extended: true
        label: "{{ item.name }}"

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          Dry run complete. {{ argocd_restore_tiers | length }} tiers configured.
          Total apps across all tiers:
          {{ argocd_restore_tiers | map(attribute='apps')
             | select('ne', '__remaining__') | map('length') | sum }}.
          Run 'ansible-playbook playbooks/restore.yml --tags restore_k3s' to execute.
