---
# ==============================================================================
# Restore K3s Cluster
# ==============================================================================
# Verifies infrastructure dependencies (etcd, Postgres) are healthy,
# starts control planes with flannel recovery, starts agents,
# uncordons all nodes, and re-enables ArgoCD.

# ------------------------------------------------------------------------------
# 1. Verify infrastructure dependencies
# ------------------------------------------------------------------------------
- name: "Restore K3s: Verify infrastructure dependencies"
  hosts: server
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Ensure etcd container is running
      ansible.builtin.systemd:
        name: container-etcd
        state: started

    - name: Verify etcd is healthy
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:2379/health"
        status_code: 200
      register: _etcd_health
      retries: 15
      delay: 2
      until: _etcd_health.status == 200

    - name: Ensure postgres container is running
      ansible.builtin.systemd:
        name: container-postgres
        state: started

    - name: Wait for Patroni API to respond
      ansible.builtin.uri:
        url: "http://127.0.0.1:8008/health"
        method: GET
        status_code: [200, 503]
      register: _patroni_health
      retries: 30
      delay: 5
      until: _patroni_health.status in [200, 503]

# ------------------------------------------------------------------------------
# 1b. Heal Postgres replicas (auto-reinit diverged timelines)
# ------------------------------------------------------------------------------
- name: "Restore K3s: Heal Postgres replicas"
  import_playbook: ../maintenance/postgres_heal.yml
  tags: [restore_k3s, postgres_heal]

- name: "Restore K3s: Verify Postgres VIP is reachable"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [restore_k3s]
  tasks:
    - name: Wait for Postgres VIP to respond
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['server'][0]]['k3s_db_host'] }}"
        port: "{{ hostvars[groups['server'][0]]['k3s_db_port'] }}"
        state: started
        timeout: 60

# ------------------------------------------------------------------------------
# 2. Start control planes (serial, one at a time)
# ------------------------------------------------------------------------------
- name: "Restore K3s: Start homeserver (Primary Control Plane)"
  hosts: homeserver
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: ../maintenance/k3s_flannel_fix.yml

    - name: Start k3s service
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate homeserver is Ready
      ansible.builtin.include_tasks: ../maintenance/k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Uncordon homeserver
      ansible.builtin.include_tasks: ../maintenance/k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

- name: "Restore K3s: Start homeserver2 (Secondary Control Plane)"
  hosts: homeserver2
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: ../maintenance/k3s_flannel_fix.yml

    - name: Start k3s service
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate homeserver2 is Ready
      ansible.builtin.include_tasks: ../maintenance/k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Uncordon homeserver2
      ansible.builtin.include_tasks: ../maintenance/k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

- name: "Restore K3s: Start homeserver3 (Tertiary Control Plane)"
  hosts: homeserver3
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: ../maintenance/k3s_flannel_fix.yml

    - name: Start k3s service
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate homeserver3 is Ready
      ansible.builtin.include_tasks: ../maintenance/k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Uncordon homeserver3
      ansible.builtin.include_tasks: ../maintenance/k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

# ------------------------------------------------------------------------------
# 3. Post control-plane: delete blocking webhooks
# ------------------------------------------------------------------------------
- name: "Restore K3s: Delete blocking webhooks"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Delete blocking webhook configurations
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop: "{{ k3s_blocking_webhooks }}"
      register: _webhook_delete
      retries: 5
      delay: 10
      until: _webhook_delete.rc == 0
      changed_when: false

# ------------------------------------------------------------------------------
# 4. Start agents
# ------------------------------------------------------------------------------
- name: "Restore K3s: Start agents"
  hosts: agent
  gather_facts: false
  tags: [restore_k3s]
  tasks:
    - name: Start k3s-agent service
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        enabled: true
        daemon_reload: true
      become: true

# ------------------------------------------------------------------------------
# 5. Uncordon all agents
# ------------------------------------------------------------------------------
- name: "Restore K3s: Uncordon agents"
  hosts: agent
  gather_facts: false
  tags: [restore_k3s]
  tasks:
    - name: Uncordon agent
      ansible.builtin.include_tasks: ../maintenance/k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

# ------------------------------------------------------------------------------
# 6. Validate agents (non-fatal per node)
# ------------------------------------------------------------------------------
- name: "Restore K3s: Validate agents"
  hosts: agent
  gather_facts: false
  tags: [restore_k3s]
  tasks:
    - name: Check if agent is Ready
      ansible.builtin.command: kubectl get node {{ inventory_hostname }} --no-headers
      delegate_to: localhost
      register: _agent_status
      until: "'Ready' in _agent_status.stdout and 'NotReady' not in _agent_status.stdout"
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false

    - name: Warn if agent is not Ready
      ansible.builtin.debug:
        msg: "WARNING: {{ inventory_hostname }} is not Ready: {{ _agent_status.stdout | default('unknown') }}"
      when: _agent_status.rc != 0 or 'NotReady' in (_agent_status.stdout | default(''))

# ------------------------------------------------------------------------------
# 6b. Delete Longhorn webhooks (post-agent startup)
# ------------------------------------------------------------------------------
# Longhorn recreates its admission webhooks once the manager pods start.
# During restore, these webhooks time out and block volume attach/detach
# operations. Delete them again now that all nodes are up; ArgoCD will
# recreate them once the cluster stabilises.
- name: "Restore K3s: Delete blocking webhooks (post-agent)"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Delete blocking webhook configurations to unblock volumes
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop: "{{ k3s_blocking_webhooks }}"
      register: _webhook_post_delete
      retries: 5
      delay: 10
      until: _webhook_post_delete.rc == 0
      changed_when: "'deleted' in (_webhook_post_delete.stdout | default(''))"

    - name: Check if ArgoCD auto-sync is already enabled (idempotency guard)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get applications -n argocd -o json \
            | jq -r '[.items[] | select(.spec.syncPolicy.automated != null)] | length'
        executable: /bin/bash
      register: _autosync_count
      changed_when: false
      failed_when: false

    - name: Scale down all non-core deployments to prevent thundering herd
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get deployments --all-namespaces -o json \
            | jq -r '.items[]
              | select(.metadata.namespace != "kube-system")
              | select(.metadata.namespace != "argocd")
              | select(.metadata.namespace != "longhorn-system")
              | select(.spec.replicas > 0)
              | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r ns name; do
                k3s kubectl scale deployment "$name" -n "$ns" --replicas=0 2>/dev/null || true
              done
        executable: /bin/bash
      changed_when: false
      failed_when: false
      when: (_autosync_count.stdout | default('0') | int) == 0

    - name: Scale down all non-core statefulsets to prevent thundering herd
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get statefulsets --all-namespaces -o json \
            | jq -r '.items[]
              | select(.metadata.namespace != "kube-system")
              | select(.metadata.namespace != "argocd")
              | select(.metadata.namespace != "longhorn-system")
              | select(.spec.replicas > 0)
              | "\(.metadata.namespace) \(.metadata.name)"' \
            | while read -r ns name; do
                k3s kubectl scale statefulset "$name" -n "$ns" --replicas=0 2>/dev/null || true
              done
        executable: /bin/bash
      changed_when: false
      failed_when: false
      when: (_autosync_count.stdout | default('0') | int) == 0

# ------------------------------------------------------------------------------
# 7. Final validation & tiered ArgoCD re-enable
# ------------------------------------------------------------------------------
- name: "Restore K3s: Pre-validation"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Wait for API server to be responsive
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: _api_check
      retries: 12
      delay: 10
      until: _api_check.rc == 0
      changed_when: false

    - name: Verify all nodes are Ready (warn only)
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get nodes --no-headers | grep 'NotReady' || true
      args:
        executable: /bin/bash
      register: _not_ready_nodes
      changed_when: false

    - name: Warn about NotReady nodes
      ansible.builtin.debug:
        msg: "WARNING: Some nodes are still NotReady: {{ _not_ready_nodes.stdout }}"
      when: _not_ready_nodes.stdout | trim | length > 0

    - name: Validate ArgoCD is available
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=available --timeout=300s
        deployment/{{ item.name }} -n {{ item.ns }}
      loop:
        - { name: 'argocd-server', ns: 'argocd' }
        - { name: 'argocd-repo-server', ns: 'argocd' }
      register: _app_wait
      retries: 3
      delay: 15
      until: _app_wait.rc == 0
      changed_when: false

- name: "Restore K3s: Check control plane resources"
  hosts: server
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Check control plane health
      ansible.builtin.include_tasks: ../maintenance/controlplane_resource_check.yml

- name: "Restore K3s: Tiered ArgoCD re-enable"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_k3s]
  vars_files:
    - ../../../inventories/group_vars/k3s_cluster/main.yml
  tasks:
    - name: Enable ArgoCD apps tier by tier
      ansible.builtin.include_tasks: ../maintenance/argocd_tiered_sync.yml
      vars:
        tier_name: "{{ tier.name }}"
        tier_apps: "{{ tier.apps }}"
        tier_timeout: "{{ tier.timeout | default(300) }}"
      loop: "{{ argocd_restore_tiers }}"
      loop_control:
        loop_var: tier
        label: "{{ tier.name }}"

    - name: Run health gate for tier
      ansible.builtin.include_tasks: ../maintenance/argocd_health_gate.yml
      vars:
        health_checks: "{{ tier.health_checks | default([]) }}"
        gate_timeout: "{{ tier.timeout | default(300) }}"
        pre_actions: "{{ tier.pre_actions | default([]) }}"
        post_actions: "{{ tier.post_actions | default([]) }}"
      loop: "{{ argocd_restore_tiers }}"
      loop_control:
        loop_var: tier
        label: "{{ tier.name }}"

    - name: Clean up Failed pods cluster-wide
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get pods --all-namespaces --field-selector status.phase=Failed \
          -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
          | while read -r ns name; do
              [ -n "$ns" ] && k3s kubectl delete pod "$name" -n "$ns" --force --grace-period=0
            done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

- name: "Restore K3s: Post-restore health check"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Run post-restore health monitor
      ansible.builtin.include_tasks: ../maintenance/restore_health_monitor.yml

    - name: Cluster restore complete
      ansible.builtin.debug:
        msg: >-
          K3s cluster restored. Tiered ArgoCD re-enable complete.
          Check ArgoCD UI for application health status.
