---
# ==============================================================================
# Restore K3s Cluster
# ==============================================================================
# Starts control planes with flannel recovery, starts agents,
# uncordons all nodes, and re-enables ArgoCD.

# ------------------------------------------------------------------------------
# 0. Stop keepalived to remove VIPs before flannel initializes
# ------------------------------------------------------------------------------
- name: "Restore K3s: Stop keepalived on all control planes"
  hosts: server
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Stop keepalived to remove VIPs
      ansible.builtin.systemd:
        name: keepalived
        state: stopped
      failed_when: false

# ------------------------------------------------------------------------------
# 1. Start control planes (serial, one at a time)
# ------------------------------------------------------------------------------
- name: "Restore K3s: Start homeserver (Primary Control Plane)"
  hosts: homeserver
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: ../maintenance/k3s_flannel_fix.yml

    - name: Start k3s service
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate homeserver is Ready
      ansible.builtin.include_tasks: ../maintenance/k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Uncordon homeserver
      ansible.builtin.include_tasks: ../maintenance/k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

- name: "Restore K3s: Start homeserver2 (Secondary Control Plane)"
  hosts: homeserver2
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: ../maintenance/k3s_flannel_fix.yml

    - name: Start k3s service
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate homeserver2 is Ready
      ansible.builtin.include_tasks: ../maintenance/k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Uncordon homeserver2
      ansible.builtin.include_tasks: ../maintenance/k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

- name: "Restore K3s: Start homeserver3 (Tertiary Control Plane)"
  hosts: homeserver3
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Ensure flannel subnet.env exists
      ansible.builtin.include_tasks: ../maintenance/k3s_flannel_fix.yml

    - name: Start k3s service
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true

    - name: Wait for K3s API port (6443)
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        delay: 10
        timeout: 300

    - name: Validate homeserver3 is Ready
      ansible.builtin.include_tasks: ../maintenance/k3s_validate_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

    - name: Uncordon homeserver3
      ansible.builtin.include_tasks: ../maintenance/k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

# ------------------------------------------------------------------------------
# 2. Post control-plane: delete blocking webhooks
# ------------------------------------------------------------------------------
- name: "Restore K3s: Delete blocking webhooks"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Delete blocking webhook configurations
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop: "{{ k3s_blocking_webhooks }}"
      register: _webhook_delete
      retries: 5
      delay: 10
      until: _webhook_delete.rc == 0
      changed_when: false

# ------------------------------------------------------------------------------
# 3. Start agents
# ------------------------------------------------------------------------------
- name: "Restore K3s: Start agents"
  hosts: agent
  gather_facts: false
  tags: [restore_k3s]
  tasks:
    - name: Start k3s-agent service
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        enabled: true
        daemon_reload: true
      become: true

# ------------------------------------------------------------------------------
# 4. Uncordon all agents
# ------------------------------------------------------------------------------
- name: "Restore K3s: Uncordon agents"
  hosts: agent
  gather_facts: false
  tags: [restore_k3s]
  tasks:
    - name: Uncordon agent
      ansible.builtin.include_tasks: ../maintenance/k3s_uncordon_node.yml
      vars:
        node_name: "{{ inventory_hostname }}"

# ------------------------------------------------------------------------------
# 5. Validate agents (non-fatal per node)
# ------------------------------------------------------------------------------
- name: "Restore K3s: Validate agents"
  hosts: agent
  gather_facts: false
  tags: [restore_k3s]
  tasks:
    - name: Check if agent is Ready
      ansible.builtin.command: kubectl get node {{ inventory_hostname }} --no-headers
      delegate_to: localhost
      register: _agent_status
      until: "'Ready' in _agent_status.stdout and 'NotReady' not in _agent_status.stdout"
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false

    - name: Warn if agent is not Ready
      ansible.builtin.debug:
        msg: "WARNING: {{ inventory_hostname }} is not Ready: {{ _agent_status.stdout | default('unknown') }}"
      when: _agent_status.rc != 0 or 'NotReady' in (_agent_status.stdout | default(''))

# ------------------------------------------------------------------------------
# 5b. Delete Longhorn webhooks (post-agent startup)
# ------------------------------------------------------------------------------
# Longhorn recreates its admission webhooks once the manager pods start.
# During restore, these webhooks time out and block volume attach/detach
# operations. Delete them again now that all nodes are up; ArgoCD will
# recreate them once the cluster stabilises.
- name: "Restore K3s: Delete blocking webhooks (post-agent)"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Delete blocking webhook configurations to unblock volumes
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop: "{{ k3s_blocking_webhooks }}"
      register: _webhook_post_delete
      retries: 5
      delay: 10
      until: _webhook_post_delete.rc == 0
      changed_when: "'deleted' in (_webhook_post_delete.stdout | default(''))"


# ------------------------------------------------------------------------------
# 5c. Start keepalived now that flannel has initialized with correct IPs
# ------------------------------------------------------------------------------
- name: "Restore K3s: Start keepalived"
  hosts: server
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Start keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: started
      failed_when: false

# ------------------------------------------------------------------------------
# 6. Final validation & ArgoCD auto-sync
# ------------------------------------------------------------------------------
- name: "Restore K3s: Pre-validation"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Wait for API server to be responsive
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: _api_check
      retries: 12
      delay: 10
      until: _api_check.rc == 0
      changed_when: false

    - name: Verify all nodes are Ready (warn only)
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get nodes --no-headers | grep 'NotReady' || true
      args:
        executable: /bin/bash
      register: _not_ready_nodes
      changed_when: false

    - name: Warn about NotReady nodes
      ansible.builtin.debug:
        msg: "WARNING: Some nodes are still NotReady: {{ _not_ready_nodes.stdout }}"
      when: _not_ready_nodes.stdout | trim | length > 0

    - name: Validate ArgoCD is available
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=available --timeout=300s
        deployment/{{ item.name }} -n {{ item.ns }}
      loop:
        - { name: 'argocd-server', ns: 'argocd' }
        - { name: 'argocd-repo-server', ns: 'argocd' }
      register: _app_wait
      retries: 3
      delay: 15
      until: _app_wait.rc == 0
      changed_when: false

- name: "Restore K3s: Check control plane resources"
  hosts: server
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Check control plane health
      ansible.builtin.include_tasks: ../maintenance/controlplane_resource_check.yml

# ------------------------------------------------------------------------------
# 7b. Rollout restart critical infrastructure
# ------------------------------------------------------------------------------
# After a node outage, pods may be running but in a degraded state (stale
# connections, expired caches, broken watches). A rollout restart ensures
# fresh pods for the services that gate external access and observability.
- name: "Restore K3s: Restart critical infrastructure"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Rollout restart critical deployments
      ansible.builtin.command: >
        k3s kubectl rollout restart deployment/{{ item.name }} -n {{ item.ns }}
      loop:
        - { name: traefik, ns: kube-system }
        - { name: authelia, ns: security }
        - { name: authelia-redis, ns: security }
        - { name: argocd-server, ns: argocd }
        - { name: argocd-repo-server, ns: argocd }
        - { name: monitoring-grafana, ns: monitoring }
        - { name: monitoring-kube-prometheus-operator, ns: monitoring }
      register: _restart
      failed_when: false
      changed_when: "'restarted' in (_restart.stdout | default(''))"

    - name: Wait for critical deployments to be available
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=available --timeout=180s
        deployment/{{ item.name }} -n {{ item.ns }}
      loop:
        - { name: traefik, ns: kube-system }
        - { name: authelia, ns: security }
        - { name: argocd-server, ns: argocd }
      register: _wait
      retries: 3
      delay: 10
      until: _wait.rc == 0
      changed_when: false

- name: "Restore K3s: Enable ArgoCD auto-sync and cleanup"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Enable ArgoCD auto-sync on all applications
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl get applications -n argocd -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
            | while read -r app; do
                [ -n "$app" ] && k3s kubectl patch application "$app" -n argocd --type merge \
                  -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}' 2>/dev/null || true
              done
        executable: /bin/bash
      changed_when: false

    - name: Delete blocking webhook configurations
      ansible.builtin.command: >
        k3s kubectl delete {{ item }} --ignore-not-found
      loop: "{{ k3s_blocking_webhooks }}"
      register: _result
      failed_when: false
      changed_when: "'deleted' in (_result.stdout | default(''))"

    - name: Clean up Failed pods cluster-wide
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl get pods --all-namespaces --field-selector status.phase=Failed \
          -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
          | while read -r ns name; do
              [ -n "$ns" ] && k3s kubectl delete pod "$name" -n "$ns" --force --grace-period=0
            done
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false

# ------------------------------------------------------------------------------
# 9. Detect and fix unhealthy workloads
# ------------------------------------------------------------------------------
# After restore, some pods may be running but degraded (broken pipes, DNS
# timeouts, stale connections). This step detects unhealthy deployments and
# statefulsets in critical namespaces and restarts them.
- name: "Restore K3s: Detect and fix unhealthy workloads"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Find deployments with unavailable replicas in critical namespaces
      ansible.builtin.shell: |
        set -o pipefail
        for ns in monitoring security argocd kube-system longhorn-system; do
          k3s kubectl get deploy -n "$ns" --no-headers 2>/dev/null \
            | awk -v ns="$ns" '$2 != $4 {print ns "/" $1}'
        done
      args:
        executable: /bin/bash
      register: _unhealthy_deploys
      changed_when: false

    - name: Find pods in CrashLoopBackOff or Error in critical namespaces
      ansible.builtin.shell: |
        set -o pipefail
        for ns in monitoring security argocd kube-system longhorn-system; do
          k3s kubectl get pods -n "$ns" --no-headers 2>/dev/null \
            | grep -E 'CrashLoopBackOff|Error|ImagePullBackOff' \
            | awk -v ns="$ns" '{print ns "/" $1}' || true
        done
      args:
        executable: /bin/bash
      register: _crashloop_pods
      changed_when: false

    - name: Find pods with high restart counts (>5) in critical namespaces
      ansible.builtin.shell: |
        set -o pipefail
        for ns in monitoring security argocd kube-system longhorn-system; do
          k3s kubectl get pods -n "$ns" --no-headers 2>/dev/null \
            | awk -v ns="$ns" '{
                split($2, ready, "/");
                restarts = $4;
                gsub(/[^0-9]/, "", restarts);
                if (restarts+0 > 5) print ns "/" $1 " restarts=" restarts
              }' || true
        done
      args:
        executable: /bin/bash
      register: _high_restart_pods
      changed_when: false

    - name: Restart unhealthy deployments
      ansible.builtin.shell: |
        set -o pipefail
        echo "{{ item }}" | IFS='/' read -r ns deploy
        k3s kubectl rollout restart "deployment/$deploy" -n "$ns"
      args:
        executable: /bin/bash
      loop: "{{ _unhealthy_deploys.stdout_lines | default([]) }}"
      when: _unhealthy_deploys.stdout | trim | length > 0
      register: _fix_deploy
      failed_when: false
      changed_when: "'restarted' in (_fix_deploy.stdout | default(''))"

    - name: Delete CrashLoopBackOff pods
      ansible.builtin.shell: |
        set -o pipefail
        echo "{{ item }}" | IFS='/' read -r ns pod
        k3s kubectl delete pod "$pod" -n "$ns" --force --grace-period=0
      args:
        executable: /bin/bash
      loop: "{{ _crashloop_pods.stdout_lines | default([]) }}"
      when: _crashloop_pods.stdout | trim | length > 0
      failed_when: false
      changed_when: true

    - name: Report detected issues
      ansible.builtin.debug:
        msg: >-
          Unhealthy deployments: {{ _unhealthy_deploys.stdout_lines | default([]) | length }},
          CrashLoop pods: {{ _crashloop_pods.stdout_lines | default([]) | length }},
          High-restart pods: {{ _high_restart_pods.stdout_lines | default([]) | length }}

    - name: Wait for critical services after fixes
      ansible.builtin.command: >
        k3s kubectl wait --for=condition=available --timeout=120s
        deployment/{{ item.name }} -n {{ item.ns }}
      loop:
        - { name: monitoring-kube-state-metrics, ns: monitoring }
        - { name: monitoring-grafana, ns: monitoring }
        - { name: authelia, ns: security }
        - { name: traefik, ns: kube-system }
      register: _wait_fixes
      retries: 3
      delay: 10
      until: _wait_fixes.rc == 0
      changed_when: false
      failed_when: false

- name: "Restore K3s: Post-restore health check"
  hosts: server[0]
  gather_facts: false
  become: true
  tags: [restore_k3s]
  tasks:
    - name: Run post-restore health monitor
      ansible.builtin.include_tasks: ../maintenance/restore_health_monitor.yml

    - name: Cluster restore complete
      ansible.builtin.debug:
        msg: >-
          K3s cluster restored. Tiered ArgoCD re-enable complete.
          Check ArgoCD UI for application health status.
