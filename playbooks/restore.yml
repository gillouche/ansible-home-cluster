---
# ==============================================================================
# Cluster Restoration Playbook
# ==============================================================================
# This playbook restores the cluster to a consistent state after a reboot.
# It focuses on starting containers in the correct dependency order,
# primarily ensuring Vault is unsealed before dependent services start.
#
# Usage:
#   ansible-playbook playbooks/restore.yml
# ==============================================================================

# 1. Vault Transit (CRITICAL: Must be first to allow auto-unseal)
- name: "Restore Vault Transit"
  hosts: vault_transit
  gather_facts: true
  become: false
  tags: [vault, transit]
  tasks:
    - name: Ensure Vault Transit is running and unsealed
      ansible.builtin.import_role:
        name: vault
      vars:
        vault_stage: transit
        vault_enable_transit_seal: false

# 2. Vault Leader (Auto-unseal relies on Transit)
- name: "Restore Vault Leader"
  hosts: vault_leader
  gather_facts: false
  become: true
  tags: [vault, leader]
  tasks:
    - name: Start Vault Leader
      ansible.builtin.command: podman start vault
      register: _start_leader
      changed_when: _start_leader.rc == 0
      failed_when: false

    - name: Wait for Vault Leader to be unsealed
      ansible.builtin.command: /usr/local/bin/vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ global_vault_api_port | default(18200) }}"
        VAULT_SKIP_VERIFY: "true"
      register: _leader_status
      until: >-
        (_leader_status.rc | default(1)) == 0 and
        ((_leader_status.stdout | from_json).sealed | default(true)) == false
      retries: 30
      delay: 2
      changed_when: false

# 3. Vault Followers
- name: "Restore Vault Followers"
  hosts: vault_followers
  gather_facts: false
  become: true
  tags: [vault, followers]
  tasks:
    - name: Start Vault Follower
      ansible.builtin.command: podman start vault
      register: _start_follower
      changed_when: _start_follower.rc == 0
      failed_when: false

    - name: Wait for Vault Follower to be unsealed
      ansible.builtin.command: /usr/local/bin/vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ global_vault_api_port | default(18200) }}"
        VAULT_SKIP_VERIFY: "true"
      register: _follower_status
      until: >-
        (_follower_status.rc | default(1)) == 0 and
        ((_follower_status.stdout | from_json).sealed | default(true)) == false
      retries: 30
      delay: 2
      changed_when: false

# 4. Infrastructure Services
- name: "Restore DNS Cluster (Pi-hole)"
  hosts: dns_cluster
  gather_facts: false
  become: true
  tags: [infra, dns]
  tasks:
    - name: Start Pi-hole container
      ansible.builtin.command: podman start pihole
      register: _start_pihole
      changed_when: _start_pihole.rc == 0
      failed_when: false

    - name: Start Keepalived (VRRP)
      ansible.builtin.service:
        name: keepalived
        state: started

- name: "Restore Internal Load Balancer"
  hosts: internal_lb_cluster
  gather_facts: false
  become: true
  tags: [infra, lb]
  tasks:
    - name: Start HAProxy and Keepalived
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
      loop:
        - haproxy
        - keepalived
        - haproxy-ca-watch.path

- name: "Restore Edge Proxy (Caddy)"
  hosts: edge_proxy_cluster
  gather_facts: false
  become: true
  tags: [infra, proxy]
  tasks:
    - name: Start Caddy container
      ansible.builtin.command: podman start edge-proxy
      register: _start_caddy
      changed_when: _start_caddy.rc == 0
      failed_when: false

    - name: Start Keepalived (VRRP)
      ansible.builtin.service:
        name: keepalived
        state: started

- name: "Restore Postgres"
  hosts: postgres
  gather_facts: false
  become: true
  tags: [infra, postgres]
  tasks:
    - name: Start Postgres container
      ansible.builtin.command: podman start postgres
      register: _start_postgres
      changed_when: _start_postgres.rc == 0
      failed_when: false

- name: "Restore Nexus"
  hosts: artifactory
  gather_facts: false
  become: true
  tags: [infra, artifactory]
  tasks:
    - name: Start Nexus
      ansible.builtin.command: podman start nexus
      register: _start_nexus
      changed_when: _start_nexus.rc == 0
      failed_when: false

- name: "Restore K3s Cluster"
  hosts: server
  gather_facts: false
  become: true
  tags: [infra, k3s]
  serial: 1
  tasks:
    - name: Start K3s Service
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait for K3s Service to be Active
      ansible.builtin.systemd:
        name: k3s
        state: started
      register: _k3s_service
      until: _k3s_service.status.ActiveState == "active"
      retries: 30
      delay: 5

    - name: Wait for All Nodes to be Ready
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: _k3s_nodes
      # Check that all nodes (lines) contain "Ready"
      until: >-
        _k3s_nodes.rc == 0 and
        (_k3s_nodes.stdout_lines | length > 0) and
        (_k3s_nodes.stdout_lines | select('search', 'Ready') | list | length == _k3s_nodes.stdout_lines | length)
      retries: 60
      delay: 5
      # Run only on the first node to avoid thundering herd on API
      when: inventory_hostname == groups['server'][0]
      changed_when: false

- name: "Restore K3s Agents"
  hosts: agent
  gather_facts: false
  become: true
  tags: [infra, k3s_agent]
  tasks:
    - name: Start K3s Agent Service
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        enabled: true

    - name: Wait for K3s Agent Service to be Active
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
      register: _k3s_agent_service
      until: _k3s_agent_service.status.ActiveState == "active"
      retries: 30
      delay: 5

    - name: Wait for Agent Nodes to be Ready # noqa: run-once
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      delegate_to: "{{ groups['server'][0] }}"
      register: _k3s_agent_nodes
      # Check that all nodes (lines) contain "Ready"
      until: >-
        _k3s_agent_nodes.rc == 0 and
        (_k3s_agent_nodes.stdout_lines | length > 0) and
        (_k3s_agent_nodes.stdout_lines | select('search', 'Ready') | list | length == _k3s_agent_nodes.stdout_lines | length)
      retries: 60
      delay: 5
      # Run verification once (e.g. from first agent, delegating to server)
      run_once: true
      changed_when: false

# 5. Monitoring Stack
- name: "Restore Monitoring Stack"
  hosts: prometheus:loki:grafana
  gather_facts: false
  become: true
  tags: [monitoring]
  tasks:
    - name: Start Prometheus
      ansible.builtin.command: podman start prometheus
      when: inventory_hostname in groups['prometheus']
      register: _start_prom
      changed_when: _start_prom.rc == 0
      failed_when: false

    - name: Start Loki
      ansible.builtin.command: podman start loki
      when: inventory_hostname in groups['loki']
      register: _start_loki
      changed_when: _start_loki.rc == 0
      failed_when: false

    - name: Start Grafana
      ansible.builtin.command: podman start grafana
      when: inventory_hostname in groups['grafana']
      register: _start_grafana
      changed_when: _start_grafana.rc == 0
      failed_when: false

# 6. Applications
- name: "Restore Applications"
  hosts: firefly
  gather_facts: false
  become: true
  tags: [apps, firefly]
  tasks:
    - name: Start Firefly III
      ansible.builtin.command: podman start firefly
      register: _start_firefly
      changed_when: _start_firefly.rc == 0
      failed_when: false

# 7. Agents (Run last to ensure they can push to restored stack)
- name: "Restore Node Agents"
  hosts: all
  gather_facts: false
  become: true
  tags: [agents]
  tasks:
    - name: Start Node Exporter
      ansible.builtin.command: podman start node-exporter
      register: _start_ne
      changed_when: _start_ne.rc == 0
      failed_when: false

    - name: Start Promtail
      ansible.builtin.command: podman start promtail
      register: _start_pt
      changed_when: _start_pt.rc == 0
      failed_when: false

# 8. Wait for Services to Settle
- name: "Wait for Services to Settle"
  hosts: localhost
  gather_facts: false
  tags: [wait]
  tasks:
    - name: Wait 30s for containers to fully initialize
      ansible.builtin.pause:
        seconds: 30

# 9. Verify Health
- name: "Verify Cluster Health"
  import_playbook: health.yml
  tags: [health]
