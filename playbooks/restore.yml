---
# ==============================================================================
# Cluster Restoration Playbook
# ==============================================================================
# This playbook restores the cluster to a consistent state after a reboot.
# It focuses on starting containers in the correct dependency order,
# primarily ensuring Vault is unsealed before dependent services start.
#
# Usage:
#   ansible-playbook playbooks/restore.yml -t base
#   ansible-playbook playbooks/restore.yml -t k3s
# ==============================================================================

# 0. Force Time Sync (CRITICAL: RPi lacks RTC, TLS depends on correct time)
- name: "Force Time Sync (All Nodes)"
  hosts: all
  gather_facts: true
  become: true
  tags: [always, base, ntp, time]
  tasks:
    - name: Ensure chronyd is started
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: true

    - name: Force immediate time sync (chrony makestep)
      ansible.builtin.command: chronyc -a makestep
      register: _chrony_makestep
      changed_when: _chrony_makestep.rc == 0
      failed_when: false

    - name: Force immediate time sync (HTTP fallback via Google)
      ansible.builtin.shell: |
        HTTP_DATE=$(curl -s --head --connect-timeout 5 http://google.com | grep ^Date: | sed 's/Date: //g')
        if [ -n "$HTTP_DATE" ]; then
          date -s "$HTTP_DATE"
        else
          exit 1
        fi
      # Only fallback if chrony hasn't synced yet (e.g. DNS issues or first boot)
      # We check if the year is 1970 or similar
      when: ansible_date_time.year | int < 2024
      register: _http_sync
      changed_when: _http_sync.rc == 0
      failed_when: false

    - name: Trigger another chrony sync if HTTP was used
      ansible.builtin.command: chronyc -a makestep
      when: _http_sync is changed
      failed_when: false

# 1. Vault Transit (CRITICAL: Must be first to allow auto-unseal)
- name: "Restore Vault Transit"
  hosts: vault_transit
  gather_facts: false
  become: true
  tags: [never, base, vault, transit]
  tasks:
    - name: Start Vault Transit container
      ansible.builtin.command: podman start vault
      register: _vault_start
      changed_when: _vault_start.rc == 0
      failed_when:
        - _vault_start.rc != 0
        - "'already' not in _vault_start.stderr"

# 2. Vault Leader (Auto-unseal relies on Transit)
- name: "Restore Vault Leader"
  hosts: vault_leader
  gather_facts: false
  become: true
  tags: [never, base, vault, leader]
  tasks:
    - name: Start Vault Leader container
      ansible.builtin.command: podman start vault
      register: _vault_start
      changed_when: _vault_start.rc == 0
      failed_when:
        - _vault_start.rc != 0
        - "'already' not in _vault_start.stderr"

    - name: Wait for Vault Leader to be unsealed
      ansible.builtin.command: /usr/local/bin/vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ global_vault_api_port | default(18200) }}"
        VAULT_SKIP_VERIFY: "true"
      register: _leader_status
      until: >-
        (_leader_status.rc | default(1)) == 0 and
        ((_leader_status.stdout | from_json).sealed | default(true)) == false
      retries: 30
      delay: 2
      changed_when: false

# 3. Vault Followers
- name: "Restore Vault Followers"
  hosts: vault_followers
  gather_facts: false
  become: true
  tags: [never, base, vault, followers]
  tasks:
    - name: Start Vault Follower container
      ansible.builtin.command: podman start vault
      register: _vault_start
      changed_when: _vault_start.rc == 0
      failed_when:
        - _vault_start.rc != 0
        - "'already' not in _vault_start.stderr"

    - name: Wait for Vault Follower to be unsealed
      ansible.builtin.command: /usr/local/bin/vault status -format=json
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ global_vault_api_port | default(18200) }}"
        VAULT_SKIP_VERIFY: "true"
      register: _follower_status
      until: >-
        (_follower_status.rc | default(1)) == 0 and
        ((_follower_status.stdout | from_json).sealed | default(true)) == false
      retries: 30
      delay: 2
      changed_when: false

# 4. Infrastructure Services
- name: "Restore DNS Cluster (Pi-hole)"
  hosts: dns_cluster
  gather_facts: false
  become: true
  tags: [never, base, infra, dns]
  tasks:
    - name: Start Pi-hole container
      ansible.builtin.command: podman start pihole
      register: _pihole_start
      changed_when: _pihole_start.rc == 0
      failed_when:
        - _pihole_start.rc != 0
        - "'already' not in _pihole_start.stderr"

    - name: Start Keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: started
      register: _keepalived_start
      until: _keepalived_start.status.ActiveState | default('') == "active"
      retries: 5
      delay: 5

- name: "Restore Internal Load Balancer"
  hosts: internal_lb_cluster
  gather_facts: false
  become: true
  tags: [never, base, infra, lb]
  tasks:
    - name: Start HAProxy
      ansible.builtin.systemd:
        name: haproxy
        state: started
      register: _haproxy_start
      until: _haproxy_start.status.ActiveState | default('') == "active"
      retries: 5
      delay: 5

    - name: Start Keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: started
      register: _keepalived_start
      until: _keepalived_start.status.ActiveState | default('') == "active"
      retries: 5
      delay: 5

- name: "Restore Edge Proxy (Caddy)"
  hosts: edge_proxy_cluster
  gather_facts: false
  become: true
  tags: [never, base, infra, proxy]
  tasks:
    - name: Start Caddy container
      ansible.builtin.command: podman start edge-proxy
      register: _caddy_start
      changed_when: _caddy_start.rc == 0
      failed_when:
        - _caddy_start.rc != 0
        - "'already' not in _caddy_start.stderr"

    - name: Start Keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: started
      register: _keepalived_start
      until: _keepalived_start.status.ActiveState | default('') == "active"
      retries: 5
      delay: 5

- name: "Restore Etcd (Postgres coordination)"
  hosts: postgres
  gather_facts: true
  become: true
  tags: [never, k3s, infra, etcd]
  tasks:
    - name: Start Etcd container
      ansible.builtin.command: podman start etcd
      register: _etcd_start
      changed_when: _etcd_start.rc == 0
      failed_when:
        - _etcd_start.rc != 0
        - "'already' not in _etcd_start.stderr"

    - name: Wait for Etcd port to be open
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(ansible_facts.default_ipv4.address) }}"
        port: "{{ global_etcd_port | default(2379) }}"
        timeout: 60

    - name: Wait for Etcd health endpoint
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(ansible_facts.default_ipv4.address) }}:{{ global_etcd_port | default(2379) }}/health"
        status_code: 200
      register: _etcd_health
      retries: 20
      delay: 3
      until: _etcd_health.status == 200

- name: "Restore Postgres"
  hosts: postgres
  gather_facts: true
  become: true
  tags: [never, k3s, infra, postgres]
  tasks:
    - name: Start HAProxy
      ansible.builtin.systemd:
        name: "{{ postgres_haproxy_service | default('haproxy') }}"
        state: started
      register: _haproxy_start
      until: _haproxy_start.status.ActiveState | default('') == "active"
      retries: 5
      delay: 5

    - name: Start Keepalived
      ansible.builtin.systemd:
        name: keepalived
        state: started
      register: _keepalived_start
      until: _keepalived_start.status.ActiveState | default('') == "active"
      retries: 10
      delay: 5

    - name: Start Postgres container
      ansible.builtin.command: podman start postgres
      register: _postgres_start
      changed_when: _postgres_start.rc == 0
      failed_when:
        - _postgres_start.rc != 0
        - "'already' not in _postgres_start.stderr"

    - name: Wait for Postgres to be ready
      ansible.builtin.command: podman exec postgres pg_isready -p {{ postgres_port | default(5432) }}
      register: _pg_isready
      until: _pg_isready.rc == 0
      retries: 30
      delay: 2
      changed_when: false

    - name: Fix Kine sequence
      ansible.builtin.shell: >-
        podman exec -e PGPASSWORD='{{ global_k3s_db_password }}' postgres
        psql -h {{ global_k3s_db_host }} -p {{ global_k3s_db_port | default(15432) }} -U {{ global_k3s_db_user | default('k3s') }}
        -d {{ global_k3s_db_name | default('kubernetes') }}
        -c "SELECT setval('kine_id_seq', (SELECT MAX(id) FROM kine));"
      register: _kine_fix
      until: _kine_fix.rc == 0
      retries: 5
      delay: 5
      changed_when: true
      no_log: true
      run_once: true
      when: inventory_hostname == groups['postgres'][0]

    - name: Ensure Authelia database exists (Postgres Leader)
      ansible.builtin.shell: |
        # Check if database exists
        DB_EXISTS=$(podman exec postgres psql -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ postgres_authelia_db_name | default('authelia') }}';")
        if [ "$DB_EXISTS" != "1" ]; then
          # Ensure user exists (ignore error if already exists)
          podman exec postgres psql -U postgres -d postgres -c "CREATE USER {{ postgres_authelia_db_user | default('authelia') }} WITH PASSWORD '{{ postgres_authelia_db_password | default('changeme') }}';" || true
          # Create database
          podman exec postgres psql -U postgres -d postgres -c "CREATE DATABASE {{ postgres_authelia_db_name | default('authelia') }} OWNER {{ postgres_authelia_db_user | default('authelia') }};"
          echo "Database {{ postgres_authelia_db_name | default('authelia') }} created"
        else
          # Ensure password is correct even if DB exists
          podman exec postgres psql -U postgres -d postgres -c "ALTER USER {{ postgres_authelia_db_user | default('authelia') }} WITH PASSWORD '{{ postgres_authelia_db_password | default('changeme') }}';"
          echo "Database {{ postgres_authelia_db_name | default('authelia') }} already exists, password updated"
        fi
      args:
        executable: /bin/bash
      register: _authelia_restore_cmd
      changed_when: "'created' in _authelia_restore_cmd.stdout or 'updated' in _authelia_restore_cmd.stdout"
      run_once: true
      when: inventory_hostname == groups['postgres'][0]
      no_log: true

- name: "Restore Nexus"
  hosts: artifactory
  gather_facts: false
  become: true
  tags: [never, base, infra, artifactory]
  tasks:
    - name: Start Nexus container
      ansible.builtin.command: podman start nexus
      register: _nexus_start
      changed_when: _nexus_start.rc == 0
      failed_when:
        - _nexus_start.rc != 0
        - "'already' not in _nexus_start.stderr"

- name: "Restore K3s Cluster"
  hosts: server
  gather_facts: false
  become: true
  tags: [never, k3s, infra]
  serial: 1
  tasks:
    - name: Start K3s Service
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: false

    - name: Wait for K3s Service to be Active
      ansible.builtin.systemd:
        name: k3s
        state: started
      register: _k3s_service
      until: _k3s_service.status.ActiveState == "active"
      retries: 30
      delay: 5

    - name: Wait for All Nodes to be Ready
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: _k3s_nodes
      # Check that all nodes (lines) contain "Ready"
      until: >-
        _k3s_nodes.rc == 0 and
        (_k3s_nodes.stdout_lines | length > 0) and
        (_k3s_nodes.stdout_lines | select('search', 'Ready') | list | length == _k3s_nodes.stdout_lines | length)
      retries: 60
      delay: 5
      # Run only on the first node to avoid thundering herd on API
      run_once: true
      delegate_to: "{{ groups['server'][0] }}"
      changed_when: false

- name: "Restore K3s Agents"
  hosts: agent
  gather_facts: false
  become: true
  tags: [never, k3s, infra, k3s_agent]
  tasks:
    - name: Start K3s Agent Service
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        enabled: false

    - name: Wait for K3s Agent Service to be Active
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
      register: _k3s_agent_service
      until: _k3s_agent_service.status.ActiveState == "active"
      retries: 30
      delay: 5

    - name: Wait for Agent Nodes to be Ready # noqa: run-once
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      delegate_to: "{{ groups['server'][0] }}"
      register: _k3s_agent_nodes
      # Check that all nodes (lines) contain "Ready"
      until: >-
        _k3s_agent_nodes.rc == 0 and
        (_k3s_agent_nodes.stdout_lines | length > 0) and
        (_k3s_agent_nodes.stdout_lines | select('search', 'Ready') | list | length == _k3s_agent_nodes.stdout_lines | length)
      retries: 60
      delay: 5
      # Run verification once (e.g. from first agent, delegating to server)
      run_once: true
      changed_when: false

# 6. Post-Restore Verification
- name: "Post-Restore Verification"
  hosts: localhost
  gather_facts: false
  become: false
  tags: [always, k3s, vault_test]
  vars_files:
    - ../inventories/group_vars/all/main.yml
  tasks:
    - name: Test K3s Vault API endpoint (Kubernetes Auth)
      ansible.builtin.uri:
        url: "https://192.168.0.253:8200/v1/auth/kubernetes"
        method: GET
        validate_certs: true
        ca_path: "/etc/tls/ca-bundle.pem"
        status_code: [200, 429, 405, 403] # 405 or 403 are expected for GET on this endpoint without proper auth
      register: _k3s_vault_health
      ignore_errors: true
      delegate_to: "{{ groups['server'][0] }}" # Run from a cluster node where ca-bundle.pem exists

    - name: Fetch current CA bundle from Vault
      ansible.builtin.uri:
        url: "https://192.168.0.253:8200/v1/pki_int/ca/pem"
        method: GET
        validate_certs: false
        return_content: true
      register: _vault_ca_bundle
      when: _k3s_vault_health.status not in [200, 429, 405, 403]

    - name: Regenerate vault-issuer.yaml if CA bundle is invalid
      ansible.builtin.set_fact:
        _new_cabundle: "{{ _vault_ca_bundle.content | b64encode | regex_replace('\\s+', '') }}"
      when:
        - _k3s_vault_health.status not in [200, 429, 405, 403]
        - _vault_ca_bundle.status == 200

    - name: Print new CA bundle for vault-issuer.yaml
      ansible.builtin.debug:
        msg: "New CA bundle: {{ _new_cabundle }}"
      when: _new_cabundle is defined
      delegate_to: localhost
