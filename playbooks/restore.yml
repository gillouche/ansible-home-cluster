---
# ==============================================================================
# Cluster Restoration Orchestrator
# ==============================================================================

# 0. Dry Run: Validate prerequisites without executing
- name: Restore Dry Run
  import_playbook: includes/restore/dry_run.yml
  tags: [restore_dry_run]

# 1. DNS: Pi-hole
- name: Restore DNS
  import_playbook: includes/restore/dns.yml
  tags: [restore_base, restore_dns]

# 2. Infrastructure: LB, Proxy
- name: Restore Infrastructure
  import_playbook: includes/restore/infrastructure.yml
  tags: [restore_base, restore_infra]

# 3. Applications: Nexus, Firefly
- name: Restore Applications
  import_playbook: includes/restore/apps.yml
  tags: [restore_base, restore_apps]

# 4. Database: Postgres
- name: Restore Postgres
  import_playbook: includes/restore/postgres.yml
  tags: [restore_base, restore_postgres]

# 5. Platform: K3s
- name: Restore K3s
  import_playbook: includes/restore/k3s.yml
  tags: [restore_k3s]

# 6. Verification
- name: Post-Restore Verification
  import_playbook: includes/restore/verification.yml
  tags: [always, restore_verify]
