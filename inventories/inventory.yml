          k3s_node_labels:
            - "node-class=rpi4"
            - "reliability=best-effort"
            - "storage=ephemeral"
        rpi5b8g1:
          k3s_node_labels:
            - "node-class=rpi5"
            - "reliability=best-effort"
            - "storage=ephemeral"
        rpi5b16g1ssd:
          k3s_node_labels:
            - "storage=ssd"
            - "node-class=rpi5"
            - "reliability=preferred"
        rpi5b16g2ssd:
          k3s_node_labels:
            - "storage=ssd"
            - "node-class=rpi5"
            - "reliability=preferred"
        rpi5b16g3ssd:
          k3s_node_labels:
            - "storage=ssd"
            - "node-class=rpi5"
            - "reliability=preferred"
