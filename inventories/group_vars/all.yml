---
# Global variables for all hosts
base_domain: gillouche.homelab

# Vault trust/CA distribution (controller + hosts)
vault_install_root_ca_on_hosts: true
vault_trust_ca_on_controller: true
vault_controller_install_keychain: login

# Controller (macOS) browser trust switch
firefox_enable_enterprise_roots: true

# Common SSH defaults (kept here if you want variables instead of ansible.cfg)
ansible_become_method: sudo
ansible_ssh_private_key_file: ~/.ssh/id_ed25519_local
ansible_connection: ssh
