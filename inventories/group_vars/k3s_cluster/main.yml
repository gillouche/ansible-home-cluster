---
systemd_dir: /etc/systemd/system

# Collection variables
use_external_database: true

k3s_postgres_host: "{{ hostvars[groups['postgres'][0]].ansible_host }}"
k3s_postgres_port: 5432
k3s_db_name: "kubernetes"
k3s_db_user: "k3s"
k3s_db_password: "{{ vault_k3s_db_password | default('k3s-db-changeme') }}"

datastore_endpoint: >-
  postgres://{{ k3s_db_user }}:{{ k3s_db_password }}@{{ k3s_postgres_host }}:{{ k3s_postgres_port }}/{{ k3s_db_name }}
api_endpoint: "{{ k3s_api_vip }}" # Using the VIP for the endpoint
api_port: 6443

# K3s Version
k3s_version: "{{ global_k3s_version | default('v1.35.0+k3s1') }}"

# Define a static token for the cluster to avoid propagation issues during setup
# In a real-world scenario, this should be moved to a vault file.
k3s_cluster_token: "k3s-ansible-cluster-token-static"

# Keepalived Configuration for K3s API
k3s_api_vip_prefixlen: 24
k3s_api_virtual_router_id: 64
k3s_api_vrrp_interface: "{{ monit_network_interface | default('end0') }}"
k3s_vrrp_auth_pass: "{{ vault_k3s_vrrp_auth_pass | default('k3s-vrrp-secret') }}"

# Keepalived Configuration for K3s Service LB
k3s_lb_vip_prefixlen: 24
k3s_lb_virtual_router_id: 65
k3s_lb_vrrp_interface: "{{ monit_network_interface | default('end0') }}"

k3s_blocking_webhooks:
  - validatingwebhookconfiguration longhorn-webhook-validator
  - mutatingwebhookconfiguration longhorn-webhook-mutator
  - validatingwebhookconfiguration chaos-mesh-validation
  - validatingwebhookconfiguration chaos-mesh-validation-auth
  - mutatingwebhookconfiguration chaos-mesh-mutation
