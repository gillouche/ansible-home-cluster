---

# HAProxy configuration to front the Vault cluster via the load_balancer role
# This keeps HAProxy generic and Vault-specific wiring in inventory/group vars.

load_balancer_haproxy_frontends:
  - name: vault_front
    bind: ":8200"
    default_backend: vault_back
    mode: tcp
    tcp_request_inspect_delay: "5s"
    tcp_request_content_accept: "{ req_ssl_hello_type 1 }"

load_balancer_haproxy_backends:
  - name: vault_back
    mode: tcp
    balance: first
    # Perform TLS handshake as part of the HTTP health-check path
    http_check_connect: "ssl"
    # HTTPS health check: explicit modern pipeline (HAProxy 3.3): connect -> send -> expect
    http_check_send:
      - "meth GET"
      - "uri /v1/sys/health"
      - "ver HTTP/1.1"
      - "hdr Host vault.gillouche.homelab"
    http_check_expect: "status 200,429"
    # Homelab-friendly cadence: less aggressive health checks
    default_server: "check inter 5s fall 2 rise 1 on-marked-down shutdown-sessions"

    # Backend servers: Vault nodes
    servers:
      - name: vault1
        addr: "{{ hostvars['rpi5b16g1ssd'].ansible_host }}"
        port: 8200
        opts: "check check-ssl sni str(rpi5b16g1ssd.gillouche.homelab) ssl-min-ver TLSv1.2 verify required ca-file /etc/ca-certificates/trust-source/anchors/vault-cluster-ca.pem"
      - name: vault2
        addr: "{{ hostvars['rpi5b16g2ssd'].ansible_host }}"
        port: 8200
        opts: "check check-ssl sni str(rpi5b16g2ssd.gillouche.homelab) ssl-min-ver TLSv1.2 verify required ca-file /etc/ca-certificates/trust-source/anchors/vault-cluster-ca.pem"
      - name: vault3
        addr: "{{ hostvars['rpi5b16g3ssd'].ansible_host }}"
        port: 8200
        opts: "check check-ssl sni str(rpi5b16g3ssd.gillouche.homelab) ssl-min-ver TLSv1.2 verify required ca-file /etc/ca-certificates/trust-source/anchors/vault-cluster-ca.pem"
