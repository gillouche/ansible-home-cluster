---
# Common SSH defaults (kept here if you want variables instead of ansible.cfg)
ansible_ssh_private_key_file: ~/.ssh/id_ed25519_local

# Global variables for all hosts
base_domain: gillouche.homelab
wildcard_domains:
  - "*.{{ base_domain }}"
  - "*.pihole.{{ base_domain }}"
  - "*.k3s.{{ base_domain }}"
  - "{{ base_domain }}"
target_user: alarm
tls_dir: "/etc/tls"
lan_subnet: "192.168.0.0/24"
podman_subnet: "10.88.0.0/16"
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# Software Versions (Shared Agents)
# ----------------------------------------

# tls trust/CA distribution (controller + hosts)
tls_trust_ca_on_controller: true
tls_controller_install_keychain: login

# Controller (macOS) browser trust switch
vault_firefox_enable_enterprise_roots: true

# HAProxy VIP (included automatically in SANs by TLS role when defined)
load_balancer_virtual_ip: 192.168.0.253
k3s_api_vip: 192.168.0.249
k3s_lb_vip: 192.168.0.248

# Shared Database Configuration
# -----------------------------
# These are used by both the Postgres role (to create DB) and K3s (to connect)
global_k3s_db_host: 192.168.0.247
global_k3s_db_port: 15432
global_postgres_port: 5432
global_k3s_db_name: kubernetes
global_k3s_db_user: k3s
# global_k3s_db_password: defined in vault

# Postgres VIP (managed by keepalived)
postgres_virtual_ip: 192.168.0.247
postgres_vrrp_router_id: 88
postgres_vrrp_auth_pass: "{{ vault_postgres_vrrp_auth_pass | default('changeme-postgres') }}"

# Global system settings
user_home_root: /home

# Centralized Networking Configuration
# ------------------------------------


# Pi-hole
pihole_virtual_ip: 192.168.0.251
pihole_dns_tcp_port: 53
pihole_dns_udp_port: 53
pihole_http_host_port: 8080
global_pihole_http_port: 8080
pihole_transit_ip: "{{ hostvars['homeserver2'].ansible_host | default('192.168.0.88') }}"

# K3s
global_k3s_api_port: 6443
global_k3s_traefik_port: 9000
global_etcd_port: 2379

# Apps
global_nexus_port: 8081
global_firefly_port: 8082

# Reverse Proxy (Caddy)
reverse_proxy_virtual_ip: 192.168.0.252
reverse_proxy_http_port: 80
reverse_proxy_https_port: 443

# Reverse proxy directory structure
reverse_proxy_root_dir: "{{ user_home_root | default('/home') }}/reverse_proxy"
reverse_proxy_config_dir: "{{ reverse_proxy_root_dir }}/config"
reverse_proxy_data_dir: "{{ reverse_proxy_root_dir }}/data"
reverse_proxy_certs_dir: "{{ reverse_proxy_root_dir }}/certs"

# Controller-side CA paths
root_ca_dir_controller: "~/.local/share/ansible-home-cluster/root-ca"
root_ca_cert_controller: "{{ root_ca_dir_controller }}/homelab-root-ca.crt"
root_ca_key_controller: "{{ root_ca_dir_controller }}/homelab-root-ca.key"
