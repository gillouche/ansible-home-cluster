---
# Common SSH defaults (kept here if you want variables instead of ansible.cfg)
ansible_ssh_private_key_file: ~/.ssh/id_ed25519_local

ansible_user: alarm
ansible_ssh_pass: "{{ ansible_password }}"

ansible_become_method: sudo
ansible_become_password: "{{ vault_device_become_password }}"

# Global variables for all hosts
base_domain: gillouche.homelab
wildcard_domains:
  - "*.{{ base_domain }}"
  - "*.pihole.{{ base_domain }}"
  - "*.k3s.{{ base_domain }}"
  - "{{ base_domain }}"
target_user: alarm
tls_dir: "/etc/tls"
lan_subnet: "192.168.0.0/24"
podman_subnet: "10.88.0.0/16"
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# Software Versions (Shared Agents)
# ----------------------------------------
loki_promtail_image: docker.io/grafana/promtail:3.6.3
prometheus_node_exporter_image: prom/node-exporter:v1.10.2

# Vault trust/CA distribution (controller + hosts)
vault_install_root_ca_on_hosts: true
vault_trust_ca_on_controller: true
vault_controller_install_keychain: login

# Controller (macOS) browser trust switch
vault_firefox_enable_enterprise_roots: true

# HAProxy VIP (included automatically in SANs by TLS role when defined)
load_balancer_virtual_ip: 192.168.0.253
k3s_api_vip: 192.168.0.249
k3s_lb_vip: 192.168.0.248

# Shared Database Configuration
# -----------------------------
# These are used by both the Postgres role (to create DB) and K3s (to connect)
global_k3s_db_host: 192.168.0.83
global_k3s_db_port: 5432
global_k3s_db_name: kubernetes
global_k3s_db_user: k3s
# global_k3s_db_password: defined in vault

# Centralized Networking Configuration
# ------------------------------------

# Vault
global_vault_api_port: 18200
global_vault_cluster_port: 18201

# Pi-hole
pihole_virtual_ip: 192.168.0.251
pihole_dns_tcp_port: 53
pihole_dns_udp_port: 53
pihole_http_host_port: 8080

# Reverse Proxy (Caddy)
reverse_proxy_virtual_ip: 192.168.0.252
reverse_proxy_http_port: 80
reverse_proxy_https_port: 443

# Vault PKI Role Name (shared between vault setup and tls provisioning)
vault_pki_int_role_name: "homelab-server"

# Controller-side CA paths
vault_cluster_ca_dir_controller: "~/.local/share/ansible-home-cluster/vault-ca"
vault_cluster_ca_cert_controller: "{{ vault_cluster_ca_dir_controller }}/homelab-root-ca.crt"
vault_cluster_ca_key_controller: "{{ vault_cluster_ca_dir_controller }}/homelab-root-ca.key"
homelab_ca_bundle_path: "{{ vault_cluster_ca_dir_controller }}/ca-bundle.pem"

# Controller-side Initialization and Token Paths
vault_init_export_path: "~/.local/share/ansible-home-cluster/cluster-init.json"
vault_transit_init_export_path: "~/.local/share/ansible-home-cluster/transit-init.json"
vault_transit_token_export_path: "~/.local/share/ansible-home-cluster/vault-transit/transit_token.txt"
vault_edge_proxy_token_path: "{{ vault_init_export_path | dirname }}/edge_proxy_token.txt"

# Global System Trust Anchor Paths
tls_root_ca_anchor_path: "/etc/ca-certificates/trust-source/anchors/homelab-root-ca.pem"
tls_intermediate_ca_anchor_path: "/etc/ca-certificates/trust-source/anchors/homelab-intermediate-ca.pem"
tls_bundle_anchor_path: "/etc/ca-certificates/trust-source/anchors/ca-bundle.pem"

# Monitoring
prometheus_node_exporter_port: 9100
loki_port: 3100
loki_promtail_http_listen_port: 9080
kube_state_metrics_node_port: 30081
