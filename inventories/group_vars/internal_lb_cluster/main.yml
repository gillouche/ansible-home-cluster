---

# HAProxy configuration to front the Vault cluster via the load_balancer role
# This keeps HAProxy generic and Vault-specific wiring in inventory/group vars.

load_balancer_haproxy_frontends:


  - name: http_in
    bind: "{{ load_balancer_virtual_ip }}:80"
    mode: http
    extra:
      - "option httplog"
      - "option forwardfor" # Ensure client IP is passed to backends
      - "option http-buffer-request"

      # ACLs for Pi-hole Routing
      - "acl is_pihole_primary hdr(host) -i primary.pihole.{{ base_domain }}"
      - "acl is_pihole_replica1 hdr(host) -i replica1.pihole.{{ base_domain }}"
      - "acl is_pihole_replica2 hdr(host) -i replica2.pihole.{{ base_domain }}"
      - "acl is_pihole_cluster hdr_end(host) -i pihole.{{ base_domain }}"

      # ACLs for Nexus
      - "acl is_nexus hdr(host) -i nexus.{{ base_domain }}"
      - "acl is_docker_v2 path_beg /v2/"

      # ACLs for Firefly
      - "acl is_firefly hdr_dom(host) -i firefly"

      # ACLs for Loki
      - "acl is_loki hdr(host) -i loki.{{ base_domain }}"

      # ACLs for K3s Services (Wildcard)
      - "acl is_k3s_domain hdr_end(host) -i .k3s.{{ base_domain }}"

      # Specific routing for Pi-hole
      - "use_backend pihole_primary if is_pihole_primary"
      - "use_backend pihole_replica1 if is_pihole_replica1"
      - "use_backend pihole_replica2 if is_pihole_replica2"
      - "use_backend pihole_backend if is_pihole_cluster"

      # Routing Logic for Nexus Docker v2 API (strip repo-name prefix, route to docker-all on port 5000)
      - "http-request replace-path ^/v2/(docker-hub|ghcr-proxy|quay-proxy|gcr-proxy|cgr-proxy|nvcr-proxy|docker-hosted)/(.*) /v2/\\2 if is_nexus is_docker_v2"
      - "use_backend nexus_docker_backend if is_nexus is_docker_v2"
      # Routing Logic for Nexus Web UI (everything else)
      - "use_backend nexus_backend if is_nexus"

      # Routing Logic for Firefly
      - "use_backend firefly_backend if is_firefly"

      # Loki Root Redirect (Loki has no UI, redirect / to /loki/ready)
      - "http-request redirect location /loki/ready code 301 if is_loki { path / }"

      # Fallback for all other *.k3s.gillouche.homelab domains
      - "use_backend traefik_http_back if is_k3s_domain"

      # Redirect / to /admin for convenience
      # IMPORTANT: Exclude /api and /remote.php to avoid breaking Pi-hole background calls
      - >-
        http-request redirect location /admin code 301 if is_pihole_cluster
        !{ path_beg /admin } !{ path_beg /api } !{ path_beg /remote.php }

    default_backend: traefik_http_back

  - name: https_in
    bind: "{{ load_balancer_virtual_ip }}:443"
    mode: http
    extra:
      - "option httplog"
      - "option forwardfor"
      - "option http-buffer-request"
      - "http-request set-header X-Forwarded-Proto https"
    default_backend: traefik_http_back

load_balancer_haproxy_backends:


  - name: traefik_http_back
    mode: http
    balance: roundrobin
    default_server: "check inter 5s fall 2 rise 1"
    servers:
      - name: k3s_server1
        addr: "{{ hostvars[groups['server'][0]].ansible_host }}"
        port: 9000
      - name: k3s_server2
        addr: "{{ hostvars[groups['server'][1]].ansible_host }}"
        port: 9000
      - name: k3s_server3
        addr: "{{ hostvars[groups['server'][2]].ansible_host }}"
        port: 9000

  # Nexus Docker v2 Backend (docker-all group on port 5000)
  - name: nexus_docker_backend
    mode: http
    servers:
      - name: nexus_docker
        addr: "{{ hostvars[groups['artifactory'][0]].ansible_host }}"
        port: 5000
        opts: "check"

  # Nexus Web UI Backend
  - name: nexus_backend
    mode: http
    servers:
      - name: nexus
        addr: "{{ hostvars[groups['artifactory'][0]].ansible_host }}"
        port: "{{ global_nexus_port }}"
        opts: "check"

  # Firefly Backend
  - name: firefly_backend
    mode: http
    servers:
      - name: firefly
        addr: "{{ hostvars[groups['firefly'][0]].ansible_host }}"
        port: "{{ global_firefly_port }}"
        opts: "check"

  # K3s API Backend (HTTPS via Ingress)
  - name: k3s_api_backend_https
    mode: http
    balance: roundrobin
    httpchk: "GET /healthz"
    http_check_expect: "status 401"
    servers:
      - name: k3s_server1
        addr: "{{ hostvars[groups['server'][0]].ansible_host }}"
        port: "{{ global_k3s_api_port }}"
        opts: "check check-ssl verify none ssl"
      - name: k3s_server2
        addr: "{{ hostvars[groups['server'][1]].ansible_host }}"
        port: "{{ global_k3s_api_port }}"
        opts: "check check-ssl verify none ssl"
      - name: k3s_server3
        addr: "{{ hostvars[groups['server'][2]].ansible_host }}"
        port: "{{ global_k3s_api_port }}"
        opts: "check check-ssl verify none ssl"

  # Pi-hole Backends
  - name: pihole_primary
    mode: http
    servers:
      - name: pihole_primary
        addr: "{{ hostvars[groups['dns_primary'][0]].ansible_host }}"
        port: "{{ pihole_http_host_port }}"
        opts: "check"

  - name: pihole_replica1
    mode: http
    servers:
      - name: pihole_replica1
        addr: "{{ hostvars[groups['dns_replicas'][0]].ansible_host }}"
        port: "{{ pihole_http_host_port }}"
        opts: "check"

  - name: pihole_replica2
    mode: http
    servers:
      - name: pihole_replica2
        addr: "{{ hostvars[groups['dns_replicas'][1]].ansible_host }}"
        port: "{{ pihole_http_host_port }}"
        opts: "check"

  - name: pihole_backend
    mode: http
    balance: roundrobin
    servers:
      - name: pihole1
        addr: "{{ hostvars[groups['dns_primary'][0]].ansible_host }}"
        port: "{{ pihole_http_host_port }}"
        opts: "check"
      - name: pihole2
        addr: "{{ hostvars[groups['dns_replicas'][0]].ansible_host }}"
        port: "{{ pihole_http_host_port }}"
        opts: "check"
      - name: pihole3
        addr: "{{ hostvars[groups['dns_replicas'][1]].ansible_host }}"
        port: "{{ pihole_http_host_port }}"
        opts: "check"
