---

# HAProxy configuration to front the Vault cluster via the load_balancer role
# This keeps HAProxy generic and Vault-specific wiring in inventory/group vars.

load_balancer_haproxy_frontends:
  - name: vault_front
    bind: "{{ load_balancer_virtual_ip }}:8200"
    default_backend: vault_back
    mode: tcp

  - name: http_in
    bind: "{{ load_balancer_virtual_ip }}:80"
    mode: http
    extra:
      - "option httplog"
      - "option forwardfor" # Ensure client IP is passed to backends

      # ACLs for Pi-hole Routing
      - "acl is_pihole_primary hdr(host) -i primary.pihole.{{ base_domain }}"
      - "acl is_pihole_replica1 hdr(host) -i replica1.pihole.{{ base_domain }}"
      - "acl is_pihole_replica2 hdr(host) -i replica2.pihole.{{ base_domain }}"
      - "acl is_pihole_cluster hdr_end(host) -i pihole.{{ base_domain }}"

      # ACLs for Nexus
      - "acl is_nexus hdr(host) -i nexus.{{ base_domain }}"

      # ACLs for Prometheus
      - "acl is_prometheus hdr(host) -i prometheus.k3s.{{ base_domain }}"

      # ACLs for Alertmanager
      - "acl is_alertmanager hdr(host) -i alertmanager.k3s.{{ base_domain }}"

      # ACLs for Grafana
      - "acl is_grafana hdr(host) -i grafana.k3s.{{ base_domain }}"

      # ACLs for Loki
      - "acl is_loki hdr(host) -i loki.k3s.{{ base_domain }}"
      - "acl is_loki_path path_beg /loki/"

      # ACLs for Firefly
      - "acl is_firefly hdr(host) -i firefly.{{ base_domain }}"

      # ACLs for K3s API (HTTP/HTTPS via Ingress)
      - "acl is_k3s_api hdr(host) -i api.k3s.{{ base_domain }}"

      # ACLs for Longhorn UI
      - "acl is_longhorn hdr(host) -i longhorn.k3s.{{ base_domain }}"

      # ACLs for Kubernetes Dashboard
      - "acl is_dashboard hdr(host) -i dashboard.k3s.{{ base_domain }}"

      # ACLs for ArgoCD
      - "acl is_argocd hdr(host) -i argocd.k3s.{{ base_domain }}"

      # ACLs for Kube State Metrics
      - "acl is_ksm hdr(host) -i ksm.k3s.{{ base_domain }}"

      # ACLs for Goldilocks
      - "acl is_goldilocks hdr(host) -i goldilocks.k3s.{{ base_domain }}"

      # ACLs for Homepage
      - "acl is_homepage hdr(host) -i homepage.k3s.{{ base_domain }}"

      # ACLs for Authelia
      - "acl is_authelia hdr(host) -i auth.k3s.{{ base_domain }}"

      # ACLs for SeaweedFS
      - "acl is_seaweedfs_filer hdr(host) -i seaweedfs-filer.k3s.{{ base_domain }}"
      - "acl is_seaweedfs_s3 hdr(host) -i seaweedfs-s3.k3s.{{ base_domain }}"

      - "use_backend pihole_primary if is_pihole_primary"
      - "use_backend pihole_replica1 if is_pihole_replica1"
      - "use_backend pihole_replica2 if is_pihole_replica2"
      - "use_backend pihole_backend if is_pihole_cluster"

      # Routing Logic for Nexus
      - "use_backend nexus_backend if is_nexus"

      # Routing Logic for Prometheus
      - "use_backend prometheus_backend if is_prometheus"

      # Routing Logic for Alertmanager
      - "use_backend alertmanager_backend if is_alertmanager"

      # Routing Logic for Grafana
      - "use_backend grafana_backend if is_grafana"

      # Routing Logic for Loki
      - "use_backend loki_backend if is_loki || is_loki_path"

      # Routing Logic for Firefly
      - "use_backend firefly_backend if is_firefly"

      # Routing Logic for K3s API
      - "use_backend k3s_api_backend_https if is_k3s_api"

      # Routing Logic for Longhorn
      - "use_backend longhorn_backend if is_longhorn"

      # Routing Logic for Kubernetes Dashboard
      - "use_backend dashboard_backend if is_dashboard"

      # Routing Logic for ArgoCD
      - "use_backend argocd_backend if is_argocd"

      # Routing Logic for Kube State Metrics
      - "use_backend kube_state_metrics_back if is_ksm"

      # Routing Logic for Goldilocks
      - "use_backend goldilocks_backend if is_goldilocks"

      # Routing Logic for Homepage
      - "use_backend homepage_backend if is_homepage"

      # Routing Logic for Authelia
      - "use_backend authelia_backend if is_authelia"

      # Routing Logic for SeaweedFS
      - "use_backend seaweedfs_filer_backend if is_seaweedfs_filer"
      - "use_backend seaweedfs_s3_backend if is_seaweedfs_s3"

      # Redirect / to /admin for convenience
      # IMPORTANT: Exclude /api and /remote.php to avoid breaking Pi-hole background calls
      - >-
        http-request redirect location /admin code 301 if is_pihole_cluster
        !{ path_beg /admin } !{ path_beg /api } !{ path_beg /remote.php }

      # Loki Root Redirect (Loki has no UI, redirect / to /loki/ready)
      - "http-request redirect location /loki/ready code 301 if is_loki { path / }"

load_balancer_haproxy_backends:
  - name: vault_back
    mode: tcp
    balance: roundrobin

    # Session Persistence (Stickiness)
    stick_table: "type ip size 200k expire 30m"
    stick_on: "src"

    # Use HTTP check (over SSL because servers have check-ssl)
    # This prevents "TLS handshake error ... connection reset by peer" logs in Vault
    # caused by HAProxy doing just TCP connect+SSL handshake and closing.
    extra:
      - "option httpchk GET /v1/sys/health"

    default_server: "check inter 5s fall 2 rise 1"

    servers:
      - name: vault1
        addr: "{{ hostvars['rpi5b16g4'].ansible_host }}"
        port: "{{ global_vault_api_port | default(18200) }}"
        opts: "check check-ssl verify none"
      - name: vault2
        addr: "{{ hostvars['rpi5b16g5'].ansible_host }}"
        port: "{{ global_vault_api_port | default(18200) }}"
        opts: "check check-ssl verify none"
      - name: vault3
        addr: "{{ hostvars['rpi5b16g6'].ansible_host }}"
        port: "{{ global_vault_api_port | default(18200) }}"
        opts: "check check-ssl verify none"

  # K3s API Backend (HTTPS via Ingress)
  - name: k3s_api_backend_https
    mode: http
    balance: roundrobin
    httpchk: "GET /healthz"
    http_check_expect: "status 401"
    servers:
      - name: k3s_server1
        addr: "{{ hostvars['rpi5b16g1ssd'].ansible_host }}"
        port: "{{ global_k3s_api_port }}"
        opts: "check check-ssl verify none ssl"
      - name: k3s_server2
        addr: "{{ hostvars['rpi5b16g2ssd'].ansible_host }}"
        port: "{{ global_k3s_api_port }}"
        opts: "check check-ssl verify none ssl"
      - name: k3s_server3
        addr: "{{ hostvars['rpi5b16g3ssd'].ansible_host }}"
        port: "{{ global_k3s_api_port }}"
        opts: "check check-ssl verify none ssl"

  # Pi-hole Backends
  - name: pihole_primary
    mode: http
    servers:
      - name: pihole_primary
        addr: "{{ hostvars['rpi5b16g4'].ansible_host }}"
        port: "{{ pihole_http_host_port }}"
        opts: "check"

  - name: pihole_replica1
    mode: http
    servers:
      - name: pihole_replica1
        addr: "{{ hostvars['rpi5b16g5'].ansible_host }}"
        port: "{{ pihole_http_host_port }}"
        opts: "check"

  - name: pihole_replica2
    mode: http
    servers:
      - name: pihole_replica2
        addr: "{{ hostvars['rpi5b16g6'].ansible_host }}"
        port: "{{ pihole_http_host_port }}"
        opts: "check"

  - name: pihole_backend
    mode: http
    balance: roundrobin
    servers:
      - name: pihole1
        addr: "{{ hostvars['rpi5b16g4'].ansible_host }}"
        port: "{{ pihole_http_host_port }}"
        opts: "check"
      - name: pihole2
        addr: "{{ hostvars['rpi5b16g5'].ansible_host }}"
        port: "{{ pihole_http_host_port }}"
        opts: "check"
      - name: pihole3
        addr: "{{ hostvars['rpi5b16g6'].ansible_host }}"
        port: "{{ pihole_http_host_port }}"
        opts: "check"

  # Nexus Backend
  - name: nexus_backend
    mode: http
    servers:
      - name: nexus
        addr: "{{ hostvars['rpi5b16g1ssd'].ansible_host }}"
        port: "{{ global_nexus_port }}"
        opts: "check"

  # Prometheus Backend
  - name: prometheus_backend
    mode: http
    balance: roundrobin
    servers:
      - name: k3s_server1
        addr: "{{ hostvars['rpi5b16g1ssd'].ansible_host }}"
        port: 9000
      - name: k3s_server2
        addr: "{{ hostvars['rpi5b16g2ssd'].ansible_host }}"
        port: 9000
      - name: k3s_server3
        addr: "{{ hostvars['rpi5b16g3ssd'].ansible_host }}"
        port: 9000

  # Alertmanager Backend
  - name: alertmanager_backend
