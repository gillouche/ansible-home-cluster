---
reverse_proxy_image: "caddy:2.10.2"
reverse_proxy_virtual_ip: 192.168.0.252
reverse_proxy_primary_host: homeserver2
reverse_proxy_acme_email: "noreply@gillouche.homelab"

# Prefer resolving via the Pi-hole VIP from reverse proxy hosts
# Keep this in reverse_proxy group to avoid cross‑group var coupling
reverse_proxy_resolver_ip: 192.168.0.251

# Bind Caddy to the VIP to avoid port conflicts with HAProxy (which binds to its own VIP on port 80)
reverse_proxy_bind_ip: "{{ reverse_proxy_virtual_ip }}"

reverse_proxy_data_dir: "/home/reverse_proxy/data"

# Domains Caddy should request certificates for.
# Using wildcards allows scaling without reconfiguring Caddy for every sub-service.
reverse_proxy_domains: "{{ wildcard_domains }}"

# TLS Wildcard configuration (consumed by tls role)
tls_wildcard_cert_enabled: true
tls_wildcard_domains: "{{ reverse_proxy_domains }}"
tls_wildcard_dest_dir: "{{ reverse_proxy_data_dir }}/caddy/certificates/wildcard"

# Use localhost to contact Vault for ACME.
# This works because Caddy runs with network_mode: host, so 127.0.0.1 refers to the host loopback where Vault is listening.
# This ensures:
# 1. Primary Caddy connects to the Vault Leader securely and directly.
# 2. Replicas use the same URL string ('127.0.0.1...'), ensuring the certificate directory path matches the one synced from Primary.
reverse_proxy_acme_ca_url: "https://127.0.0.1:{{ global_vault_api_port | default(18200) }}/v1/pki_int/acme/directory"
