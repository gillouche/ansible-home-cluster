---
reverse_proxy_image: "caddy:2.10.2"
reverse_proxy_virtual_ip: 192.168.0.252
reverse_proxy_primary_host: rpi5b8g1
reverse_proxy_acme_email: "noreply@gillouche.homelab"

# Prefer resolving via the Pi-hole VIP from reverse proxy hosts
# Keep this in reverse_proxy group to avoid cross‑group var coupling
reverse_proxy_resolver_ip: 192.168.0.251

# Example sites mapping retained
reverse_proxy_sites:
  - host: "primary.pihole.{{ base_domain }}"
    upstream: "{{ hostvars['rpi5b8g1'].ansible_host }}:8080"
    endpoint: "/admin"
  - host: "replica1.pihole.{{ base_domain }}"
    upstream: "{{ hostvars['rpi4b8g1'].ansible_host }}:8080"
    endpoint: "/admin"
  - host: "replica2.pihole.{{ base_domain }}"
    upstream: "{{ hostvars['rpi4b8g2'].ansible_host }}:8080"
    endpoint: "/admin"
